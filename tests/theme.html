<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · theme tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}iframe{border:1px solid #ccc;margin:0 8px 8px 0;vertical-align:top}</style></head>
<body>
<h1>Theme tests</h1>
<p>Two themes, one layout: light "Paper &amp; Glow" and dark (the night sky). Auto follows the system; Profile → Appearance can fix either; the browser chrome follows. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
const SETUP = `state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesSource: "default"});
  ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok");
  state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id; save(); closeOnboarding();`;
const load = q => new Promise(res => {
  const f = document.createElement("iframe");
  f.width = 390; f.height = 844; f.src = "../index.html?test&now=2026-10-22T12:10" + (q || "");
  document.body.append(f);
  f.onload = async () => { f.contentWindow.eval(SETUP); await wait(300); res(f); };
});
/* WCAG contrast of a (possibly translucent) colour over an opaque one */
const parse = c => { const m = c.match(/[\d.]+/g).map(Number); return {r: m[0], g: m[1], b: m[2], a: m[3] === undefined ? 1 : m[3]}; };
const over = (fg, bg) => ({r: fg.r * fg.a + bg.r * (1 - fg.a), g: fg.g * fg.a + bg.g * (1 - fg.a), b: fg.b * fg.a + bg.b * (1 - fg.a), a: 1});
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c.r) + .7152 * f(c.g) + .0722 * f(c.b); };
const ratio = (fg, bg) => { const a = lum(over(fg, bg)), b = lum(bg); return (Math.max(a, b) + .05) / (Math.min(a, b) + .05); };
(async () => {
  try {
    localStorage.clear();
    let f = await load(), d = f.contentDocument, w = f.contentWindow, $ = s => d.querySelector(s);
    const tok = n => w.getComputedStyle(d.documentElement).getPropertyValue(n).trim();
    ok("Auto with a light system: the light theme", d.documentElement.dataset.theme === "light" && d.documentElement.dataset.appearance === "auto");
    ok("light tokens: --bg #DCDDDD, --ink #121212, --sheet #F6F6F4", tok("--bg") === "#DCDDDD" && tok("--ink") === "#121212" && tok("--sheet") === "#F6F6F4", [tok("--bg"), tok("--ink"), tok("--sheet")]);
    const hex = h => ({r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16), a: 1});
    const bg = hex("#DCDDDD");
    ok("--ink-muted is at least 4.5:1 on --bg", ratio(parse(w.getComputedStyle($("#whoAge")).color), bg) >= 4.5, ratio(parse(w.getComputedStyle($("#whoAge")).color), bg).toFixed(2));
    ok("the page itself is --bg (paper), no night-sky image", w.getComputedStyle(d.documentElement).backgroundColor === "rgb(220, 221, 221)" && w.getComputedStyle($(".bg")).display === "none");
    ok("…and bg.jpg is never requested in the light theme", !w.performance.getEntriesByType("resource").some(e => /bg\.jpg/.test(e.name)) && !d.getElementById("bgPreload"));
    const metas = () => [...d.querySelectorAll('meta[name="theme-color"]')].map(m => m.media + "=" + m.content);
    ok("two theme-color metas: light #DCDDDD, dark the top of the night sky", metas().join() === "(prefers-color-scheme: light)=#DCDDDD,(prefers-color-scheme: dark)=#3D4662", metas());
    ok("installed: standalone, status-bar style 'default'", $('meta[name="apple-mobile-web-app-capable"]').content === "yes" && $('meta[name="apple-mobile-web-app-status-bar-style"]').content === "default");
    ok("the manifest says standalone, on the paper", await (await w.fetch("manifest.webmanifest")).json().then(m => m.display === "standalone" && m.theme_color === "#DCDDDD"));
    ok("color-scheme is 'light dark'", $('meta[name="color-scheme"]').content === "light dark");
    // Profile → Appearance
    w.eval("go('profile')"); await wait(750);
    const seg = [...d.querySelectorAll(".s-seg-opts button")];
    ok("Profile has 'Appearance: Auto · Light · Dark'", $(".s-seg-l").textContent === "Appearance" && seg.map(b => b.textContent).join(" · ") === "Auto · Light · Dark" && seg[0].getAttribute("aria-pressed") === "true");
    ok("…each a 44px target", seg.every(b => b.getBoundingClientRect().height >= 44 && b.getBoundingClientRect().width >= 44));
    seg[2].click(); await wait(100);
    ok("Dark: the dark theme, stored on this device", d.documentElement.dataset.theme === "dark" && w.eval("state.profile.appearance") === "dark" && JSON.parse(w.localStorage.getItem("toddlerMealPlanner.v1")).profile.appearance === "dark");
    ok("…the night sky shows, the ink turns white", w.getComputedStyle($(".bg")).display === "block" && w.getComputedStyle($("#headline")).color === "rgb(255, 255, 255)");
    ok("…the Profile screen's text turns white too", w.getComputedStyle($("#t-profile")).color === "rgb(255, 255, 255)");
    ok("…both theme colours pin to the top of the night sky", metas().every(m => m.endsWith("=#3D4662")), metas());
    ok("…and the night-sky image is preloaded", !!d.getElementById("bgPreload"));
    // same layout: the headline sits in the same place in both themes
    const darkTop = Math.round($("#t-profile").getBoundingClientRect().top);
    [...d.querySelectorAll(".s-seg-opts button")][1].click(); await wait(100);
    ok("Light again; the layout doesn't move between themes", d.documentElement.dataset.theme === "light" && Math.round($("#t-profile").getBoundingClientRect().top) === darkTop);
    [...d.querySelectorAll(".s-seg-opts button")][0].click(); await wait(100);
    ok("Auto again: each meta has its own colour back", metas().join() === "(prefers-color-scheme: light)=#DCDDDD,(prefers-color-scheme: dark)=#3D4662", metas());
    ok("Auto again follows the system", d.documentElement.dataset.theme === "light" && w.eval("state.profile.appearance") === "auto");
    // a saved choice applies before the first paint
    w.eval("state.profile.appearance = 'dark'; save()");
    f = await load(); d = f.contentDocument;
    ok("a saved 'Dark' is applied before the first paint", d.documentElement.dataset.theme === "dark");
    f = await load("&theme=light"); d = f.contentDocument;
    ok("?theme=light overrides it (for testing)", d.documentElement.dataset.theme === "light");
    // an old save without appearance becomes auto
    w.eval("delete state.profile.appearance; save()");
    ok("an old save gains appearance: auto", w.eval("migrate(JSON.parse(localStorage.getItem('toddlerMealPlanner.v1'))).profile.appearance") === "auto");
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · theme";
})();
</script>
</body></html>
