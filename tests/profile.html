<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · profile tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Profile tests</h1>
<p>The Profile screen (Thursday 22 October 2026, 12:10, an 18-month-old with a few days of offers): how it's going, Loved it, Still warming up, Off the plate with the allergen records apart, Firsts, Settings and caregivers. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear(); sessionStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T12:10";
f.width = 390; f.height = 844;
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    const $ = s => d.querySelector("#scr-profile " + s), $$ = s => [...d.querySelectorAll("#scr-profile " + s)];
    const sec = k => $(`[data-sec="${k}"]`);
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesConfirmed: true});
       ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok");
       delete state.profile.allergens.egg; delete state.profile.allergens.shellfish; state.profile.allergens.peanut = "avoid";
       state.profile.avoid = [{name: "Kiwi", kind: "allergy"}, {name: "Beetroot", kind: "dislike"}];
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id;
       const ev = (date, foodId, outcome, first) => ({id: uid(), at: date + "T12:00:00", date, mealId: "m-" + date, itemId: uid(), foodId, outcome, firstOfFood: !!first, firstAllergen: false});
       state.offers = [ev("2026-10-20", "banana", "loved", true), ev("2026-10-21", "banana", "loved"), ev("2026-10-21", "carrots", "not_today", true),
                       ev("2026-10-22", "carrots", "some"), ev("2026-10-22", "peas", "some", true), ev("2026-10-21", "egg", null, true)];
       offersChanged(); save(); closeOnboarding(); go("profile", {quiet: true});`);
    await wait(500);
    const text = () => d.getElementById("scr-profile").textContent;
    ok("Profile: a pinned 'Home' control, the name, age and stage", $(".home-link").textContent === "Home" && $("h1").textContent === "Lula" && getComputedStyle($("h1")).textTransform === "uppercase" && $(".scr-sub").textContent === "18 months · A seat at the family table");
    ok("sections in order: how it's going, loved it, still warming up, off the plate, firsts, settings, caregivers", $$("section.sec").map(s => s.dataset.sec).join() === "going,loved,warming,offplate,firsts,settings,people", $$("section.sec").map(s => s.dataset.sec));

    // how it's going: sentences per food group
    const going = [...sec("going").querySelectorAll(".sec-p")].map(p => p.textContent);
    ok("How it's going: one sentence per food group", going.length === 5 && ["Protein:", "Veg:", "Fruit:", "Grains:", "Fats and dairy:"].every((g, k) => going[k].startsWith(g)), going);
    ok("…'Fruit: banana.' and 'Veg: carrots, peas.' from this week's offers", /^Fruit: banana\./.test(going[2]) && /^Veg: carrots and peas\./.test(going[1]), going.slice(1, 3));
    ok("…'Still waiting: …' for what's planned and not yet offered", going.some(g => / Still waiting: /.test(g)));
    ok("…no percentages, scores or streaks anywhere", !/%|\bscore|\bstreak|\bmissed|\beaten/i.test(text()));

    // loved it, still warming up
    ok("Loved it: foods whose offers were mostly loved", sec("loved").querySelector("p").textContent === "Banana.");
    const warm = [...sec("warming").querySelectorAll(".row")].map(r => [r.querySelector(".row-t").firstChild.textContent, r.querySelector(".row-sub").textContent]);
    ok("Still warming up: offered twice or more, 'Not today' or 'Ate some', not loved", warm.length === 1 && warm[0][0] === "Carrots · offered 2 times", warm);
    ok("…with a try-another-way line (another texture, shape or pairing)", /^Try it /.test(warm[0][1]) && /banana/.test(warm[0][1]), warm[0][1]);
    ok("…and no exposure count from research ('10 to 15 tries')", !/\b1[05]\b.*(tries|times)|tries/i.test(sec("warming").textContent));
    ok("peas, offered once, isn't there yet", !/Peas/.test(sec("warming").textContent));

    // off the plate: preferences, then the allergen records apart
    const off = sec("offplate").textContent;
    ok("Off the plate: 'Allergies: peanut and kiwi.' and 'Not a fan: beetroot.'", /Allergies: peanut and kiwi\./.test(off) && /Not a fan: beetroot\./.test(off), off.slice(0, 120));
    ok("…the locked rules for this age", off.includes(E("lockedLine(ageNow())")));
    const recs = () => Object.fromEntries([...sec("offplate").querySelectorAll(".row")].map(r => [r.querySelector(".row-t").firstChild.textContent, r.querySelector(".row-sub").textContent]));
    ok("the allergen records sit apart, under 'Allergens'", [...sec("offplate").querySelectorAll("h3")].some(h => h.textContent === "Allergens") && Object.keys(recs()).length === 9);
    ok("…Egg: 'Introduced on' the day of its first offer", recs().Egg === "Introduced on " + E("fmtDayMonth(localDate('2026-10-21'))"), recs().Egg);
    ok("…Peanut: 'Keep out'; Shellfish: 'Not yet'; Milk (tried before): 'Introduced'", recs().Peanut === "Keep out" && recs().Shellfish === "Not yet" && recs().Milk === "Introduced", recs());
    ok("…kiwi and beetroot are preferences, not allergen records", !("Kiwi" in recs()) && !("Beetroot" in recs()));
    $('[data-f="noreact:egg"]').click(); await wait(30);
    ok("'No reaction noted': 'Introduced, no reaction noted on {today}'", recs().Egg === "Introduced, no reaction noted on " + E("fmtDayMonth(now())") && E("state.allergyNotes.egg.noReactionOn") === "2026-10-22" && !$('[data-f="noreact:egg"]'));
    ok("…with the not-medical-advice note", /Not medical advice\./.test(sec("offplate").textContent));

    // firsts
    const firsts = [...sec("firsts").querySelectorAll(".row .row-t")].map(p => p.textContent);
    ok("Firsts: a quiet journal, newest first: 'First peas · 22 Oct'…", firsts.length === 4 && firsts[0] === "First peas · " + E("fmtDayShort(localDate('2026-10-22'))") && firsts.at(-1) === "First banana · " + E("fmtDayShort(localDate('2026-10-20'))"), firsts);
    let picked = null;
    w.HTMLInputElement.prototype.click = function(){ if (this.type === "file") picked = this.accept; };
    $('[data-f="photo:banana"]').click();
    ok("'Add photo' asks for a picture on this device", picked === "image/*" && !!d.querySelector("input.pf-photo"));
    d.querySelector("input.pf-photo").remove();
    E(`state.firstPhotos.banana = "data:image/gif;base64,R0lGODlhAQABAAAAACw="; refresh("profile")`); await wait(30);
    ok("…a photo shows beside its first, with words for screen readers", $('[data-sec="firsts"] img') && /banana/i.test($('[data-sec="firsts"] img').alt) && $('[data-f="photo:banana"]').textContent === "Remove photo");
    $('[data-f="photo:banana"]').click(); await wait(30);
    ok("…and 'Remove photo' takes it away", !E("state.firstPhotos.banana") && !$('[data-sec="firsts"] img'));

    // the drawn name heads Profile (read aloud by its spelling); no ink, the typed name
    ok("no ink: Profile's title is the typed name", d.getElementById("t-profile").textContent === "Lula" && !d.querySelector("#t-profile svg"));
    E(`state.profile.ink = {w: 300, h: 150, strokes: [[10, 100, 10, 20, 40, 60, 70, 20, 70, 100]]}; save(); refresh("profile")`); await wait(30);
    ok("ink: Profile's title is the drawing, with the name for screen readers", !!d.querySelector("#t-profile svg.pf-ink path") && d.querySelector("#t-profile .sr-only").textContent === "Lula");
    E(`state.profile.ink = null; save(); refresh("profile")`); await wait(30);
    // settings reopen the onboarding's sentences, with a text Close that comes back here
    const rows = [...sec("settings").querySelectorAll(".row-btn")].map(b => b.querySelector(".row-t span").textContent);
    ok("Settings: birthday, meal times, priorities, kitchen basics, replay as rows", JSON.stringify(rows) === JSON.stringify(["Birthday", "Meal times", "Priorities", "Kitchen basics", "Replay the first steps"]), rows);
    const nameRow = sec("settings").firstElementChild.nextElementSibling;
    ok("…led by 'Name · Lula' with 'Redraw' and 'Edit spelling'", nameRow.classList.contains("s-person") && /^Name · Lula/.test(nameRow.textContent) && $('[data-f="set:redraw"]').textContent === "Redraw" && $('[data-f="set:name"]').textContent === "Edit spelling", nameRow.textContent);
    $('[data-f="set:redraw"]').click(); await wait(800);
    ok("Redraw opens Draw on its pad", !d.getElementById("onboarding").hidden && d.getElementById("onbTitle").textContent.startsWith("Pull up a chair for") && !!d.querySelector(".pad-sheet .pad"));
    d.getElementById("onbClose").click(); await wait(100);
    $('[data-f="set:name"]').click(); await wait(400);
    ok("Edit spelling (no ink): the typed sentence, its field focused", d.getElementById("onbTitle").textContent.startsWith("Pull up a chair for") && d.activeElement === d.querySelector("#onbCard .blank-input") && !d.querySelector(".pad-sheet"));
    ok("…with a text 'Close'", !d.getElementById("onbClose").hidden && d.getElementById("onbClose").textContent === "Close");
    d.getElementById("onbClose").click(); await wait(100);
    ok("…Close comes back to Profile", d.getElementById("onboarding").hidden && E("pg.cur") === "profile");
    $('[data-f="set:priorities"]').click(); await wait(400);
    ok("Priorities opens its step", /This week, we care most about/.test(d.getElementById("onbTitle").textContent));
    d.getElementById("onbClose").click(); await wait(100);
    $('[data-f="appearance:dark"]').click(); await wait(30);
    ok("Appearance: Auto · Light · Dark; Dark turns the theme", d.documentElement.dataset.theme === "dark" && $('[data-f="appearance:dark"]').getAttribute("aria-pressed") === "true" && $$(".s-seg-opts button").map(b => b.textContent).join() === "Auto,Light,Dark");
    $('[data-f="appearance:light"]').click(); await wait(30);

    // caregivers
    const nm = $('[data-f="pf:addname"]'), ph = $('[data-f="pf:addphone"]');
    nm.value = "ana"; ph.value = "+34 600 11 22 33";
    ph.dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true})); await wait(30);
    ok("caregivers: add 'Ana' with a number, kept on this device", E("state.profile.people.length") === 1 && E("state.profile.people[0].name") === "Ana" && E("state.profile.people[0].phone") === "+34600112233");
    const person = E("state.profile.people[0].id");
    ok("…each with 'Send tomorrow' and 'Remove'", $(`[data-f="pf:send:${person}"]`).textContent === "Send tomorrow" && $(`[data-f="pf:send:${person}"]`).getAttribute("aria-label") === "Tomorrow to Ana" && !!$(`[data-f="pf:rm:${person}"]`));
    $('[data-f="pf:link"]').click(); await wait(30);
    ok("'This week, as a link' warns first: allergies and menu, readable by anyone, can't be taken back", /This link includes Lula's allergies and menu\./.test(sec("people").textContent) && $('[data-f="pf:linkok"]').textContent === "Make the link");
    $(`[data-f="pf:rm:${person}"]`).click(); await wait(30);
    ok("…Remove takes the person away", E("state.profile.people.length") === 0);
    ok("no emoji or icon glyphs", !/\p{Extended_Pictographic}|✕|✓/u.test(text()));
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · profile";
};
</script>
</body></html>
