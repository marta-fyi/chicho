<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · profile tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Profile tests</h1>
<p>The Profile screen (Thursday 22 October 2026, 12:10, an 18-month-old with a few days of offers): how it's going, Loved it, Still warming up, Off the plate with the allergen records apart, Firsts, Settings and caregivers. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear(); sessionStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T12:10";
f.width = 390; f.height = 844;
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    const $ = s => d.querySelector("#scr-profile " + s), $$ = s => [...d.querySelectorAll("#scr-profile " + s)];
    const sec = k => $(`[data-sec="${k}"]`);
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesSource: "default"});
       ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok");
       delete state.profile.allergens.egg; delete state.profile.allergens.shellfish; state.profile.allergens.peanut = "avoid";
       state.profile.avoid = [{name: "Kiwi", kind: "allergy"}, {name: "Beetroot", kind: "dislike"}];
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id;
       const ev = (date, foodId, outcome, first) => ({id: uid(), at: date + "T12:00:00", date, mealId: "m-" + date, itemId: uid(), foodId, outcome, firstOfFood: !!first, firstAllergen: false});
       state.offers = [ev("2026-10-20", "banana", "loved", true), ev("2026-10-21", "banana", "loved"), ev("2026-10-21", "carrots", "not_today", true),
                       ev("2026-10-22", "carrots", "some"), ev("2026-10-22", "peas", "some", true), ev("2026-10-21", "egg", null, true)];
       offersChanged(); save(); closeOnboarding(); go("profile", {quiet: true});`);
    await wait(500);
    const text = () => d.getElementById("scr-profile").textContent;
    ok("Profile: the title 'Profile' under the header (the name and age are in it), the stage under the title, no Home link", !$(".home-link") && $("h1").getBoundingClientRect().top >= d.getElementById("chrome").getBoundingClientRect().bottom && $("h1").textContent === "Profile" && $(".scr-sub").textContent === "A seat at the family table" && d.getElementById("whoName").textContent === "Lula");
    ok("sections in order: how it's going, off the plate, settings, caregivers", $$("section.sec").map(s => s.dataset.sec).join() === "going,offplate,settings,people", $$("section.sec").map(s => s.dataset.sec));
    ok("…no percentages, scores or streaks anywhere", !/%|\bscore|\bstreak|\bmissed|\beaten/i.test(text()));

    // two folds, closed on arrival, each saying what's inside
    const fold = k => $(`[data-f="fold:${k}"]`), sums = k => [...sec(k).querySelectorAll(".pf-sum")].map(p => p.textContent);
    ok("How it's going and Off the plate start closed: 'Show', aria-expanded false", ["going", "offplate"].every(k => fold(k).textContent === "Show" && fold(k).getAttribute("aria-expanded") === "false") && !sec("loved") && !sec("firsts"));
    ok("…How it's going says 'Loved banana.' and 'First peas, carrots and egg in October.'", JSON.stringify(sums("going")) === JSON.stringify(["Loved banana.", "First peas, carrots and egg in October."]), sums("going"));
    ok("…Off the plate says 'Allergies: peanut and kiwi.' and what's introduced", sums("offplate")[0] === "Allergies: peanut and kiwi." && sums("offplate")[1] === "Egg, milk, tree nuts, wheat, soy, fish and sesame introduced.", sums("offplate"));
    fold("going").click(); await wait(30);
    ok("Show opens it: 'Hide', aria-expanded true, focus kept, the summary gone", fold("going").textContent === "Hide" && fold("going").getAttribute("aria-expanded") === "true" && d.activeElement === fold("going") && !sec("going").querySelector(".pf-sum"));

    // this week: each group's planned foods, offered in ink, still to come muted
    const rowsOf = k => [...sec(k).querySelectorAll(".pf-row")];
    const week = Object.fromEntries(rowsOf("week").map(r => [r.querySelector(".pf-row-l").textContent, r.querySelector(".pf-foods")]));
    ok("This week: a row per group, the group in the label column", Object.keys(week).length >= 3 && Object.keys(week).every(g => ["Protein", "Veg", "Fruit", "Grains", "Fats and dairy"].includes(g)), Object.keys(week));
    ok("…banana offered: in ink, first in Fruit", week.Fruit && !week.Fruit.querySelector(".pf-food").classList.contains("later") && week.Fruit.querySelector(".pf-food").textContent === "banana", week.Fruit && week.Fruit.innerHTML);
    ok("…what's planned and not offered yet is muted, and read as 'still to come'", rowsOf("week").some(r => r.querySelector(".pf-food.later")) && /still to come/.test(week.Fruit.getAttribute("aria-label")) && /^Fruit: offered banana/.test(week.Fruit.getAttribute("aria-label")), week.Fruit.getAttribute("aria-label"));
    ok("…no 'nothing yet' or 'Still waiting' sentences", !/nothing yet|Still waiting/i.test(sec("going").textContent));

    // loved it, still warming up
    ok("Loved it: foods whose offers were mostly loved", sec("loved").querySelector("p").textContent === "Banana.");
    const warm = () => [...sec("warming").querySelectorAll(".row")].map(r => [r.querySelector(".row-t").firstChild.textContent, r.querySelector(".row-sub").textContent]);
    ok("Still warming up: offered twice or more, 'Not today' or 'Ate some', not loved", warm().length === 1 && warm()[0][0] === "Carrots · offered 2 times", warm());
    ok("…with a try-another-way line (another texture, shape or pairing)", /^Try it /.test(warm()[0][1]) && /banana/.test(warm()[0][1]), warm()[0][1]);
    ok("…and no exposure count from research ('10 to 15 tries')", !/\b1[05]\b.*(tries|times)|tries/i.test(sec("warming").textContent));
    ok("peas, offered once, isn't there yet", !/Peas/.test(sec("warming").textContent));
    E(`const ev = (date, foodId, outcome) => ({id: uid(), at: date + "T12:00:00", date, mealId: "m-" + date, itemId: uid(), foodId, outcome, firstOfFood: false, firstAllergen: false});
       state.offers.push(ev("2026-10-22", "peas", "some"), ev("2026-10-22", "apple", "loved"), ev("2026-10-22", "avocado", "loved")); offersChanged(); save(); refresh("profile")`); await wait(30);
    const tips = warm().map(x => x[1]);
    ok("…each row pairs with a different loved food", tips.length === 2 && new Set(tips).size === 2, tips);

    // firsts, by month, no photos
    const months = rowsOf("firsts").map(r => [r.querySelector(".pf-row-l").textContent, r.querySelector(".pf-foods").textContent]);
    ok("Firsts: by month, the foods in a sentence: 'October · Peas, carrots and egg…'", months.length === 1 && months[0][0] === E("MONTH_NAMES[9]") && /^Peas, carrots, egg and banana\.$/.test(months[0][1]), months);
    E(`state.offers.push({id: uid(), at: "2026-09-12T12:00:00", date: "2026-09-12", mealId: "m", itemId: uid(), foodId: "oats", outcome: "loved", firstOfFood: true, firstAllergen: false}); offersChanged(); save(); refresh("profile")`); await wait(30);
    ok("…newest month first", rowsOf("firsts").map(r => r.querySelector(".pf-row-l").textContent).join() === E("MONTH_NAMES[9] + ',' + MONTH_NAMES[8]"), rowsOf("firsts").map(r => r.textContent));
    ok("…and no photos or photo buttons", !sec("going").querySelector("img") && !$('[data-f^="photo:"]'));
    E(`state.offers = state.offers.filter(e => e.date !== "2026-09-12" && !(e.date === "2026-10-22" && !e.firstOfFood && ["peas", "apple", "avocado"].includes(e.foodId))); offersChanged(); save(); refresh("profile")`); await wait(30);

    // off the plate: preferences, then the allergens by where they stand
    fold("offplate").click(); await wait(30);
    const off = () => sec("offplate").textContent;
    ok("Off the plate: 'Allergies: peanut and kiwi.' and 'Not a fan: beetroot.'", /Allergies: peanut and kiwi\./.test(off()) && /Not a fan: beetroot\./.test(off()), off().slice(0, 120));
    ok("…the locked rules for this age", off().includes(E("lockedLine(ageNow())")));
    const groups = () => { const g = {}; let cur = null; [...sec("offplate").querySelectorAll("h3, .row")].forEach(n => { if (n.tagName === "H3") g[cur = n.textContent] = {}; else g[cur][n.querySelector(".row-t").firstChild.textContent] = (n.querySelector(".row-sub") || {}).textContent || ""; }); return g; };
    ok("the allergens in two groups, 'Introduced' then 'Not yet'", JSON.stringify(Object.keys(groups())) === JSON.stringify(["Introduced", "Not yet"]), Object.keys(groups()));
    ok("…Egg: the day of its first offer; Milk (tried before): 'Before Chicho'", groups().Introduced.Egg === E("fmtDayMonth(localDate('2026-10-21'))") && groups().Introduced.Milk === "Before Chicho", groups().Introduced);
    ok("…Shellfish under Not yet, no repeated 'Not yet' under it; Peanut (kept out) is in Allergies, not a row", "Shellfish" in groups()["Not yet"] && groups()["Not yet"].Shellfish === "" && !("Peanut" in groups().Introduced) && !("Peanut" in groups()["Not yet"]), groups());
    ok("…kiwi and beetroot are preferences, not allergen rows", !/Kiwi|Beetroot/.test(JSON.stringify(groups())));
    $('[data-f="noreact:egg"]').click(); await wait(30);
    ok("'No reaction noted': '{today} · no reaction noted'", groups().Introduced.Egg === E("fmtDayMonth(now())") + " · no reaction noted" && E("state.allergyNotes.egg.noReactionOn") === "2026-10-22" && !$('[data-f="noreact:egg"]'), groups().Introduced.Egg);
    ok("…with the not-medical-advice note", /Not medical advice\./.test(off()));
    ok("Not yet has 'Tried, all fine'; tried before Chicho has 'Not yet'; Keep out and introduced-by-offer have neither", $('[data-f="tried:shellfish"]').textContent === "Tried, all fine" && $('[data-f="tried:milk"]').textContent === "Not yet" && !$('[data-f="tried:peanut"]') && !$('[data-f="tried:egg"]'));
    $('[data-f="tried:shellfish"]').click(); await wait(60);
    ok("…'Tried, all fine': Shellfish moves to Introduced (before Chicho), its button now 'Not yet', focus kept", E("state.profile.allergens.shellfish") === "ok" && groups().Introduced.Shellfish === "Before Chicho" && $('[data-f="tried:shellfish"]').textContent === "Not yet" && d.activeElement === $('[data-f="tried:shellfish"]'));
    $('[data-f="tried:shellfish"]').click(); await wait(60);
    ok("…and back: Not yet", !("shellfish" in E("state.profile.allergens")) && "Shellfish" in groups()["Not yet"]);
    fold("going").click(); fold("offplate").click(); await wait(30);

    // the drawn name heads Profile (read aloud by its spelling); no ink, the typed name
    ok("no ink: the header's name is typed; Profile's title stays 'Profile'", d.getElementById("whoName").textContent === "Lula" && !d.querySelector("#whoName svg") && d.getElementById("t-profile").textContent === "Profile");
    E(`state.profile.ink = {w: 300, h: 150, strokes: [[10, 100, 10, 20, 40, 60, 70, 20, 70, 100]]}; save(); changed()`); await wait(30);
    ok("ink: the header's name is the drawing (read as 'Lula'); the title never repeats it", !!d.querySelector("#whoName svg path") && d.querySelector("#whoName .sr-only").textContent === "Lula" && d.getElementById("t-profile").textContent === "Profile" && !d.querySelector("#t-profile svg"));
    E(`state.profile.ink = null; save(); changed()`); await wait(30);
    // settings reopen the onboarding's sentences, with a text Close that comes back here
    const rows = [...sec("settings").querySelectorAll(".row-btn")].map(b => b.querySelector(".row-t span").textContent);
    ok("Settings: birthday, meal times, priorities, kitchen basics, replay as rows", JSON.stringify(rows) === JSON.stringify(["Birthday", "Meal times", "Priorities", "Kitchen basics", "Replay the first steps"]), rows);
    const nameRow = sec("settings").firstElementChild.nextElementSibling;
    ok("…led by 'Name · Lula' with 'Redraw' and 'Edit spelling'", nameRow.classList.contains("s-person") && /^Name · Lula/.test(nameRow.textContent) && $('[data-f="set:redraw"]').textContent === "Redraw" && $('[data-f="set:name"]').textContent === "Edit spelling", nameRow.textContent);
    $('[data-f="set:redraw"]').click(); await wait(800);
    ok("Redraw opens Draw on its pad", !d.getElementById("onboarding").hidden && d.getElementById("onbTitle").textContent.startsWith("Pull up a chair for") && !!d.querySelector(".pad-sheet .pad"));
    d.getElementById("onbClose").click(); await wait(100);
    $('[data-f="set:name"]').click(); await wait(400);
    ok("Edit spelling (no ink): the typed sentence, its field focused", d.getElementById("onbTitle").textContent.startsWith("Pull up a chair for") && d.activeElement === d.querySelector("#onbCard .blank-input") && !d.querySelector(".pad-sheet"));
    ok("…with a text 'Close'", !d.getElementById("onbClose").hidden && d.getElementById("onbClose").textContent === "Close");
    d.getElementById("onbClose").click(); await wait(100);
    ok("…Close comes back to Profile", d.getElementById("onboarding").hidden && E("pg.cur") === "profile");
    $('[data-f="set:priorities"]').click(); await wait(400);
    ok("Priorities opens its step", /This week, we care most about/.test(d.getElementById("onbTitle").textContent));
    d.getElementById("onbClose").click(); await wait(100);
    $('[data-f="appearance:dark"]').click(); await wait(30);
    ok("Appearance: Auto · Light · Dark; Dark turns the theme", d.documentElement.dataset.theme === "dark" && $('[data-f="appearance:dark"]').getAttribute("aria-pressed") === "true" && $$(".s-seg-opts button").map(b => b.textContent).join() === "Auto,Light,Dark");
    $('[data-f="appearance:light"]').click(); await wait(30);

    // caregivers
    const nm = $('[data-f="pf:addname"]'), ph = $('[data-f="pf:addphone"]');
    nm.value = "ana"; ph.value = "+34 600 11 22 33";
    ph.dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true})); await wait(30);
    ok("caregivers: add 'Ana' with a number, kept on this device", E("state.profile.people.length") === 1 && E("state.profile.people[0].name") === "Ana" && E("state.profile.people[0].phone") === "+34600112233");
    const person = E("state.profile.people[0].id");
    ok("…each with 'Send tomorrow' and 'Remove'", $(`[data-f="pf:send:${person}"]`).textContent === "Send tomorrow" && $(`[data-f="pf:send:${person}"]`).getAttribute("aria-label") === "Tomorrow to Ana" && !!$(`[data-f="pf:rm:${person}"]`));
    $('[data-f="pf:link"]').click(); await wait(30);
    ok("'This week, as a link' warns first: allergies and menu, readable by anyone, can't be taken back", /This link includes Lula's allergies and menu\./.test(sec("people").textContent) && $('[data-f="pf:linkok"]').textContent === "Make the link");
    $(`[data-f="pf:rm:${person}"]`).click(); await wait(30);
    ok("…Remove takes the person away", E("state.profile.people.length") === 0);
    ok("no emoji or icon glyphs", !/\p{Extended_Pictographic}|✕|✓/u.test(text()));
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · profile";
};
</script>
</body></html>
