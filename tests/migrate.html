<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · migration tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}.f{color:#a02}.p{color:#060}</style></head>
<body>
<h1>Migration tests</h1>
<p>Opens the app once, then feeds old saves straight to <code>migrate()</code>. Every line should be PASS.</p>
<pre id="out">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const item = (name, qty, cat, eaten) => ({id: Math.random().toString(36).slice(2), name, qty, cats: [cat], eaten: !!eaten});
const week = () => ({days: ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(n => ({name: n, meals: [
  {label: "Breakfast", icon: "", items: [item("Oatmeal", "40 g", "grain", n === "Monday"), item("Banana", "60 g", "fruit")]}]}))});

localStorage.clear(); sessionStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test";
f.style.cssText = "width:390px;height:400px;border:1px solid #ccc";
document.body.append(f);
f.onload = () => {
  try {
    const w = f.contentWindow, M = s => w.migrate(JSON.parse(JSON.stringify(s)));

    // 1. schema 4: age in months, a grocery list, a "never include" list with locked items, eaten flags
    const v4 = M({schemaVersion: 4, createAge: 10, plan: week(), excludedFoods: ["Broccoli", "Honey", "Added salt or sugar", "Whole nuts"],
      grocery: [{id: "a", name: "Oatmeal", cat: "grain", checked: true, manual: false, entries: [{day: "Monday", qty: "40 g"}, {day: "Tuesday", qty: "60 g"}]},
                {id: "b", name: "Diapers", qty: "1 pack", cat: "other", checked: true, manual: true}]});
    ok("schema becomes 12", v4.schemaVersion === 12, v4.schemaVersion);
    ok("createAge 10 → birth date 10 months ago", w.ageMonths(v4.profile.birthDate) === 10, [v4.profile.birthDate, w.ageMonths(v4.profile.birthDate)]);
    ok("createAge and excludedFoods are gone", !("createAge" in v4) && !("excludedFoods" in v4), Object.keys(v4));
    ok("Broccoli becomes a dislike", JSON.stringify(v4.profile.avoid) === JSON.stringify([{name: "Broccoli", kind: "dislike"}]), v4.profile.avoid);
    ok("locked items (honey, salt, nuts) drop: they're locked now", !v4.profile.avoid.some(a => /honey|salt|nuts/i.test(a.name)), v4.profile.avoid);
    const mon = v4.plans[0].days[0].meals[0], tue = v4.plans[0].days[1].meals[0];
    ok("the old plan becomes one dated week, every meal and food with an id", v4.plans.length === 1 && typeof v4.plans[0].startsOn === "string" && v4.plans[0].days.every(d => d.meals.every(m => m.id && m.items.every(i => i.id))), v4.plans);
    ok("a food marked in an old save is an offer event now, and the mark is gone", v4.offers.length === 1 && v4.offers[0].itemId === mon.items[0].id && v4.offers[0].mealId === mon.id && v4.offers[0].foodId === "oatmeal" && !("eaten" in mon.items[0]) && !("offered" in mon.items[0]), [v4.offers, mon.items[0]]);
    ok("…dated on its weekday in that week", w.eval("DAY_ORDER")[w.localDate(v4.offers[0].date).getDay()] === "Monday", v4.offers[0].date);
    ok("…a first, with no outcome", v4.offers[0].firstOfFood === true && v4.offers[0].outcome === null, v4.offers[0]);
    ok("an unmarked food has no event", !v4.offers.some(e => e.itemId === tue.items[0].id));
    ok("old ticked grocery becomes Plenty in the pantry, the manual one too", JSON.stringify(v4.pantry.map(p => [p.foodId, p.state])) === JSON.stringify([["oatmeal", "plenty"], ["diapers", "plenty"]]), v4.pantry);
    ok("no stock, extras or grocery left", !("stock" in v4) && !("extras" in v4) && !("grocery" in v4), Object.keys(v4));
    ok("onboarding still to do, plan kept", v4.profile.onboarded === false && v4.plan.days.length === 7, [v4.profile.onboarded, v4.plan.days.length]);

    // 1b. schema 8: offered items, meal outcomes, exposures, the per-food records, stock in grams and extras
    const wk8 = week(); wk8.days.forEach(d => d.meals[0].items.forEach(i => { delete i.eaten; }));
    const tues = wk8.days[1].meals[0]; tues.items.forEach(i => i.offered = true); tues.outcome = "nottoday";
    const weds = wk8.days[2].meals[0]; weds.items[0].ate = "some"; weds.items[1].ate = "all";
    wk8.days[3].meals[0].items.unshift(item("Egg, well cooked", "50 g", "protein")); wk8.days[3].meals[0].items[0].offered = true;
    const v8 = M({schemaVersion: 8, plan: wk8, weekStarted: "2026-10-19", exposures: {oatmeal: 4, banana: 1, "egg, well cooked": 1, peas: 2},
      foods: {peas: {safety: "introduced", safetyOn: "2026-10-10", firstOfferOn: "2026-10-09"}, "egg, well cooked": {safety: "introduced", safetyOn: "2026-10-22", noReactionOn: "2026-10-23"}},
      stock: {"oatmeal": {name: "Oatmeal", g: 300, plenty: false}, "banana": {name: "Banana", g: 0, plenty: false}, "rice, soft-cooked": {name: "Rice, soft-cooked", g: null, plenty: false}},
      extras: [{id: "x", name: "Wipes", qty: "", checked: false}],
      profile: {name: "Lula", birthDate: "2025-04-01", onboarded: true, allergens: {}}});
    ok("schema 8 → 12", v8.schemaVersion === 12);
    ok("weekStarted becomes the week's start date (and still reads as a view)", v8.plans[0].startsOn === "2026-10-19" && v8.weekStarted === "2026-10-19" && !Object.keys(v8).includes("weekStarted") && !Object.keys(v8).includes("plan"), [v8.plans[0].startsOn, Object.keys(v8)]);
    const ev = v8.offers;
    ok("Tuesday's offered meal: one event per food on Tue 20 Oct, 'nottoday' → 'not_today'", ev.filter(e => e.date === "2026-10-20").length === 2 && ev.filter(e => e.date === "2026-10-20").every(e => e.outcome === "not_today"), ev);
    ok("Wednesday's schema-7 marks (ate some, ate all) become events with outcome 'some'", ev.filter(e => e.date === "2026-10-21").length === 2 && ev.filter(e => e.date === "2026-10-21").every(e => e.outcome === "some"), ev.filter(e => e.date === "2026-10-21"));
    ok("exposures beyond the week become earlier events (oatmeal 4 = 2 in the week + 2 before)", ev.filter(e => e.foodId === "oatmeal").length === 4 && ev.filter(e => e.foodId === "oatmeal" && e.mealId === "legacy").length === 2, ev.filter(e => e.foodId === "oatmeal"));
    ok("…dated the day before the week, or the food's first offer when it was known", ev.filter(e => e.foodId === "oatmeal" && e.mealId === "legacy").every(e => e.date === "2026-10-18") && ev.filter(e => e.foodId === "peas").every(e => e.date === "2026-10-09"), ev.filter(e => e.mealId === "legacy"));
    ok("firstOfFood: exactly one per food, on its earliest event", ["oatmeal", "banana", "egg", "peas"].every(k => { const es = ev.filter(e => e.foodId === k); return es.filter(e => e.firstOfFood).length === 1 && es.find(e => e.firstOfFood).date === es.map(e => e.date).sort()[0]; }), ev);
    ok("firstAllergen marks the egg's first offer", ev.find(e => e.foodId === "egg" && e.firstOfFood).firstAllergen === true && !ev.filter(e => e.foodId === "oatmeal").slice(1).some(e => e.firstAllergen), ev.filter(e => e.firstAllergen));
    ok("'no reaction noted' moves from the food to its allergen", v8.allergyNotes.egg && v8.allergyNotes.egg.noReactionOn === "2026-10-23", v8.allergyNotes);
    ok("stock: grams left → Plenty, none left → Out, no measure → Plenty; an open extra → Out", JSON.stringify(v8.pantry.map(p => [p.foodId, p.state])) === JSON.stringify([["oatmeal", "plenty"], ["banana", "out"], ["rice", "plenty"], ["wipes", "out"]]), v8.pantry);
    ok("exposures, foods, stock and extras are gone; items carry no offered flag; meals no outcome", !["exposures", "foods", "stock", "extras"].some(k => k in v8) && v8.plans[0].days.every(d => d.meals.every(m => !("outcome" in m) && m.items.every(i => !("offered" in i) && !("ate" in i)))), Object.keys(v8));

    // 1c. a schema-9 save comes back as it was
    const v9 = M(JSON.parse(JSON.stringify(v8)));
    ok("a v9 save round-trips: plans, offers, pantry and notes unchanged", JSON.stringify([v9.plans, v9.offers, v9.pantry, v9.allergyNotes]) === JSON.stringify([v8.plans, v8.offers, v8.pantry, v8.allergyNotes]));
    ok("…and state.plan / state.weekStarted are still the views", v9.plan === v9.plans[0] && v9.weekStarted === "2026-10-19");
    v9.plans.push({startsOn: "2099-01-05", days: v9.plans[0].days});
    ok("a week starting later doesn't take over before its date", v9.plan.startsOn === "2026-10-19");
    v9.plan = {days: v9.plans[0].days.slice()};
    ok("setting state.plan replaces the weeks with one on the current start date", v9.plans.length === 1 && v9.plans[0].startsOn === "2026-10-19");

    // 1d. schema 10: the Kitchen's shopping state and the cook-ahead record; the old suggestion ticks go
    ok("a v9 save gets an empty shop (manual, not this week, got it) and no cook-ahead done", JSON.stringify(v8.shop) === JSON.stringify({manual: [], notThisWeek: [], got: []}) && JSON.stringify(v8.cookAhead) === JSON.stringify({done: []}), [v8.shop, v8.cookAhead]);
    const v10 = M(Object.assign(JSON.parse(JSON.stringify(v8)), {schemaVersion: 9,
      pantry: [{foodId: "pumpkin", name: "Pumpkin", state: "plenty", updatedAt: "2026-10-22T10:00:00Z", prevState: "out"}, {foodId: "rice", name: "Rice", state: "low", prevState: "maybe"}],
      freezer: [{foodId: "lentils", name: "Lentils", portions: 2, madeOn: "2026-10-01"}, {foodId: "peas", portions: 0}],
      prepped: {date: "2026-10-22", done: ["double:Pumpkin:2026-10-23:4", "freeze:Lentils:2026-10-22", "roast:Beetroot:2026-10-22:2", "steam:Peas:2026-10-23:2", "defrost:Lentils:2026-10-23:2", "salt:2026-10-22"]},
      shop: {manual: [{foodId: "bread"}, {foodId: ""}, null], notThisWeek: [{foodId: "kiwi", planWeekId: "2026-10-19"}], got: [{foodId: "pumpkin", at: "2026-10-22T09:00:00Z", prevState: "out"}, {foodId: "rice", prevState: "nope"}]},
      cookAhead: {done: [{id: "roast:2026-10-22:abc", at: "2026-10-22T18:00:00Z", covers: [{foodId: "pumpkin", iso: "2026-10-23", mealId: "m1"}, {foodId: "x"}]}, {nope: 1}]}}));
    ok("the pantry keeps each food's state and a valid prevState (an unknown one drops)", JSON.stringify(v10.pantry.map(p => [p.foodId, p.state, p.prevState])) === JSON.stringify([["pumpkin", "plenty", "out"], ["rice", "low", undefined]]), v10.pantry);
    ok("the freezer keeps its portions; an empty one drops", JSON.stringify(v10.freezer.map(f => [f.foodId, f.portions, f.madeOn])) === JSON.stringify([["lentils", 2, "2026-10-01"]]), v10.freezer);
    ok("the old cook-double, make-double-and-freeze and same-oven ticks are deleted; defrost and salt stay", JSON.stringify(v10.prepped.done) === JSON.stringify(["defrost:Lentils:2026-10-23:2", "salt:2026-10-22"]), v10.prepped.done);
    ok("shop: junk entries drop, planWeekId and prevState kept", JSON.stringify(v10.shop) === JSON.stringify({manual: [{foodId: "bread"}], notThisWeek: [{foodId: "kiwi", planWeekId: "2026-10-19"}], got: [{foodId: "pumpkin", at: "2026-10-22T09:00:00Z", prevState: "out"}, {foodId: "rice", at: v10.shop.got[1].at, prevState: null}]}), v10.shop);
    ok("cook-ahead: done sessions kept with their covered meals, junk dropped", v10.cookAhead.done.length === 1 && v10.cookAhead.done[0].covers.length === 1 && v10.cookAhead.done[0].covers[0].mealId === "m1", v10.cookAhead);
    ok("a v10 save round-trips", JSON.stringify([v10.pantry, v10.freezer, v10.shop, v10.cookAhead]) === JSON.stringify((r => [r.pantry, r.freezer, r.shop, r.cookAhead])(M(JSON.parse(JSON.stringify(v10))))));

    // 2. the other ages old saves used, and nonsense
    [12, 18, 0, 36].forEach(m => { const r = M({schemaVersion: 5, createAge: m, plan: week()}); ok(`createAge ${m} → ${m} months`, w.ageMonths(r.profile.birthDate) === m, w.ageMonths(r.profile.birthDate)); });
    const bad = M({schemaVersion: 5, createAge: "x", plan: week()});
    ok("unreadable age → 10 months", w.ageMonths(bad.profile.birthDate) === 10, w.ageMonths(bad.profile.birthDate));
    const big = M({schemaVersion: 5, createAge: 99, plan: week()});
    ok("age over 36 is clamped to 36", w.ageMonths(big.profile.birthDate) === 36, w.ageMonths(big.profile.birthDate));

    // 2b. ages saved in years, or with units
    const age = o => w.ageMonths(M(Object.assign({schemaVersion: 5, plan: week()}, o)).profile.birthDate);
    ok("ageYears 2 → 24 months", age({ageYears: 2}) === 24, age({ageYears: 2}));
    ok("ageYears 1.5 → 18 months", age({ageYears: 1.5}) === 18, age({ageYears: 1.5}));
    ok("ageMonths 9 → 9 months", age({ageMonths: 9}) === 9, age({ageMonths: 9}));
    ok("createAge '2 years' → 24", age({createAge: "2 years"}) === 24, age({createAge: "2 years"}));
    ok("createAge '1 year 3 months' → 15", age({createAge: "1 year 3 months"}) === 15, age({createAge: "1 year 3 months"}));
    ok("createAge '9 months' → 9", age({createAge: "9 months"}) === 9, age({createAge: "9 months"}));
    ok("createAge '14' (text, no unit) → 14 months", age({createAge: "14"}) === 14, age({createAge: "14"}));
    ok("age {years:1, months:3} → 15", age({age: {years: 1, months: 3}}) === 15, age({age: {years: 1, months: 3}}));
    ok("age '1,5 y' → 18", age({age: "1,5 y"}) === 18, age({age: "1,5 y"}));
    ok("4 years is clamped to 36 months", age({ageYears: 4}) === 36, age({ageYears: 4}));
    const yrs = M({schemaVersion: 5, ageYears: 2, age: "2 years", plan: week()});
    ok("old age fields are gone after migrating", !("ageYears" in yrs) && !("age" in yrs) && !("ageMonths" in yrs), Object.keys(yrs));
    ok("a saved birth date always wins over an old age", w.ageMonths(M({schemaVersion: 6, ageYears: 3, profile: {birthDate: "2025-12-14"}, plan: week()}).profile.birthDate) === w.ageMonths("2025-12-14"));

    // 3. schema 6 round trip: nothing moves, junk is cleaned
    const v6 = M({schemaVersion: 6, plan: week(), profile: {name: "Lucía", birthDate: "2025-12-14", onboarded: true,
      allergens: {egg: "avoid", milk: "ok", unicorn: "avoid", fish: "maybe"}, avoid: [{name: "Kiwi", kind: "allergy"}, {name: " ", kind: "dislike"}, {name: "Peas"}],
      priorities: ["iron", "quick", "nope", "batch", "gentle"]}});
    ok("birth date kept", v6.profile.birthDate === "2025-12-14", v6.profile.birthDate);
    ok("name and onboarded kept", v6.profile.name === "Lucía" && v6.profile.onboarded === true, v6.profile);
    ok("unknown allergens and states dropped", JSON.stringify(v6.profile.allergens) === JSON.stringify({egg: "avoid", milk: "ok"}), v6.profile.allergens);
    ok("blank avoid dropped, missing kind = dislike", JSON.stringify(v6.profile.avoid) === JSON.stringify([{name: "Kiwi", kind: "allergy"}, {name: "Peas", kind: "dislike"}]), v6.profile.avoid);
    ok("priorities: known ids, at most 3", JSON.stringify(v6.profile.priorities) === JSON.stringify(["iron", "quick", "batch"]), v6.profile.priorities);

    // 4. birth-date arithmetic edges
    const D = (y, m, d) => new w.Date(y, m - 1, d);
    ok("born Jan 31, on Feb 28 → 0 months", w.ageMonths("2026-01-31", D(2026, 2, 28)) === 0, w.ageMonths("2026-01-31", D(2026, 2, 28)));
    ok("born Jan 31, on Mar 31 → 2 months", w.ageMonths("2026-01-31", D(2026, 3, 31)) === 2, w.ageMonths("2026-01-31", D(2026, 3, 31)));
    ok("born Dec 15, on Dec 14 next year → 11", w.ageMonths("2025-12-15", D(2026, 12, 14)) === 11, w.ageMonths("2025-12-15", D(2026, 12, 14)));
    ok("10 months before May 31 → Jul 31", w.birthDateFromMonths(10, D(2026, 5, 31)) === "2025-07-31", w.birthDateFromMonths(10, D(2026, 5, 31)));
    ok("1 month before Mar 31 → Feb 28 (clamped)", w.birthDateFromMonths(1, D(2026, 3, 31)) === "2026-02-28", w.birthDateFromMonths(1, D(2026, 3, 31)));
    ok("future birth date → 0, never negative", w.ageMonths("2027-01-01", D(2026, 10, 22)) === 0, w.ageMonths("2027-01-01", D(2026, 10, 22)));
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("out").innerHTML = out.map(l => `<span class="${l.startsWith("PASS") ? "p" : "f"}">${l.replace(/</g, "&lt;")}</span>`).join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · migration";
};
</script>
</body></html>
