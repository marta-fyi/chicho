<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · onboarding tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Onboarding tests</h1>
<p>Onboarding v3, driven like a person would: drawing on the pad, typing into the blanks, Enter, Back. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T09:15";
f.style.cssText = "width:390px;height:844px;border:1px solid #ccc";
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    const step = () => E("onb.step");
    const type = (inp, v) => { inp.focus(); inp.value = v; inp.dispatchEvent(new w.Event("input", {bubbles: true})); };
    const enter = inp => inp.dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true}));
    const next = () => d.querySelector("#onbFoot .btn-ink");
    const settle = () => wait(450);
    const before = JSON.stringify(E("state.plan"));

    // Draw: no welcome; the page opens on the sentence and its pad
    ok("a first run opens straight on Draw (no welcome)", step() === "draw" && !d.getElementById("onboarding").hidden && !d.querySelector(".wel-art, .wel-h"));
    ok("'Pull up a chair for ____.' is the title, and it takes the focus (no keyboard on arrival)", d.getElementById("onbTitle").textContent.replace(/\s+/g, " ").trim() === "Pull up a chair for ." && d.activeElement === d.getElementById("onbTitle"), d.getElementById("onbTitle").textContent);
    ok("…at 40px", getComputedStyle(d.getElementById("onbTitle")).fontSize === "40px");
    ok("no Back on Draw, no Close on a first run", d.getElementById("onbBack").hidden && d.getElementById("onbClose").hidden);
    ok("progress: four hairline segments, the first on; 'Step 1 of 4: Name' for screen readers", d.querySelectorAll("#onbDots i").length === 4 && d.querySelector("#onbDots i").classList.contains("on") && d.getElementById("onbProgress").textContent === "Step 1 of 4: Name");
    await wait(700);
    const sheet = d.querySelector(".onb-sheet.pad-sheet");
    ok("the pad's sheet rises: 'Sign here', 'Big letters. Wobbly is perfect.'", sheet && !sheet.hidden && sheet.querySelector(".sh-title").textContent === "Sign here" && sheet.querySelector(".sh-hint").textContent === "Big letters. Wobbly is perfect.");
    const btns = [...sheet.querySelectorAll("button")].map(b => b.textContent);
    ok("…Erase, Done, Undo, then 'Type instead'", JSON.stringify(btns) === JSON.stringify(["Erase", "Done", "Undo", "Type instead"]), btns);
    const pad = sheet.querySelector("canvas.pad"), done = sheet.querySelector(".pad-row .btn-ink");
    ok("a drawing pad, named for screen readers, with no browser panning on it", !!pad && pad.getAttribute("aria-label") === "Drawing pad for their name" && getComputedStyle(pad).touchAction === "none");
    ok("…Done is aria-disabled until there's ink, Erase and Undo off", done.getAttribute("aria-disabled") === "true" && sheet.querySelector(".pad-row .btn-text").disabled);
    const pr = pad.getBoundingClientRect();
    const stroke = pts => { const p = (t, [x, y]) => pad.dispatchEvent(new w.PointerEvent(t, {bubbles: true, cancelable: true, pointerId: 7, pointerType: "touch", isPrimary: true, clientX: pr.left + x, clientY: pr.top + y}));
      p("pointerdown", pts[0]); pts.slice(1).forEach(q => p("pointermove", q)); p("pointerup", pts[pts.length - 1]); };
    stroke([[20, 120], [20, 30], [50, 80], [80, 30], [80, 120]]);
    stroke([[110, 30], [110, 120]]);
    const ink = E("state.profile.ink");
    ok("writing saves the ink: two strokes of points, on this device", ink && ink.strokes.length === 2 && ink.strokes[0].length >= 10 && ink.w > 0 && ink.h > 0, ink && ink.strokes.map(s => s.length));
    ok("…the blank mirrors it live, as an SVG marked data-ink", !!d.querySelector("#onbTitle .ink-blank svg[data-ink] path"));
    ok("…and Done is ready", done.getAttribute("aria-disabled") === "false");
    [...sheet.querySelectorAll(".pad-row .btn-text")].find(b => b.textContent === "Undo").click();
    ok("Undo takes the last stroke back", E("state.profile.ink.strokes.length") === 1);
    [...sheet.querySelectorAll(".pad-row .btn-text")].find(b => b.textContent === "Erase").click();
    ok("Erase empties the pad and the ink", E("state.profile.ink") === null && done.getAttribute("aria-disabled") === "true" && !d.querySelector("#onbTitle .ink-blank svg"));
    done.click(); await settle();
    ok("…an empty pad's Done does nothing", step() === "draw");
    stroke([[20, 120], [20, 30], [50, 80], [80, 30], [80, 120]]);
    done.click(); await settle();

    // Spell
    ok("Done goes to Spell, the ink above 'Spelled for the grown-ups: ____.'", step() === "spell" && !!d.querySelector(".spell-ink svg[data-ink]") && d.getElementById("onbTitle").textContent.startsWith("Spelled for the grown-ups:"));
    ok("…'So we can say hello properly.'", d.querySelector("#onbCard .onb-line").textContent === "So we can say hello properly.");
    ok("…Back is a text 'Back', top-left; the first segment is still on", !d.getElementById("onbBack").hidden && d.getElementById("onbBack").textContent === "Back" && d.getElementById("onbProgress").textContent === "Step 1 of 4: Name");
    const nameIn = d.querySelector(".blank-input");
    ok("the words before the blank label it", d.querySelector(`label[for="${nameIn.id}"]`).textContent === "Spelled for the grown-ups:");
    ok("the blank has no placeholder", !nameIn.placeholder);
    ok("Next is pinned in the foot, aria-disabled until there's a name", next().classList.contains("wait") && next().getAttribute("aria-disabled") === "true");
    type(nameIn, "Lula");
    ok("…and ready once there is one", !next().classList.contains("wait") && next().getAttribute("aria-disabled") === "false");
    ok("the mirror grows the field with the text", d.querySelector(".blank-mirror").textContent === "Lula");
    d.getElementById("onbBack").click(); await settle();
    ok("Back from Spell: Draw, with the ink kept", step() === "draw" && E("state.profile.ink.strokes.length") === 1);
    await wait(500);
    d.querySelector(".pad-row .btn-ink").click(); await settle();
    enter(d.querySelector(".blank-input")); await settle();

    // birthday: three columns, nothing counts until each is touched
    ok("Enter continues to the birthday", step() === "birthday");
    ok("'Lula showed up on…', the name as its ink (and its spelling for screen readers)", d.getElementById("onbTitle").textContent === "Lula showed up on…" && !!d.querySelector("#onbTitle svg[data-ink]"), d.getElementById("onbTitle").textContent);
    ok("progress: 'Step 2 of 4: Birthday'", d.getElementById("onbProgress").textContent === "Step 2 of 4: Birthday");
    await wait(300);
    const cols = () => [...d.querySelectorAll(".bd-col")], col = k => d.querySelector(`.bd-col[data-key="${k}"]`);
    ok("three spinbuttons in the locale's order", JSON.stringify(cols().map(c => c.dataset.key)) === JSON.stringify(E("bdOrder()")) && cols().every(c => c.getAttribute("role") === "spinbutton"));
    ok("untouched: dim, 'Swipe each column.', Next aria-disabled", cols().every(c => c.classList.contains("untouched")) && d.querySelector(".bd-msg").textContent === "Swipe each column." && next().getAttribute("aria-disabled") === "true");
    ok("…starting at 15, this month, last year", col("day").getAttribute("aria-valuenow") === "15" && col("month").getAttribute("aria-valuetext") === "October" && col("year").getAttribute("aria-valuenow") === "2025");
    const key = (k, name, n = 1) => { for (let i = 0; i < n; i++) col(k).dispatchEvent(new w.KeyboardEvent("keydown", {key: name, bubbles: true, cancelable: true})); };
    key("day", "ArrowDown"); key("month", "ArrowUp", 2);
    ok("two touched: still not ready", next().getAttribute("aria-disabled") === "true" && !col("day").classList.contains("untouched"));
    key("year", "ArrowUp"); key("year", "ArrowDown");
    ok("all three: 14 December 2025, saved", E("state.profile.birthDate") === "2025-12-14" && next().getAttribute("aria-disabled") === "false" && d.querySelector(".bd-msg").textContent === "", E("state.profile.birthDate"));
    ok("the stage: 'Fingers first' · '3 meals · lumpy mash and finger foods'",
       d.querySelector(".bd-tag").textContent === "Fingers first" && d.querySelector(".bd-line").textContent === "3 meals · lumpy mash and finger foods");
    key("year", "ArrowUp");
    ok("a future date: 'That day hasn't happened yet.', no Next", d.querySelector(".bd-msg").textContent === "That day hasn't happened yet." && next().getAttribute("aria-disabled") === "true");
    key("day", "End"); key("month", "Home"); key("month", "ArrowUp");
    ok("31 then February: 'Day set to 28'", col("day").getAttribute("aria-valuenow") === "28" && d.querySelector(".bd-step .sr-only[aria-live]").textContent === "Day set to 28", [col("day").getAttribute("aria-valuenow"), d.querySelector(".bd-step .sr-only[aria-live]").textContent]);
    key("month", "PageUp"); key("day", "Home");
    ok("1 July 2026: milk for now, with how long", E("state.profile.birthDate") === "2026-07-01" && d.querySelector(".bd-tag").textContent === "Milk is all Lula needs for now. We'll save a seat for 3 more months." && d.querySelector(".bd-line").textContent === "Nothing to cook yet.", d.querySelector(".bd-stage").textContent);
    ok("…and Next still goes on", next().getAttribute("aria-disabled") === "false");
    key("year", "ArrowDown"); key("month", "PageUp"); key("day", "Home", 1); key("day", "ArrowUp", 13);
    ok("back to 14 December 2025", E("state.profile.birthDate") === "2025-12-14", E("state.profile.birthDate"));
    next().click(); await settle();
    d.getElementById("onbBack").click(); await settle();
    ok("Back keeps what was chosen, touched", step() === "birthday" && col("month").getAttribute("aria-valuetext") === "December" && !col("year").classList.contains("untouched"));
    next().click(); await settle();

    // keep out
    ok("keep out is a statement", step() === "keepout" && d.getElementById("onbTitle").textContent === "Keep these off the plate.");
    const egg = [...d.querySelectorAll(".pill-o")].find(b => b.textContent.includes("Egg"));
    egg.click(); ok("tap once: keep out", E("state.profile.allergens.egg") === "avoid" && egg.dataset.state === "out");
    egg.click(); ok("tap twice: tried and loved", E("state.profile.allergens.egg") === "ok" && egg.dataset.state === "loved");
    egg.click(); ok("tap three times: back to neutral", !("egg" in E("state.profile.allergens")));
    d.querySelector(".pill-add").click(); await wait(50);
    const also = d.querySelector(".pill-edit .blank-input");
    ok("'Add something else' opens 'Also not ____' in a pill", !!also && d.querySelector(`label[for="${also.id}"]`).textContent === "Also not");
    d.querySelectorAll(".kind-toggle button")[1].click();
    type(also, "Kiwi"); enter(also); await wait(50);
    ok("…and saves it as a dislike", JSON.stringify(E("state.profile.avoid")) === JSON.stringify([{name: "Kiwi", kind: "dislike"}]));
    ok("the locked line names this stage's rules", /^Always off the plate at this age: honey/.test(d.querySelector(".locked-say p").textContent.trim()));
    next().click(); await settle();

    // ask late: a first run goes from the allergens straight to the week
    ok("a first run skips priorities, the kitchen and meal times (asked later)", step() === "reveal", step());
    ok("…and only shows dots for the steps it asks", d.querySelectorAll("#onbDots i").length === 4, d.querySelectorAll("#onbDots i").length);

    // reveal, then the week, applied only on Love it
    ok("the reveal: 'Setting the table…'", step() === "reveal" && d.getElementById("onbTitle").textContent === "Setting the table…");
    ok("…with drawings floating in", d.querySelectorAll(".rv-item").length > 0);
    await wait(2600);
    ok("it moves on by itself within 2.5 s", d.getElementById("onbTitle").textContent === "Lula's week.");
    const rows = [...d.querySelectorAll("#onbCard .wk-rows .wk-row")];
    ok("the week preview: seven rows of text, one a day, today first, no drawings", rows.length === 7 && !d.querySelector("#onbCard .wk-rows .food-art, #onbCard .wk-rows img") && rows[0].querySelector(".wk-name").textContent === E("new Intl.DateTimeFormat(undefined, {weekday: 'short'}).format(now())") && rows.every(r => /: /.test(r.querySelector(".wk-meals").textContent)), rows.map(r => r.textContent).slice(0, 2));
    ok("nothing is applied before the choice", JSON.stringify(E("state.plan")) === before);
    d.querySelectorAll("#onbFoot .btn-text")[0].click(); await settle();
    ok("Shuffle makes another week, still not applied", JSON.stringify(E("state.plan")) === before && !!E("onb.draft"));
    const draft = JSON.stringify(E("onb.draft.days"));
    E(`state.offers.push({id: "keepme", at: "", date: "2026-10-01", mealId: "legacy", itemId: null, foodId: "banana", outcome: null, firstOfFood: true, firstAllergen: false}); offersChanged()`);
    next().click(); await settle();
    ok("Love it applies that week (startWeek, from today) and closes", JSON.stringify(E("state.plan.days")) === draft && E("state.plan.startsOn") === E("todayISO()") && E("state.plans.length") === 1 && d.getElementById("onboarding").hidden && E("state.profile.onboarded") === true);
    ok("…nothing from the log is lost", E("state.offers.some(e => e.id === 'keepme')"));
    ok("…its meals carry slots", E("state.plan.days.every(d => d.meals.every(m => m.slot))"));

    // the late steps open one at a time (from the profile sheet or a late question) and close after
    E('openOnboarding("priorities", {single: true})'); await settle();
    ok("priorities: 'This week, we care most about…'", step() === "priorities" && d.getElementById("onbTitle").textContent === "This week, we care most about…");
    const pills = [...d.querySelectorAll(".pill-o")];
    pills.slice(0, 4).forEach(b => b.click());
    ok("at most three, the rest disabled", E("state.profile.priorities.length") === 3 && pills[4].disabled);
    ok("one line says how the week changes", /^We'll lean on iron-rich meals/.test(d.querySelector(".onb-lean").textContent));
    ok("a single step says Save", next().textContent === "Save");
    next().click(); await settle();
    ok("…and Save closes it", d.getElementById("onboarding").hidden);
    E('openOnboarding("priorities", {single: true})'); await settle();
    const close = d.getElementById("onbClose");
    ok("a re-opened step has a text 'Close' (no icon glyph)", !close.hidden && close.textContent === "Close" && !/✕/.test(close.textContent));
    close.click(); await settle();
    ok("…and Close returns", d.getElementById("onboarding").hidden);
    E('openOnboarding("mealtimes", {single: true})'); await settle();
    ok("meal times, for the stage's meals", step() === "mealtimes" && [...d.querySelectorAll(".mt-row label")].map(l => l.textContent).join() === "Breakfast at,Lunch at,Dinner at", [...d.querySelectorAll(".mt-row label")].map(l => l.textContent).join());
    const lunch = d.getElementById("mt-lunch");
    ok("prefilled with the stage's anchors", lunch.value === "12:30");
    lunch.value = "12:00"; lunch.dispatchEvent(new w.Event("change", {bubbles: true}));
    ok("a changed time is saved as theirs", E("state.profile.mealTimes.lunch") === "12:00");
    next().click(); await settle();
    ok("…and confirmed, so the late question doesn't ask again", E("state.profile.mealTimesConfirmed") === true && d.getElementById("onboarding").hidden);
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · onboarding";
};
</script>
</body></html>
