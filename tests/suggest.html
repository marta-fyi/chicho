<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · suggestion tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>"While you're at it" tests</h1>
<p>suggestAlso() on small hand-made weeks (Thursday 22 October 2026): each rule, its order, the cap of two, lead-time gating, the family-salt retirement and the prepped flag. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
localStorage.clear(); sessionStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test";
f.style.cssText = "width:390px;height:300px;border:1px solid #ccc";
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, E = x => w.eval(x);
    // a blank week, then only the meals each case needs
    E(`window.tMk = (spec, months) => {
      state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(months || 18, new Date(2026, 9, 22))});
      const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(name => ({name, meals: []}));
      const slots = {breakfast: "Breakfast", snack1: "Snack", lunch: "Lunch", snack2: "Snack", dinner: "Dinner"};
      spec.forEach(([day, slot, foods, extra]) => {
        const d = days.find(x => x.name === day);
        const m = meal(slots[slot], "", foods.map(([n, q]) => { const p = FOOD_POOL.find(x => x.name === n); return it(n, q, p.cats.slice()); }), slot);
        Object.assign(m, extra || {});
        d.meals.push(m);
      });
      days.forEach(d => d.meals.sort((a, b) => MEAL_SLOTS.findIndex(s => s.id === a.slot) - MEAL_SLOTS.findIndex(s => s.id === b.slot)));
      state.plan = {days};
      return state.plan;
    };
    window.tRef = (day, slot, date) => {
      const dayIdx = state.plan.days.findIndex(d => d.name === day), k = state.plan.days[dayIdx].meals.findIndex(m => m.slot === slot);
      const m = state.plan.days[dayIdx].meals[k];
      return {m, k, dayIdx, date, start: atTime(date, mealTime(slot, date))};
    };
    window.tS = (r, nowD, pantry, seen) => suggestAlso(r, state.plan, nowD, state.profile, pantry || {}, Object.assign({sessions: deriveCookAhead(state.plan, [], nowD, {timeOf: mealTime})}, seen || {}));`);
    const thu = "new Date(2026, 9, 22)", fri = "new Date(2026, 9, 23)";

    // 2. cook ahead (from deriveCookAhead, the Kitchen's own) and 5. salt, capped at two, in order
    E(`tMk([["Thursday", "lunch", [["Carrots, soft-cooked", "45 g"]]], ["Friday", "lunch", [["Carrots, soft-cooked", "45 g"]]]])`);
    let s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("carrots today and tomorrow: the cook-ahead session for this meal, 'Carrots +45 g. Covers tomorrow's lunch.'", s[0] && s[0].kind === "cook" && s[0].text === "Carrots +45 g. Covers tomorrow's lunch.", s);
    ok("…it is the session itself (one source with the Kitchen's Prep)", s[0] && s[0].id === E(`deriveCookAhead(state.plan, [], new Date(2026, 9, 22, 11, 0), {timeOf: mealTime})[0].id`));
    ok("never more than two, and never two about the same food (cook, then salt)", s.length === 2 && s[1].kind === "salt", s.map(x => x.kind));
    const before = E("JSON.stringify(state.plan)");
    E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("pure: asking changes nothing in the plan", E("JSON.stringify(state.plan)") === before);
    ok("only foods already in the plan are ever suggested", s.every(x => E(`state.plan.days.some(d => d.meals.some(m => m.items.some(i => i.name === ${JSON.stringify(x.food)} || baseName(i) === ${JSON.stringify(x.food)})))`)));
    s = E(`tS(tRef("Friday", "lunch", ${fri}), new Date(2026, 9, 22, 11, 0))`);
    ok("the later meal gets no line of its own (it's covered, not the first)", !s.some(x => x.kind === "cook"), s.map(x => x.kind));
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0), {}, {sessions: deriveCookAhead(state.plan, [], new Date(2026, 9, 22, 11, 0), {timeOf: mealTime}).map(x => Object.assign(x, {done: true}))})`);
    ok("a session marked done stops appearing", !s.some(x => x.kind === "cook"), s.map(x => x.kind));
    // the old generic rules are gone
    E(`tMk([["Monday", "lunch", [["Carrots, soft-cooked", "45 g"]]], ["Thursday", "lunch", [["Carrots, soft-cooked", "45 g"], ["Sweet potato", "45 g"]]], ["Thursday", "dinner", [["Pumpkin", "45 g"]]], ["Sunday", "lunch", [["Carrots, soft-cooked", "45 g"]]]])`);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("no 'Cook double', 'Make double … freeze half' or 'the oven's on' lines any more", !s.some(x => ["double", "freeze", "oven", "steamer"].includes(x.kind)) && !s.some(x => /double|oven's on|steamer's on/i.test(x.text)), s);

    // 1. lead time: a frozen portion to defrost, while there's time
    E(`tMk([["Thursday", "lunch", [["Rice, soft-cooked", "40 g"]]], ["Friday", "dinner", [["Lentils", "40 g"]], {from: "Wednesday"}]])`);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("a batch portion tomorrow: 'Move the lentils to the fridge tonight…' comes first", s[0] && s[0].kind === "defrost" && /Move the lentils to the fridge tonight\. It's in dinner tomorrow\./.test(s[0].text), s);
    E(`tMk([["Friday", "lunch", [["Rice, soft-cooked", "40 g"]]], ["Friday", "dinner", [["Lentils", "40 g"]], {from: "Wednesday"}]])`);
    s = E(`tS(tRef("Friday", "lunch", ${fri}), new Date(2026, 9, 23, 13, 0))`);
    ok("six hours before: too late to defrost, so it isn't suggested", !s.some(x => x.kind === "defrost"), s.map(x => x.kind));
    // soak: only for dried legumes in the pantry (canned is the default)
    E(`tMk([["Thursday", "lunch", [["Rice, soft-cooked", "40 g"]]], ["Friday", "lunch", [["Lentils", "40 g"]]]])`);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("lentils treated as canned: no soaking", !s.some(x => x.kind === "soak"), s.map(x => x.kind));
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0), {lentils: {name: "Lentils", g: 500, dried: true}})`);
    ok("dried lentils in the pantry: 'Soak the lentils tonight. It's in lunch tomorrow.'", s[0] && s[0].kind === "soak" && s[0].text === "Soak the lentils tonight. It's in lunch tomorrow.", s);

    // 5. family salt: 12 months and up, lunch or dinner, retired after three showings
    E(`tMk([["Thursday", "lunch", [["Banana", "45 g"]]]])`);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`);
    ok("18 months at lunch: 'Cooking for the family? Set aside Lula's portion before adding salt.'", s.some(x => x.kind === "salt" && x.text === "Cooking for the family? Set aside Lula's portion before adding salt."), s);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0), {}, {salt: 3})`);
    ok("…retired after three showings", !s.some(x => x.kind === "salt"));
    E(`tMk([["Thursday", "breakfast", [["Banana", "45 g"]]]])`);
    ok("…never at breakfast", !E(`tS(tRef("Thursday", "breakfast", ${thu}), new Date(2026, 9, 22, 7, 0))`).some(x => x.kind === "salt"));
    E(`tMk([["Thursday", "lunch", [["Banana", "45 g"]]]], 10)`);
    ok("…and not before 12 months", !E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0))`).some(x => x.kind === "salt"));

    E(`tMk([["Thursday", "lunch", [["Carrots, soft-cooked", "45 g"]]], ["Friday", "lunch", [["Carrots, soft-cooked", "45 g"]]]])`);
    s = E(`tS(tRef("Thursday", "lunch", ${thu}), new Date(2026, 9, 22, 11, 0), {}, {max: 1})`);
    ok("seen.max caps the lines (Home asks for one)", s.length === 1, s.length);

    // Home and the Kitchen share one done-state
    E(`tMk([["Thursday", "lunch", [["Carrots, soft-cooked", "45 g"]]], ["Thursday", "dinner", [["Carrots, soft-cooked", "45 g"]]]]); setClock(new Date(2026, 9, 22, 11, 0)); state.weekStarted = "2026-10-22"; state.prepped = {}; state.cookAhead = {done: []}; state.profile.lastStage = stageNow().id; closeOnboarding(); homeChanged();`);
    const d = f.contentDocument, wait = ms => new Promise(r => setTimeout(r, ms));
    const also = () => [...d.querySelectorAll("#nowMeal .meal-also")];
    ok("Home shows one 'While you're at it' line: the session, with 'Done'", also().length === 1 && also()[0].textContent === "While you're at it: Carrots +45 g. Covers tonight's dinner. Done", also().map(x => x.textContent));
    E(`go("kitchen", {quiet: true}); switchView("prep")`); await wait(450);
    const sid = E(`cookAhead()[0].id`), kring = () => d.querySelector(`#scr-kitchen [data-f="cook:${sid}"]`);
    ok("the Kitchen's Prep has the same session, its ring open", !!kring() && !kring().classList.contains("on") && kring().closest(".k-prep").textContent.startsWith("Steam with today's lunch"));
    d.querySelector('[data-f="also:done"]').click(); await wait(60);
    ok("Done on Home: the Kitchen's ring fills too", kring() && kring().classList.contains("on"));
    ok("…and Home's line moves on", !also().some(x => /Carrots \+45/.test(x.textContent)));
    E(`setClock(new Date(2026, 9, 22, 18, 30)); picked = null; homeChanged()`); await wait(60);
    ok("the later meal says '{food} · prepped' (Home at dinner)", [...d.querySelectorAll("#nowMeal .meal-foods li")].some(li => li.textContent === "Carrots · prepped"), [...d.querySelectorAll("#nowMeal .meal-foods li")].map(li => li.textContent));
    E(`setClock(new Date(2026, 9, 22, 11, 0)); picked = null; homeChanged()`); await wait(60);
    kring().click(); await wait(60);
    ok("unticked in the Kitchen: Home's line is back", also().some(x => /Carrots \+45 g/.test(x.textContent)) && !E("state.cookAhead.done.length"));
    E(`refresh("kitchen")`); await wait(30);
    kring().click(); await wait(60);
    ok("ticked in the Kitchen: Home's line goes", !also().some(x => /Carrots \+45 g/.test(x.textContent)) && E("state.cookAhead.done.length") === 1);
    E("setClock(null)");
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · suggest";
};
</script>
</body></html>
