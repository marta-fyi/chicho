<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · home tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Home tests</h1>
<p>The lock screen, driven by taps and keys against a set clock (Thursday 22 October 2026, 12:10): offered, outcomes, the one-open-at-a-time meal, sheets. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T12:10";
f.style.cssText = "width:1200px;height:900px;border:1px solid #ccc";
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesConfirmed: true});
       ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok");
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id;
       state.exposures = {}; state.foods = {}; save(); closeOnboarding();`);
    await wait(200);
    const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
    const lunch = () => E("state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch')");
    const key = (el, k) => el.dispatchEvent(new w.KeyboardEvent("keydown", {key: k, bubbles: true}));

    // the top of the page
    ok("header: 'Thursday, October 22 · 12:10' on one line", $("#clock").textContent === E("fmtHeaderDate(now())") && $("#clock").textContent.includes(" · "), $("#clock").textContent);
    ok("…then 'Lula · 18 months'", $("#who").textContent === "Lula · 18 months");
    ok("the clock and headline are plain text, not live regions", !$("#clock").closest("[aria-live]") && !$("#headline").closest("[aria-live]"));
    ok("headline: 'Lunch in 20 minutes.'", $("#headline").textContent === "Lunch in 20 minutes.");
    ok("the tab: 'Lunch in 20 min · Chicho'", d.title === "Lunch in 20 min · Chicho", d.title);
    ok("Send has its word, and the profile circle its initial", $("#sendBtn").textContent.trim() === "Send" && $("#profileBtn").textContent === "L");

    // the open meal: the next one, in place
    ok("the open meal is lunch", $("#openMeal .mx-title").textContent === "Lunch");
    ok("…its meta: 'around 12:30 · {n} min · {texture}'", /^around .+ · \d+ min · .+/.test($("#openMeal .mx-meta").textContent), $("#openMeal .mx-meta").textContent);
    ok("…a row per food with amount and texture", $$("#openMeal .fr").length === lunch().items.length && $$("#openMeal .fr-sub").every(s => / · /.test(s.textContent)));
    ok("…the how, in one or two lines", !!$("#openMeal .mx-how") && $("#openMeal .mx-how").textContent.split(". ").length <= 3);
    ok("…and 'Mark as offered'", $("#openMeal .offer-pill").textContent === "Mark as offered");
    ok("earlier today: breakfast and the snack, with only an empty ring (no 'Not logged')", $$("#earlierList .mrow").length === 2 && $$("#earlierList .ring-btn").every(r => r.getAttribute("aria-pressed") === "false") && !/logged/i.test($("#earlierSec").textContent));
    ok("up next: the snack and dinner", $$("#nextList .mrow").length === 2 && $("#nextLabel").textContent === "Up next");

    // offered → Offered · Undo → Offered + how it went
    $("#openMeal .offer-pill").click(); await wait(30);
    const pillNow = () => [...d.querySelectorAll(".mx")].find(x => x.querySelector(".mx-title").textContent === "Lunch");
    ok("tap: lunch is offered", E("mealOffered(state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch'))") === true);
    ok("…it stays open: 'Offered · Undo' for 5 seconds", !!pillNow() && pillNow().querySelector(".offer-pill").textContent.trim() === "Offered" && [...pillNow().querySelectorAll(".mx-acts .btn-text")].some(b => b.textContent === "Undo"));
    await wait(80);
    ok("…announced politely: 'Lunch offered'", d.getElementById("liveStatus").textContent === "Lunch offered", d.getElementById("liveStatus").textContent);
    ok("variety counts what was offered", E("GROUPS.some(c => offeredFoods(c).length)"));
    [...pillNow().querySelectorAll(".mx-acts .btn-text")].find(b => b.textContent === "Undo").click(); await wait(30);
    ok("Undo: not offered again", E("mealOffered(state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch'))") === false && pillNow().querySelector(".offer-pill").textContent === "Mark as offered");
    ok("…and nothing left behind in variety", !E("offeredFoods(state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch').items[0].cats[0]).includes(baseName(state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch').items[0]))"));
    pillNow().querySelector(".offer-pill").click(); await wait(5200);
    ok("after 5 seconds: 'Offered' and the outcome row", !!$(".outcomes") && $$(".outcome").map(b => b.textContent).join(" · ") === "Loved it · Ate some · Not today");
    $$(".outcome")[0].click(); await wait(30);
    ok("an outcome is the food's preference, never its safety", E("lunch = state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch'); lunch.outcome") === "loved" && E("Object.values(state.foods).every(r => !r.preference || ['loved','some','nottoday'].includes(r.preference))"));
    $$(".outcome")[0].click(); await wait(30);
    ok("…tapping it again clears it (optional, equal)", !E("state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch').outcome"));
    ok("now lunch is offered, the headline moves on: 'Snack around 4:00.'", /^Snack around/.test($("#headline").textContent), $("#headline").textContent);
    $$(".mx-title").find(t => t.textContent === "Lunch") && $$("button.mx-title").find(t => t.textContent === "Lunch") && $$("button.mx-title").find(t => t.textContent === "Lunch").click(); await wait(40);
    ok("closing it, the default open meal is the next one (the snack)", $("#openMeal .mx-title") && $("#openMeal .mx-title").textContent === "Snack", $("#openMeal .mx-title") && $("#openMeal .mx-title").textContent);

    // the ring on a compact row
    const ring = $$("#earlierList .ring-btn")[0];
    ring.click(); await wait(30);
    ok("a row's ring offers that meal, with an Undo line", E("mealOffered(state.plan.days[planDayIndex(now())].meals[0])") && /Offered · Undo/.test($("#earlierList").textContent));

    // one open at a time, in place
    const rowBtn = $$("#earlierList .mrow-btn")[1];
    rowBtn.click(); await wait(60);
    ok("tapping a row opens it in place", !!$("#earlierList .mx") && $$(".mx").length === 1, $$(".mx").length);
    ok("…and the other one closes to a row", !!$("#openMeal .mrow") && !$("#openMeal .mx"));
    ok("…its title says it's expanded", $("#earlierList .mx-title").getAttribute("aria-expanded") === "true");
    $("#earlierList .mx-title").click(); await wait(60);
    ok("tapping its title closes it; the default comes back", !!$("#openMeal .mx") && $$(".mx").length === 1);
    $$("#earlierList .mrow-btn")[1].click(); await wait(60);
    E("setClock(new Date(2026, 9, 22, 16, 1)); tick();"); await wait(400);   // the headline crossfades (140 ms out, then in)
    ok("the choice stands until the next boundary, then the now meal opens again", $$(".mx").length === 1 && $("#openMeal .mx-title") && $("#openMeal .mx-title").textContent === "Snack", $("#openMeal .mx-title") && $("#openMeal .mx-title").textContent);
    ok("…'Snack time.'", $("#headline").textContent === "Snack time.");

    // a food row: tip, why, Change with undo
    const fr = $("#openMeal .fr");
    fr.click(); await wait(40);
    const frNow = $("#openMeal .fr");
    ok("a food row expands inline", frNow.getAttribute("aria-expanded") === "true" && !d.getElementById(frNow.getAttribute("aria-controls")).hidden);
    ok("…with its why", /^Why: /.test($("#openMeal .fr-why") ? $("#openMeal .fr-why").textContent : ""));
    const snack = () => E("state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'snack2')");
    const was = snack().items[0].name;
    [...d.querySelectorAll("#openMeal .fr-more .btn-text")].find(b => b.textContent === "Change").click(); await wait(20);
    const alts = $$("#openMeal .fr-alts .alt");
    ok("Change shows up to three safe alternatives", alts.length >= 1 && alts.length <= 3, alts.length);
    alts[0].click(); await wait(40);
    ok("…picking one replaces the food", snack().items[0].name !== was);
    const undo = [...d.querySelectorAll("#openMeal .undo-line .btn-text")].find(b => b.textContent === "Undo");
    ok("…with an Undo for 5 seconds", !!undo);
    undo.click(); await wait(40);
    ok("…Undo brings it back", snack().items[0].name === was);
    // add something else
    [...d.querySelectorAll("#openMeal .mx-links .btn-text")].find(b => b.textContent === "Add something else").click(); await wait(60);
    const add = $("#openMeal .mx-links input");
    ok("'Add something else' asks in a sentence: 'Also offered: ____'", !!add && /Also offered:/.test($("#openMeal .mx-links").textContent));
    add.value = "Mango"; add.dispatchEvent(new w.Event("input", {bubbles: true})); key(add, "Enter"); await wait(40);
    ok("…and adds it", snack().items.some(i => i.name === "Mango"));
    // keyboard: arrows move within the open meal
    const first = $("#openMeal .fr"); first.focus();
    key(first, "ArrowDown"); await wait(20);
    ok("↓ moves to the next control in the meal", d.activeElement !== first && $("#openMeal").contains(d.activeElement));

    // sheets: the one overlay
    const wd = $$(".wd")[3];
    wd.focus(); wd.click(); await wait(300);
    ok("a day opens a sheet with that day's meals", $("#sheet").open && $$("#sheetBody .s-meal").length >= 3 && /Friday/.test($("#sheetTitle").textContent), $("#sheetTitle").textContent);
    ok("…with 'Change' on a future day", $$("#sheetBody .btn-text").some(b => b.textContent === "Change"));
    ok("…and a visible ✕ of 44px", $("#sheetClose").getBoundingClientRect().width >= 44 && $("#sheetClose").getBoundingClientRect().height >= 44);
    $("#sheet").dispatchEvent(new w.Event("cancel", {cancelable: true})); await wait(300);
    ok("Esc closes it and gives focus back to the day", !$("#sheet").open && d.activeElement === $$(".wd")[3]);
    $("#shopLine").click(); await wait(300);
    const items = () => $$("#sheetBody .s-item").length;
    ok("the shop sheet lists what to pick up, each with a bought ring", $("#sheet").open && $("#sheetTitle").textContent === "Shop" && $$("#sheetBody .ring-btn").length >= 1);
    const firstName = $("#sheetBody .s-item-n").textContent;
    ok("…'runs out' or 'for' a weekday, in words (never red)", /^(runs out|for) ([A-Z][a-z]+day|today|tomorrow)$/.test($("#sheetBody .s-item-sub").textContent), $("#sheetBody .s-item-sub").textContent);
    $("#sheetBody .ring-btn").click(); await wait(60);
    ok("a ring = bought: it moves to In stock", [...d.querySelectorAll("#sheetBody .s-sec ~ .s-item .s-item-n")].some(n => n.textContent === firstName));
    ok("…with 'Send the list' at the foot", [...d.querySelectorAll("#sheetBody .btn-ink")].some(b => b.textContent === "Send the list"));
    const r = $("#sheet").getBoundingClientRect();
    $("#sheet").dispatchEvent(new w.MouseEvent("click", {bubbles: true, clientX: 5, clientY: 5}));
    await wait(300);
    ok("a tap outside closes it", !$("#sheet").open);
    $("#profileBtn").click(); await wait(300);
    ok("the profile sheet: the six entries", [...d.querySelectorAll("#sheetBody .s-row")].map(b => b.textContent).join("|") === "Birthday and profile|Off the plate|Priorities|Meal times|People|Replay welcome");
    $("#sheetClose").click(); await wait(300);
    $("#sendBtn").click(); await wait(300);
    ok("the send sheet: groceries, tomorrow, the link, copy, more — and what it does", /Groceries to myself/.test($("#sheetBody").textContent) && /This week, as a link/.test($("#sheetBody").textContent) && /Opens Messages with everything filled in\. You press send\./.test($("#sheetBody").textContent));
    $("#sheetClose").click(); await wait(300);

    // the voice, on the page itself
    ok("no banned word anywhere on the page", !/\b(eaten|cleared|missed|streak|score|behind|not logged)\b/i.test(d.body.innerText), (d.body.innerText.match(/\b(eaten|cleared|missed|streak|score|behind|not logged)\b/ig) || []));
    ok("no emoji on the page", !/\p{Extended_Pictographic}/u.test(d.body.innerText.replace(/[☐✕]/g, "")));
    ok("the favicon is drawn (or the static icon)", /^data:image\/png|icon-192\.png$/.test(d.getElementById("favicon").href));
    E("setClock(null)");
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · home";
};
</script>
</body></html>
