<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · home tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Home tests</h1>
<p>The home and its peeks, driven with a pointer and the keyboard against a set clock (Thursday 22 October 2026). Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T11:00";
f.style.cssText = "width:1200px;height:900px;border:1px solid #ccc";
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18)});
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id;
       state.exposures = {}; save(); closeOnboarding(); mealsSig = ""; renderHome();`);
    await wait(300);
    const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
    const peek = () => d.getElementById("peek");
    const open = () => peek() && !peek().hidden;
    const pe = (el, type) => el.dispatchEvent(new w.PointerEvent(type, {pointerType: "mouse", bubbles: type !== "pointerenter" && type !== "pointerleave"}));
    const key = (el, k, extra) => el.dispatchEvent(new w.KeyboardEvent("keydown", Object.assign({key: k, bubbles: true}, extra)));

    // the top of the page
    ok("greeting: 'Good morning, Lula · 18 months'", $("#greet").textContent === "Good morning, Lula · 18 months", $("#greet").textContent);
    ok("the clock line shows the full date and time", $("#clock").textContent === E("fmtDateTime(now())"));
    ok("the clock is not in a live region", !$("#clock").closest("[aria-live]") && !$("#headline").closest("[aria-live]"));
    ok("the headline is the next meal", $("#headline").textContent === E("homeMoment().headline"), $("#headline").textContent);
    ok("the tab says what's next", d.title === E("homeMoment().title") && d.title.startsWith("Chicho · "), d.title);

    // Today
    const meals = $$(".meal");
    ok("five meals at 18 months, in time order", meals.length === 5 && $$(".meal-name b").map(b => b.textContent).join() === "Breakfast,Snack,Lunch,Snack,Dinner");
    ok("each shows its time", $$(".meal-time")[2].textContent.includes(E("fmtTime(atTime(now(), '12:30'))")));
    ok("11:00: the morning snack is 'Now', lifted", meals[1].classList.contains("next") && meals[1].querySelector(".meal-tag span").textContent === "Now");
    ok("breakfast (past, unmarked) says 'Not logged', quietly", meals[0].querySelector(".meal-note").textContent === "Not logged");
    const before = $(".poster").getBoundingClientRect().toJSON();

    // the quick tick
    const q = meals[0].querySelector(".qtick");
    q.click(); await wait(50);
    ok("the quick tick marks the whole meal without opening anything", E("state.plan.days[planDayIndex(now())].meals[0].items.every(i => i.ate === 'all')") && !open());
    ok("…its drawing stays in full colour with the check", $$(".meal")[0].classList.contains("eaten") && getComputedStyle($$(".meal")[0].querySelector(".meal-art")).opacity === "1" && $$(".meal")[0].querySelector(".qtick").getAttribute("aria-pressed") === "true");
    ok("…'Not logged' goes", $$(".meal")[0].querySelector(".meal-note").textContent === "");
    await wait(60); ok("…the live region says so", /Breakfast: all eaten/.test(d.getElementById("liveStatus").textContent), d.getElementById("liveStatus").textContent);
    const ring = () => +getComputedStyle($$(".wd")[2].querySelector(".r-fg")).getPropertyValue("--p");
    ok("…and today's ring advances", ring() > 0, ring());
    ok("variety follows what was eaten", $$(".vdot").some(b => b.classList.contains("on")));
    $$(".meal")[0].querySelector(".qtick").click(); await wait(50);
    ok("tapping it again undoes it", E("state.plan.days[planDayIndex(now())].meals[0].items.every(i => !i.ate)") && ring() === 0);

    // hover intent
    const lunchBtn = $$(".meal-btn")[2];
    pe(lunchBtn, "pointerenter"); await wait(40);
    ok("hover: nothing before 90 ms", !open());
    await wait(120);
    ok("hover: the meal peek opens after 90 ms", open() && peek().querySelector("h2").textContent === "Lunch");
    ok("…the trigger says it's expanded and controls the peek", lunchBtn.getAttribute("aria-expanded") === "true" && lunchBtn.getAttribute("aria-controls") === "peek");
    ok("…the peek is a dialog labelled by its title", peek().getAttribute("role") === "dialog" && peek().getAttribute("aria-labelledby") === "peekTitle");
    ok("…and it overlays: nothing on the page moved", JSON.stringify($(".poster").getBoundingClientRect().toJSON()) === JSON.stringify(before));
    const pr = peek().getBoundingClientRect();
    ok("…on screen", pr.left >= 8 && pr.right <= w.innerWidth - 8 && pr.top >= 0 && pr.bottom <= w.innerHeight, pr.toJSON());
    pe(lunchBtn, "pointerleave"); pe(peek(), "pointerenter"); await wait(250);
    ok("moving into the peek keeps it open (hoverable)", open());
    pe(peek(), "pointerleave"); await wait(100);
    ok("…it stays a beat after leaving", open());
    await wait(150);
    ok("…and starts closing 160 ms after the pointer leaves both", $$(".meal-btn")[2].getAttribute("aria-expanded") === "false");
    await wait(200);
    ok("…gone once its 140 ms exit has played", !open());

    // click pins
    lunchBtn.click(); await wait(30);
    ok("click pins it open", open() && peek().classList.contains("pinned"));
    pe(lunchBtn, "pointerleave"); await wait(300);
    ok("a pinned peek ignores the pointer leaving", open());
    const lunch = () => E("state.plan.days[planDayIndex(now())].meals.find(m => m.slot === 'lunch')");
    peek().querySelector(".tick").click(); await wait(30);
    ok("tick a food in the peek: marked, the peek stays", lunch().items[0].ate === "all" && open());
    ok("…its tick reads pressed, and the row redraws in place", peek().querySelector(".tick").getAttribute("aria-pressed") === "true");
    peek().querySelector(".tick").click(); await wait(30);
    ok("…and again unmarks it (reversible)", !lunch().items[0].ate);
    // ate some / refused from the row menu
    peek().querySelector(".p-dots").click(); await wait(30);
    const some = [...peek().querySelectorAll(".p-more .p-alt")].find(b => b.textContent === "Ate some");
    some.click(); await wait(30);
    ok("the row menu: 'Ate some' is recorded", lunch().items[0].ate === "some");
    peek().querySelector(".p-dots").click(); await wait(30);
    [...peek().querySelectorAll(".p-more .p-alt")].find(b => b.textContent === "Refused").click(); await wait(30);
    ok("…and 'Refused' (it still counts as offered)", lunch().items[0].ate === "refused" && E("Object.keys(state.exposures).length") > 0);
    peek().querySelector(".p-dots").click(); await wait(30);
    [...peek().querySelectorAll(".p-more .p-alt")].find(b => b.textContent === "Refused").click(); await wait(30);
    ok("…pressing it again clears it", !lunch().items[0].ate);
    // All eaten: the meal completes, the headline follows
    peek().querySelector(".p-switch").click(); await wait(30);
    ok("'All eaten' marks every food", lunch().items.every(i => i.ate === "all") && peek().querySelector(".p-switch").getAttribute("aria-pressed") === "true");
    peek().querySelector(".p-switch").click(); await wait(30);
    // swap with undo
    const was = lunch().items[0].name;
    peek().querySelector(".p-act").click(); await wait(30);
    const alts = [...peek().querySelectorAll(".p-swap .p-alt")];
    ok("Swap opens three safe alternatives from the same group", alts.length === 3 && alts.every(b => E(`isAllowed(FOOD_POOL.find(f => f.name.startsWith(${JSON.stringify(b.textContent.trim())})), 18, state.profile)`)));
    alts[0].click(); await wait(30);
    ok("…picking one replaces the food", lunch().items[0].name !== was && !$("#toast").hidden && /Swapped in/.test($("#toast").textContent));
    $("#toast").querySelector("button").click(); await wait(30);
    ok("…and Undo puts it back", lunch().items[0].name === was);
    // skip with undo
    const n0 = lunch().items.length;
    [...peek().querySelectorAll(".p-act")].find(b => b.textContent === "Skip").click(); await wait(30);
    ok("Skip takes the food off this meal", lunch().items.length === n0 - 1);
    $("#toast").querySelector("button").click(); await wait(30);
    ok("…Undo brings it back, in place", lunch().items.length === n0 && lunch().items[0].name === was);
    // log something else
    peek().querySelector(".p-logbtn").click(); await wait(60);
    const log = peek().querySelector(".p-log input");
    log.value = "Mango"; log.dispatchEvent(new w.Event("input", {bubbles: true})); key(log, "Enter"); await wait(30);
    ok("'Log something else' adds an eaten food to the meal", lunch().items.some(i => i.name === "Mango" && i.ate === "all"));
    ok("…which counts towards variety (fruit)", E("triedFoods('fruit')").includes("Mango"));
    peek().querySelector(".p-logbtn").click(); await wait(60);
    const log2 = peek().querySelector(".p-log input");
    log2.value = "Honey"; log2.dispatchEvent(new w.Event("input", {bubbles: true})); key(log2, "Enter"); await wait(30);
    ok("…but a locked food is refused, with the reason", !lunch().items.some(i => /honey/i.test(i.name)) || E("ageNow()") >= 12, $("#toast").textContent);
    // change time, for today only
    [...peek().querySelectorAll(".p-sub button")][0].click(); await wait(60);
    const ti = peek().querySelector(".p-time input");
    ti.value = "13:15"; ti.dispatchEvent(new w.Event("change", {bubbles: true})); await wait(30);
    ok("'Change time' moves lunch for today only", E("mealTime('lunch', now())") === "13:15" && E("mealTime('lunch', new Date(2026, 9, 23))") === "12:30");
    ok("…and the row shows the new time", $$(".meal-time")[2].textContent.includes(E("fmtTime(atTime(now(), '13:15'))")));
    E("state.profile.timesToday = null; save(); mealsSig = ''; renderHome();");
    // Escape closes and returns focus
    key(d, "Escape"); await wait(250);
    ok("Esc closes it", !open() && $$(".meal-btn")[2].getAttribute("aria-expanded") === "false");

    // one peek at a time
    $$(".meal-btn")[1].click(); await wait(20); $$(".wd")[3].click(); await wait(20);
    ok("only one peek is open at a time", open() && peek().querySelector("h2").textContent.includes("October 23") && $$(".meal-btn")[1].getAttribute("aria-expanded") === "false");
    ok("the day peek lists the day's meals and 'Open day →'", peek().querySelectorAll(".p-row").length === 5 && /Open day/.test(peek().querySelector(".p-foot").textContent));
    d.body.dispatchEvent(new w.PointerEvent("pointerdown", {bubbles: true})); await wait(250);
    ok("an outside click closes a pinned peek", !open());

    // keyboard: focus opens, arrows move, Esc returns focus
    const kb = $$(".meal-btn")[3];
    key(d.body, "Tab"); kb.focus(); await wait(40);   // a keypress first, so the focus counts as keyboard focus
    const focusOpened = open();
    if (!focusOpened) E("Peek.open(document.querySelectorAll('.meal-btn')[3], false)");
    out.push((focusOpened ? "PASS" : "INFO") + " keyboard focus opens the peek" + (focusOpened ? "" : " (headless didn't treat programmatic focus as :focus-visible; opened directly)"));
    key(kb, "ArrowDown"); await wait(20);
    ok("↓ moves into its rows", peek().contains(d.activeElement));
    const first = d.activeElement; key(d.activeElement, "ArrowDown"); await wait(20);
    ok("↓ again moves to the next row", d.activeElement !== first && peek().contains(d.activeElement));
    key(d.activeElement, "Escape"); await wait(250);
    ok("Esc closes and gives focus back to the meal", !open() && d.activeElement === kb);

    // touch: a bottom sheet over a scrim
    E("Peek.open(document.querySelectorAll('.meal-btn')[3], true, true)"); await wait(50);
    ok("touch opens the same peek as a bottom sheet with a scrim", open() && peek().classList.contains("as-sheet") && !$(".scrim").hidden);
    $(".scrim").click(); await wait(300);
    ok("…a tap on the scrim closes it", !open() && $(".scrim").hidden);

    // shop: tick = bought, settles into In stock, the line updates
    const count0 = +$("#shopText").textContent.match(/\d+/)[0];
    $("#shopLine").click(); await wait(30);
    ok("the shop peek lists what to pick up, soonest first", open() && peek().querySelector("h2").textContent === "Shop" && peek().querySelectorAll(".p-row").length >= 1);
    const firstName = peek().querySelector(".p-row .p-name").firstChild.textContent;
    peek().querySelector(".p-row .tick").click(); await wait(320);
    ok("tick = bought: the line counts one fewer", +$("#shopText").textContent.match(/\d+/)[0] === count0 - 1, $("#shopText").textContent);
    ok("…and it settles under In stock", [...peek().querySelectorAll(".p-sec + .p-rows .p-name")].some(n => n.textContent === firstName));
    $("#toast").querySelector("button").click(); await wait(30);
    ok("…Undo puts it back on the list", +$("#shopText").textContent.match(/\d+/)[0] === count0);
    ok("the stack shows as many drawings as it can, never more than the line says", $$("#shopStack .st").length === Math.min(4, count0));
    key(d, "Escape"); await wait(250);

    // variety: try next drops into the next open meal, with undo
    const veg = $$(".vdot")[1];
    veg.click(); await wait(30);
    ok("the variety peek shows Tried this week and Try next", /Tried this week/.test(peek().textContent) && /Try next/.test(peek().textContent));
    const idea = peek().querySelector(".p-idea");
    const total = () => E("state.plan.days.reduce((n, d) => n + d.meals.reduce((k, m) => k + m.items.length, 0), 0)");
    const t0 = total();
    if (idea){
      idea.click(); await wait(30);
      ok("a suggestion is added to the next open meal", total() === t0 + 1 && /added to/.test($("#toast").textContent), $("#toast").textContent);
      $("#toast").querySelector("button").click(); await wait(30);
      ok("…and Undo takes it out again", total() === t0);
    } else ok("a suggestion is offered", false);
    ok("the legend shows once, on first reach", E("state.legendSeen") === true);
    key(d, "Escape"); await wait(250);

    // profile menu
    $("#profileBtn").click(); await wait(30);
    ok("the profile peek has the five entries", [...peek().querySelectorAll(".p-menu-row")].map(b => b.textContent).join("|") === "Profile and birthday|Allergens and priorities|Meal times|Set next week|Replay welcome");
    [...peek().querySelectorAll(".p-menu-row")][0].click(); await wait(400);
    ok("'Profile and birthday' opens the name step", !d.getElementById("onboarding").hidden && E("ONB_STEPS[onb.step]") === "name");
    E("closeOnboarding()"); await wait(50);

    // the clock moves on
    E("setClock(new Date(2026, 9, 22, 12, 31)); tick();"); await wait(500);
    ok("12:31: lunch is 'Now' and the headline follows", $("#headline").textContent === "Lunch time." && $$(".meal")[2].classList.contains("next"), $("#headline").textContent);
    ok("…the tab too", d.title === "Chicho · Lunch time");
    ok("…and the change is announced once, politely", d.getElementById("liveStatus").getAttribute("aria-live") === "polite");
    E("setClock(new Date(2026, 9, 23, 0, 5)); tick();"); await wait(500);
    ok("past midnight it's Friday: Friday's meals, all upcoming", $$(".meal").length === 5 && $$(".meal").every(m => !m.classList.contains("eaten")) && /Breakfast at/.test($("#headline").textContent), $("#headline").textContent);
    ok("…and the dot moved to Friday on the strip", $$(".wd")[3].classList.contains("today") && !$$(".wd")[2].classList.contains("today"));

    // prompts take the support line's place
    E("state.profile.lastStage = 'textures'; renderHome();");
    ok("a stage change is one line with Update and Later, not a modal", /Textures are changing\. Update the week\?/.test($("#support").textContent) && $$("#support button").map(b => b.textContent).join() === "Update,Later");
    $$("#support button")[1].click(); await wait(400);
    ok("Later puts it away", !/Textures/.test($("#support").textContent) && E("state.profile.lastStage") === E("stageNow().id"));
    E("setClock(new Date(2026, 9, 27, 9, 0)); tick();"); await wait(500);
    ok("a week later: 'Week done. Ready for the next?' with 'Set next week'", /Week done\. Ready for the next\?/.test($("#support").textContent) && $$("#support button")[0].textContent === "Set next week", $("#support").textContent);
    E("setClock(null)");
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · home";
};
</script>
</body></html>
