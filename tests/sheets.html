<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · sheet tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}iframe{border:1px solid #ccc;vertical-align:top}</style></head>
<body>
<h1>Sheet tests</h1>
<p>The one overlay, in a 390×844 phone: a bottom sheet with a scrim, a handle, medium and large detents, swipe down to dismiss, a 44px ✕, Esc, a focus trap, and a keyboard that never hides the field (a stand-in visualViewport). Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T12:10";
f.width = 390; f.height = 844;
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x), $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesConfirmed: true});
       ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok");
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id; save(); closeOnboarding();`);
    await wait(300);
    const sheet = $("#sheet"), R = el => el.getBoundingClientRect();
    const drag = async (el, dy) => {
      const r = R(el), x = r.left + 30, y = r.top + 8;
      el.dispatchEvent(new w.PointerEvent("pointerdown", {bubbles: true, clientX: x, clientY: y, pointerId: 1, isPrimary: true}));
      el.dispatchEvent(new w.PointerEvent("pointermove", {bubbles: true, clientX: x, clientY: y + dy, pointerId: 1, isPrimary: true}));
      el.dispatchEvent(new w.PointerEvent("pointerup", {bubbles: true, clientX: x, clientY: y + dy, pointerId: 1, isPrimary: true}));
      await wait(320);
    };
    // the shop sheet has the most content
    $("#shopLine").click(); await wait(320);
    ok("it is a <dialog> opened modally (focus is trapped by the browser too)", sheet.open && sheet.matches(":modal"));
    ok("a bottom sheet: anchored to the bottom edge, full width", Math.round(R(sheet).bottom) === 844 && Math.round(R(sheet).width) === 390, [R(sheet).bottom, R(sheet).width]);
    ok("…with a scrim", getComputedStyle(sheet, "::backdrop").backgroundColor !== "rgba(0, 0, 0, 0)", getComputedStyle(sheet, "::backdrop").backgroundColor);
    ok("…a drag handle", !!$("#sheetGrab i") && R($("#sheetGrab i")).width >= 32);
    ok("…and a visible ✕ of 44px", R($("#sheetClose")).width >= 44 && R($("#sheetClose")).height >= 44 && getComputedStyle($("#sheetClose")).visibility === "visible");
    ok("opens at the medium detent (62% of the screen)", sheet.dataset.detent === "medium" && Math.abs(R(sheet).height - Math.round(844 * .62)) <= 2, R(sheet).height);
    ok("its scroll area contains overscroll", getComputedStyle($("#sheetBody")).overscrollBehaviorY === "contain" && getComputedStyle($("#sheetBody")).overflowY === "auto");
    ok("the bottom padding includes the safe area", /env\(safe-area-inset-bottom\)/.test([...d.styleSheets[0].cssRules].map(r => r.cssText).find(t => t.startsWith(".sheet-body {")) || ""));
    await drag($("#sheetGrab"), -120);
    ok("dragging the handle up: the large detent", sheet.dataset.detent === "large" && R(sheet).height > 844 * .9, R(sheet).height);
    await drag($("#sheetGrab"), 140);
    ok("dragging down from large: back to medium", sheet.open && sheet.dataset.detent === "medium");
    await drag($("#sheetGrab"), 30);
    ok("a small drag springs back", sheet.open && !sheet.style.transform);
    // focus trap: Tab from the last control comes back to the first
    const focusables = () => [...sheet.querySelectorAll("button:not([disabled]):not([hidden]), input:not([disabled])")].filter(z => z.offsetParent);
    const last = focusables().at(-1); last.focus();
    last.dispatchEvent(new w.KeyboardEvent("keydown", {key: "Tab", bubbles: true, cancelable: true}));
    ok("Tab from the last control wraps to the first", d.activeElement === focusables()[0], d.activeElement && d.activeElement.className);
    focusables()[0].dispatchEvent(new w.KeyboardEvent("keydown", {key: "Tab", shiftKey: true, bubbles: true, cancelable: true}));
    ok("…and Shift+Tab from the first wraps to the last", d.activeElement === focusables().at(-1));
    // the keyboard: a shorter visual viewport
    const input = sheet.querySelector(".blank-input");
    input.focus();
    w.__vv = {height: 844 - 336, offsetTop: 0}; E("kbSync()"); await wait(200);
    ok("keyboard up: the sheet sits on top of it", Math.round(R(sheet).bottom) === 844 - 336, R(sheet).bottom);
    ok("…grows to the visible height", R(sheet).top >= 0 && R(sheet).height > (844 - 336) * .9, [R(sheet).top, R(sheet).height]);
    const ir = R(input);
    ok("…and the field is never hidden", ir.top >= R($("#sheetBody")).top - 1 && ir.bottom <= 844 - 336, [ir.top, ir.bottom]);
    w.__vv = null; E("kbSync()"); await wait(200);
    ok("keyboard down: back to the bottom edge", Math.round(R(sheet).bottom) === 844);
    // swipe down to dismiss
    await drag($("#sheetGrab"), 160);
    ok("swiping down from medium dismisses it", !sheet.open);
    // Esc
    $("#shopLine").click(); await wait(320);
    sheet.dispatchEvent(new w.Event("cancel", {cancelable: true})); await wait(300);
    ok("Esc closes it", !sheet.open);
    // one overlay type: no centred dialog, no popover anywhere
    ok("no centred-dialog variant is left in the stylesheet", ![...d.styleSheets[0].cssRules].some(r => r.media && /min-width/.test(r.media.mediaText) && /\.sheet/.test(r.cssText)));
    ok("no anchored popover (month peek) is left", !d.querySelector(".month-peek") && !E("typeof monthPicker === 'function'"));
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · sheets";
};
</script>
</body></html>
