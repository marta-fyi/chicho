<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · new week tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>New week tests</h1>
<p>The New week screen (Thursday 22 October 2026, 12:10; the running week started Tuesday 20th): the onboarding's sentences inside the pager, More, the seven-row preview, and a new plan that simply starts on its date. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
const wait = ms => new Promise(r => setTimeout(r, ms));
localStorage.clear(); sessionStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test&now=2026-10-22T12:10";
f.width = 390; f.height = 844;
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument, E = x => w.eval(x);
    const $ = s => d.querySelector("#scr-week " + s), $$ = s => [...d.querySelectorAll("#scr-week " + s)];
    const type = (el, v) => { el.value = v; el.dispatchEvent(new w.Event("input", {bubbles: true})); };
    E(`state.profile = Object.assign(freshProfile(), {name: "Lula", onboarded: true, birthDate: birthDateFromMonths(18), firstDay: "2026-10-01", mealTimesSource: "default"});
       ALLERGENS.forEach(a => state.profile.allergens[a.id] = "ok"); delete state.profile.allergens.shellfish;   // no food in the pool carries it, so it stays "still to come"
       state.plan = generateWeek(18, state.profile); state.weekStarted = "2026-10-20"; state.profile.lastStage = stageNow().id;
       state.offers = []; offersChanged(); [20, 21].forEach(n => mealsOn(new Date(2026, 9, n)).forEach(x => offerMeal(x.m, x.date, true)));
       save(); closeOnboarding(); go("week", {quiet: true});`);
    await wait(500);
    const offers0 = E("state.offers.length");
    ok("New week: its title under the header, no Home link, inside the pager (no modal)", !$(".home-link") && $("h1").getBoundingClientRect().top >= d.getElementById("chrome").getBoundingClientRect().bottom && $("h1").textContent === "New week" && !d.querySelector("dialog[open]") && d.getElementById("onboarding").hidden);
    const sents = $$(".sent").map(s => s.textContent.replace(/\s+/g, " ").trim());
    ok("four sentences: starts ____ · cook on ____ days · most into… · try ____ new foods", /^Next week starts/.test(sents[0]) && /^We'll cook on .* days\.$/.test(sents[1]) && sents[2] === "This week, we're most into…" && /^Try .* new foods\.$/.test(sents[3]), sents);
    ok("…the sentences are paragraphs: the screen's only h1 is its title", $$("h1").length === 1);
    const date = $('[data-f="nw:date"]');
    ok("'Next week starts' defaults to the day after this week ends (Tue 27 Oct), never before today", date.value === "2026-10-27" && date.min === "2026-10-22", [date.value, date.min]);
    ok("…its field is labelled by the sentence", !!$(`label[for="${date.id}"]`));

    // cook days: 1–7
    const cook = $('[data-f="nw:cook"]');
    ok("'We'll cook on 7 days' by default", cook.value === "7");
    type(cook, "9");
    ok("9: a hint, and nothing saved", /A number from 1 to 7\./.test(d.getElementById("scr-week").textContent) && E("state.profile.cookDays") === 7);
    type(cook, "3");
    ok("3: saved", E("state.profile.cookDays") === 3);

    // priorities, at most three
    const pills = () => $$(".pills .pill-o");
    for (const k of [0, 1, 2]) { pills()[k].click(); await wait(20); }
    ok("priorities: three on, the rest disabled", pills().filter(p => p.getAttribute("aria-pressed") === "true").length === 3 && pills().slice(3).every(p => p.disabled) && E("state.profile.priorities.length") === 3);
    pills()[0].click(); await wait(20);
    ok("…tap one off and the others are free again", E("state.profile.priorities.length") === 2 && !pills()[5].disabled);

    // new foods: 0–5, the stage's default, the allergen rule
    const nf = $('[data-f="nw:new"]');
    ok("'Try 2 new foods' at 18 months (the stage's default)", nf.value === "2" && E("state.profile.newFoods") === null);
    ok("…with the allergen rule while an allergen is still to come", /New allergens still come one at a time, 3 days apart\./.test(d.getElementById("scr-week").textContent));
    type(nf, "7");
    ok("7: 'A number from 0 to 5.', nothing saved", /A number from 0 to 5\./.test(d.getElementById("scr-week").textContent) && E("state.profile.newFoods") === null);
    type(nf, "0");
    ok("0: saved, and no allergen line (nothing new)", E("state.profile.newFoods") === 0 && !/New allergens still/.test(d.getElementById("scr-week").textContent));
    type(nf, "4");

    // More: read-only summaries, linking into Profile and the Kitchen
    const mb = $('[data-f="nw:more"]');
    ok("'More' is folded", mb.getAttribute("aria-expanded") === "false" && $("#nwMore").hidden);
    mb.click(); await wait(30);
    const more = $("#nwMore").textContent;
    ok("…open: what's off the plate, what's at home, what to offer again", /Off the plate|Nothing off the plate/.test(more) && /At home|Nothing marked at home/.test(more) && /offer again/.test(more), more);
    ok("…read-only, with links into Profile and the Kitchen", !$("#nwMore input") && !!$('[data-f="nw:offplate"]') && $('[data-f="nw:athome"]').textContent === "Kitchen" && $('[data-f="nw:again"]').textContent === "Profile");
    $('[data-f="nw:offplate"]').click(); await wait(450);
    ok("…'Profile' goes there, to Off the plate, opened", E("pg.cur") === "profile" && d.activeElement === d.querySelector('#scr-profile [data-sec="offplate"]') && d.querySelector('#scr-profile [data-f="fold:offplate"]').getAttribute("aria-expanded") === "true");
    E(`go("week", {quiet: true})`); await wait(450);

    // Set the table → the seven-row preview, Shuffle, Love it
    $(".scr-pin .btn-ink").click(); await wait(40);
    const rows = $$(".wk-rows .wk-row");
    ok("'Set the table': seven rows of text from the start date (Tue first)", rows.length === 7 && rows[0].querySelector(".wk-name").textContent === E("new Intl.DateTimeFormat(undefined, {weekday: 'short'}).format(new Date(2026, 9, 27))") && !$(".wk-rows img, .wk-rows .food-art"), rows.map(r => r.textContent).slice(0, 2));
    ok("…the pill says 'Love it', with 'Shuffle' beside the preview", $(".scr-pin .btn-ink").textContent === "Love it" && $('[data-f="nw:shuffle"]').textContent === "Shuffle");
    const draft1 = E("JSON.stringify(nwUI.draft.days.map(d => d.meals.map(m => m.items.map(i => i.name))))");
    $('[data-f="nw:shuffle"]').click(); await wait(30);
    ok("Shuffle: another week, still not applied", E("JSON.stringify(nwUI.draft.days.map(d => d.meals.map(m => m.items.map(i => i.name))))") !== draft1 && E("state.plans.length") === 1);
    const draft = E("JSON.stringify(nwUI.draft.days)");
    $(".scr-pin .btn-ink").click(); await wait(500);
    ok("Love it: the new plan starts on 27 Oct, the current week keeps running until then", E("state.plans.length") === 2 && E("state.plans[1].startsOn") === "2026-10-27" && JSON.stringify(E("state.plans[1].days")) === draft && E("state.weekStarted") === "2026-10-20");
    ok("…nothing deleted: every offer is still in the log", E("state.offers.length") === offers0);
    ok("…and it comes home, saying so", E("pg.cur") === "home" && d.getElementById("liveStatus").textContent === "New week set.");
    E("setClock(new Date(2026, 9, 27, 9, 0)); changed()");
    ok("on 27 Oct the new week is the running one", E("state.weekStarted") === "2026-10-27" && E("state.plan === state.plans[1]"));
    ok("…and last week's offers still read as last week", E("liveOffers().filter(e => e.date === '2026-10-21').length") > 0);
    E("setClock(new Date(2026, 9, 22, 12, 10)); changed()");

    // starting today replaces what's ahead, keeps the log
    E(`go("week", {quiet: true})`); await wait(450);
    const date2 = $('[data-f="nw:date"]');
    date2.value = "2026-10-20"; date2.dispatchEvent(new w.Event("change", {bubbles: true}));
    ok("a date before today isn't taken", E("nwUI.start") !== "2026-10-20" && date2.value !== "2026-10-20");
    date2.value = "2026-10-22"; date2.dispatchEvent(new w.Event("change", {bubbles: true}));
    $(".scr-pin .btn-ink").click(); await wait(30); $(".scr-pin .btn-ink").click(); await wait(500);
    ok("from today: it runs now, the week planned for the 27th gives way, the old week stays in the past", E("state.weekStarted") === "2026-10-22" && E("state.plans.map(p => p.startsOn).join()") === "2026-10-20,2026-10-22" && E("state.offers.length") === offers0);

    // the sentences shape the week
    const newCount = n => E(`(() => { state.profile.newFoods = ${n}; let t = 0; for (let k = 0; k < 30; k++) { const wk = generateWeek(18, state.profile), seen = new Set();
      wk.days.forEach(d => d.meals.forEach(m => m.items.forEach(i => { if (!knownFoods().has(foodIdOf(i))) seen.add(foodIdOf(i)); }))); t += seen.size; } return t / 30; })()`);
    const n0 = newCount(0), n5 = newCount(5);
    ok(`'Try n new foods' shapes the week (0 → ${n0.toFixed(1)} new a week, 5 → ${n5.toFixed(1)}; a slot with no known food still gets a new one)`, n0 < n5 - 1, [n0, n5]);
    const copies = E(`(() => { state.profile.cookDays = 3; const wk = generateWeek(18, state.profile, {start: new Date(2026, 9, 27)}); return wk.days.filter(d => d.meals.some(m => m.from)).length; })()`);
    ok("'We'll cook on 3 days': on the other four, lunch and dinner come round again", copies === 4, copies);
    E("state.profile.cookDays = 7; state.profile.newFoods = null");
  } catch (e) { out.push("FAIL threw " + e + "\n" + e.stack); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · newweek";
};
</script>
</body></html>
