<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Chicho · food art and copy tests</title>
<style>body{font:14px/1.5 -apple-system,system-ui,sans-serif;margin:24px}pre{white-space:pre-wrap}</style></head>
<body>
<h1>Food art and copy tests</h1>
<p>The manifest covers every food the generator can pick, every drawing it names exists, the fallback never shows a broken image, and the copy keeps to the voice rules. Every line should be PASS.</p>
<pre id="o">running…</pre>
<script>
const out = [], ok = (name, cond, got) => out.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  → got " + JSON.stringify(got)));
localStorage.clear();
const f = document.createElement("iframe");
f.src = "../index.html?test";
f.style.cssText = "width:390px;height:400px;border:1px solid #ccc";
document.body.append(f);
f.onload = async () => {
  try {
    const w = f.contentWindow, E = x => w.eval(x);

    // the manifest
    const unresolved = E("FOOD_POOL.filter(f => !foodOf(f.name)).map(f => f.name)");
    ok("every food in the generator's pool resolves to a manifest id", unresolved.length === 0, unresolved);
    ok("ids are unique", E("new Set(FOODS.map(f => f.id)).size === FOODS.length"));
    ok("every entry has a label, group, tint and emoji",
       E("FOODS.every(f => f.label && ['protein','veg','fruit','grains','fats','dairy','other'].includes(f.group) && /^#[0-9A-F]{6}$/i.test(f.tint) && f.emoji)"),
       E("FOODS.filter(f => !(f.label && f.tint && f.emoji)).map(f => f.id)"));
    ok("names resolve through aliases", E("foodOf('Carrots, soft-cooked').id === 'carrot' && foodOf('porridge').id === 'oatmeal' && foodOf('Egg, well cooked').id === 'egg'"));
    ok("an unknown name resolves to nothing", E("foodOf('Dragon fruit') === null"));

    // every file the manifest names is really there
    const files = E("FOODS.filter(f => f.files).flatMap(f => Object.values(f.files))");
    const missing = [];
    await Promise.all(files.map(p => fetch("../" + p, {method: "HEAD"}).then(r => { if (!r.ok) missing.push(p); }, () => missing.push(p))));
    ok(`all ${files.length} drawing files exist`, missing.length === 0, missing);

    // rendering: a picture with explicit size, or the emoji, never a broken image
    const html = E("foodArt('Banana', {size: 150, lazy: true})");
    ok("a drawn food renders <picture> with WebP and a PNG fallback", /<picture[^>]*>.*type="image\/webp".*banana-192\.webp 1x, img\/food\/banana-384\.webp 2x.*src="img\/food\/banana-384\.png"/.test(html), html);
    ok("…with explicit width/height, async decoding and lazy loading", /width="150" height="150"/.test(html) && /decoding="async"/.test(html) && /loading="lazy"/.test(html), html);
    ok("small sizes use the 64px file", /banana-64\.webp 1x/.test(E("foodArt('banana', {size: 28})")));
    ok("alt='' hides the art from screen readers", /aria-hidden="true"/.test(E("foodArt('banana', {alt: ''})")) && /alt=""/.test(E("foodArt('banana', {alt: ''})")));
    ok("a food with no drawing renders its emoji, labelled", /food-emoji[^>]*role="img" aria-label="Milk">🍼/.test(E("foodArt('milk')")), E("foodArt('milk')"));
    ok("a held drawing (raspberries) renders its emoji", /food-emoji/.test(E("foodArt('raspberries')")));
    ok("an unknown food renders a plate", /🍽️/.test(E("foodArt('Dragon fruit')")));
    ok("missing art is collected for the console warning", E("MISSING_ART.has('milk') && MISSING_ART.has('raspberries')"));
    const hero = E("HERO_FOODS.filter(id => hasArt(foodOf(id)))");
    ok("the whole welcome set is drawn (7 foods)", hero.length === 7, hero);
    // a broken drawing turns into its emoji
    const doc = w.document, box = doc.createElement("div");
    box.innerHTML = E("foodArt('banana', {size: 40})").replace(/banana-(64|192|384)\.(webp|png)/g, "nope.$2");
    doc.body.append(box);
    await new Promise(r => setTimeout(r, 400));
    ok("a drawing that fails to load becomes its emoji", !!box.querySelector(".food-emoji") && !box.querySelector("img"), box.innerHTML);
    box.remove();

    // copy: the voice rules
    const C = E("CONTENT");
    const words = s => s.replace(/\{[^}]+\}/g, "X").split(/\s+/).filter(w => /\w/.test(w)).length;
    const banned = /little one|lovely|gentle questions|get started|\bplan\b|\btrack|\bmanage|\boptimi[sz]e/i;
    const flat = o => typeof o === "string" ? [o] : Object.values(o).flatMap(flat);
    const onbHeads = [C.onb.welcome.title, C.onb.name.sentence, C.onb.birthday.sentence, C.onb.keepOut.title, C.onb.priorities.title,
      C.onb.atHome.title, C.onb.mealTimes.title, C.onb.reveal.title, C.onb.done.title, C.onb.restful.title];
    const headlines = [...flat(C.home.headline), ...onbHeads, C.home.weekDone];
    ok("headlines are at most 7 words", headlines.every(h => words(h) <= 7), headlines.filter(h => words(h) > 7));
    ok("headlines avoid the banned words", headlines.every(h => !banned.test(h)), headlines.filter(h => banned.test(h)));
    const support = [...C.home.support, C.onb.welcome.line, C.onb.birthday.line, C.onb.keepOut.line, C.onb.priorities.line, C.onb.atHome.line, C.onb.mealTimes.line, C.onb.done.line];
    ok("no onboarding headline is a question", onbHeads.every(h => !h.trim().endsWith("?")), onbHeads.filter(h => h.trim().endsWith("?")));
    ok("support lines are at most 12 words", support.every(s => words(s) <= 12), support.filter(s => words(s) > 12));
    const all = JSON.stringify(C);
    ok("no percentages anywhere in the copy", !/\d\s?%/.test(all));

    // say(): placeholders, plurals, daily variants
    ok("say() fills placeholders", E("say('home.headline.soon', {meal: 'Lunch', n: 25})") === "Lunch in 25 minutes." && E("say('home.headline.soon', {meal: 'Lunch', n: 1})") === "Lunch in 1 minute.");
    ok("say() reads months", E("say('home.stageChange', {name: 'Lula', months: 9})") === "Lula is 9 months. Textures are changing. Update the week?");
    ok("say() picks singular, plural and none", E("[say('home.shop', {n: 1}), say('home.shop', {n: 4}), say('home.shop', {n: 0})].join('|')") === "1 thing to pick up|4 things to pick up|All stocked up.");
    ok("say() picks the same support line all day", E("say('home.support') === say('home.support') && CONTENT.home.support.includes(say('home.support'))"));
    ok("say() on a missing key returns an empty string", E("say('home.nope')") === "");
  } catch (e) { out.push("FAIL threw: " + e.message); }
  const fails = out.filter(l => l.startsWith("FAIL")).length;
  document.getElementById("o").textContent = out.join("\n");
  document.title = (fails ? fails + " FAILED" : "ALL PASS") + " · foods";
};
</script>
</body></html>
