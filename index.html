  :root{
    /* the background: Marta's gradient image (bg.jpg) */
    --cream:#DBD3C6;   /* the image's top edge, shown until bg.jpg arrives */

    /* time of day: tints laid over the gradient (see .tod below) */
    --tod-dawn:rgba(255,196,164,.55);     /* soft peach */
    --tod-golden:rgba(255,176,72,.42);    /* late-afternoon amber */
    --tod-evening:rgba(16,30,70,.78);     /* deep, calm blue */

    /* brand: olive, warm ink, white cards */
    --olive-900:#3E4621;
    --olive-700:#5F6B33;   /* headlines and the tint: 5.8:1 on white */
    --olive-500:#7E8B47;
    --olive-200:#DCE2C6;
    --olive-100:#EEF1E4;
    --olive-50:#F6F8F0;
    --ink:#0A0A0A;         /* all text is black */
    --ink-70:rgba(10,10,10,.7);   /* secondary text: never lighter */
    --ink-25:rgba(10,10,10,.25);  /* inactive dots, hairlines; never text */
    --muted:var(--ink-70);
    --faint:#8A919C;       /* decoration only, never text */
    --card:#FFFFFF;
    --hairline:rgba(31,35,40,.10);

    /* food categories: soft pastels for tiles, deeper dots */
    --protein:#E59A6B; --vegetable:#7DB46C; --fruit:#E58FA6; --grain:#E3B64F; --fat:#9B8FD6;
    --protein-soft:#FBE3D3; --vegetable-soft:#E1F0DA; --fruit-soft:#FBE0E7; --grain-soft:#F8EBC9; --fat-soft:#E7E3F7;

    /* shape and depth */
    --r-card:28px; --r-tile:22px; --r-group:18px; --r-field:14px; --r-pill:999px;
    --shadow-card:0 24px 60px -24px rgba(40,46,30,.28), 0 2px 8px rgba(40,46,30,.06);
    --shadow-lift:0 30px 60px -20px rgba(40,46,30,.34), 0 4px 12px rgba(40,46,30,.10);
    --shadow-tile:0 14px 30px -12px rgba(40,46,30,.30), 0 2px 6px rgba(40,46,30,.08);

    /* spacing */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;

    /* type: the system stack (SF Pro on Apple devices) */
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --fs-display:36px; --fs-title:22px; --fs-body:16px; --fs-caption:13px;
    --fs-hero:44px; --track-hero:-.03em;   /* the one big headline per screen */
    --art-shadow:drop-shadow(0 12px 18px rgba(0,0,0,.18));   /* follows the drawing, never a tile */
    --on-ink:#FFFFFF;      /* text on an ink-filled button */
    --art-ink:none;        /* the drawings are black ink; at night they invert to white */
    --track-display:-.035em; --track-title:-.02em;

    /* motion */
    --spring:cubic-bezier(.32,1.25,.5,1);
    --spring-soft:cubic-bezier(.25,1.1,.4,1);
    --ease-out:cubic-bezier(.22,.61,.36,1);
    --dur-1:120ms; --dur-2:250ms; --dur-3:380ms;

    /* the component layer still reads these older names until the card
       system replaces it (commit 2) and the home screen (commit 5) */
    --tint:var(--olive-700); --tint-soft:var(--olive-100);
    --label:var(--ink); --label-2:var(--muted); --label-3:var(--faint);
    --separator:var(--hairline); --grouped:var(--olive-50); --cell:var(--card);
    --fill:rgba(95,107,51,.12); --fill-3:rgba(95,107,51,.08); --gray3:#C9CDBE;
    --green:#5E8C3A; --green-soft:var(--olive-100); --orange:#B5641F; --red:#B33A2E;
    --r-sheet:var(--r-card);
    --fs-large:var(--fs-display); --fs-title2:var(--fs-title); --fs-title3:20px; --fs-headline:17px;
    --fs-callout:16px; --fs-sub:15px; --fs-foot:var(--fs-caption); --fs-cap:12px;
  }
  @media (prefers-contrast: more){
    :root{--muted:#41464F;--hairline:rgba(31,35,40,.22);--olive-700:#4C5628;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--cream);}
  body{
    background:transparent;color:var(--label);font-family:var(--font);font-size:var(--fs-body);
    letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  b,strong{font-weight:600;}
  button,input,select,textarea{font-family:inherit;color:inherit;letter-spacing:inherit;}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .container{max-width:640px;margin:0 auto;padding:0 16px;}
  :focus{outline:none;}
  :focus-visible{outline:3px solid var(--tint);outline-offset:2px;}

  /* ---------- background: Marta's gradient image ----------
     The image itself (bg.jpg, her file untouched, grain and all), covering
     the screen, drifting very slowly: a 3-4 minute push-and-settle on
     transform only, paused when the tab is hidden, still under reduced
     motion. Until it arrives the page is the image's own top colour. */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--cream);}
  .bg-img{
    position:absolute;inset:-6%;background:url("bg.jpg") center / cover no-repeat;
    animation:drift 220s ease-in-out infinite alternate;will-change:transform;
  }
  @keyframes drift{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(-2.5%,1.5%) scale(1.06);}
  }
  .tab-hidden .bg-img{animation-play-state:paused;}
  /* Time of day: one tint per moment over the image, crossfading slowly
     (60 s) when the hour turns. Midday is the image as it is; evening is a
     deep calm blue that lets the colour glow through, dimmed. */
  .tod{position:absolute;inset:0;opacity:0;transition:opacity 60s linear;}
  .tod-dawn{background:linear-gradient(180deg, var(--tod-dawn), rgba(255,214,190,.25) 60%, rgba(255,230,210,.1));mix-blend-mode:soft-light;}
  .tod-dawn-wash{background:linear-gradient(180deg, rgba(255,205,180,.38), rgba(255,225,205,.12) 70%);}
  .tod-golden{background:linear-gradient(180deg, rgba(255,214,140,.22), var(--tod-golden) 70%, rgba(240,140,60,.35));mix-blend-mode:soft-light;}
  .tod-golden-wash{background:linear-gradient(180deg, rgba(255,196,110,.24), rgba(255,160,70,.38));}
  .tod-evening{background:linear-gradient(180deg, var(--tod-evening), rgba(24,40,92,.72) 60%, rgba(40,52,110,.66));}
  [data-tod="dawn"] .tod-dawn, [data-tod="dawn"] .tod-dawn-wash,
  [data-tod="golden"] .tod-golden, [data-tod="golden"] .tod-golden-wash,
  [data-tod="evening"] .tod-evening{opacity:1;}
  .tod-instant .tod{transition:none;}
  /* At night (the navy evening tint) anything sitting straight on the sky turns
     white: text, dots, drawings, and the pill flips to white with black text.
     Black on the navy measures 2:1; white passes. Surfaces (white cards, peeks)
     keep black ink. Add each frameless screen to this list as it lands. */
  [data-tod="evening"] :is(.onb){
    --ink:#FFFFFF; --ink-70:rgba(255,255,255,.78); --ink-25:rgba(255,255,255,.32);
    --on-ink:#0A0A0A; --art-ink:invert(1);
  }
  [data-tod="evening"] .onb-card:not(.bare){
    --ink:#0A0A0A; --ink-70:rgba(10,10,10,.7); --ink-25:rgba(10,10,10,.25); --on-ink:#FFFFFF; --art-ink:none;
  }

  /* ---------- navigation: large title + the iOS 26 scroll edge ----------
     Content scrolling under the status bar softens into a glass edge
     instead of cutting off hard. */
  .scroll-edge{
    position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 28px);z-index:40;pointer-events:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    -webkit-mask-image:linear-gradient(#000 40%, transparent);mask-image:linear-gradient(#000 40%, transparent);
  }

  /* ---------- buttons (iOS 26: capsules) ---------- */
  .btn{
    border:none;border-radius:999px;min-height:44px;padding:11px 20px;font-size:var(--fs-callout);font-weight:600;
    background:var(--fill-3);color:var(--tint);cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), opacity var(--dur-1);
  }
  .btn.primary{background:var(--tint);color:#fff;}
  .btn.danger{background:var(--fill-3);color:var(--red);}
  .btn:active{transform:scale(.96);opacity:.85;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn:disabled:active{transform:none;}
  .btnrow{display:flex;gap:10px;margin:6px 0 16px;flex-wrap:wrap;}
  .btnrow .btn.primary{flex:1;}

  /* segmented control: a capsule track, the selected segment a raised glass
     capsule that springs across */
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill-3);border-radius:999px;padding:3px;margin:0 0 18px;}
  .seg::before{
    content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:999px;
    background:rgba(255,255,255,.92);
    box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04), inset 0 0 0 .5px rgba(0,0,0,.04);
    transform:translateX(calc(var(--i, 0) * 100%));transition:transform var(--dur-3) var(--spring);
  }
  .seg button{position:relative;border:none;background:none;min-height:36px;padding:0 4px;font-size:var(--fs-sub);font-weight:500;white-space:nowrap;cursor:pointer;}
  .seg button[aria-pressed="true"]{font-weight:600;}

  /* an inset-grouped list */
  .card, .meal-block{background:var(--cell);border-radius:var(--r-group);padding:4px 0 4px 16px;margin-bottom:18px;overflow:hidden;}
  .section-title{font-size:var(--fs-headline);font-weight:600;margin:12px 16px 4px 0;}
  .section-title.small{font-size:var(--fs-foot);font-weight:400;color:var(--label-2);margin:12px 0 6px;}
  .subtle{font-size:var(--fs-foot);color:var(--label-2);margin:0 4px 12px;line-height:1.4;}
  .subtle.center{text-align:center;}
  .empty{font-size:var(--fs-sub);color:var(--label-2);text-align:center;padding:16px 16px 16px 0;margin:0;}
  /* rows: 44pt minimum, hairline separators inset to the text */
  .item-row + .item-row > .row-fg::before, .k-row + .k-row > .row-fg::before,
  .history-row + .history-row::before, .preview-line + .preview-line::before{
    content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--separator);
  }

  /* ---------- meals ---------- */
  .meal-head{display:flex;align-items:baseline;justify-content:space-between;padding:10px 16px 6px 0;}
  .meal-head .label{font-size:var(--fs-headline);font-weight:600;}
  .meal-head .count{font-size:var(--fs-sub);color:var(--label-2);}
  .item-row{position:relative;}
  .row-fg{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px 6px 0;background:var(--cell);touch-action:pan-y;}
  .item-row label{flex:1;min-width:0;font-size:var(--fs-body);display:flex;align-items:center;gap:8px;}
  .item-row.checked .nm{color:var(--label-2);}
  .nmw{min-width:0;display:flex;flex-direction:column;gap:1px;}
  .nmw > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nmw .qty{display:block;}
  .tag-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .tex, .qty{font-size:var(--fs-foot);color:var(--label-2);}
  .have-chip{flex:0 0 auto;font-size:var(--fs-foot);font-weight:600;color:var(--green);white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .have-chip::before{content:"";width:6px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px;}
  .buy-chip{
    flex:0 0 auto;border:none;border-radius:999px;background:var(--tint-soft);color:var(--tint);
    font-size:var(--fs-foot);font-weight:600;white-space:nowrap;min-height:30px;padding:5px 12px;cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out);
  }
  .buy-chip:active{transform:scale(.94);}
  .item-row.just .have-chip{animation:pop var(--dur-3) var(--spring);}

  /* swipe to delete: the row slides, a red Delete waits underneath; swipe
     all the way and it goes */
  .swipe-del{
    position:absolute;right:0;top:0;bottom:0;width:88px;border:none;background:var(--red);color:#fff;
    font-size:var(--fs-sub);font-weight:600;cursor:pointer;
  }
  .row-fg{position:relative;z-index:1;transition:transform var(--dur-3) var(--spring);}
  .dragging .row-fg{transition:none;}
  .item-row:focus-within .row-fg:has(+ .swipe-del:focus-visible), .k-row:focus-within .row-fg:has(+ .swipe-del:focus-visible){transform:translateX(-88px);}

  /* the tick: Reminders' circle that fills */
  input[type=checkbox]:not([role=switch]){
    -webkit-appearance:none;appearance:none;margin:0;flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--gray3);background:none;display:grid;place-items:center;cursor:pointer;
    transition:background-color var(--dur-2) var(--ease-out), border-color var(--dur-2);
  }
  input[type=checkbox]:not([role=switch])::before{
    content:"";width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:translateY(-1px) rotate(-45deg) scale(0);
  }
  input[type=checkbox]:not([role=switch]):checked{background:var(--tint);border-color:var(--tint);}
  input[type=checkbox]:not([role=switch]):checked::before{transform:translateY(-1px) rotate(-45deg) scale(1);}
  .just input[type=checkbox]:checked::before{animation:tick-pop var(--dur-3) var(--spring);}
  .leaving-r{animation:out-right var(--dur-2) var(--ease-out) forwards;}
  .leaving-l{animation:out-left var(--dur-2) var(--ease-out) forwards;}

  /* the switch */
  .switch{display:flex;align-items:center;gap:10px;font-size:var(--fs-body);cursor:pointer;}
  .switch input{
    -webkit-appearance:none;appearance:none;margin:0;position:relative;width:51px;height:31px;border-radius:999px;
    background:var(--fill);cursor:pointer;transition:background-color var(--dur-2) var(--ease-out);
  }
  .switch input::before{
    content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06);transition:transform var(--dur-3) var(--spring);
  }
  .switch input:checked{background:var(--green);}
  .switch input:checked::before{transform:translateX(20px);}

  /* ---------- forms ---------- */
  input[type=text], select{
    border:none;border-radius:var(--r-field);background:var(--fill-3);padding:11px 12px;font-size:var(--fs-body);min-height:44px;
  }
  input[type=text]::placeholder{color:var(--muted);}
  input[type=text]:focus, select:focus{outline:none;box-shadow:0 0 0 2px var(--tint);}
  .add-item-row{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap;}
  .add-item-row input.name{flex:1 1 120px;min-width:90px;}
  .add-item-row button{border:none;border-radius:999px;background:var(--tint);color:#fff;padding:0 18px;min-height:44px;font-size:var(--fs-callout);font-weight:600;cursor:pointer;}
  .addform{position:relative;}
  .addform::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--separator);}
  /* "Add" rows, iOS-style: the tint, a filled plus circle */
  .add-toggle{
    width:100%;background:none;border:none;padding:13px 16px 13px 0;font-size:var(--fs-body);color:var(--tint);
    display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;
  }
  .add-toggle::before{content:"+";flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:20px;line-height:23px;text-align:center;font-weight:500;}
  .add-toggle:active{background:var(--fill-3);}
  .addform-open{padding:10px 16px 12px 0;animation:rise var(--dur-2) var(--spring);}
  .addform-open input.full{width:100%;}
  .addform-row{display:flex;gap:8px;margin-top:8px;}
  .addform-row input, .addform-row select{flex:1 1 0;min-width:0;}
  .addform-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .addform-actions .btn:not(.primary){background:none;}
  .banner{font-size:var(--fs-foot);color:var(--label-2);line-height:1.45;margin:8px 4px 16px;}

  /* ---------- chips (capsule buttons) ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips.spaced{margin:4px 16px 12px 0;}
  .chips.below{margin-bottom:8px;}
  .chip{
    border:none;border-radius:999px;padding:7px 13px;font-size:var(--fs-sub);
    background:var(--fill-3);color:var(--label);display:flex;align-items:center;gap:6px;cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2);
  }
  .chip.tap:active{transform:scale(.94);}
  .chip.covered{background:var(--olive-100);color:var(--olive-900);}   /* tasted: 9.4:1 */
  .chip.selected{background:var(--tint);color:#fff;}
  .chip .x{color:var(--muted);font-size:var(--fs-foot);}
  .suggest{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px;font-size:var(--fs-foot);color:var(--label-2);}
  .suggest button{border:none;background:var(--tint-soft);border-radius:999px;padding:6px 12px;font-size:var(--fs-foot);font-weight:600;color:var(--tint);min-height:32px;cursor:pointer;}
  .suggest button:active{transform:scale(.94);}
  .filter-note{font-size:var(--fs-foot);color:var(--label-2);margin:6px 16px 10px 0;}

  /* ---------- variety ---------- */
  .cat-block{padding:4px 0 0;}
  .cat-block + .cat-block{border-top:.5px solid var(--separator);}
  .cat-block h3{font-size:var(--fs-headline);font-weight:600;display:flex;align-items:center;gap:8px;margin:10px 16px 8px 0;}
  .history-row{position:relative;display:flex;justify-content:space-between;font-size:var(--fs-body);padding:13px 16px 13px 0;}
  .history-row span:last-child{color:var(--label-2);}

  /* ---------- food ---------- */
  .k-row{position:relative;}
  .k-row > .row-fg > label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .k-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .k-name{font-size:var(--fs-body);}
  .k-sub{font-size:var(--fs-sub);color:var(--label-2);white-space:nowrap;}
  .k-sub.low{color:var(--orange);font-weight:600;}
  .k-row.done .k-name{color:var(--label-2);}
  .k-row.just{animation:from-left var(--dur-3) var(--spring);}
  .k-group{font-size:var(--fs-foot);color:var(--label-2);padding:14px 16px 4px 0;}
  .k-stock{
    flex:1;min-width:0;border:none;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .k-stock::after{content:"";flex:0 0 auto;width:7px;height:7px;border-right:2px solid var(--gray3);border-top:2px solid var(--gray3);rotate:45deg;margin-left:2px;}
  .k-stock .k-name{flex:1;min-width:0;}
  .k-edit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;padding:10px 0;}
  .k-edit .k-name{flex:1 0 100%;font-weight:600;}
  .k-edit input[type=text]{width:96px;}
  .k-edit .k-unit{font-size:var(--fs-body);color:var(--label-2);}
  .k-edit button{border:none;border-radius:999px;background:var(--fill-3);color:var(--tint);padding:0 16px;min-height:38px;font-size:var(--fs-sub);font-weight:600;cursor:pointer;}
  .k-edit button.save{background:var(--tint);color:#fff;}
  .k-edit button.rm{color:var(--red);margin-left:auto;}

  /* ---------- plan ---------- */
  .age-ctl{display:flex;align-items:center;gap:12px;padding:10px 16px 6px 0;}
  .age-read{flex:1;text-align:left;font-size:var(--fs-sub);color:var(--label-2);line-height:1.3;order:-1;}
  .age-read b{display:block;font-size:var(--fs-title2);font-weight:700;color:var(--label);white-space:nowrap;}
  /* the stepper: one capsule, two halves */
  .stepper{display:flex;background:var(--fill-3);border-radius:999px;overflow:hidden;}
  .age-step{
    width:48px;height:34px;border:none;background:none;color:var(--label);font-size:22px;line-height:1;cursor:pointer;
    display:grid;place-items:center;transition:background-color var(--dur-1);
  }
  .age-step + .age-step{border-left:.5px solid var(--separator);}
  .age-step:active{background:var(--fill);}
  .age-step:disabled{color:var(--label-3);}
  /* the slider: tint fills the track up to the thumb */
  .age-range{-webkit-appearance:none;appearance:none;width:calc(100% - 16px);height:36px;margin:0 0 6px;background:none;--fillpct:50%;}
  .age-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(var(--tint),var(--tint)) 0 / var(--fillpct) 100% no-repeat, var(--fill);}
  .age-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06), 0 0 0 .5px rgba(0,0,0,.04);}
  .age-range::-moz-range-track{height:6px;border-radius:999px;background:var(--fill);}
  .age-range::-moz-range-progress{height:6px;border-radius:999px;background:var(--tint);}
  .age-range::-moz-range-thumb{width:28px;height:28px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .stage-sum{font-size:var(--fs-foot);color:var(--label-2);padding:0 16px 12px 0;margin:0;}
  .milk-state{text-align:center;padding:18px 16px 12px 0;}
  .milk-state .big{font-size:var(--fs-headline);font-weight:600;margin:0 0 6px;}
  .milk-state p{font-size:var(--fs-sub);color:var(--label-2);margin:0;}
  .preview-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--fs-foot);color:var(--label-2);padding:0 16px 12px 0;}
  .preview-stats strong{color:var(--label);font-size:var(--fs-title3);}
  .preview-line{position:relative;display:flex;gap:8px;padding:11px 16px 11px 0;font-size:var(--fs-sub);}
  .preview-line .lbl{flex:0 0 92px;color:var(--label-2);}
  .preview-line .foods{flex:1;}

  /* ---------- card system ----------
     White cards (.hcard on the home, the sheet itself), 28px corners, soft
     diffuse shadows; headlines big, bold, olive, tightly tracked, ending in
     an arrow. Inside, groups are a whisper of olive rather than more white. */
  .card, .meal-block{background:var(--olive-50);}
  .row-fg{background:var(--olive-50);}

  /* ---------- onboarding ----------
     Full screen over the gradient, one question per screen on one big white
     card (so no text ever sits on the colour). Back and the progress dots
     float above the card; the step slides and fades as you move, and the
     background image drifts faster for a moment, like moving through the sky. */
  .onb-open{overflow:hidden;}
  .onb-open .container, .onb-open .scroll-edge{visibility:hidden;}
  .onb{position:fixed;inset:0;z-index:100;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;
       padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);}
  .onb[hidden]{display:none;}
  .onb-top{width:min(460px,100%);display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:12px;}
  .onb-back, .onb-close{
    width:44px;height:44px;border:none;border-radius:50%;background:none;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:0;line-height:1;position:relative;
    transition:transform var(--dur-1) var(--ease-out);
  }
  .onb-close::before, .onb-close::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:2px;border-radius:2px;background:currentColor;rotate:45deg;}
  .onb-close::after{rotate:-45deg;}
  .onb-back:focus-visible, .onb-close:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .onb-back:active, .onb-close:active{transform:scale(.92);}
  .onb-back[hidden], .onb-close[hidden]{display:none;}
  .onb-back::before{content:"";width:10px;height:10px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;rotate:45deg;translate:2px 0;}
  .onb-dots{flex:1;display:flex;justify-content:center;gap:8px;}
  .onb-dots i{width:8px;height:8px;border-radius:50%;background:var(--ink-25);transition:background-color var(--dur-2);}
  .onb-dots i.on{background:var(--ink);}
  .is-welcome .onb-dots{visibility:hidden;}
  .is-welcome .onb-top{width:min(420px,100%);}
  .onb-spacer{width:44px;flex:0 0 auto;}
  .onb-close:not([hidden]) + .onb-spacer{display:none;}   /* the X sits at the column's right edge */
  .onb-card{
    width:min(460px,100%);background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);
    padding:32px 24px 24px;display:flex;flex-direction:column;gap:18px;margin:auto 0;
  }
  .onb-h:focus{outline:none;}
  .onb-h{margin:0;font-size:var(--fs-display);font-weight:800;letter-spacing:var(--track-display);line-height:1.08;color:var(--olive-700);}
  .onb-p{margin:-6px 0 0;font-size:var(--fs-body);color:var(--muted);line-height:1.45;}
  .onb-cta{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .pill{
    border:none;border-radius:var(--r-pill);min-height:54px;padding:14px 24px;font:inherit;font-size:17px;font-weight:700;
    background:var(--olive-700);color:#fff;cursor:pointer;box-shadow:0 10px 24px -12px rgba(62,70,33,.6);
    transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2), opacity var(--dur-2);
  }
  .pill:active{transform:scale(.97);box-shadow:0 4px 10px -6px rgba(62,70,33,.6);}
  .pill:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .pill:disabled:active{transform:none;}
  .pill.quiet{background:var(--olive-100);color:var(--olive-900);box-shadow:none;}
  .link-btn{border:none;background:none;font:inherit;font-size:15px;color:var(--olive-700);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;align-self:center;}
  .onb-input{
    width:100%;border:none;border-radius:var(--r-field);background:var(--olive-50);box-shadow:inset 0 0 0 1.5px var(--olive-200);
    font:inherit;font-size:28px;font-weight:700;letter-spacing:var(--track-title);text-align:center;padding:16px;color:var(--ink);
  }
  .onb-input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--olive-700);}
  .onb-input::placeholder{color:var(--faint);font-weight:500;}
  /* ---------- welcome: no card. One drawing, one line, one button, straight on the background ---------- */
  .onb-card.bare{background:none;box-shadow:none;border-radius:0;width:min(420px,100%);padding:0 8px 7vh;gap:0;align-items:center;text-align:center;}
  .wel-art{width:140px;height:140px;margin:0 0 32px;}
  .wel-bob{position:relative;width:100%;height:100%;animation:wel-bob 2s ease-in-out infinite alternate;}
  @keyframes wel-bob{from{transform:translateY(-4px);}to{transform:translateY(4px);}}
  .wel-layer{position:absolute;inset:0;rotate:-6deg;opacity:0;filter:var(--art-shadow);}
  .wel-layer.is-on{opacity:1;}
  .wel-layer .food-art{width:100%;height:100%;}
  .wel-h{margin:0 0 14px;font-size:var(--fs-hero);font-weight:700;letter-spacing:var(--track-hero);line-height:1.04;color:var(--ink);text-wrap:balance;}
  .wel-p{margin:0 0 32px;max-width:340px;font-size:17px;line-height:1.4;color:var(--ink-70);text-wrap:balance;}
  .keep{display:inline-block;}
  .wel-in > *{animation:wel-rise 400ms var(--ease-out) both;animation-delay:var(--d, 0ms);}
  @keyframes wel-rise{from{opacity:0;transform:translateY(12px);}}
  /* the black pill: every primary action in the new system */
  .btn-ink{
    min-height:48px;min-width:160px;padding:0 28px;border:none;border-radius:var(--r-pill);
    background:var(--ink);color:var(--on-ink);font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.5);
    transition:transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
  }
  .btn-ink:hover{box-shadow:0 14px 28px -12px rgba(0,0,0,.55);}
  .btn-ink:active{transform:scale(.97);box-shadow:0 4px 10px -6px rgba(0,0,0,.5);transition-duration:60ms;}
  .btn-ink:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    .wel-bob{animation:none;}
    .wel-in > *{animation-name:wel-fade;}
    @keyframes wel-fade{from{opacity:0;}}
  }
  /* welcome: the tiles float, gently, each on its own beat */
  .onb .fan{margin:0;min-height:0;padding:12px 0 4px;}
  .onb .tile{cursor:default;}
  .float .tile-art{animation:bob 4.2s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -1.1s);}
  @keyframes bob{from{transform:translateY(-4px);}to{transform:translateY(5px);}}
  /* birthday: three wheels, the middle row is the choice */
  .wheels{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:8px;position:relative;}
  .wheels::before{content:"";position:absolute;left:0;right:0;top:50%;height:48px;translate:0 -50%;border-radius:14px;background:var(--olive-100);pointer-events:none;}
  .wheel-list{
    position:relative;height:192px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:72px 0;
    -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);
    border-radius:14px;
  }
  .wheel-list::-webkit-scrollbar{display:none;}
  .wheel-list:focus-visible{outline:2px solid var(--olive-700);outline-offset:2px;}
  .wheel-opt{height:48px;display:grid;place-items:center;scroll-snap-align:center;font-size:20px;color:var(--muted);cursor:pointer;user-select:none;}
  .wheel-opt[aria-selected="true"]{color:var(--ink);font-weight:700;font-size:22px;}
  .stage-badge{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-pill);background:var(--olive-100);color:var(--olive-900);font-weight:700;font-size:15px;}
  .stage-preview{margin:-8px 0 0;text-align:center;font-size:15px;color:var(--muted);}
  .calm-emoji{font-size:56px;text-align:center;line-height:1;}
  /* keep out: nine big tiles that cycle neutral → avoid → tried */
  .al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .al-tile{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px 10px;min-height:96px;
    border:none;border-radius:18px;background:var(--olive-50);box-shadow:inset 0 0 0 1.5px var(--olive-100);font:inherit;cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2), box-shadow var(--dur-2);
  }
  .al-tile:active{transform:scale(.95);}
  .al-emoji{position:relative;font-size:30px;line-height:1.2;}
  .al-name{font-size:13px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;}
  .al-state{font-size:12px;color:var(--muted);min-height:15px;}
  .al-tile[data-state="avoid"]{background:#F8E6E1;box-shadow:inset 0 0 0 2px #B3473A;}
  .al-tile[data-state="avoid"] .al-state{color:#7A2E22;font-weight:700;}
  /* avoid is a strike through the food, not just a colour */
  .al-tile[data-state="avoid"] .al-emoji::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;border-radius:2px;background:#B3473A;rotate:-35deg;}
  .al-tile[data-state="ok"]{background:var(--olive-100);box-shadow:inset 0 0 0 2px var(--olive-500);}
  .al-tile[data-state="ok"] .al-state{color:var(--olive-900);font-weight:700;}
  .al-tile.bump{animation:pop var(--dur-3) var(--spring);}
  .kind-seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--olive-50);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px var(--olive-100);}
  .kind-seg button{border:none;background:none;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;color:var(--olive-900);cursor:pointer;min-height:36px;}
  .kind-seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow-tile);font-weight:700;}
  .add-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .add-line input{flex:1 1 100%;min-width:0;}
  .add-line .pill{margin-left:auto;}
  .note-calm{font-size:13px;color:var(--muted);margin:0;line-height:1.45;}
  /* priorities: soft cards, up to three */
  .pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pr-card{
    position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:92px;border:none;border-radius:18px;
    background:var(--olive-50);box-shadow:inset 0 0 0 1.5px var(--olive-100);font:inherit;text-align:left;cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2), box-shadow var(--dur-2);
  }
  .pr-card:active{transform:scale(.96);}
  .pr-card:disabled{opacity:.45;cursor:default;}
  .pr-card .pr-emoji{font-size:26px;line-height:1;}
  .pr-card .pr-label{font-size:15px;font-weight:600;line-height:1.25;color:var(--ink);}
  .pr-card[aria-pressed="true"]{background:var(--olive-100);box-shadow:inset 0 0 0 2px var(--olive-700);}
  .pr-card[aria-pressed="true"]::after{
    content:"";position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--olive-700);
    background-image:linear-gradient(transparent, transparent);
  }
  .pr-card[aria-pressed="true"]::before{content:"";position:absolute;top:17px;right:17px;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;rotate:-45deg;z-index:1;}
  .lean{font-size:15px;color:var(--olive-900);background:var(--olive-50);border-radius:14px;padding:12px 14px;margin:0;line-height:1.4;}
  /* at home: staple chips */
  .st-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .st-chip{
    display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:10px 14px;min-height:44px;
    background:var(--olive-50);box-shadow:inset 0 0 0 1.5px var(--olive-100);font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2);
  }
  .st-chip:active{transform:scale(.95);}
  .st-chip[aria-pressed="true"]{background:var(--olive-700);color:#fff;box-shadow:none;}
  /* reveal: the table being set, then the week */
  .rv-stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0;}
  .rv-line{font-size:var(--fs-title);font-weight:700;letter-spacing:var(--track-title);color:var(--olive-900);text-align:center;margin:0;}
  .rv-days{display:flex;flex-direction:column;gap:2px;margin:0;}
  .rv-day{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--hairline);font-size:15px;line-height:1.35;}
  .rv-day:first-child{border-top:none;}
  .rv-day b{color:var(--olive-700);}
  .rv-day span{color:var(--ink);}

  /* ---------- keep out, priorities ---------- */
  .lean-line{font-size:var(--fs-caption);color:var(--muted);margin:2px 16px 12px 0;line-height:1.4;}
  .chip .kind{font-size:12px;color:var(--muted);}
  .chip.allergy{background:#F6E3DE;color:#7A2E22;}
  .chip.allergy .kind{color:#7A2E22;font-weight:600;}
  .chip button.x{border:none;background:none;padding:0 0 0 2px;font:inherit;font-size:var(--fs-caption);color:var(--muted);cursor:pointer;min-width:24px;min-height:24px;}
  .chip:disabled{opacity:.45;cursor:default;}
  .add-item-row button.quiet{background:var(--olive-100);color:var(--olive-700);}
  .locked{margin:4px 16px 12px 0;}
  .locked-head{font-size:var(--fs-caption);color:var(--muted);margin:0 0 6px;}
  .locked-rule{
    display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:6px 10px;border:none;border-radius:var(--r-pill);
    background:transparent;box-shadow:inset 0 0 0 1px var(--hairline);font:inherit;font-size:var(--fs-caption);color:var(--ink);cursor:pointer;min-height:32px;
  }
  /* a small padlock drawn in CSS: a shackle over a body */
  .lock{position:relative;width:9px;height:7px;border-radius:2px;background:var(--muted);margin-top:4px;}
  .lock::before{content:"";position:absolute;left:1.5px;bottom:5px;width:6px;height:5px;border:1.5px solid var(--muted);border-bottom:none;border-radius:4px 4px 0 0;box-sizing:border-box;}
  .locked-why{font-size:var(--fs-caption);color:var(--ink);margin:4px 0 0;line-height:1.45;min-height:1em;}
  .form-note{font-size:var(--fs-caption);color:#7A2E22;margin:8px 0 0;line-height:1.45;}

  /* ---------- the fan ----------
     A fan of rounded tiles, each slightly rotated and overlapping its
     neighbour. A tile is a photo when there is one, otherwise a soft pastel
     of its food group with a big emoji. Hover, focus or a tap straightens
     it and lifts it to the front; on first paint the tiles fan in one by
     one (Web Animations, 70 ms apart). */
  .fan{display:flex;justify-content:center;align-items:flex-end;padding:20px 8px 8px;margin:0 22px;min-height:150px;}
  .tile{
    --r:0deg;position:relative;flex:0 0 auto;width:min(30%, 124px);margin:0 -9px;padding:0;border:none;background:none;
    font:inherit;color:inherit;text-align:left;cursor:pointer;transform:rotate(var(--r));transform-origin:50% 90%;
    transition:transform var(--dur-3) var(--spring), z-index 0s var(--dur-2);
  }
  .tile-art{
    position:relative;display:grid;place-items:center;aspect-ratio:4 / 5;border-radius:var(--r-tile);background:var(--soft, var(--olive-100));
    box-shadow:var(--shadow-tile);overflow:hidden;transition:box-shadow var(--dur-3) var(--ease-out);
  }
  .tile-art img{width:100%;height:100%;object-fit:cover;}
  .tile-emoji{font-size:46px;line-height:1;filter:drop-shadow(0 6px 8px rgba(40,46,30,.18));}
  /* the meal's name rides inside the tile, so overlapping tiles never collide */
  .tile-slot{position:absolute;left:2px;right:2px;bottom:12px;text-align:center;font-size:12px;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;}
  .tile-emoji{margin-bottom:14px;}
  .tile:hover, .tile:focus-visible, .tile.lift{transform:rotate(0) translateY(-10px) scale(1.04);z-index:2;transition:transform var(--dur-3) var(--spring), z-index 0s;}
  .tile:hover .tile-art, .tile:focus-visible .tile-art, .tile.lift .tile-art{box-shadow:var(--shadow-lift);}
  .tile:active{transform:rotate(0) translateY(-6px) scale(.97);transition-duration:var(--dur-1);}
  .tile:focus-visible{outline:none;}
  .tile:focus-visible .tile-art{outline:3px solid var(--olive-700);outline-offset:3px;}
  .fan-empty{font-size:var(--fs-body);color:var(--muted);text-align:center;padding:20px 22px;}

  /* ---------- home ----------
     One calm column: a greeting with their name and age, the Today card
     with the fan, then three quiet cards that each show one thing. On wide
     screens a small rail takes the week, the rainbow and the tip. */
  .container{max-width:492px;}
  .hello{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 24px) 4px 18px;}
  .hello-text{flex:1;min-width:0;}
  .hello-time{margin:0;font-size:17px;font-weight:600;color:var(--olive-900);transition:color 60s linear;}
  .hello-name{margin:4px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;
    font-size:var(--fs-display);font-weight:800;letter-spacing:var(--track-display);line-height:1.05;color:var(--ink);transition:color 60s linear;}
  .age-chip{font-size:14px;font-weight:600;letter-spacing:0;padding:6px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.88);color:var(--olive-900);}
  [data-tod="evening"] .hello-time, [data-tod="evening"] .hello-name{color:#fff;}
  .profile-btn{
    flex:0 0 auto;width:48px;height:48px;border:none;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow-tile);
    font:inherit;font-weight:800;font-size:19px;color:var(--olive-700);cursor:pointer;transition:transform var(--dur-1) var(--ease-out);
  }
  .profile-btn:active{transform:scale(.94);}
  .home-grid, .home-main, .home-rail{display:flex;flex-direction:column;gap:16px;}
  .hcard{
    position:relative;display:block;width:100%;text-align:left;font:inherit;color:inherit;border:none;
    background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:22px;
    transition:transform var(--dur-2) var(--spring), box-shadow var(--dur-2) var(--ease-out);
  }
  button.hcard{cursor:pointer;}
  button.hcard:active, .hcard.pressable:has(> .hhead:active){transform:scale(.97);box-shadow:var(--shadow-tile);transition-duration:var(--dur-1);}
  .hhead{
    display:inline-flex;align-items:baseline;gap:.3em;border:none;background:none;padding:0;margin:0;font:inherit;cursor:pointer;
    font-size:26px;font-weight:800;letter-spacing:var(--track-display);line-height:1.05;color:var(--olive-700);
  }
  .hhead::after{content:"→";font-weight:700;transition:transform var(--dur-3) var(--spring);}
  .hcard:hover .hhead::after, .hhead:hover::after{transform:translateX(4px);}
  .hhead.static{cursor:default;}
  .hhead.static::after{content:none;}
  .hero .hhead{font-size:var(--fs-display);}
  .hero .fan{margin:6px 0 0;padding:14px 18px 8px;}   /* room for the outer tiles to tilt */
  .hero-line{margin:14px 2px 0;font-size:17px;line-height:1.45;color:var(--ink);}
  .hero-line:empty{display:none;}
  .hero .pill{margin-top:16px;width:100%;}
  .glance{display:block;margin:10px 0 0;font-size:17px;line-height:1.35;color:var(--ink);}
  .hint{display:block;margin:4px 0 0;font-size:14px;color:var(--muted);}
  .hint:empty{display:none;}
  /* Shop: a little stack of what's needed first */
  .thumbs{position:absolute;right:22px;top:22px;display:flex;}
  .thumb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--soft, var(--olive-100));box-shadow:0 0 0 3px var(--card);margin-left:-10px;}
  /* This week: seven days, a soft ring each that fills as meals are marked */
  .strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin:14px -6px 0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
  .strip::-webkit-scrollbar{display:none;}
  .wd{
    scroll-snap-align:start;border:none;background:none;border-radius:18px;padding:8px 0 10px;min-height:44px;
    display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;cursor:pointer;transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2);
  }
  .wd:active{transform:scale(.92);}
  .wd-l{font-size:12px;font-weight:600;color:var(--muted);}
  .wd.today{background:var(--olive-50);}
  .wd.today .wd-l{color:var(--olive-700);}
  .ring{position:relative;width:38px;height:38px;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:3.5;}
  .r-bg{stroke:var(--olive-100);}
  .r-fg{stroke:var(--olive-500);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p) * 100);transition:stroke-dashoffset 700ms var(--spring-soft);}
  .wd.done .r-fg{stroke:var(--olive-700);}
  .wd-n{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink);}
  .wd.done .wd-n{color:var(--olive-700);}
  /* Variety: one dot per food group, filled once it's been tasted this week */
  .rainbow{display:flex;gap:14px;margin-top:14px;}
  .rdot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
  .rdot i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c);transition:background-color var(--dur-3);}
  .rdot.on i{background:var(--c);}
  .rdot.on{color:var(--ink);}
  /* a small kind tip, dismissible */
  .tip{display:flex;gap:12px;align-items:flex-start;margin:0;background:rgba(255,255,255,.9);border-radius:22px;padding:14px 12px 14px 18px;font-size:14px;line-height:1.45;color:var(--ink);}
  .tip p{margin:0;flex:1;}
  .tip button{flex:0 0 auto;width:32px;height:32px;margin:-4px 0;border:none;border-radius:50%;background:none;color:var(--muted);font-size:15px;cursor:pointer;}
  .tip[hidden]{display:none;}
  /* a gentle notice: a stage change, a reminder that came due */
  .notice{background:var(--olive-50);box-shadow:inset 0 0 0 1.5px var(--olive-200), var(--shadow-card);}
  .notice p{margin:0 0 14px;font-size:17px;line-height:1.45;}
  .notice .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .notice .pill{min-height:46px;padding:10px 20px;font-size:16px;}
  #notices:empty{display:none;}

  /* ---------- sheets ----------
     One <dialog> for every detail: it springs up from the bottom on a phone
     and scales in on wide screens, traps focus, closes on Escape or a tap
     outside, and can be dragged down by its handle. Views inside slide
     sideways (meal → back to the week). */
  .sheet{
    position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;
    padding:0;border:none;border-radius:var(--r-card) var(--r-card) 0 0;background:var(--card);color:var(--ink);
    box-shadow:0 -20px 60px -20px rgba(40,46,30,.35);overflow:hidden;
  }
  .sheet[open]{display:flex;flex-direction:column;}
  .sheet::backdrop{background:rgba(28,32,20,.34);}
  .sheet-grab{flex:0 0 auto;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none;}
  .sheet-grab i{width:40px;height:5px;border-radius:3px;background:var(--olive-200);}
  .sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:2px 16px 10px;touch-action:none;}
  .sheet-title:focus{outline:none;}
  .sheet-title{flex:1;min-width:0;margin:0;font-size:var(--fs-title);font-weight:800;letter-spacing:var(--track-title);color:var(--olive-900);}
  .sheet-back, .sheet-close{
    flex:0 0 auto;width:44px;height:44px;border:none;border-radius:50%;background:var(--olive-50);color:var(--olive-900);
    display:grid;place-items:center;font-size:17px;cursor:pointer;transition:transform var(--dur-1) var(--ease-out);
  }
  .sheet-back:active, .sheet-close:active{transform:scale(.92);}
  .sheet-back[hidden]{display:none;}
  .sheet-back::before{content:"";width:9px;height:9px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;rotate:45deg;translate:2px 0;}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(24px + env(safe-area-inset-bottom));}
  @media (min-width:768px){
    .sheet{inset:0;margin:auto;width:min(560px, 92vw);max-height:86vh;border-radius:var(--r-card);box-shadow:var(--shadow-lift);}
    .sheet-grab{height:12px;cursor:default;}
    .sheet-grab i{display:none;}
  }
  /* the meal */
  .ms-hero{display:flex;align-items:center;gap:14px;margin:4px 0 16px;}
  .ms-emoji{flex:0 0 auto;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:var(--soft, var(--olive-100));rotate:-4deg;box-shadow:var(--shadow-tile);}
  .ms-slot{margin:0;font-size:14px;color:var(--muted);}
  .ms-dish{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:var(--track-title);line-height:1.15;color:var(--olive-700);}
  .ate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px;}
  .ate button{
    border:none;border-radius:var(--r-pill);min-height:50px;padding:10px 6px;font:inherit;font-size:15px;font-weight:700;
    background:var(--olive-50);color:var(--olive-900);box-shadow:inset 0 0 0 1.5px var(--olive-100);cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-2), color var(--dur-2);
  }
  .ate button:active{transform:scale(.95);}
  .ate button[aria-pressed="true"]{background:var(--olive-700);color:#fff;box-shadow:none;}
  .ms-items{padding:4px 12px 4px 14px;}
  /* a food: dot, name and grams, its chip and actions; the tip runs full width beneath */
  .ms-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;column-gap:10px;row-gap:4px;padding:12px 0;border-top:1px solid var(--hairline);}
  .ms-row .ms-tip{grid-column:2 / -1;}
  .ms-row:first-child{border-top:none;}
  .ms-dot{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--soft, var(--olive-100));}
  .ms-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ms-name{font-size:16px;font-weight:600;}
  .ms-sub{font-size:13px;color:var(--muted);}
  .ms-tip{font-size:13px;color:var(--ink);line-height:1.4;margin-top:2px;}
  .ms-acts{display:flex;align-items:center;gap:2px;}
  .ms-acts .icon-btn{width:40px;height:40px;border:none;border-radius:50%;background:var(--card);box-shadow:none;font-size:16px;color:var(--olive-700);}
  .ms-acts .icon-btn:active{transform:scale(.9);background:var(--olive-100);}
  .ms-why p{margin:0 0 8px;font-size:14px;line-height:1.45;}
  .ms-why p:last-child{margin-bottom:4px;}
  .ms-why b{font-weight:700;color:var(--olive-900);}
  /* the week */
  .days-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 18px;padding:2px 16px 8px;scrollbar-width:none;}
  .days-rail::-webkit-scrollbar{display:none;}
  .day-card{flex:0 0 84%;scroll-snap-align:center;background:var(--olive-50);border-radius:22px;padding:16px;}
  .dc-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .dc-day{flex:1;margin:0;font-size:19px;font-weight:800;letter-spacing:var(--track-title);color:var(--olive-900);}
  .dc-tag{font-size:12px;font-weight:700;color:var(--olive-700);background:var(--card);border-radius:999px;padding:4px 10px;}
  .dc-meals{list-style:none;margin:0;padding:0;}
  .dc-meal{width:100%;display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:baseline;border:none;background:none;padding:10px 0;border-top:1px solid var(--hairline);font:inherit;text-align:left;cursor:pointer;}
  li:first-child .dc-meal{border-top:none;}
  .dc-slot{font-size:13px;color:var(--muted);}
  .dc-dish{font-size:15px;line-height:1.3;color:var(--ink);}
  .dc-mark{font-size:12px;font-weight:700;color:var(--olive-700);white-space:nowrap;}
  .history-bar{flex:0 0 120px;height:8px;border-radius:999px;background:var(--olive-100);overflow:hidden;align-self:center;}
  .history-bar i{display:block;height:100%;width:var(--w);background:var(--olive-500);border-radius:999px;}
  /* variety */
  .vg-list{display:flex;flex-direction:column;}
  .vg-row{display:flex;align-items:center;gap:14px;border:none;background:none;padding:14px 4px;border-top:1px solid var(--hairline);font:inherit;text-align:left;cursor:pointer;}
  .vg-row:first-child{border-top:none;}
  .vg-dot{flex:0 0 auto;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--c);}
  .vg-dot.on{background:var(--c);}
  .vg-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .vg-name{font-size:17px;font-weight:700;}
  .vg-sub{font-size:13px;color:var(--muted);}
  .vg-row::after, .set-row::after{content:"";flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);rotate:45deg;}
  /* settings */
  .set-list{padding:2px 14px;}
  .set-row{width:100%;display:flex;align-items:center;gap:12px;border:none;background:none;padding:14px 0;border-top:1px solid var(--hairline);font:inherit;text-align:left;cursor:pointer;min-height:56px;}
  .set-row:first-child{border-top:none;}
  .set-label{flex:0 0 auto;font-size:16px;font-weight:600;}
  .set-value{flex:1;min-width:0;text-align:right;font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* shop */
  .seg.two{grid-template-columns:1fr 1fr;}
  .seg.two::before{width:calc((100% - 6px) / 2);}
  .celebrate{margin:0 4px 14px;font-size:16px;font-weight:700;color:var(--olive-700);}
  .celebrate[hidden]{display:none;}
  .k-name{background:linear-gradient(currentColor,currentColor) no-repeat 0 58% / 0 1.5px;transition:background-size var(--dur-2) var(--ease-out);}
  .k-row.bought .k-name{background-size:100% 1.5px;color:var(--muted);}
  .sheet-body > *{animation:none;}
  .sheet-body.enter > :nth-child(-n+8){animation:rise var(--dur-3) var(--spring) both;}
  .sheet-body.enter > :nth-child(2){animation-delay:30ms;}
  .sheet-body.enter > :nth-child(3){animation-delay:60ms;}
  .sheet-body.enter > :nth-child(4){animation-delay:90ms;}
  .sheet-body.enter > :nth-child(5){animation-delay:120ms;}
  .sheet-body.enter > :nth-child(6){animation-delay:150ms;}
  .sheet-body.enter > :nth-child(7){animation-delay:180ms;}
  .sheet-body.enter > :nth-child(8){animation-delay:210ms;}

  /* small controls keep their size on screen but take a 44px tap */
  .buy-chip, .chip button.x, .tip button, .locked-rule, .suggest button, .have-chip{position:relative;}
  .buy-chip::after, .chip button.x::after, .tip button::after, .locked-rule::after, .suggest button::after{
    content:"";position:absolute;left:50%;top:50%;width:max(100%, 44px);height:max(100%, 44px);translate:-50% -50%;
  }

  /* ---------- food art (foods.js → foodArt()): a drawing, or its emoji ---------- */
  .food-art{display:inline-block;width:var(--art);height:var(--art);flex:none;line-height:1;}
  .food-art img{display:block;width:100%;height:100%;transform:scale(var(--scale,1));filter:var(--art-ink);}
  .food-emoji{display:inline-grid;place-items:center;font-size:calc(var(--art) * .62);}

  /* ---------- micro-interactions ---------- */
  .burst{position:fixed;width:0;height:0;z-index:300;pointer-events:none;}
  .bp{position:absolute;left:0;top:0;display:block;opacity:0;}
  .bp.leaf{width:12px;height:7px;border-radius:12px 0 12px 0;background:var(--olive-500);}
  .bp.dot{width:6px;height:6px;border-radius:50%;background:var(--grain);}
  .bp.star{width:9px;height:9px;background:var(--fruit);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
  /* every row answers a press at once, then springs back */
  .set-row, .vg-row, .dc-meal, .k-stock, .history-row{transition:transform var(--dur-1) var(--ease-out), background-color var(--dur-1);}
  .set-row:active, .vg-row:active, .dc-meal:active, .k-stock:active{transform:scale(.985);background-color:var(--olive-50);}
  /* a sheet's rows and chips arrive in a short stagger (at most eight) */
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip, .dc-meal):nth-child(-n+8){animation:rise var(--dur-3) var(--spring) both;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(2){animation-delay:40ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(3){animation-delay:80ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(4){animation-delay:120ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(5){animation-delay:160ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(6){animation-delay:200ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(7){animation-delay:240ms;}
  .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip):nth-child(8){animation-delay:280ms;}
  /* a day's ring completing on the home strip */
  .wd.complete .ring{animation:ring-done 800ms var(--spring);}
  @keyframes ring-done{0%{transform:scale(1);} 35%{transform:scale(1.22) rotate(-8deg);} 100%{transform:scale(1);}}
  .ate button[aria-pressed="true"]{animation:pop var(--dur-3) var(--spring);}
  /* the bought tick pops and the strike draws */
  .k-row.just input[type=checkbox]:checked::before{animation:tick-pop var(--dur-3) var(--spring);}

  /* ---------- wide screens: the main column and a small rail ---------- */
  @media (min-width:1024px){
    .container{max-width:880px;padding:0 24px;}
    .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;}
  }

  /* ---------- motion ---------- */
  @keyframes rise{from{transform:translateY(10px);}}
  @keyframes from-right{from{transform:translateX(28px);}}
  @keyframes from-left{from{transform:translateX(-28px);}}
  @keyframes out-right{to{transform:translateX(110%);}}
  @keyframes out-left{to{transform:translateX(-110%);}}
  @keyframes tick-pop{
    from{transform:translateY(-1px) rotate(-45deg) scale(0);}
    60%{transform:translateY(-1px) rotate(-45deg) scale(1.3);}
  }
  @keyframes pop{from{transform:scale(.6);}}
  @keyframes band-in{from{transform:scaleX(0);}}
  @media (prefers-reduced-motion: reduce){
    .bg-img,
    .item-row.just .have-chip, .just input[type=checkbox]:checked::before, .addform-open, .k-row.just,
    .float .tile-art, .al-tile.bump, .sheet-body.enter > *, .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .set-row, .chip, .dc-meal),
    .wd.complete .ring, .ate button[aria-pressed="true"], .k-row.just input[type=checkbox]:checked::before{animation:none;}
    .set-row, .vg-row, .dc-meal, .k-stock, .history-row, .k-name{transition:none;}
    .seg::before, .btn, .chip, .buy-chip, .row-fg, .r-fg, .hcard, .wd,
    .switch input, .switch input::before, input[type=checkbox]{transition:none;}
  }
</style>
</head>
<body>
<!-- the background: Marta's gradient image, drifting slowly, with a tint for the time of day -->
<div class="bg" aria-hidden="true">
  <i class="bg-img"></i>
  <i class="tod tod-dawn"></i><i class="tod tod-dawn-wash"></i><i class="tod tod-golden"></i><i class="tod tod-golden-wash"></i><i class="tod tod-evening"></i>
</div>
<script>
/* Set the time of day before the first paint, so the page never flashes
   midday at night. ?tod=dawn|day|golden|evening overrides it (for testing). */
function timeOfDay(d){
  const h = d.getHours() + d.getMinutes()/60;
  return h>=5 && h<9 ? "dawn" : h>=9 && h<16.5 ? "day" : h>=16.5 && h<19.5 ? "golden" : "evening";
}
(function(){
  const forced = new URLSearchParams(location.search).get("tod");
  const root = document.documentElement;
  root.classList.add("tod-instant");
  root.dataset.tod = ["dawn","day","golden","evening"].includes(forced) ? forced : timeOfDay(new Date());
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove("tod-instant")));
  if(!forced) setInterval(()=>{ root.dataset.tod = timeOfDay(new Date()); }, 10*60*1000);
  document.addEventListener("visibilitychange", ()=>root.classList.toggle("tab-hidden", document.hidden));
})();
</script>

<div class="onb" id="onboarding" role="dialog" aria-modal="true" aria-labelledby="onbTitle" hidden>
  <div class="onb-top">
    <button type="button" class="onb-back" id="onbBack" aria-label="Back"></button>

    <span class="onb-spacer" id="onbSpacer"></span>
  </div>
  <p class="sr-only" id="onbProgress" aria-live="polite"></p>
  <div class="onb-card" id="onbCard"></div>
</div>
<div class="scroll-edge" aria-hidden="true"></div>
<div class="container">
  <header class="hello">
    <div class="hello-text">
      <p class="hello-time" id="helloTime"></p>
      <h1 class="hello-name"><span id="helloName"></span><span class="age-chip" id="ageChip"></span></h1>
    </div>
    <button type="button" class="profile-btn" id="profileBtn" aria-label="Profile and settings"></button>
  </header>

  <div class="home-grid">
    <div class="home-main">
      <div id="notices"></div>
      <section class="hcard hero pressable" id="hero" aria-labelledby="heroHead">
        <button type="button" class="hhead" id="heroHead">Today</button>
        <div class="fan" id="todayFan" role="group" aria-label="Today's meals"></div>
        <p class="hero-line" id="heroLine"></p>
      </section>
      <button type="button" class="hcard" id="shopCard">
        <span class="hhead">Shop</span>
        <span class="thumbs" id="shopThumbs" aria-hidden="true"></span>
        <span class="glance" id="shopGlance"></span>
        <span class="hint" id="shopHint"></span>
      </button>
    </div>
    <aside class="home-rail" aria-label="This week and variety">
      <section class="hcard pressable" aria-labelledby="weekHead">
        <button type="button" class="hhead" id="weekHead">This week</button>
        <div class="strip" id="weekStrip"></div>
      </section>
      <button type="button" class="hcard" id="varietyHome">
        <span class="hhead">Variety</span>
        <span class="glance" id="rainbowGlance"></span>
        <span class="rainbow" id="rainbow"></span>
      </button>
      <div class="tip" id="tip" role="note" hidden><p id="tipText"></p><button type="button" id="tipClose" aria-label="Dismiss today's tip">✕</button></div>
    </aside>
  </div>

  <!-- detail panels that keep their own renderers; they live here, hidden,
       and move into the sheet while it shows them -->
  <div id="parts" hidden>
    <div id="part-shop">
      <div class="seg two" id="shopTabs" role="tablist" aria-label="Shop">
        <button type="button" role="tab" id="tabBuy" aria-controls="panelBuy" aria-selected="true">To buy</button>
        <button type="button" role="tab" id="tabStock" aria-controls="panelStock" aria-selected="false">In stock</button>
      </div>
      <div id="panelBuy" role="tabpanel" aria-labelledby="tabBuy">
        <div class="seg" id="windowSeg" role="group" aria-label="Shop for">
          <button type="button" data-w="today">Today</button><button type="button" data-w="next3">Next 3 days</button><button type="button" data-w="week">Week</button>
        </div>
        <p class="celebrate" id="shopCelebrate" role="status" hidden></p>
        <div class="card">
          <div class="section-title" id="toBuyTitle">To buy</div>
          <div id="toBuyList"></div>
          <div id="extrasAdd"></div>
        </div>
      </div>
      <div id="panelStock" role="tabpanel" aria-labelledby="tabStock" hidden>
        <div class="card">
          <div class="section-title" id="homeTitle">Stock</div>
          <div id="homeList"></div>
          <div id="homeAdd"></div>
        </div>
      </div>
    </div>

    <div id="part-plan">
      <p class="subtle">Seven days of menus for their age. Nothing changes until you use the preview.</p>
      <div class="card"><p class="stage-sum" id="stageSummary"></p></div>
      <div id="solidsControls">
        <div class="card">
          <div class="section-title">What matters most</div>
          <div class="chips below" id="priorityChips" role="group" aria-label="Up to three priorities"></div>
          <p class="lean-line" id="priorityLine"></p>
        </div>
        <div class="card">
          <div class="section-title">Keep out</div>
          <div class="chips below" id="excludeChips"></div>
          <div class="add-item-row" style="padding-right:16px">
            <label class="sr-only" for="excludeName">Food to keep out</label>

/* ---------- the child's profile: age from a birth date ----------
   Age is never stored, only the birth date; months are worked out from
   today, so the stage moves on by itself. */
function ageMonths(iso, now){
  const b = localDate(iso), n = now || new Date();
  if(isNaN(b)) return null;
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
/* the birth date that makes a child m months old today (same day of the
   month, clamped to the month's length) */
function birthDateFromMonths(m, now){
  const n = now || new Date();
  const y = n.getFullYear(), mo = n.getMonth() - m;
  const first = new Date(y, mo, 1);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const d = new Date(first.getFullYear(), first.getMonth(), Math.min(n.getDate(), days));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ageNow(){
  const m = state.profile && state.profile.birthDate ? ageMonths(state.profile.birthDate) : null;
  return m===null ? 10 : m;
}

/* a whole word or phrase inside a food name: "egg" finds "Egg, well cooked"
   but not "eggplant"; "nuts" doesn't find "peanut butter" */
function hasWord(name, phrase){
  const esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + esc + "($|[^a-z])", "i").test(name);
}

/* ---------- safety: what never goes on the plate ----------
   Locked: the user can't remove these, and the generator, swaps and
   hand-added foods all go through the same check (lockedRule). `until` is
   the age in months from which a rule stops applying; no `until` = always,
   for 0-3. `unless` words make a safe preparation pass ("grapes,
   quartered"). Ages and lists are general guidance to check with a
   paediatric source. */
const LOCKED_RULES = [
  {id:"honey", label:"Honey", until:12, words:["honey"],
   why:"Honey isn't safe before 12 months: it can carry spores a baby's tummy can't handle yet."},
  {id:"cowsmilk", label:"Cow's milk as a drink", until:12, words:["cow's milk","cows milk","cow milk","glass of milk"],
   why:"Before 12 months, cow's milk as a drink can crowd out iron. A little in cooking is fine."},
  {id:"nuts", label:"Whole nuts", words:["whole nut","whole nuts","nuts","peanuts","almonds","almond","walnut","walnuts","hazelnut","hazelnuts","cashew","cashews","pistachio","pistachios","pecans"],
   unless:["butter","ground","flour","milk"],
   why:"Whole and chopped nuts are a choking risk for little ones. Smooth nut butters are fine."},
  {id:"grapes", label:"Whole grapes", words:["grape","grapes","whole grapes","cherry tomato","cherry tomatoes"],
   unless:["quartered","halved lengthways"],
   why:"Round foods like whole grapes can block a small airway. Quarter them lengthways."},
  {id:"hardraw", label:"Hard raw chunks", words:["raw carrot","raw apple","popcorn","hard sweet","hard sweets","hard candy","boiled sweets"],
   why:"Hard raw pieces and popcorn are choking risks. Cook until soft, or grate."},
  {id:"salt", label:"Added salt", words:["salt","salted","stock cube","bouillon","soy sauce","crisps"],
   why:"Little kidneys can't handle much salt. Season the grown-up portions after you've served theirs."},
  {id:"sugar", label:"Added sugar", words:["sugar","sugary","syrup","sweets","candy","juice","biscuits","cake"],
   unless:["snap"],
   why:"No added sugar keeps their taste for real food, and their new teeth happy."},
  {id:"unpasteurised", label:"Unpasteurised foods", words:["unpasteurised","unpasteurized","raw milk","raw cheese","raw egg","runny egg","brie","camembert","blue cheese"],
   why:"Unpasteurised milk and soft mould-ripened cheeses can carry listeria. Choose pasteurised."}
];
/* the rule a food breaks at this age, or null */
function lockedRule(name, months){
  const n = String(name);
  return LOCKED_RULES.find(r=>{
    if(r.until && months >= r.until) return false;
    if(!r.words.some(w=>hasWord(n, w))) return false;
    return !(r.unless || []).some(w=>hasWord(n, w));
  }) || null;
}

/* the common allergens, with the words that give them away in a food name */
const ALLERGENS = [
  {id:"egg",       label:"Egg",            emoji:"🥚", words:["egg","eggs","omelette","mayonnaise"]},
  {id:"milk",      label:"Milk",           emoji:"🥛", words:["milk","yogurt","yoghurt","cheese","ricotta","cream","kefir"]},
  {id:"peanut",    label:"Peanut",         emoji:"🥜", words:["peanut","peanuts","groundnut"]},
  {id:"treenuts",  label:"Tree nuts",      emoji:"🌰", words:["almond","cashew","walnut","hazelnut","pistachio","pecan","nut butter"]},
  {id:"wheat",     label:"Wheat / gluten", emoji:"🌾", words:["wheat","bread","toast","pasta","couscous","flour","oat","oats","oatmeal","barley","rye"]},
  {id:"soy",       label:"Soy",            emoji:"🫘", words:["soy","soya","tofu","edamame"]},
  {id:"fish",      label:"Fish",           emoji:"🐟", words:["fish","salmon","cod","hake","tuna","sardine","mackerel"]},
  {id:"shellfish", label:"Shellfish",      emoji:"🦐", words:["shrimp","prawn","prawns","crab","lobster","mussel","mussels","clam","squid"]},
  {id:"sesame",    label:"Sesame",         emoji:"🌱", words:["sesame","tahini","hummus"]}
];
/* foods whose allergens don't show in the name */
const HIDDEN_ALLERGENS = {"Beef meatballs, soft":["egg","wheat"]};
function allergensOf(name){
  const ids = ALLERGENS.filter(a=>a.words.some(w=>hasWord(name, w))).map(a=>a.id);
  return [...new Set(ids.concat(HIDDEN_ALLERGENS[name] || []))];
}
/* Allergy is strict: the food never appears. A typed allergy ("kiwi")
   blocks foods with that word; one naming an allergen ("egg") blocks
   everything carrying it. */
function allergyMatch(name, profile){
  const own = allergensOf(name);
  if(own.some(a=>(profile.allergens||{})[a]==="avoid")) return true;
  return (profile.avoid||[]).some(x=>x.kind==="allergy" && (
    hasWord(name, x.name) || ALLERGENS.some(a=>a.words.some(w=>hasWord(x.name, w)) && own.includes(a.id))));
}
/* Dislike is soft: it just comes up less often. */
function dislikeMatch(name, profile){
  return (profile.avoid||[]).some(x=>x.kind==="dislike" && hasWord(name, x.name));
}
/* the single gate every food passes: the generator, swaps, hand-added */
function isAllowed(food, months, profile){
  if(food.min > months || (food.max && food.max < months)) return false;
  if(lockedRule(food.name, months)) return false;
  return !allergyMatch(food.name, profile);
}

  "Olive oil":["yellow",1,0,"mid"], "Chia seeds":["brown",1,0,"mid"], "Smooth peanut butter":["brown",1,0,"low"],
  "Hummus":["yellow",1,1,"low"]
};
function metaOf(name){
  const m = FOOD_META[name];
  return m ? {colour:m[0], quick:!!m[1], freezes:!!m[2], cost:m[3]} : {};
}

/* ---------- dish names, prep tips, "why this food" ---------- */
function listJoin(a){ return a.length<=1 ? (a[0]||"") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
const baseName = i=>i.name.split(",")[0].trim();
const lower1 = t=>t.charAt(0).toLowerCase() + t.slice(1);
/* "Oatmeal with banana", "Lentils and sweet potato mash", "Chicken with
   carrots and rice": the meal's foods read as one dish */
function dishName(m, opts){
  const afters = !(opts && opts.afters===false);
  if(!m.items.length) return "";
  const byCat = c=>m.items.find(i=>i.cats[0]===c);
  if(m.label==="Snack") return listJoin(m.items.map((i,k)=>k ? lower1(baseName(i)) : baseName(i)));
  if(m.label==="Breakfast"){
    const lead = byCat("grain") || byCat("fruit") || m.items[0];
    const rest = m.items.filter(i=>i!==lead).map(i=>lower1(baseName(i)));
    return baseName(lead) + (rest.length ? " with " + listJoin(rest) : "");
  }
  const p = byCat("protein"), v = byCat("vegetable"), g = byCat("grain");
  const soft = m.items.map(i=>i.tex||"").find(t=>/purée|mash/.test(t));
  if(p && v && soft && m.items.length<=3 && !g){
    return `${baseName(p)} and ${lower1(baseName(v))} ${/purée/.test(soft) ? "purée" : "mash"}`;
  }
  // lunch and dinner: the main dish, and any fruit as the afters
  const fruit = m.items.filter(i=>i.cats[0]==="fruit");
  const mains = m.items.filter(i=>i.cats[0]!=="fruit");
  if(!mains.length) return listJoin(fruit.map((i,k)=>k ? lower1(baseName(i)) : baseName(i)));
  const lead = p || v || mains[0];
  const rest = mains.filter(i=>i!==lead).map(i=>lower1(baseName(i)));
  return baseName(lead) + (rest.length ? " with " + listJoin(rest) : "") +
         (fruit.length && afters ? ", then " + listJoin(fruit.map(i=>lower1(baseName(i)))) : "");
}
const FORM_TIPS = {
  meat:"Cook it right through, then shred or chop finely; a splash of the cooking water keeps it moist.",
  fish:"Bake or poach until it flakes, then check carefully for bones.",
  egg:"Cook until the yolk and white are both firm.",
  mash:"Simmer until very soft, then mash with a fork.",
  veg:"Steam until a fork slides in easily.",
  fruit:"Ripe and soft is right: it should squash between finger and thumb.",
  small:"Squash or cut small, never whole.",
  finger:"Cut into finger-length strips they can hold in a fist.",
  cereal:"Cook with water or their usual milk, no sugar.",
  grain:"Cook it a little softer than you would for yourself.",
  spoon:"Plain and full-fat, with no added sugar.",
  spread:"Spread thinly on something they can hold.",
  oil:"Stir a little into the food just before serving."
};
const PREP_TIPS = {
  "Lentils":"Red lentils collapse into a soft mash in about 15 minutes.",
  "Spinach":"Cook and chop finely; a little goes a long way for iron.",
  "Salmon":"Bake for 12 minutes, flake, and check for bones.",
  "Avocado":"Ripe enough to squash: serve in thick strips or mashed.",

  "Smooth peanut butter":"Thin it with warm water or stir it into porridge; never in a lump.",
  "Hummus":"Look for a low-salt one, or blitz chickpeas with a little oil."
};
function prepTip(item){
  return PREP_TIPS[baseName(item)] || FORM_TIPS[FOOD_FORM[item.name] || CAT_FORM[item.cats[0]]] || "";
}
function whyFor(item){
  const food = FOOD_POOL.find(f=>f.name===item.name);
  const m = metaOf(item.name);
  if(food && food.iron) return "Iron-rich: from about 6 months their own iron stores start running low.";
  if(/salmon/i.test(item.name)) return "Oily fish brings omega-3 fats for a growing brain.";
  if(item.cats[0]==="vegetable") return "Another colour on the plate" + (m.colour ? `, a ${m.colour} one.` : ".");
  if(item.cats[0]==="fruit") return "Natural sweetness and vitamin C, which helps them absorb iron.";
  if(item.cats[0]==="fat") return "Healthy fats: little bodies need plenty of energy in small portions.";
  if(item.cats[0]==="grain") return "Steady energy, and a familiar base next to anything new.";
  return "Protein for growing muscles.";
}

/* Marking a meal: ate it, ate some, or refused. Any mark means it was
   served, so stock goes down; all and some count for variety; every first
   mark counts as one more exposure to that food (refusal is normal and
   still counts: it can take 10-15 tries). */
/* why a hand-added food can't go on the plate, or "" */
function keepOutReason(name){
  const r = lockedRule(name, ageNow());
  if(r) return `${r.label} stays off the menu for now. ${r.why}`;
  if(allergyMatch(name, state.profile)) return `${name} is on their keep-out list, so we'll leave it off.`;
  return "";
}
function setAte(item, v){
  const was = item.eaten;
  if(!item.ate && v){
    const k = foodKey(baseName(item));
    state.exposures[k] = (state.exposures[k] || 0) + 1;
  }
  item.ate = v || null;
  item.eaten = item.ate!==null;
  if(was!==item.eaten) useStock(item);
}

/* item: {id, name, qty, cats:[...], tex?} ; cats reference CATS keys, first = primary (used for grocery grouping).

function uid(){ return Math.random().toString(36).slice(2,10); }
/* today as YYYY-MM-DD on the local clock (toISOString is UTC: wrong day after midnight in Europe) */
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

const STORE_KEY = "toddlerMealPlanner.v1";
const SCHEMA_VERSION = 6;
let state = loadState();

function freshProfile(){
  return {name:"", birthDate:null, onboarded:false, onboardingStep:0,
          allergens:{},      // {egg:"avoid"|"ok"}
          avoid:[],          // [{name, kind:"allergy"|"dislike"}]
          priorities:[],     // up to 3 PRIORITIES ids
          staples:[], remindAt:null, lastStage:null};
}
function freshState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    plan: defaultPlan(),
    variety: JSON.parse(JSON.stringify(DEFAULT_VARIETY)),
    manualCovered: {},   // { "protein::Salmon": true }
    stock: {},           // what's at home: { "oatmeal": {name, g:number|null, plenty:bool} }
    extras: [],          // non-food shopping: [{id, name, qty, checked}]
    history: [],
    profile: freshProfile(),
    exposures: {},       // how many times each food has been offered: {"banana": 3}
    openCard: "meals",   // the one card that's open, or null
    groceryFilter: "week", // "today" | "next3" | "week" (the rest of the planned week)
    weekStarted: todayISO()
  };
}

function loadState(){
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw) return freshState();
  let saved;
  try{ saved = JSON.parse(raw); }catch(e){ return freshState(); }
  return migrate(saved);
}

/* An older save's age, in months. CHICHO itself only ever stored months
   (createAge: 10), but accept years too: ageYears: 2, ageMonths: 9,
   age: {years:1, months:3}, or text like "2 years", "1.5 y", "9 months".
   A bare number means months. null when there's nothing readable. */
function savedAgeMonths(saved){
  const num = v=>typeof v==="number" && Number.isFinite(v) ? v : null;
  const text = v=>{
    if(typeof v!=="string" || !v.trim()) return null;
    const t = v.trim().toLowerCase().replace(",", ".");
    let y = t.match(/(\d+(?:\.\d+)?)\s*(?:y|yr|yrs|year|years)\b/), m = t.match(/(\d+(?:\.\d+)?)\s*(?:m|mo|mos|month|months)\b/);
    if(y || m) return (y ? Number(y[1])*12 : 0) + (m ? Number(m[1]) : 0);
    return /^\d+(\.\d+)?$/.test(t) ? Number(t) : null;
  };
  const parts = o=>o && typeof o==="object" && (num(o.years)!==null || num(o.months)!==null)
    ? (num(o.years) || 0)*12 + (num(o.months) || 0) : null;
  const tries = [num(saved.ageMonths), num(saved.ageYears)!==null ? saved.ageYears*12 : null,
                 num(saved.createAge), text(saved.createAge), parts(saved.age), text(saved.age), num(saved.age)];
  const hit = tries.find(v=>v!==null && v>=0);
  return hit===undefined ? null : hit;
}

/* Saved states predate later features, so fill in anything the running code
   expects but an older save never wrote. Saved values always win. */
function migrate(saved){
  const s = Object.assign(freshState(), saved);

  if(!s.plan || !Array.isArray(s.plan.days) || s.plan.days.length===0) s.plan = defaultPlan();

  // keep only categories this build knows about, and add any it's missing
  const variety = {};
  Object.keys(DEFAULT_VARIETY).forEach(cat=>{
    const foods = s.variety && Array.isArray(s.variety[cat]) ? s.variety[cat] : null;
    variety[cat] = foods ? foods.slice() : DEFAULT_VARIETY[cat].slice();
  });
  s.variety = variety;

  if(!s.manualCovered || typeof s.manualCovered!=="object") s.manualCovered = {};
  if(!Array.isArray(s.history)) s.history = [];
  // stock and extras replace the stored grocery list (schema 5): extras keep
  // their tick, and plan foods already ticked as bought count as at home
  if(!s.stock || typeof s.stock!=="object" || Array.isArray(s.stock)) s.stock = {};
  if(!Array.isArray(s.extras)) s.extras = [];
  if(Array.isArray(saved.grocery) && !Array.isArray(saved.extras)){
    saved.grocery.forEach(g=>{
      if(!g || !g.name) return;
      if(g.manual){ s.extras.push({id:g.id||uid(), name:g.name, qty:g.qty||"", checked:!!g.checked}); return; }
      if(!g.checked) return;
      const k = foodKey(g.name);
      if(s.stock[k]) return;
      const grams = (g.entries||[]).reduce((t,e)=>t+(gramsOf(e.qty)||0), 0);
      s.stock[k] = {name:g.name, g: grams || null, plenty:false};
    });
  }
  delete s.grocery;
  if(!GROCERY_FILTERS.some(f=>f.key===s.groceryFilter)) s.groceryFilter = "week";

  delete s.mascotPos;      // the floating mascot is gone

  delete s.menuHintSeen;   // the mascot menu is gone
  if(s.openCard!==null && !["meals","food","variety","plan"].includes(s.openCard)) s.openCard = "meals";
  // schema 6: a profile with a birth date replaces the stored age (always
  // months: 10, 12 or 18 before stages, 0-36 after), and the one "never
  // include" list becomes dislikes; anything a locked rule covers drops,
  // because it's locked now
  const prof = Object.assign(freshProfile(), saved.profile && typeof saved.profile==="object" ? saved.profile : {});
  if(!prof.birthDate || isNaN(localDate(prof.birthDate))){
    const age = savedAgeMonths(saved);
    prof.birthDate = birthDateFromMonths(age===null ? 10 : Math.min(AGE_MAX, Math.max(0, Math.round(age))));
  }
  if(!saved.profile && Array.isArray(saved.excludedFoods)){
    saved.excludedFoods.forEach(f=>{
      if(typeof f!=="string" || !f.trim()) return;
      const name = f.trim();
      if(lockedRule(name, 0)) return;
      if(!prof.avoid.some(a=>a.name.toLowerCase()===name.toLowerCase())) prof.avoid.push({name, kind:"dislike"});
    });
  }
  prof.avoid = (Array.isArray(prof.avoid) ? prof.avoid : [])
    .filter(a=>a && typeof a.name==="string" && a.name.trim())
    .map(a=>({name:a.name.trim(), kind:a.kind==="allergy" ? "allergy" : "dislike"}));
  const al = {};
  Object.entries(prof.allergens || {}).forEach(([k,v])=>{ if(ALLERGENS.some(a=>a.id===k) && (v==="avoid" || v==="ok")) al[k] = v; });
  prof.allergens = al;
  prof.priorities = (Array.isArray(prof.priorities) ? prof.priorities : []).filter(id=>PRIORITIES.some(p=>p.id===id)).slice(0,3);
  if(!saved.profile) prof.returning = true;   // an older save: their week is worth keeping
  s.profile = prof;
  delete s.createAge; delete s.ageYears; delete s.ageMonths; delete s.age;
  delete s.excludedFoods;
  if(!s.exposures || typeof s.exposures!=="object" || Array.isArray(s.exposures)) s.exposures = {};
  // marking: eaten:true becomes "ate it"; eaten keeps meaning "served"
  s.plan.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{
    if(!["all","some","refused"].includes(i.ate)) i.ate = i.eaten ? "all" : null;
    i.eaten = i.ate!==null;
  })));

  s.schemaVersion = SCHEMA_VERSION;
  return s;
}
