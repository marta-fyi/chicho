/* The theme, before the first paint: Auto follows the system (prefers-color-scheme), or the family's choice
   in Profile (state.profile.appearance: auto · light · dark). ?theme=light|dark overrides it, for testing.
   Only the dark theme needs the night-sky image, so only it preloads it. */
(function(){
  const root = document.documentElement, forced = new URLSearchParams(location.search).get("theme");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let pref = "auto";
  try{ const s = JSON.parse(localStorage.getItem("toddlerMealPlanner.v1") || "null"); if(s && s.profile && s.profile.appearance) pref = s.profile.appearance; }catch(e){}
  window.applyTheme = function(p){
    if(p) pref = p;
    const t = forced==="light" || forced==="dark" ? forced : pref==="light" || pref==="dark" ? pref : dark.matches ? "dark" : "light";
    const changed = root.dataset.theme!==t;
    root.dataset.theme = t; root.dataset.appearance = pref;
    if(t==="dark" && !document.getElementById("bgPreload")){ const l = document.createElement("link"); l.id = "bgPreload"; l.rel = "preload"; l.as = "image"; l.href = "bg.jpg"; document.head.appendChild(l); }
    if(changed) document.dispatchEvent(new Event("themechange"));
    return t;
  };
  applyTheme();
  dark.addEventListener("change", ()=>applyTheme());
  document.addEventListener("visibilitychange", ()=>root.classList.toggle("tab-hidden", document.hidden));
})();
/* a shared snapshot link is never indexed (the payload lives in the fragment, which is never sent anyway) */
if(/^#\/s\//.test(location.hash)){ const m = document.createElement("meta"); m.name = "robots"; m.content = "noindex"; document.head.appendChild(m); }
/* first run only: the welcome's first two drawings (HERO_FOODS[0], [1] in foods.js) start loading with the page */
try{
  const saved = JSON.parse(localStorage.getItem("toddlerMealPlanner.v1") || "null");
  if(!saved || !saved.profile || !saved.profile.onboarded) ["banana","carrot"].forEach(id=>{
    const l = document.createElement("link");
    l.rel = "preload"; l.as = "image"; l.type = "image/webp";
    l.setAttribute("imagesrcset", `img/food/${id}-192.webp 1x, img/food/${id}-384.webp 2x`);
    document.head.appendChild(l);
  });
}catch(e){}
</script>

  .pill-x::after{rotate:-45deg;}
  .pill-x:focus-visible{outline:2px solid currentColor;outline-offset:-4px;}
  .pill-edit{cursor:text;gap:6px;padding-right:6px;}
  .pill-edit .blank{min-width:5ch;}
  .kind-toggle{display:inline-flex;margin-left:4px;}
  .kind-toggle button{min-height:44px;margin:-4px 0;padding:0 10px;border:none;border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;opacity:.6;}
  .kind-toggle button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;}
  /* the locked line, and its reasons on tap */
  .locked-say{margin-top:24px;max-width:460px;font-size:15px;line-height:1.45;color:var(--ink-85);}
  .locked-say p{margin:0;}
  .lock-i{width:14px;height:14px;margin-right:6px;vertical-align:-1px;fill:currentColor;stroke:currentColor;stroke-width:1.6;}
  .lock-i path{fill:none;}
  .why-list{margin:10px auto 0;padding:0;list-style:none;text-align:left;display:grid;gap:6px;}
  /* meal times */
  .mt-rows{margin-top:24px;display:grid;gap:6px;}
  .mt-row{margin:0;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.5;color:var(--ink);}
  .mt-row input[type=time]{font-variant-numeric:tabular-nums;}
  .mt-row input[type=time]::-webkit-calendar-picker-indicator{display:none;}
  /* the reveal: drawings floating up one by one */
  .rv-row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:28px;min-height:84px;}
  .rv-item{display:block;rotate:var(--r);animation:rv-rise 520ms var(--spring) both;
           animation-delay:calc(var(--k) * 70ms);}
  @keyframes rv-rise{from{opacity:0;transform:translateY(24px) scale(.85);}}
  /* the week, before it's yours */
  
  @media (prefers-reduced-motion: reduce){
    .blank.idle:focus-within::after{animation:none;}
    .rv-item{animation:wel-fade 300ms both;animation-delay:calc(var(--k) * 70ms);}
    .wel-in > *{animation-name:wel-fade;}
    @keyframes wel-fade{from{opacity:0;}}
  }

  /* labels and button text: uppercase with +0.06em (the words stay sentence case in content.js) */
  .btn-ink, .offer-pill, .offer-bar .btn-text.undo, .outcome, .pill-o, .alt, .s-seg-opts button, .kind-toggle button,
  .sec-h, .btn-text:not(.inline){text-transform:uppercase;letter-spacing:var(--track-label);}
  .btn-ink, .offer-pill, .offer-bar .btn-text.undo{font-size:14px;}
  .outcome, .pill-o, .alt, .s-seg-opts button, .btn-text:not(.inline), .kind-toggle button{font-size:13px;}
  .sec-h{font-size:12px;}

  /* ---------- keep out, priorities ---------- */

  .locked{margin:4px 16px 12px 0;}

  /* a small padlock drawn in CSS: a shackle over a body */
  .lock{position:relative;width:9px;height:7px;border-radius:2px;background:var(--muted);margin-top:4px;}
  .lock::before{content:"";position:absolute;left:1.5px;bottom:5px;width:6px;height:5px;border:1.5px solid var(--muted);border-bottom:none;border-radius:4px 4px 0 0;box-sizing:border-box;}

  /* ---------- the app: five full-screen views on a 2D canvas ----------
     One pager: the screens sit on a grid (LAYOUT in home.js), a camera holds them
     and only the camera moves (transform). Home never scrolls, so the pager owns
     every direction there; the other screens scroll natively and are left by their
     header zone or by pulling past their scroll edge. Nothing responds to hover. */
  html, body{overscroll-behavior:none;}
  body.is-app{height:100dvh;overflow:hidden;padding-bottom:0;}
  .app{position:fixed;inset:0;color:var(--ink);}
  .pager{position:absolute;inset:0;overflow:hidden;}
  .camera{position:absolute;inset:0;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;}
  .screen.is-off{visibility:hidden;}
  .scr-col{width:100%;max-width:calc(var(--col) + var(--pad-l) + var(--pad-r));margin:0 auto;padding:0 var(--pad-r) 0 var(--pad-l);}
  .scr-home{touch-action:none;}
  .home-in{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(env(safe-area-inset-bottom) + 12px);}
  /* the backdrop: the glow (light) or the night sky (dark), panning at 0.3x of the camera */
  .backdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .bg{display:none;}
  [data-theme="dark"] .bg{display:block;position:absolute;top:-36%;bottom:-66%;left:-6%;right:-36%;background:var(--bg);}
  .bg-img{position:absolute;inset:0;background:url("bg.jpg") center / cover no-repeat;}
  .bg-night{position:absolute;inset:0;background:linear-gradient(180deg, var(--night), var(--night-mid) 60%, var(--night-low));}
  .glow-plane{position:absolute;inset:0;--glow-size:calc(1.5 * min(var(--vw, 100vw) - var(--pad-l) - var(--pad-r), var(--col)));}
  [data-theme="dark"] .glow-plane{display:none;}
  .glow-pulse{position:absolute;left:50%;top:var(--glow-y, 160px);width:var(--glow-size);height:var(--glow-size);translate:-50% -50%;transition:opacity 1.2s ease-in-out;}
  .glow-dim .glow-pulse{opacity:.55;}
  .glow{position:absolute;inset:0;animation:breathe 10s ease-in-out infinite;will-change:transform, opacity;}
  @keyframes breathe{0%, 100%{transform:scale(1);opacity:.94;} 50%{transform:scale(1.05);opacity:1;}}
  .tab-hidden .glow{animation-play-state:paused;}
  .glow-s{position:absolute;inset:0;opacity:0;}
  .glow-s.home-on{opacity:1;}
  .glow-l{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease-in-out;}
  .glow-l.is-on{opacity:1;}
  .glow-grain{position:absolute;inset:0;background:url("img/grain.png") 0 0 / 128px 128px;
              -webkit-mask-image:radial-gradient(circle closest-side, black 30%, transparent 100%);mask-image:radial-gradient(circle closest-side, black 30%, transparent 100%);}
  @media (prefers-reduced-motion: reduce){ .glow{animation:none;} .glow-l{transition-duration:.3s;} }

  /* ---------- Home: offer ---------- */
  .corners{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .who-btn{display:flex;flex-direction:column;align-items:flex-start;min-width:44px;min-height:44px;margin:0;padding:2px 0;border:none;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
  .who-age, .when-date{font-size:13px;line-height:1.4;color:var(--ink-muted);}
  .who-name.has-ink{text-decoration:none;}
  .who-name{font-size:20px;font-weight:500;line-height:1.3;text-transform:uppercase;letter-spacing:var(--track-label);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;}
  .who-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px;}
  .when{display:flex;flex-direction:column;align-items:flex-end;margin:0;padding:2px 0;text-align:right;font-variant-numeric:tabular-nums;}
  .when-time{font-size:20px;font-weight:500;line-height:1.3;}
  .headline{margin:20px 0 0;font-family:var(--font-display);font-size:clamp(32px, 9.5vw, 40px);font-weight:500;letter-spacing:var(--track-hero);line-height:1.1;text-wrap:balance;}
  .headline:focus{outline:none;}
  .moment{margin:10px 0 0;min-height:1.45em;font-size:17px;line-height:1.45;color:var(--ink);text-wrap:pretty;}
  .moment.calm-tone{font-weight:500;}
  /* inline text actions keep the line's rhythm; their 44px target is an invisible pad around the words */
  .btn-text.inline{position:relative;min-height:0;min-width:0;padding:0 2px;font-size:inherit;line-height:inherit;color:var(--ink);vertical-align:baseline;}
  .btn-text.inline::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:44px;translate:0 -50%;}
  .btn-text.quiet{color:var(--ink-muted);font-weight:500;}
  /* the meal now (or next): text only. It never scrolls the page; opened up, the block scrolls inside itself */
  .now-meal{flex:1 1 auto;min-height:0;margin-top:18px;overflow:hidden;}
  .now-meal.scrolls{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;}
  .meal-title{margin:0;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.25;}
  .meal-title:focus{outline:none;}
  .meal-foods{list-style:none;margin:10px 0 0;padding:0;font-size:17px;line-height:1.5;}
  .meal-foods li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-foods .more-li, .meal-foods li:has(.more-btn){overflow:visible;}
  .meal-foods .more-btn{margin-left:-2px;}
  .meal-how{margin:10px 0 0;font-size:16px;line-height:1.5;color:var(--ink-muted);}
  .meal-how .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meal-also{margin:10px 0 0;font-size:16px;line-height:1.5;}
  .meal-also b{font-weight:500;}
  .offer-zone{flex:none;margin-top:14px;}
  .offer-bar{display:flex;align-items:stretch;width:100%;height:48px;border-radius:999px;background:var(--ink);color:var(--on-ink);}
  /* the pill keeps its size in every state ("Mark as offered", "Offered · Undo", "Offered"), so nothing shifts */
  .offer-pill{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:48px;padding:0 20px;border-radius:999px;border:none;
              background:none;color:inherit;font:inherit;font-size:14px;font-weight:500;cursor:pointer;}
  .offer-bar .btn-text.undo{flex:none;min-height:48px;margin-left:0;padding:0 22px 0 0;color:inherit;border-radius:0 999px 999px 0;font-size:14px;}
  .offer-bar .btn-text.undo::before{content:"·";display:inline-block;margin:0 10px 0 8px;text-decoration:none;}
  .offer-bar:has(.undo) .offer-pill{justify-content:flex-end;padding-right:0;}   /* the two hit areas meet, never overlap */
  .offer-pill:focus-visible, .outcome:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .outcomes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .outcome{flex:1 1 0;min-height:44px;padding:0 10px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .outcome[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);}
  .how-went{margin:6px 0 0;}
  .foot-line{flex:none;display:flex;align-items:center;min-height:44px;margin:8px 0 0;padding-right:56px;font-size:15px;line-height:1.4;color:var(--ink-muted);}
  .foot-line[hidden]{display:none;}
  .is-milk .now-meal, .is-milk .offer-zone, .is-empty .now-meal, .is-empty .offer-zone{display:none;}

  /* ---------- the other screens: a pinned header, native scroll, one primary pill ---------- */
  .scr-head{flex:none;padding-top:calc(env(safe-area-inset-top) + 4px);touch-action:none;}
  .scr-head .scr-col{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 12px;}
  .home-link{margin-left:-6px;}
  .scr-title{flex-basis:100%;margin:2px 0 10px;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.25;}
  .scr-title:focus{outline:none;}
  .scr-sub{flex-basis:100%;margin:-6px 0 10px;font-size:15px;color:var(--ink-muted);}
  .scr-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:24px;}
  .scr-pin{flex:none;padding:10px 0 calc(env(safe-area-inset-bottom) + 64px);}
  .scr-foot{flex:none;height:calc(env(safe-area-inset-bottom) + 64px);}
  .scr-pin .btn-ink{width:100%;}
  .sec{margin-top:26px;}
  .sec:first-child{margin-top:4px;}
  .sec-h{margin:0 0 4px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:var(--track-label);color:var(--ink-muted);}
  .sec-p{margin:6px 0 0;font-size:16px;line-height:1.5;}
  .sec-p.muted, .quiet-line{color:var(--ink-muted);}
  .quiet-line{margin:8px 0 0;font-size:15px;line-height:1.5;}
  .row{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0;border-bottom:1px solid var(--hairline);font-size:17px;line-height:1.35;}
  .row .row-t{flex:1;min-width:0;display:flex;flex-direction:column;}
  .row .row-sub{font-size:15px;color:var(--ink-muted);}
  .row .food-art{--art:24px;}
  .row-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:4px 0;border:none;border-bottom:1px solid var(--hairline);background:none;color:var(--ink);font:inherit;font-size:17px;text-align:left;cursor:pointer;}
  .row-btn .row-t{flex:1;min-width:0;display:flex;flex-direction:column;}
  .row-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .state-word{flex:none;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:var(--track-label);}
  .chev{width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -3px;transition:rotate var(--dur-2) var(--ease-out);opacity:.85;}
  [aria-expanded="true"] > .chev{rotate:225deg;translate:0 3px;}
  .toggle{display:inline-flex;gap:2px;}
  .toggle .btn-text{min-width:0;padding:0 6px;font-size:13px;opacity:.6;text-decoration:none;}
  .toggle .btn-text[aria-pressed="true"]{opacity:1;text-decoration:underline;}
  .toggle .sep{align-self:center;font-size:13px;color:var(--ink-muted);}
  .wake{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
  .wake i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;}
  .wake[aria-pressed="true"] i{background:currentColor;}
  .undo-line{margin:6px 0 0;font-size:16px;color:var(--ink-muted);}
  /* the done ring (prep tasks, To buy): 28px, a 1.5px ink line; done fills with ink and the check shows */
  .ring-btn{position:relative;flex:none;width:44px;height:44px;padding:0;border:none;border-radius:50%;background:none;color:var(--ink);cursor:pointer;}
  .ring-btn i{position:absolute;inset:8px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;overflow:hidden;}
  .ring-btn i::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform 160ms var(--ease-out);}
  .ring-btn svg{position:relative;width:16px;height:16px;fill:none;stroke:var(--bg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  .ring-btn[aria-pressed="true"] i::before{transform:scale(1);}
  .ring-btn[aria-pressed="true"] svg{opacity:1;}
  .ring-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .ring-btn:active{transform:none;}
  .ring-btn:not(:disabled):active i{transform:scale(.97);}
  /* Shuffle */
  .sh-meal{padding:14px 0 12px;border-bottom:1px solid var(--hairline);}
  .sh-meal:focus{outline:none;}
  .sh-meal.is-target{scroll-margin-top:8px;}
  .sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0;font-size:17px;font-weight:500;}
  .sh-state{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:var(--track-label);color:var(--ink-muted);}
  .sh-foods{list-style:none;margin:4px 0 0;padding:0;}
  .sh-food{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 8px;min-height:44px;font-size:16px;}
  .sh-food-t{display:flex;flex-direction:column;min-width:0;padding:6px 0;}
  .sh-alert{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:var(--track-label);color:var(--ink-muted);}
  .sh-food .alt-line{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;margin:0 0 6px;font-size:16px;}
  .sh-acts{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:2px;}
  .sh-none{margin:4px 0 0;font-size:15px;color:var(--ink-muted);}
  .sh-foot{margin:18px 0 0;}
  /* Kitchen */
  .group-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:0;border:none;border-bottom:1px solid var(--hairline);background:none;color:var(--ink);font:inherit;font-size:17px;text-align:left;cursor:pointer;}
  .group-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .group-list{padding-left:12px;}
  .group-list[hidden]{display:none;}
  .add-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:10px 0 0;font-size:17px;font-weight:500;}
  .suggest-list{display:flex;flex-wrap:wrap;gap:8px;flex-basis:100%;}
  .suggest-list:empty{display:none;}
  .alt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;}
  .alt:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .storage-note{margin:10px 0 0;font-size:15px;line-height:1.5;color:var(--ink-muted);}
  /* New week: the onboarding's sentences, inside the pager */
  .nw .sent{font-size:clamp(26px, 7.6vw, 32px);text-align:left;margin-top:22px;}
  .nw .sent:first-child{margin-top:6px;}
  .nw .pills{justify-content:flex-start;margin-top:14px;}
  .nw .onb-hint{text-align:left;}
  .nw-date{position:relative;display:inline-block;}
  .blank.date .blank-input{position:static;width:auto;text-align:left;min-width:8ch;}
  .blank.date .blank-input::-webkit-calendar-picker-indicator{display:none;}
  .nw-more{margin-top:26px;}
  .nw-preview .sent{margin-top:4px;}
  .wk-rows{list-style:none;margin:18px 0 0;padding:0;width:100%;text-align:left;}
  .wk-row{display:grid;grid-template-columns:4.5ch 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--hairline);font-size:15px;line-height:1.45;}
  .wk-name{font-weight:500;}
  .onb .wk-rows{max-width:var(--col);}
  .nw-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:20px;}
  /* Profile */
  .pf-name{flex-basis:100%;margin:2px 0 0;font-size:24px;font-weight:500;letter-spacing:var(--track-label);text-transform:uppercase;line-height:1.25;}
  .pf-name:focus{outline:none;}
  .pf-firsts .row img{width:44px;height:44px;border-radius:8px;object-fit:cover;}
  .pf-photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .s-seg{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;border-bottom:1px solid var(--hairline);}
  .s-seg-l{font-size:17px;}
  .s-seg-opts{display:flex;gap:8px;}
  .s-seg-opts button{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;}
  .s-seg-opts button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);}
  .s-seg-opts button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .s-sentence{margin:14px 0 0;font-size:18px;font-weight:500;line-height:1.5;}
  .s-person{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 12px;min-height:48px;border-bottom:1px solid var(--hairline);font-size:17px;}
  .s-person p{margin:0;}
  .s-warn{margin:10px 0 0;font-size:16px;line-height:1.45;}
  .s-status:empty{display:none;}
  /* the position map: five dots laid out like the canvas, the current one filled; each dot is a link */
  .map{position:absolute;right:max(20px, env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;width:44px;height:44px;
       display:grid;grid-template-columns:repeat(2, 22px);grid-template-rows:repeat(4, 11px);}
  .map a{position:relative;display:block;color:var(--ink);}
  .map a::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:currentColor;opacity:.35;}
  .map a[aria-current="page"]::before{opacity:1;}
  .map a[hidden]{display:none;}
  .map a:focus-visible{outline:2px solid var(--ink);outline-offset:0;border-radius:3px;}
  .map .m-profile{grid-area:1 / 1;} .map .m-home{grid-area:2 / 1;} .map .m-shuffle{grid-area:2 / 2;} .map .m-kitchen{grid-area:3 / 1;} .map .m-week{grid-area:4 / 1;}
  .is-onb .map{display:none;}
  /* screens fade their content in, staggered, after arriving */
  .arrive > *{animation:arrive 280ms var(--ease-out) both;}
  @keyframes arrive{from{opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .chev, .ring-btn i::before{transition:none;} }

  /* a food with no drawing: a hairline circle, never an emoji */
  .food-none{display:inline-block;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-20);}
  /* the read-only snapshot */
  .snap{padding:calc(env(safe-area-inset-top) + 24px) 0 40px;}
  .snap-who{font-size:17px;color:var(--ink-85);margin:0;}
  .snap-avoid{margin:10px 0 24px;font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.2;}
  .snap-day h2{margin:24px 0 8px;font-size:22px;font-weight:500;}
  .snap-meal{margin:0 0 14px;}
  .snap-meal-h{margin:0 0 4px;font-size:17px;font-weight:500;}
  .snap-food{display:flex;align-items:center;gap:10px;margin:2px 0;font-size:17px;}
  .snap-updated, .snap-broken{margin-top:28px;font-size:17px;color:var(--ink-85);}
  .is-snapshot{height:auto;overflow:auto;}
  .is-snapshot .app{position:static;}
  .is-snapshot .home-snap{max-width:calc(var(--col) + var(--pad-l) + var(--pad-r));margin:0 auto;padding:0 var(--pad-r) 0 var(--pad-l);}

  /* ---------- food art (foods.js → foodArt()): a drawing, or its emoji ---------- */
  .food-art{display:inline-block;width:var(--art);height:var(--art);flex:none;line-height:1;}
  .food-art img{display:block;width:100%;height:100%;transform:scale(var(--scale,1));filter:var(--art-ink);}
  /* the bullets: each drawing is a mask filled with the ink, so one file serves both themes (and an ink pill
     fills it with --on-ink). artReady() in foods.js switches a bullet to its mask once the image has loaded,
     so lazy loading still works; where masks aren't supported the image shows, forced to the ink's colour */
  .food-art.masked{background-color:var(--art-color, var(--ink));
    -webkit-mask:var(--mask) center / calc(var(--scale, 1) * 100%) no-repeat;mask:var(--mask) center / calc(var(--scale, 1) * 100%) no-repeat;}

  /* ---------- motion ---------- */
  @keyframes rise{from{transform:translateY(10px);}}
  @keyframes from-right{from{transform:translateX(28px);}}
  @keyframes from-left{from{transform:translateX(-28px);}}
  @keyframes out-right{to{transform:translateX(110%);}}
  @keyframes out-left{to{transform:translateX(-110%);}}
  @keyframes tick-pop{
    from{transform:translateY(-1px) rotate(-45deg) scale(0);}
    60%{transform:translateY(-1px) rotate(-45deg) scale(1.3);}
  }
  @keyframes pop{from{transform:scale(.6);}}
  @keyframes band-in{from{transform:scaleX(0);}}
  @media (prefers-reduced-motion: reduce){
    .bg-img,
    .just input[type=checkbox]:checked::before, .arrive > *{animation:none;}

    .seg::before, .btn, .chip, .buy-chip, .row-fg, .r-fg, .hcard, .wd,
    .switch input, .switch input::before, input[type=checkbox]{transition:none;}
  }
  /* touch: every tappable answers a press within 100ms (scale .97, transform only); iOS needs a touchstart
     listener on the document for :active to apply (home.js adds one). Text actions inside a sentence become
     inline-blocks so they can scale too. Nothing responds to hover (tools/check.mjs). */
  :is(button, a[href], [role="button"], summary){touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  .btn-text.inline{display:inline-block;}

  :is(button, a[href], [role="button"]):not(:disabled):active{transform:scale(.97);transition:transform 100ms var(--ease-out);}
  .ring-btn:not(:disabled):active, .map a:active{transform:none;}   /* the ring scales its circle instead, so its 44px pad doesn't move */
  /* last, so nothing above overrides it: a field is never under 16px (iOS zooms on focus below that) */
  .blank .blank-input{font-size:max(16px, 1em);}

<script>

function now(){ return clockAt===null ? new Date() : new Date(clockAt); }

/* What a dish is like to eat depends on what kind of food it is, so each

/* meal slots, mirroring the five the plan already uses; each stage picks
   the ones it serves by id. slot = which foods fit (FOOD_POOL.slots). */
const MEAL_SLOTS = [
  {id:"breakfast", slot:"breakfast", label:"Breakfast", icon:"🍳", cats:["grain","fruit","protein"]},
  {id:"snack1",    slot:"snack",     label:"Snack",     icon:"🧃", cats:["protein","fruit"]},
  {id:"lunch",     slot:"lunch",     label:"Lunch",     icon:"🍽️", cats:["protein","vegetable","grain"]},

  {id:"dinner",    slot:"dinner",    label:"Dinner",    icon:"🌙", cats:["protein","vegetable","grain","fruit"]}
];

/* ---------- the child's profile: age from a birth date ----------
   Age is never stored, only the birth date; months are worked out from
   today, so the stage moves on by itself. */
function ageMonths(iso, at){
  const b = localDate(iso), n = at || now();
  if(isNaN(b)) return null;
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
/* the birth date that makes a child m months old today (same day of the
   month, clamped to the month's length) */
function birthDateFromMonths(m, at){
  const n = at || now();
  const y = n.getFullYear(), mo = n.getMonth() - m;
  const first = new Date(y, mo, 1);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const d = new Date(first.getFullYear(), first.getMonth(), Math.min(n.getDate(), days));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ageNow(){
  const m = state.profile && state.profile.birthDate ? ageMonths(state.profile.birthDate) : null;
  return m===null ? 10 : m;
}

/* ---------- meal times ----------
   Each stage has default times per slot; the family can set their own
   (profile.mealTimes), and a meal's peek can move one meal for today only
   (profile.timesToday). Times are local "HH:mm"; a meal's moment is built
   from the calendar date, so daylight-saving days land on the right hour.
   A meal is upcoming, now (from its anchor for NOW_WINDOW_MIN), earlier
   (it just loses emphasis and stays tickable; never a failure), or offered. */
const NOW_WINDOW_MIN = 60;
function hhmm(v){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || "").trim());
  return m && +m[1] < 24 && +m[2] < 60 ? [+m[1], +m[2]] : null;
}
function fmtHHMM([h, m]){ return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"); }
/* plans saved before schema 7 only had labels: Breakfast, Snack, Lunch, Snack, Dinner */
function ensureSlots(plan){
  (plan && plan.days || []).forEach(d=>{
    let seenLunch = false;
    (d.meals || []).forEach(m=>{
      if(m.label==="Lunch") seenLunch = true;
      if(m.slot && MEAL_SLOTS.some(ms=>ms.id===m.slot)) return;
      m.slot = {Breakfast:"breakfast", Lunch:"lunch", Dinner:"dinner"}[m.label] || (seenLunch ? "snack2" : "snack1");
    });
  });
  return plan;
}
const FALLBACK_TIMES = {breakfast:"08:00", snack1:"10:30", lunch:"12:30", snack2:"16:00", dinner:"19:00"};
function stageTimes(months){ return Object.assign({}, FALLBACK_TIMES, stageFor(Math.max(6, months)).times); }
/* "HH:mm" for a slot on a date: today's one-off change, then theirs, then the stage's */
function mealTime(slot, date){
  const P = state.profile, iso = isoOf(date);
  const once = P.timesToday && P.timesToday.date===iso ? P.timesToday.times[slot] : null;
  return once || (P.mealTimes || {})[slot] || stageTimes(planMonths())[slot] || "12:00";
}
function atTime(date, hm){
  const [h, m] = hhmm(hm) || [12, 0];
  return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m);
}
/* the plan a date falls in: the latest one that has started by then (a new week waits for its own start date) */
function planOn(date){ return planRecOn(state, date); }
function planDayIndex(date){
  const p = planOn(date);
  return p ? p.days.findIndex(d=>d.name===DAY_ORDER[date.getDay()]) : -1;
}
function mealStatus(m, start, t, date){
  if(m.skipped) return "skipped";
  if(mealOffered(m, date)) return "offered";
  if(t < start) return "upcoming";
  return t - start < NOW_WINDOW_MIN*60000 ? "now" : "earlier";
}
/* a day's meals in time order: {m, k (index in the day), dayIdx, plan, date, slot, time, start, status} */
function mealsOn(date){
  const plan = planOn(date), dayIdx = planDayIndex(date);
  if(dayIdx < 0) return [];
  const t = now();
  return plan.days[dayIdx].meals.map((m, k)=>({m, k, dayIdx, plan, date, slot:m.slot}))
    .filter(x=>x.m.items.length)
    .map(x=>{ x.time = mealTime(x.slot, date); x.start = atTime(date, x.time); x.status = mealStatus(x.m, x.start, t, date); return x; })
    .sort((a, b)=>a.start - b.start);
}
function tomorrowOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
/* the first meal still to come (or happening now) today, else tomorrow's first */
function nextMeal(){
  const t = now();
  const today = mealsOn(t).find(x=>x.status==="upcoming" || x.status==="now");
  if(today) return Object.assign(today, {when:"today"});
  const first = mealsOn(tomorrowOf(t))[0];
  return first ? Object.assign(first, {when:"tomorrow"}) : null;
}

/* times and dates in the reader's own locale and clock (12 or 24 h), never a fixed format */
const FMT = {};
function fmtTime(d){ return (FMT.t = FMT.t || new Intl.DateTimeFormat(undefined, {hour:"numeric", minute:"2-digit"})).format(d); }

/* is this food new to them? (only once something has been offered, so a first week isn't all "new") */
function isNewFood(item){
  const known = knownFoods();
  return known.size > 0 && !known.has(foodKey(baseName(item)));
}
const upper1 = t=>t.charAt(0).toUpperCase() + t.slice(1);
/* "Lentils and sweet potato." */
function foodsLine(m){ return upper1(listJoin(m.items.map(i=>lower1(baseName(i))))) + "."; }

/* The headline, from the clock and the plan: the first rule that applies.
   Returns {kind, headline, title, key, next, announce}; key changes only when the
   state does (so the live region speaks once, not every minute). */
function headlineNow(){
  const P = state.profile, name = P.name || "", months = ageNow();
  if(months < 6 && !P.exploreEarly) return {kind:"milk", headline:say("home.headline.milk", {name}), title:say("home.title.plain"), key:"milk"};
  if(!state.plan || !state.plan.days.some(d=>d.meals.some(m=>m.items.length))) return {kind:"empty", headline:say("home.headline.empty"), title:say("home.title.plain"), key:"empty"};
  const t = now(), today = mealsOn(t), nx = nextMeal();
  const v = x=>({meal:x.m.label, time:fmtTime(x.start)});
  if(nx && nx.when==="today"){
    if(nx.status==="now") return {kind:"now", next:nx, headline:say("home.headline.now", v(nx)), title:say("home.title.now", v(nx)), key:"now:"+nx.slot, announce:say("home.announce.now", v(nx))};
    const mins = Math.max(1, Math.ceil((nx.start - t) / 60000));
    if(mins < 60) return {kind:"soon", next:nx, headline:say("home.headline.soon", Object.assign(v(nx), {n:mins})), title:say("home.title.soon", Object.assign(v(nx), {n:mins})), key:"soon:"+nx.slot};
    return {kind:"at", next:nx, headline:say("home.headline.at", v(nx)), title:say("home.title.at", v(nx)), key:"at:"+nx.slot};
  }
  // today is over: done if every meal was offered (or skipped); otherwise just what's next
  const done = today.length > 0 && today.every(x=>x.status==="offered" || x.status==="skipped");
  if(done) return {kind:"done", next:nx, headline:say("home.headline.done"), title:nx ? say("home.title.tomorrow", v(nx)) : say("home.title.plain"), key:"done", announce:say("home.announce.done")};
  if(nx) return {kind:"tomorrow", next:nx, headline:say("home.headline.tomorrow", v(nx)), title:say("home.title.tomorrow", v(nx)), key:"tomorrow"};
  return {kind:"empty", headline:say("home.headline.empty"), title:say("home.title.plain"), key:"empty"};
}

/* a whole word or phrase inside a food name: "egg" finds "Egg, well cooked"
   but not "eggplant"; "nuts" doesn't find "peanut butter" */
function hasWord(name, phrase){
  const esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + esc + "($|[^a-z])", "i").test(name);
}

/* ---------- safety: what never goes on the plate ----------
   Locked: the user can't remove these, and the generator, swaps and
   hand-added foods all go through the same check (lockedRule). `until` is
   the age in months from which a rule stops applying; no `until` = always,
   for 0-3. `unless` words make a safe preparation pass ("grapes,
   quartered"). Ages and lists are general guidance to check with a
   paediatric source. */
const LOCKED_RULES = [
  {id:"honey", label:"Honey", until:12, words:["honey"],
   why:"Honey isn't safe before 12 months: it can carry spores a baby's tummy can't handle yet."},
  {id:"cowsmilk", label:"Cow's milk as a drink", until:12, words:["cow's milk","cows milk","cow milk","glass of milk"],
   why:"Before 12 months, cow's milk as a drink can crowd out iron. A little in cooking is fine."},
  {id:"nuts", label:"Whole nuts", words:["whole nut","whole nuts","nuts","peanuts","almonds","almond","walnut","walnuts","hazelnut","hazelnuts","cashew","cashews","pistachio","pistachios","pecans"],
   unless:["butter","ground","flour","milk"],
   why:"Whole and chopped nuts are a choking risk for little ones. Smooth nut butters are fine."},
  {id:"grapes", label:"Whole grapes", words:["grape","grapes","whole grapes","cherry tomato","cherry tomatoes"],
   unless:["quartered","halved lengthways"],
   why:"Round foods like whole grapes can block a small airway. Quarter them lengthways."},
  {id:"hardraw", label:"Hard raw chunks", words:["raw carrot","raw apple","popcorn","hard sweet","hard sweets","hard candy","boiled sweets"],
   why:"Hard raw pieces and popcorn are choking risks. Cook until soft, or grate."},
  {id:"salt", label:"Added salt", words:["salt","salted","stock cube","bouillon","soy sauce","crisps"],
   why:"Little kidneys can't handle much salt. Season the grown-up portions after you've served theirs."},
  {id:"sugar", label:"Added sugar", words:["sugar","sugary","syrup","sweets","candy","juice","biscuits","cake"],
   unless:["snap"],
   why:"No added sugar keeps their taste for real food, and their new teeth happy."},
  {id:"unpasteurised", label:"Unpasteurised foods", words:["unpasteurised","unpasteurized","raw milk","raw cheese","raw egg","runny egg","brie","camembert","blue cheese"],
   why:"Unpasteurised milk and soft mould-ripened cheeses can carry listeria. Choose pasteurised."}
];
/* the rule a food breaks at this age, or null */
function lockedRule(name, months){
  const n = String(name);
  return LOCKED_RULES.find(r=>{
    if(r.until && months >= r.until) return false;
    if(!r.words.some(w=>hasWord(n, w))) return false;
    return !(r.unless || []).some(w=>hasWord(n, w));
  }) || null;
}

/* the common allergens, with the words that give them away in a food name */
const ALLERGENS = [
  {id:"egg",       label:"Egg",            emoji:"🥚", words:["egg","eggs","omelette","mayonnaise"]},
  {id:"milk",      label:"Milk",           emoji:"🥛", words:["milk","yogurt","yoghurt","cheese","ricotta","cream","kefir"]},
  {id:"peanut",    label:"Peanut",         emoji:"🥜", words:["peanut","peanuts","groundnut"]},
  {id:"treenuts",  label:"Tree nuts",      emoji:"🌰", words:["almond","cashew","walnut","hazelnut","pistachio","pecan","nut butter"]},
  {id:"wheat",     label:"Wheat / gluten", emoji:"🌾", words:["wheat","bread","toast","pasta","couscous","flour","oat","oats","oatmeal","barley","rye"]},
  {id:"soy",       label:"Soy",            emoji:"🫘", words:["soy","soya","tofu","edamame"]},
  {id:"fish",      label:"Fish",           emoji:"🐟", words:["fish","salmon","cod","hake","tuna","sardine","mackerel"]},
  {id:"shellfish", label:"Shellfish",      emoji:"🦐", words:["shrimp","prawn","prawns","crab","lobster","mussel","mussels","clam","squid"]},
  {id:"sesame",    label:"Sesame",         emoji:"🌱", words:["sesame","tahini","hummus"]}
];
/* foods whose allergens don't show in the name */
const HIDDEN_ALLERGENS = {"Beef meatballs, soft":["egg","wheat"]};
function allergensOf(name){
  const ids = ALLERGENS.filter(a=>a.words.some(w=>hasWord(name, w))).map(a=>a.id);
  return [...new Set(ids.concat(HIDDEN_ALLERGENS[name] || []))];
}
/* Allergy is strict: the food never appears. A typed allergy ("kiwi")
   blocks foods with that word; one naming an allergen ("egg") blocks
   everything carrying it. */
function allergyMatch(name, profile){
  const own = allergensOf(name);
  if(own.some(a=>(profile.allergens||{})[a]==="avoid")) return true;
  return (profile.avoid||[]).some(x=>x.kind==="allergy" && (
    hasWord(name, x.name) || ALLERGENS.some(a=>a.words.some(w=>hasWord(x.name, w)) && own.includes(a.id))));
}
/* Dislike is soft: it just comes up less often. */
function dislikeMatch(name, profile){
  return (profile.avoid||[]).some(x=>x.kind==="dislike" && hasWord(name, x.name));
}
/* the single gate every food passes: the generator, swaps, hand-added */
function isAllowed(food, months, profile){
  if(food.min > months || (food.max && food.max < months)) return false;
  if(lockedRule(food.name, months)) return false;
  return !allergyMatch(food.name, profile);
}

}

function whyFor(item){
  const food = FOOD_POOL.find(f=>f.name===item.name);
  const m = metaOf(item.name);
  if(food && food.iron) return "Iron-rich: from about 6 months their own iron stores start running low.";

  if(item.cats[0]==="vegetable") return "Another colour on the plate" + (m.colour ? `, a ${m.colour} one.` : ".");

}

/* Marking a meal: ate it, ate some, or refused. Any mark means it was
   served, so stock goes down; all and some count for variety; every first
   mark counts as one more exposure to that food (refusal is normal and
   still counts: it can take 10-15 tries). */
/* why a hand-added food can't go on the plate, or "" */
function keepOutReason(name){
  const r = lockedRule(name, ageNow());
  if(r) return `${r.label} stays off the menu for now. ${r.why}`;
  if(allergyMatch(name, state.profile)) return `${name} is on their keep-out list, so we'll leave it off.`;
  return "";
}
/* ---------- the offer log: what was put in front of them, and how it went ----------
   Append-only: state.offers = [{id, at, date, mealId, itemId, foodId, outcome, firstOfFood, firstAllergen}].
   The Offered tick writes one event per food (outcome null); the outcome row fills it in. Undo removes the
   tick's own events. Any later change is a correction, a new event {id, at, corrects, outcome}, so history is
   never edited silently. Everything else (variety, firsts, Loved it, the allergen record, what's new) is read
   from the log; a week is just a view over it. */
const OUTCOMES = ["loved","some","not_today"];
let liveCache = null;
/* the log with corrections applied: one record per offer, its outcome the latest word on it */
function liveOffers(){
  if(liveCache && liveCache.src===state.offers && liveCache.n===state.offers.length && liveCache.v===offersVersion) return liveCache.list;
  const list = [], byId = {};
  state.offers.forEach(e=>{
    if(e.corrects){ const o = byId[e.corrects]; if(o) o.outcome = e.outcome; return; }
    const c = Object.assign({}, e); byId[e.id] = c; list.push(c);
  });
  liveCache = {src:state.offers, n:state.offers.length, v:offersVersion, list};
  return list;
}
let offersVersion = 0;
function offersChanged(){ offersVersion++; }
function offersOf(m, date){ const iso = isoOf(date || now()); return liveOffers().filter(e=>e.mealId===m.id && e.date===iso); }
function itemOffered(m, item, date){ const iso = isoOf(date || now()); return liveOffers().some(e=>e.mealId===m.id && e.date===iso && e.itemId===item.id); }
function mealOffered(m, date){ return m.items.length > 0 && m.items.every(i=>itemOffered(m, i, date)); }
/* how it went for a meal on a date: the outcome its foods share (or the first one set), else null */
function mealOutcome(m, date){ const o = offersOf(m, date).map(e=>e.outcome).filter(Boolean); return o[0] || null; }
/* every food offered at least once, by food id */
function knownFoods(){ return new Set(liveOffers().map(e=>e.foodId)); }
function offerCount(foodId){ return liveOffers().filter(e=>e.foodId===foodId).length; }

/* item: {id, name, qty, cats:[...], tex?} ; cats reference CATS keys, first = primary (used for grocery grouping).
   tex is the stage's texture for a generated dish ("mashed", "soft pieces"). */
function it(name, qty, cats, tex){ const i = {id:uid(), name, qty, cats}; if(tex) i.tex = tex; return i; }
function uid(){ return Math.random().toString(36).slice(2,10); }
/* today as YYYY-MM-DD on the local clock (toISOString is UTC: wrong day after midnight in Europe) */
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoOf(now()); }
