/* ---------- collapsible add form ----------
   One "+ Add" button that expands into its fields. Open state and typed values
   are held per form key so an unrelated re-render (ticking a checkbox, say)
   doesn't close the form or wipe what you've typed. */
const addForms = {};   // key -> {open, values}

function addFormState(key){
  return addForms[key] || (addForms[key] = {open:false, values:{}});
}

/* fields: [{name, type:"text"|"select", placeholder, full, options:[[value,label]]}] */
function addForm(key, opts){
  const st = addFormState(key);
  const wrap = document.createElement("div");
  wrap.className = "addform";

  if(!st.open){
    const toggle = document.createElement("button");
    toggle.className = "add-toggle";
    toggle.textContent = opts.label;   // the green plus circle is drawn by CSS
    toggle.addEventListener("click", ()=>{ st.open = true; opts.rerender(); });
    wrap.appendChild(toggle);
    return wrap;
  }

  const form = document.createElement("div");
  form.className = "addform-open";
  const inputs = {};

  const full = opts.fields.filter(f=>f.full);
  const rest = opts.fields.filter(f=>!f.full);

  function build(field){
    let el;
    if(field.type==="select"){
      el = document.createElement("select");
      el.setAttribute("aria-label", field.label || (field.name==="cat" ? "Food group" : field.name));
      field.options.forEach(([v,label])=>{
        const o = document.createElement("option");
        o.value = v; o.textContent = label;
        el.appendChild(o);
      });
      el.value = st.values[field.name] || field.options[0][0];
    }else{
      el = document.createElement("input");
      el.type = "text";
      el.placeholder = field.placeholder || "";
      el.setAttribute("aria-label", field.placeholder || field.name);
      el.value = st.values[field.name] || "";
      el.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    }
    if(field.full) el.className = "full";
    el.addEventListener("input", ()=>{ st.values[field.name] = el.value; });
    el.addEventListener("change", ()=>{ st.values[field.name] = el.value; });
    inputs[field.name] = el;
    return el;
  }

  full.forEach(f=>form.appendChild(build(f)));
  if(rest.length){
    const row = document.createElement("div");
    row.className = "addform-row";
    rest.forEach(f=>row.appendChild(build(f)));
    form.appendChild(row);
  }

  function close(){ st.open = false; st.values = {}; st.note = ""; }

  function submit(){
    const values = {};
    Object.entries(inputs).forEach(([k,el])=>{ values[k] = el.value.trim(); });
    const r = opts.onSubmit(values);
    if(typeof r==="string"){ st.note = r; opts.rerender(); return; }   // a calm reason, stay open
    if(r === false) return;   // validation failed, stay open
    close();
    opts.rerender();
  }

  if(st.note){
    const note = document.createElement("p");
    note.className = "form-note";
    note.setAttribute("role", "status");
    note.textContent = st.note;
    form.appendChild(note);
  }
  const actions = document.createElement("div");
  actions.className = "addform-actions";
  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "Cancel";
  cancel.addEventListener("click", ()=>{ close(); opts.rerender(); });
  const add = document.createElement("button");
  add.className = "btn primary";
  add.textContent = "Add";
  add.addEventListener("click", submit);
  actions.appendChild(cancel); actions.appendChild(add);
  form.appendChild(actions);

  wrap.appendChild(form);
  setTimeout(()=>{ const first = form.querySelector("input"); if(first) first.focus(); }, 0);
  return wrap;
}

/* ---------- view switching ---------- */
let currentDay = 0;

/* ---------- motion helpers ----------
   Rows are rebuilt on every change, so a CSS transition never sees the
   before state. Instead the one row that changed is marked (justChanged)
   and plays its entrance once; a row on its way out slides off first and
   the re-render waits for it. With reduced motion everything is instant. */
let justChanged = null;
function calm(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; }
/* Swipe to delete, the iOS list gesture: drag a row left to show Delete,
   drag it most of the way across to delete at once. Pointer events, so it
   works with touch, pen and mouse; vertical drags still scroll. */
let openSwipe = null;
function closeSwipe(){
  if(openSwipe){ const fg = openSwipe.querySelector(".row-fg"); if(fg) fg.style.transform = ""; }
  openSwipe = null;
}
function swipeable(row, label, onDelete){
  const fg = row.querySelector(".row-fg");
  const del = document.createElement("button");
  del.type = "button"; del.className = "swipe-del"; del.textContent = "Delete";
  del.setAttribute("aria-label", "Delete " + label);
  del.addEventListener("click", ()=>{ openSwipe = null; leave(row, "left", onDelete); });
  row.appendChild(del);
  let x0 = 0, y0 = 0, dx = 0, base = 0, id = null, horiz = null;
  const set = v=>{ fg.style.transform = v ? `translateX(${v}px)` : ""; };
  fg.addEventListener("pointerdown", e=>{
    if(e.button>0 || e.target.closest("input,select,.buy-chip,.swipe-del")) return;   // taps on controls stay taps
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = null;
    base = openSwipe===row ? -88 : 0;
    if(openSwipe && openSwipe!==row) closeSwipe();
  });
  fg.addEventListener("pointermove", e=>{
    if(e.pointerId!==id) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(horiz===null){
      if(Math.abs(mx)<6 && Math.abs(my)<6) return;
      horiz = Math.abs(mx) > Math.abs(my);
      if(horiz){ row.classList.add("dragging"); fg.setPointerCapture(id); }
    }
    if(!horiz) return;
    dx = Math.min(0, base + mx);
    set(dx);
  });
  const end = e=>{
    if(e.pointerId!==id) return;
    id = null; row.classList.remove("dragging");
    if(!horiz) return;
    if(dx < -row.offsetWidth*0.6){   // a full swipe deletes
      set(-row.offsetWidth); openSwipe = null;
      return setTimeout(onDelete, calm() ? 0 : 200);
    }
    if(dx < -44){ set(-88); openSwipe = row; }
    else{ set(0); if(openSwipe===row) openSwipe = null; }
  };
  fg.addEventListener("pointerup", end);
  fg.addEventListener("pointercancel", end);
  // the click that ends a drag mustn't tick the row's checkbox
  fg.addEventListener("click", e=>{ if(horiz){ e.preventDefault(); e.stopPropagation(); horiz = null; } }, true);
}
function leave(el, side, then){
  if(calm()) return then();
  el.classList.add(side==="left" ? "leaving-l" : "leaving-r");
  setTimeout(then, 220);
}

/* ---------- PLAN RENDER ---------- */
/* Plan days stay in their canonical Mon–Sun order (grocery badges depend on it);
   only the tab strip is rotated so today leads. */
function dayDisplayOrder(){
  const days = state.plan.days;
  const start = days.findIndex(d=>d.name===DAY_ORDER[new Date().getDay()]);
  if(start < 0) return days.map((_,i)=>i);   // custom plan with no matching day name
  return days.map((_,k)=>(start+k)%days.length);
}

/* ---------- calendar ----------
   The plan is a week that starts again on the weekday it was started (the day
   it was applied, or "Start new week"), so what's left of it runs from today
   up to the day before that weekday comes round again. */
function localDate(iso){
  const [y,m,d] = String(iso).split("-").map(Number);
  return new Date(y, m-1, d);
}
function daysLeftInWeek(){
  const start = localDate(state.weekStarted);
  const anchor = isNaN(start) ? new Date().getDay() : start.getDay();
  return ((anchor - new Date().getDay() + 7) % 7) || 7;
}

/* The plan's days in display order lead with today, so position k is k days from now. */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateForDay(idx){
  const pos = dayDisplayOrder().indexOf(idx);
  const d = new Date();
  d.setDate(d.getDate() + (pos<0 ? 0 : pos));
  return d;
}
function formatDate(d){
  return DAY_ORDER[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
}

function haveChip(c, name){
  if(!c) return "";   // eaten: nothing left to check
  if(c.have) return `<span class="have-chip">At home</span>`;
  const pack = c.buy===null ? null : buyPacks(name, c.buy);
  return `<button type="button" class="buy-chip" data-buy aria-label="Mark ${name} bought${pack ? ", " + pack.label : ""}">${pack ? "Buy " + pack.short : "Buy"}</button>`;
}

/* Every change to the plan ends here: the fan, whatever sheet is open, and
   the home cards follow along. */

/* A tiny celebration: six leaves and sparkles burst from a point and
   settle (transform and opacity only, 600 ms, never in the way of a tap).
   With reduced motion, nothing moves; the words carry the moment. */
function burst(from){
  if(calm() || !from || !from.getBoundingClientRect) return;
  const r = from.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
  const layer = document.createElement("div");
  layer.className = "burst"; layer.setAttribute("aria-hidden", "true");
  layer.style.left = x + "px"; layer.style.top = y + "px";
  const shapes = ["leaf","dot","leaf","star","leaf","dot"];
  shapes.forEach((sh, k)=>{
    const p = document.createElement("i");
    p.className = "bp " + sh;
    layer.appendChild(p);
    const a = (k/shapes.length)*Math.PI*2 - Math.PI/2 + (Math.random()-.5)*.5, d = 26 + Math.random()*18;
    p.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:0},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d*.6}px), calc(-50% + ${Math.sin(a)*d*.6}px)) scale(1) rotate(${k*40}deg)`, opacity:1, offset:.35},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d + 8}px)) scale(.6) rotate(${k*70}deg)`, opacity:0}
    ], {duration:620, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"});
  });
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 700);
}
/* a light tap of the phone where it's supported (never on its own) */
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

/* a quiet line for screen readers after a mark ("Lunch: ate it") */

/* a similar food for the same meal, still passing every safety check */
function swapItem(m, k){
  const item = m.items[k], months = planMonths(), st = stageFor(months);
  const slot = SLOT_OF[m.label] || "lunch";
  const taken = new Set(m.items.map(i=>i.name));
  const pool = FOOD_POOL.filter(f=>f.cats[0]===item.cats[0] && f.slots.includes(slot) && !taken.has(f.name) && isAllowed(f, months, state.profile));
  if(!pool.length) return false;
  const ctx = planContext(months, state.profile), dayCtx = {taken:new Set(), colours:new Set(), newCount:0};
  const ws = pool.map(f=>weightFor(f, ctx, dayCtx));
  let r = Math.random() * ws.reduce((a,b)=>a+b, 0), j = 0;
  for(; j<ws.length-1; j++){ r -= ws[j]; if(r <= 0) break; }
  if(item.eaten){ setAte(item, null); }   // put back what it took from stock
  const fresh = dish(pool[j], st);
  m.items[k] = fresh;
  justChanged = fresh.id;
  save();
  return true;
}

/* ---------- GROCERY ---------- */
/* the days a shopping window covers: today, the next three, or what's left
   of the planned week (the calendar's band) */
function windowDays(key){
  const order = dayDisplayOrder();
  const n = key==="today" ? 1 : key==="next3" ? 3 : Math.min(daysLeftInWeek(), order.length);
  return new Set(order.slice(0, n).map(i=>state.plan.days[i].name));
}
/* ---------- KITCHEN: what to buy for the window, what's at home ----------
   Only stock and extras are stored. What to buy is worked out on every
   render: the plan's portions not yet eaten, on the window's days, minus
   what's at home. Quantities count when they're in grams ("50 g"); a food
   with no gram amount is just needed, or covered once it's at home. */
function foodKey(name){ return String(name).trim().toLowerCase(); }
function gramsOf(qty){
  const m = String(qty||"").match(/^\s*(\d+(?:[.,]\d+)?)\s*g\b/i);
  return m ? parseFloat(m[1].replace(",", ".")) : null;
}
function fmtG(g){
  if(g < 1000) return Math.round(g) + " g";
  return (Math.round(g/100)/10).toString().replace(/\.0$/, "") + " kg";
}

/* ---------- packs ----------

const PACK_ALIAS = {"oats":"oatmeal", "pasta":"whole wheat pasta", "cucumber sticks":"cucumber",
  "smooth peanut butter":"peanut butter"};
/* "Carrots, soft-cooked" shops as carrots: the preparation after the comma doesn't change the pack */
function packFor(name){
  const base = foodKey(name).split(",")[0].trim();
  return PACKS[PACK_ALIAS[base] || base] || null;
}
/* whole packs covering a shortfall in grams; a food with no known pack
   rounds up to the next 100 g */
function buyPacks(name, grams){
  const p = packFor(name);
  if(!p){ const g = Math.max(100, Math.ceil(grams/100)*100); return {g, label:fmtG(g), short:fmtG(g)}; }
  const n = Math.max(1, Math.ceil((grams - 0.5) / p.g));
  return {g:n*p.g, label:(n>1 ? n+" × " : "") + p.label, short:(n>1 ? n+" × " : "") + p.short};
}
function shortDay(name){ return name.slice(0,3); }
const CAT_ORDER = ["protein","vegetable","fruit","grain","fat","other"];

function needOn(daySet){
  const need = {};
  state.plan.days.forEach(day=>{
    if(daySet && !daySet.has(day.name)) return;
    day.meals.forEach(m=>m.items.forEach(item=>{
      if(item.eaten) return;
      const k = foodKey(item.name);
      const n = need[k] || (need[k] = {key:k, name:item.name, cat:item.cats[0]||"other", g:0, days:[]});
      n.g += gramsOf(item.qty) || 0;
      if(!n.days.includes(day.name)) n.days.push(day.name);
    }));
  });
  return need;
}

/* grams still to buy (0 = covered); null = needed, no amount to go on */
function toBuy(n){
  const st = state.stock[n.key];
  if(st && (st.plenty || st.g===null)) return 0;
  if(n.g===0) return st && st.g>0 ? 0 : null;
  return Math.max(0, Math.ceil(n.g - (st ? st.g : 0)));
}

/* walks the plan from today: the first day this food falls short, and the
   last day it's needed at all */
function shortfall(key){
  const st = state.stock[key];
  const measured = !(st && (st.plenty || st.g===null));
  let left = st && measured ? st.g : 0, short = null, last = null;
  for(const idx of dayDisplayOrder()){
    const day = state.plan.days[idx];
    let g = 0;
    day.meals.forEach(m=>m.items.forEach(i=>{ if(!i.eaten && foodKey(i.name)===key) g += gramsOf(i.qty) || 0; }));
    if(!g) continue;
    last = day.name;
    left -= g;
    if(measured && !short && left < -0.5) short = day.name;
  }
  return {short, last};
}

function homeStatus(key){
  const st = state.stock[key];
  if(st.plenty) return {text:"plenty"};
  const {short, last} = shortfall(key);
  if(!last) return {text:"not in this week's plan"};
  if(st.g===null) return {text:"needed this week"};
  if(!short) return {text:lastsFor(key, st.g)};
  const today = short===DAY_ORDER[new Date().getDay()];
  return {text: today ? "runs out today" : "runs out " + shortDay(short), low:true};
}

/* A pack outlives the week, so say roughly how long: grams at home over
   what a whole week of the plan uses. */
function lastsFor(key, g){
  let perWeek = 0;
  state.plan.days.forEach(day=>day.meals.forEach(m=>m.items.forEach(i=>{ if(foodKey(i.name)===key) perWeek += gramsOf(i.qty) || 0; })));
  const weeks = perWeek ? g / perWeek : Infinity;
  if(weeks < 2) return "enough for the week";
  if(weeks < 4) return "lasts about " + Math.floor(weeks) + " weeks";
  if(weeks < 6) return "lasts about a month";
  return "lasts over a month";
}

/* For every dish not yet eaten, from today on: covered by what's at home,
   or how much is missing for this portion. Stock is spent in plan order, so
   100 g of oatmeal at 40 g a day covers two days and leaves 20 g of the third
   to buy. Plenty, or a "have" with no amount, always covers. */
function coverOnPlan(){
  const left = {}, out = {};
  for(const idx of dayDisplayOrder()){
    state.plan.days[idx].meals.forEach(m=>m.items.forEach(item=>{
      if(item.eaten) return;
      const k = foodKey(item.name), st = state.stock[k];
      if(st && (st.plenty || st.g===null)){ out[item.id] = {have:true}; return; }
      const g = gramsOf(item.qty);
      if(g===null){ out[item.id] = st && st.g>0 ? {have:true} : {buy:null}; return; }
      if(!(k in left)) left[k] = st ? st.g : 0;
      if(left[k] >= g - 0.5){ left[k] -= g; out[item.id] = {have:true}; }
      else{ out[item.id] = {buy: Math.ceil(g - Math.max(0, left[k]))}; left[k] = 0; }
    }));
  }
  return out;
}

/* Eating takes the portion out of what's at home; un-ticking puts back
   exactly what was taken (item.took), even if stock had hit zero. Plenty,
   unmeasured stock and quantities not in grams are left alone. */
function useStock(item){
  const st = state.stock[foodKey(item.name)];
  if(item.eaten){
    const g = gramsOf(item.qty);
    if(!st || st.plenty || st.g===null || g===null){ delete item.took; return; }
    item.took = Math.min(st.g, g);
    st.g -= item.took;
  }else{
    if(st && st.g!==null && item.took) st.g += item.took;
    delete item.took;
  }
}

function addToStock(key, name, grams){
  const st = state.stock[key];
  if(grams===null) state.stock[key] = st || {name, g:null, plenty:false};
  else state.stock[key] = {name, g:(st && st.g>0 ? st.g : 0) + grams, plenty:false};
  save();
}

let editingStock = null;   // the At home row whose amount is open for editing

      const inp = row.querySelector("input[type=text]");

        editingStock = null; save(); renderKitchen();

      state.stock[k] = {name: st ? st.name : v.name, g: g!==null ? g : (st ? st.g : null), plenty:false};

/* ---------- VARIETY ---------- */
function eatenFoodNamesThisWeek(){
  const set = new Set();
  state.plan.days.forEach(day=>{
    day.meals.forEach(m=>{
      m.items.forEach(item=>{
        if(item.ate==="all" || item.ate==="some") set.add(item.name.trim().toLowerCase());
      });
    });
  });
  return set;
}

function isCovered(cat, food){
  const manualKey = cat+"::"+food;
  if(state.manualCovered[manualKey]) return true;
  return eatenFoodNamesThisWeek().has(food.trim().toLowerCase());
}

function toggleManual(cat, food){
  const key = cat+"::"+food;
  if(eatenFoodNamesThisWeek().has(food.trim().toLowerCase())){
    // it's auto-covered by an eaten item; manual toggle would only act as an "un-cover" which we don't support to avoid confusion
    return;
  }
  state.manualCovered[key] = !state.manualCovered[key];
  save(); renderVariety();
}

/* A checklist food the child is too young for (by the food pool's minimum
   age) waits until they reach it; foods the pool doesn't know always show. */
function suitableNow(food){
  if(!stageNow().solids) return true;
  const t = food.trim().toLowerCase();
  const match = FOOD_POOL.find(f=>{
    const n = f.name.toLowerCase();
    return n===t || n.startsWith(t+",") || n.startsWith(t+" ") || n.endsWith(" "+t);
  });
  return !match || match.min <= ageNow();
}
function varietyNow(){
  const out = {};
  Object.entries(state.variety).forEach(([cat, foods])=>{ out[cat] = foods.filter(suitableNow); });
  return out;
}

function renderVariety(){ refreshSheet(); renderSummaries(); }

/* past weeks: a soft bar each, the number only for screen readers (no
   percentages on show, nothing that reads like a grade) */
function renderHistory(wrap){
  if(!state.history || state.history.length===0){
    wrap.innerHTML = `<p class="empty">${CONTENT.pastWeeks}</p>`;
    return;
  }
  wrap.innerHTML = "";
  state.history.slice().reverse().forEach(h=>{
    const row = document.createElement("div");
    const d = localDate(h.weekOf);
    row.className = "history-row";
    row.innerHTML = `<span>Week of ${isNaN(d) ? h.weekOf : MONTHS[d.getMonth()] + " " + d.getDate()}</span>`
      + `<span class="history-bar" role="img" aria-label="${h.overallPct} percent of the checklist tasted"><i style="--w:${Math.max(4, h.overallPct)}%"></i></span>`;
    wrap.appendChild(row);
  });
}

function startNewWeek(){
  // compute this week's overall pct for history before clearing
  let totalItems=0, totalCovered=0;
  Object.entries(varietyNow()).forEach(([cat, foods])=>{
    totalItems += foods.length;
    totalCovered += foods.filter(f=>isCovered(cat,f)).length;
  });
  const overallPct = totalItems? Math.round(100*totalCovered/totalItems) : 0;
  state.history.push({ weekOf: state.weekStarted, overallPct });

  // reset eaten flags + manual covers + ticked extras (stock stays: the food is still at home)
  state.plan.days.forEach(day=>day.meals.forEach(m=>m.items.forEach(item=>{ item.eaten=false; item.ate=null; delete item.took; })));
  state.manualCovered = {};
  state.extras.forEach(x=>x.checked=false);
  state.weekStarted = todayISO();
  currentDay = dayDisplayOrder()[0];   // the new week starts today

  save();
  renderDayContent();
  renderKitchen();
  renderVariety();
}

/* ---------- CREATE: generate a week of age-appropriate menus ---------- */
let draft = null;   // preview only — deliberately never written to state until applied

function stageNow(){ return stageFor(ageNow()); }

function eligibleFoods(months, profile){
  return FOOD_POOL.filter(f=>isAllowed(f, months, profile));
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Deals foods by weight: priorities, dislikes and what's at home tilt the
   odds, and each use makes a food less likely next time, so the week still
   spreads out. A food already on today's plates is skipped while there's
   anything else. */
function weightFor(f, ctx, day){
  const P = ctx.priorities, m = metaOf(f.name), key = foodKey(f.name.split(",")[0]);
  let w = 1;
  // strong enough to see in a week: each meal only draws from its own food
  // groups and repeats are penalised, which dilutes any single weight
  if(dislikeMatch(f.name, ctx.profile)) w *= .3;
  if(P.has("iron") && f.iron) w *= 4;
  if(P.has("colours") && m.colour && !day.colours.has(m.colour)) w *= 2.5;
  if(P.has("quick")) w *= m.quick ? 2.5 : .35;
  if(P.has("batch") && m.freezes) w *= 2.5;
  if(P.has("finger") && ctx.finger && /finger|strips|pieces|bite-size/.test(textureFor(f, ctx.st) || "")) w *= 2.5;
  if(P.has("athome") && ctx.atHome.has(key)) w *= 4;
  if(P.has("affordable")) w *= m.cost==="low" ? 2.5 : m.cost==="high" ? .2 : 1;
  if(P.has("gentle")){
    if(ctx.known.has(key)) w *= 3;
    else if(day.newCount >= 1) w *= .05;   // one new taste a day is plenty
  }
  return w;
}
function makeDealer(foods, ctx){
  const uses = {};
  return function deal(cat, slot, day){
    const fits = foods.filter(f=>f.cats[0]===cat && f.slots.includes(slot));
    const cands = fits.filter(f=>!day.taken.has(f.name));
    const pool = cands.length ? cands : fits;
    if(!pool.length) return null;
    const ws = pool.map(f=>weightFor(f, ctx, day) / (1 + 1.2*(uses[f.name] || 0)));
    let r = Math.random() * ws.reduce((a,b)=>a+b, 0), k = 0;
    for(; k<ws.length-1; k++){ r -= ws[k]; if(r <= 0) break; }
    const f = pool[k];
    uses[f.name] = (uses[f.name] || 0) + 1;
    day.taken.add(f.name);
    const m = metaOf(f.name);
    if(m.colour) day.colours.add(m.colour);
    if(ctx.priorities.has("gentle") && !ctx.known.has(foodKey(f.name.split(",")[0]))) day.newCount++;
    return f;
  };
}

function portionFor(food, st){
  return (st.portions[food.cats[0]] || 30) + " g";
}
function dish(food, st){ return it(food.name, portionFor(food, st), food.cats, textureFor(food, st)); }

/* Near-family weeks keep three familiar grains (one for breakfast, two for
   lunch and dinner) so each plate has a staple next to anything new. */
function withStaples(foods){
  const grains = foods.filter(f=>f.cats[0]==="grain");
  const bfast = shuffled(grains.filter(f=>f.slots.includes("breakfast"))).slice(0,1);
  const main = shuffled(grains.filter(f=>!bfast.includes(f) && (f.slots.includes("lunch") || f.slots.includes("dinner")))).slice(0,2);
  const keep = new Set(bfast.concat(main));
  return foods.filter(f=>f.cats[0]!=="grain" || keep.has(f));
}

/* what generation knows about this household right now */
function planContext(months, profile){
  const st = stageFor(months);
  const atHome = new Set(Object.entries(state.stock || {})
    .filter(([,x])=>x.plenty || x.g===null || x.g>0).map(([k])=>k.split(",")[0].trim()));
  const known = new Set(Object.keys(state.exposures || {}));
  (state.plan ? state.plan.days : []).forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{
    if(i.ate==="all" || i.ate==="some") known.add(foodKey(baseName(i)));
  })));
  return {st, profile, priorities:new Set(profile.priorities || []), atHome, known,
          finger:["textures","family","nearfamily"].includes(st.id)};
}

/* null when the stage has no solids: there is no menu to make yet */
function generateWeek(months, profile){
  const ctx = planContext(months, profile);
  const st = ctx.st;
  if(!st.solids) return null;
  let foods = eligibleFoods(months, profile);
  if(st.picky) foods = withStaples(foods);
  const deal = makeDealer(foods, ctx);
  const slots = MEAL_SLOTS.filter(ms=>st.slots.includes(ms.id));

  const days = DAY_ORDER.slice(1).concat(DAY_ORDER[0]).map(name=>{   // Monday..Sunday
    const day = {taken:new Set(), colours:new Set(), newCount:0};
    const meals = slots.map(ms=>{
      const items = [];
      (st.perMeal ? ms.cats.slice(0, st.perMeal) : ms.cats).forEach(cat=>{
        const food = deal(cat, ms.slot, day);
        if(food) items.push(dish(food, st));
      });
      return meal(ms.label, ms.icon, items);
    });
    return {name, meals};
  });

  const week = {days};
  // batch-cook: Monday's and Thursday's dinners come round again two days later
  if(ctx.priorities.has("batch")){
    [[0,2],[3,5]].forEach(([from, to])=>{
      const src = days[from].meals.find(m=>m.label==="Dinner");
      const k = days[to].meals.findIndex(m=>m.label==="Dinner");
      if(!src || k<0) return;
      const copy = meal(src.label, src.icon, src.items.map(i=>it(i.name, i.qty, i.cats.slice(), i.tex)));
      copy.from = days[from].name;   // "from Monday's batch"
      days[to].meals[k] = copy;
    });
  }
  ensureIron(week, foods, st);
  return week;
}

/* Babies and toddlers need iron daily, so guarantee at least one iron-rich
   item per day by swapping the lunch protein where a day comes up short. */
function ensureIron(week, foods, st){
  const ironNames = new Set(foods.filter(f=>f.iron).map(f=>f.name));
  const ironLunch = foods.filter(f=>f.iron && f.slots.includes("lunch") && f.cats[0]==="protein");
  if(ironLunch.length===0) return;
  week.days.forEach(day=>{
    const has = day.meals.some(m=>m.items.some(i=>ironNames.has(i.name)));
    if(has) return;
    const lunch = day.meals.find(m=>m.label==="Lunch");
    if(!lunch) return;
    const slot = lunch.items.findIndex(i=>i.cats[0]==="protein");
    const pick = ironLunch[Math.floor(Math.random()*ironLunch.length)];
    const item = dish(pick, st);
    if(slot>=0) lunch.items[slot] = item; else lunch.items.unshift(item);
  });
}

/* ---------- CREATE: preview stats ---------- */
function draftStats(){
  const names = new Set(), ironNames = new Set(FOOD_POOL.filter(f=>f.iron).map(f=>f.name));
  let ironDays = 0;
  draft.days.forEach(day=>{
    let dayIron = false;
    day.meals.forEach(m=>m.items.forEach(i=>{
      names.add(i.name);
      if(ironNames.has(i.name)) dayIron = true;
    }));
    if(dayIron) ironDays++;
  });
  // what the variety checklist would reach if every generated food were eaten
  let totalFoods = 0, covered = 0;
  const lower = new Set([...names].map(n=>n.toLowerCase()));
  Object.values(state.variety).forEach(foods=>{
    totalFoods += foods.length;
    covered += foods.filter(f=>{
      const t = f.trim().toLowerCase();
      return [...lower].some(n=>n===t || n.startsWith(t+",") || t.startsWith(n.split(",")[0]));
    }).length;
  });
  return {
    distinct: names.size,
    ironDays,
    coverage: totalFoods ? Math.round(100*covered/totalFoods) : 0
  };
}

/* ---------- CREATE: render ---------- */
function renderCreate(){
  renderCreateControls();
  renderCreatePreview();
}

function renderCreateControls(){
  const months = ageNow(), st = stageNow();

  const sum = document.getElementById("stageSummary");
  sum.textContent = stageSummary(st);
  sum.hidden = !st.solids;   // the milk-only note below already says it

  // under six months there is nothing to plan: a calm note instead of controls
  const milk = document.getElementById("milkState");
  document.getElementById("solidsControls").hidden = !st.solids;
  milk.hidden = st.solids;
  if(!st.solids){
    const left = 6 - months;
    milk.innerHTML = `<p class="big">No solids yet, milk is all they need.</p>
      <p>Come back around 6 months${left===1 ? ", in about a month" : `, in about ${left} months`}.</p>`;

  // priorities: up to three, and a line saying how they steer the plan
  const pWrap = document.getElementById("priorityChips");

      save(); draft = null; renderCreate();
    });

  if(st.solids){
    document.getElementById("createBanner").textContent =
      `At ${ageLabel(months)}, foods are ${st.textureShort}; portions are ${st.portionHint}. ${st.note} `
      + `No added salt or sugar, and nothing served whole that could block a small airway. General guidance `
      + `only; check allergen introduction and anything you're unsure about with your paediatrician.`;

  const gen = document.getElementById("generateBtn");

/* ---------- sheets ----------
   One dialog shows every detail. showSheet() opens it (or, when it's
   already open, goes one view deeper with a Back); views re-render in place
   when the plan changes, keeping scroll and focus. Shop and Plan are panels
   with their own renderers: they move in while shown and back out after. */
const sheetEl = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
let sheetStack = [], sheetOpener = null, sheetOpenerKey = null;
const PARTS = {shop:"part-shop", plan:"part-plan"};
function setSheetTitle(t){ document.getElementById("sheetTitle").textContent = t; }
const wideSheet = ()=>matchMedia("(min-width:768px)").matches;

function showSheet(kind, arg){
  if(sheetEl.open){ unmountParts(); sheetStack.push({kind, arg}); renderSheet(1); return; }
  sheetOpener = document.activeElement;
  // a redraw may replace the opener (a fan tile), so remember how to find it again
  sheetOpenerKey = sheetOpener ? (sheetOpener.id ? "#" + sheetOpener.id : sheetOpener.dataset.k ? `[data-k="${sheetOpener.dataset.k}"]` : null) : null;
  sheetStack = [{kind, arg}];
  renderSheet(0);
  sheetEl.showModal();
  document.getElementById("sheetTitle").focus({preventScroll:true});   // start on the title, not the close button
  sheetEl.style.transform = "";
  if(calm()) sheetEl.animate([{opacity:0},{opacity:1}], {duration:180});
  else sheetEl.animate(wideSheet() ? [{transform:"scale(.96)", opacity:0}, {transform:"none", opacity:1}]
                                   : [{transform:"translateY(100%)"}, {transform:"none"}],
                       {duration: wideSheet() ? 260 : 420, easing:"cubic-bezier(.32,1.2,.5,1)"});
  enterStagger();
}
function backSheet(){
  if(sheetStack.length < 2) return closeSheet();
  unmountParts(); sheetStack.pop(); renderSheet(-1);
}
function closeSheet(){
  if(!sheetEl.open) return;
  const done = ()=>{
    unmountParts(); sheetEl.close(); sheetStack = []; sheetEl.style.transform = "";
    const back = sheetOpener && document.contains(sheetOpener) ? sheetOpener : sheetOpenerKey ? document.querySelector(sheetOpenerKey) : null;
    if(back) back.focus({preventScroll:true});
  };
  if(calm()){ done(); return; }
  // exits are quicker than entrances
  const from = sheetEl.style.transform || "none";
  const a = sheetEl.animate(wideSheet() ? [{opacity:1}, {transform:"scale(.97)", opacity:0}]
                                        : [{transform:from}, {transform:"translateY(100%)"}],
                            {duration: wideSheet() ? 150 : 220, easing:"cubic-bezier(.4,0,1,1)", fill:"forwards"});
  a.onfinish = ()=>{ done(); a.cancel(); };
}
function unmountParts(){
  Object.values(PARTS).forEach(id=>{
    const el = document.getElementById(id);
    if(el.parentElement!==document.getElementById("parts")) document.getElementById("parts").appendChild(el);
  });
}
function enterStagger(){
  if(calm()) return;
  sheetBody.classList.remove("enter"); void sheetBody.offsetWidth; sheetBody.classList.add("enter");
  setTimeout(()=>sheetBody.classList.remove("enter"), 600);
}
function renderSheet(dir){
  const top = sheetStack[sheetStack.length-1];
  document.getElementById("sheetBack").hidden = sheetStack.length < 2;
  sheetBody.innerHTML = "";
  if(PARTS[top.kind]){
    sheetBody.appendChild(document.getElementById(PARTS[top.kind]));
    if(top.kind==="shop"){ setSheetTitle("Shop"); renderKitchen(); }
    if(top.kind==="plan"){ setSheetTitle("Plan next week"); renderCreate(); }
  }else{
    ({meal:renderMealSheet, week:renderWeekSheet, variety:renderVarietySheet, group:renderGroupSheet,
      settings:renderSettingsSheet})[top.kind](sheetBody, top.arg || {});
  }
  if(dir){
    sheetBody.scrollTop = 0;
    if(!calm()) sheetBody.animate([{transform:`translateX(${dir*32}px)`, opacity:0}, {transform:"none", opacity:1}],
                                  {duration:280, easing:"cubic-bezier(.32,1.2,.5,1)"});
    else sheetBody.animate([{opacity:0},{opacity:1}], {duration:160});
  }
}
/* the plan changed: redraw the view on show, keeping scroll and focus */
function refreshSheet(){
  if(!sheetEl.open || !sheetStack.length) return;
  const top = sheetStack[sheetStack.length-1];
  if(PARTS[top.kind]) return;   // Shop and Plan redraw themselves
  const y = sheetBody.scrollTop, rail = sheetBody.querySelector(".days-rail");
  const railX = rail ? rail.scrollLeft : 0;
  const focusKey = document.activeElement && sheetBody.contains(document.activeElement) ? document.activeElement.dataset.k : null;
  renderSheet(0);
  sheetBody.scrollTop = y;
  const r2 = sheetBody.querySelector(".days-rail"); if(r2) r2.scrollLeft = railX;
  if(focusKey){ const f = sheetBody.querySelector(`[data-k="${focusKey}"]`); if(f) f.focus({preventScroll:true}); }
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("sheetBack").addEventListener("click", backSheet);
sheetEl.addEventListener("cancel", e=>{ e.preventDefault(); closeSheet(); });   // Escape
sheetEl.addEventListener("click", e=>{ if(e.target===sheetEl) closeSheet(); });   // a tap on the backdrop
/* drag the handle (or the header) down to dismiss */
(function(){
  let y0 = null, dy = 0, id = null;
  const start = e=>{ if(wideSheet() || e.target.closest("button")) return; y0 = e.clientY; dy = 0; id = e.pointerId; e.currentTarget.setPointerCapture(id); };
  const move = e=>{ if(e.pointerId!==id || y0===null) return; dy = Math.max(0, e.clientY - y0); sheetEl.style.transform = `translateY(${dy}px)`; };
  const end = e=>{
    if(e.pointerId!==id || y0===null) return;
    y0 = null; id = null;
    if(dy > 110) closeSheet();
    else{
      const from = sheetEl.style.transform; sheetEl.style.transform = "";
      if(from && !calm()) sheetEl.animate([{transform:from}, {transform:"none"}], {duration:300, easing:"cubic-bezier(.32,1.2,.5,1)"});
    }
  };
  ["sheetGrab","sheetHead"].forEach(i=>{
    const el = document.getElementById(i);
    el.addEventListener("pointerdown", start); el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  });
})();

/* ---------- voice: every string lives in content.js (CONTENT, pick, say) ---------- */
function dayPart(d){
  const h = (d || new Date()).getHours();
  return h>=5 && h<12 ? "morning" : h>=12 && h<18 ? "afternoon" : "evening";
}
const STAGE_NEWS = {
  first:"First tastes can begin: smooth purées and soft finger foods.",
  textures:"Lumpier textures and finger foods are on the table.",
  family:"Whole milk and more family foods are on the table.",
  nearfamily:"Bite-size family meals now, and a say in what goes on the plate."
};
const DAY_FULL = d=>DAY_ORDER[d.getDay()];

/* the one inspiring line under the fan, from today's own menu */
function heroLine(day){
  const by = l=>day.meals.find(m=>m.label===l && m.items.length);
  const bf = by("Breakfast"), lu = by("Lunch"), di = by("Dinner");
  const lines = [];
  const main = m=>dishName(m, {afters:false});   // the dish itself, without the fruit after
  if(di && di.from) lines.push(`${main(di)} again tonight, straight from ${di.from}'s batch.`);
  if(di && di.items.some(i=>metaOf(i.name).freezes && i.cats[0]!=="fruit")) lines.push(`${main(di)} tonight, and yes, it freezes beautifully.`);
  if(lu && lu.items.some(i=>(FOOD_POOL.find(f=>f.name===i.name)||{}).iron)) lines.push(`${main(lu)} for lunch: a lovely little iron boost.`);
  const fresh = day.meals.flatMap(m=>m.items).find(i=>!state.exposures[foodKey(baseName(i))]);
  if(fresh && Object.keys(state.exposures).length) lines.push(`Something new today: ${lower1(baseName(fresh))}. One curious taste is a win.`);
  if(bf) lines.push(`${dishName(bf)} to start the day.`);
  if(lu && !lines.length) lines.push(`${dishName(lu, {afters:false})} for lunch today.`);
  const items = day.meals.flatMap(m=>m.items);
  if(items.length && items.every(i=>i.ate)) return pick(CONTENT.dayDone, "done");
  if(!state.history.length && !Object.keys(state.exposures).length && state.profile.onboarded && lines.length<2) lines.push(pick(CONTENT.firstLaunch, "first"));
  return lines.length ? pick(lines, "hero") : "";
}

function renderHome(){
  const P = state.profile, name = P.name || "your little one", months = ageNow(), st = stageNow();

  // greeting
  document.getElementById("helloTime").textContent = pick(CONTENT.greet[dayPart()], dayPart()) + ",";
  document.getElementById("helloName").textContent = P.name || "little one";
  document.getElementById("ageChip").textContent = ageLabel(months);
  document.getElementById("profileBtn").textContent = (P.name || "·").trim().charAt(0).toUpperCase();

  // notices: a stage change on the birthday-month boundary, a reminder that came due
  const notes = document.getElementById("notices");
  notes.innerHTML = "";
  if(P.lastStage===null || P.lastStage===undefined){ P.lastStage = st.id; save(); }
  const notice = (text, label, act)=>{
    const n = document.createElement("section");
    n.className = "hcard notice";
    n.innerHTML = `<p>${text}</p><div class="row"><button type="button" class="pill">${label}</button><button type="button" class="link-btn">Not now</button></div>`;
    n.querySelector(".pill").addEventListener("click", act);
    return n;
  };
  if(P.remindAt && todayISO() >= P.remindAt && months >= 6){
    notes.appendChild(notice(`${P.name || "Your little one"} is ${ageLabel(months)}: ready for first tastes?`, "Plan a first week",
      ()=>{ P.remindAt = null; save(); openOnboarding(6); }));
    notes.lastChild.querySelector(".link-btn").addEventListener("click", ()=>{ P.remindAt = null; save(); renderHome(); });
  }else if(P.lastStage!==st.id && st.solids){
    notes.appendChild(notice(`${P.name || "Your little one"} is ${ageLabel(months)}. ${STAGE_NEWS[st.id] || ""} Update the plan?`, "Update the plan",
      ()=>{ P.lastStage = st.id; save(); openOnboarding(6); }));
    notes.lastChild.querySelector(".link-btn").addEventListener("click", ()=>{ P.lastStage = st.id; save(); renderHome(); });
  }

  // Today: the fan and one line, or a calm word when there's nothing to fan
  const dayIdx = dayDisplayOrder()[0], day = state.plan.days[dayIdx];
  const line = document.getElementById("heroLine"), fan = document.getElementById("todayFan");
  const old = document.querySelector("#hero .pill");
  if(old) old.remove();
  if(months < 6 && !P.exploreEarly){
    fan.innerHTML = sampleFan(["🍼"]).replace(/^<div[^>]*>|<\/div>$/g, "");   // just the tile, no second fan
    const at = P.remindAt ? localDate(P.remindAt) : null;
    line.textContent = `Milk is all ${name} needs right now.` + (at ? ` First tastes come around ${MONTHS[at.getMonth()]} ${at.getDate()}.` : "");
  }else if(!day || !day.meals.some(m=>m.items.length)){
    fan.innerHTML = "";
    line.textContent = CONTENT.empty;
    const b = document.createElement("button");
    b.type = "button"; b.className = "pill"; b.textContent = "Set the table";
    b.addEventListener("click", ()=>openOnboarding(6));
    document.getElementById("hero").appendChild(b);
  }else{
    line.textContent = heroLine(day);
  }

  // Shop: how many things for the chosen window, the first three to need, and urgency in words
  const win = GROCERY_FILTERS.find(f=>f.key===state.groceryFilter);
  const order = dayDisplayOrder().map(i=>state.plan.days[i].name);
  const need = Object.values(needOn(windowDays(win.key)))
    .filter(n=>{ const a = toBuy(n); return a===null || a>0; })
    .sort((a,b)=>Math.min(...a.days.map(d=>order.indexOf(d))) - Math.min(...b.days.map(d=>order.indexOf(d))));
  const extras = state.extras.filter(x=>!x.checked).length;
  const count = need.length + extras;
  document.getElementById("shopThumbs").innerHTML = need.slice(0,3).map(n=>
    `<span class="thumb" style="--soft:var(--${n.cat}-soft, var(--olive-100))">${emojiFor({name:n.name, cats:[n.cat]})}</span>`).join("");
  document.getElementById("shopGlance").textContent = count ? `${count} thing${count===1 ? "" : "s"} to pick up` : pick(CONTENT.shopDone, "shop");
  let soon = null;
  Object.keys(state.stock).forEach(k=>{
    const sx = state.stock[k];
    if(sx.plenty || sx.g===null || !(sx.g>0)) return;
    const {short} = shortfall(k);
    if(short && (!soon || order.indexOf(short) < order.indexOf(soon.day))) soon = {name:sx.name.split(",")[0], day:short};
  });
  document.getElementById("shopHint").textContent = soon
    ? `${soon.name} runs out ${soon.day===order[0] ? "today" : soon.day}`
    : win.meta.replace(/^For/, "for").replace(/^./, c=>c.toUpperCase());

  // This week: seven days from today, a ring each
  const strip = document.getElementById("weekStrip");
  strip.innerHTML = "";
  dayDisplayOrder().forEach((idx, pos)=>{
    const d = dateForDay(idx), items = state.plan.days[idx].meals.flatMap(m=>m.items);
    const marked = items.filter(i=>i.ate).length, p = items.length ? marked/items.length : 0;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "wd" + (pos===0 ? " today" : "") + (items.length && marked===items.length ? " done" : "");
    b.innerHTML = `<span class="wd-l">${DAY_FULL(d).charAt(0)}</span><span class="ring"><svg viewBox="0 0 38 38" aria-hidden="true">
      <circle class="r-bg" cx="19" cy="19" r="15.9" pathLength="100"/><circle class="r-fg" cx="19" cy="19" r="15.9" pathLength="100" style="--p:${p.toFixed(3)}"/></svg>
      <span class="wd-n">${d.getDate()}</span></span>`;
    b.setAttribute("aria-label", `${formatDate(d)}${pos===0 ? ", today" : ""}: ${items.length ? `${marked} of ${items.length} meals marked` : "nothing planned"}`);
    b.addEventListener("click", ()=>showSheet("week", {day:idx}));
    strip.appendChild(b);
  });

  // Variety: which food groups have been tasted this week
  const now = varietyNow(), rb = document.getElementById("rainbow");
  let on = 0;
  rb.innerHTML = Object.keys(CATS).map(cat=>{
    const tasted = (now[cat] || []).some(f=>isCovered(cat, f));
    if(tasted) on++;
    const short = {protein:"Protein", vegetable:"Veg", fruit:"Fruit", grain:"Grains", fat:"Fats"}[cat];
    return `<span class="rdot${tasted ? " on" : ""}" style="--c:var(--${cat})"><i aria-hidden="true"></i>${short}<span class="sr-only">${tasted ? ": tasted this week" : ": not yet"}</span></span>`;
  }).join("");
  document.getElementById("rainbowGlance").textContent = on===0 ? CONTENT.rainbow.none : on===Object.keys(CATS).length ? CONTENT.rainbow.all : CONTENT.rainbow.some;

  // the tip of the day, unless it's been dismissed today
  const tip = document.getElementById("tip");
  tip.hidden = state.tipDismissed===todayISO();
  document.getElementById("tipText").textContent = pick(CONTENT.tips, "tip");
}

/* ---------- onboarding ----------
   One question per screen; every answer is saved as it's given, so closing
   the tab and coming back resumes at the same step. Nothing about the plan
   changes until "Looks good" on the last screen. */
const ONB_STEPS = ["welcome","name","birthday","keepout","priorities","athome","reveal"];
const STAPLES = [
  ["Oats","Oatmeal","🥣"],["Rice","Rice, soft-cooked","🍚"],["Pasta","Whole wheat pasta","🍝"],["Bread","Whole wheat toast","🍞"],
  ["Eggs","Egg, well cooked","🥚"],["Yogurt","Greek yogurt","🥛"],["Cheese","Cheese, grated","🧀"],["Lentils","Lentils","🫘"],
  ["Chickpeas","Chickpeas","🫘"],["Frozen peas","Peas","🫛"],["Frozen spinach","Spinach, cooked","🥬"],["Potatoes","Potato","🥔"],
  ["Sweet potatoes","Sweet potato","🍠"],["Carrots","Carrots, soft-cooked","🥕"],["Bananas","Banana","🍌"],["Apples","Apple, cooked","🍎"],
  ["Avocado","Avocado","🥑"],["Olive oil","Olive oil","🫒"]
];
let onb = {step:0, sub:null, dir:1, draft:null, revealed:false, kind:"allergy"};

/* months to plan for: a baby under 6 months only gets a menu if the
   family chose to explore anyway, and then it's a first-tastes week */
function planMonths(){
  const m = ageNow();
  return m < 6 && state.profile.exploreEarly ? 6 : m;
}
function openOnboarding(step, opts){
  const P = state.profile;
  onb.single = !!(opts && opts.single);   // from Settings: one step, then back home
  onb.step = Math.max(0, Math.min(ONB_STEPS.length-1, step===undefined ? (P.onboardingStep||0) : step));
  onb.sub = null; onb.draft = null; onb.revealed = false;
  document.body.classList.add("onb-open");
  document.querySelector(".container").inert = true;
  const el = document.getElementById("onboarding");
  el.hidden = false;
  document.getElementById("onbClose").hidden = !P.onboarded;   // a re-run can be left; a first run can't
  renderOnb();
  const first = document.querySelector("#onbCard input") || document.getElementById("onbTitle");
  if(first) first.focus({preventScroll:true});
}
function closeOnboarding(){
  document.getElementById("onboarding").hidden = true;
  document.body.classList.remove("onb-open");
  document.querySelector(".container").inert = false;
  fanDrawn = false;   // the fan arrives again on the page
  renderDayContent(); renderKitchen(); renderVariety(); renderCreate();
}
function finishOnboarding(){
  state.profile.onboarded = true;
  state.profile.onboardingStep = 0;
  delete state.profile.returning;
  save();
  closeOnboarding();
}
/* the gradient hurries for a moment, as if we were moving through it */
function rushSky(){
  if(calm()) return;
  document.querySelectorAll(".bg-img").forEach(b=>b.getAnimations().forEach(a=>{
    a.playbackRate = 14;
    setTimeout(()=>{ a.playbackRate = 6; }, 160);
    setTimeout(()=>{ a.playbackRate = 1; }, 420);
  }));
}
function goStep(n, sub){
  if(onb.single && n!==onb.step){ save(); closeOnboarding(); return; }
  const card = document.getElementById("onbCard");
  onb.dir = n > onb.step || (n===onb.step && sub) ? 1 : -1;
  const swap = ()=>{
    onb.step = n; onb.sub = sub || null;
    if(!onb.single) state.profile.onboardingStep = n;
    save();
    renderOnb();
    if(!calm()) card.animate([{transform:`translateX(${onb.dir*36}px)`, opacity:0}, {transform:"none", opacity:1}],
                             {duration:320, easing:"cubic-bezier(.32,1.25,.5,1)"});
    else card.animate([{opacity:0},{opacity:1}], {duration:180});
    const f = card.querySelector("input");
    const title = card.querySelector("#onbTitle");
    if(f) f.focus({preventScroll:true});
    else if(title){ title.tabIndex = -1; title.focus({preventScroll:true}); }
  };
  rushSky();
  if(calm()){ swap(); return; }
  const out = card.animate([{transform:"none", opacity:1}, {transform:`translateX(${-onb.dir*36}px)`, opacity:0}],
                           {duration:160, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
  out.onfinish = ()=>{ out.cancel(); swap(); };
}

function renderOnb(){
  const P = state.profile, key = ONB_STEPS[onb.step];
  const dots = document.getElementById("onbDots");
  dots.innerHTML = ONB_STEPS.map((_,k)=>`<i class="${k===onb.step ? "on" : k<onb.step ? "done" : ""}"></i>`).join("");
  document.getElementById("onbProgress").textContent = `Step ${onb.step+1} of ${ONB_STEPS.length}`;
  const back = document.getElementById("onbBack");
  back.hidden = onb.step===0 && !onb.sub;
  back.onclick = ()=> onb.sub ? goStep(onb.step) : onb.single ? closeOnboarding() : goStep(onb.step-1);
  back.hidden = back.hidden && !onb.single;
  document.getElementById("onbClose").onclick = closeOnboarding;
  const card = document.getElementById("onbCard");
  card.innerHTML = "";
  card.className = "onb-card";
  clearInterval(welTimer);
  document.getElementById("onboarding").classList.toggle("is-welcome", key==="welcome");
  ({welcome:onbWelcome, name:onbName, birthday:onbBirthday, keepout:onbKeepout,
    priorities:onbPriorities, athome:onbAtHome, reveal:onbReveal})[key](card, P);
}
/* a headline, an optional line, then the step's own content and buttons */
function onbHead(card, title, line){
  card.insertAdjacentHTML("beforeend", `<h1 class="onb-h" id="onbTitle" tabindex="-1">${title}</h1>` + (line ? `<p class="onb-p">${line}</p>` : ""));
}
function onbCta(card, label, onNext, opts){
  const o = opts || {};
  const wrap = document.createElement("div");
  wrap.className = "onb-cta";
  const b = document.createElement("button");
  b.type = "button"; b.className = "pill"; b.textContent = onb.single && label==="Continue" ? "Save" : label;
  b.disabled = !!o.disabled;
  b.addEventListener("click", onNext);
  wrap.appendChild(b);
  (o.extra || []).forEach(x=>{
    const e = document.createElement("button");
    e.type = "button"; e.className = x.quiet ? "pill quiet" : "link-btn"; e.textContent = x.label;
    e.addEventListener("click", x.on);
    wrap.appendChild(e);
  });
  card.appendChild(wrap);
  return b;
}
/* a decorative fan (onboarding has no real meals yet) */
function sampleFan(emojis, cls){

}
function fanIn(container){
  [...container.querySelectorAll(".tile")].forEach((t,k)=>{
    const end = getComputedStyle(t).transform;
    t.animate(calm() ? [{opacity:0},{opacity:1}] : [{transform:"translateY(30px) rotate(0deg) scale(.85)", opacity:0}, {transform:end, opacity:1}],
              {duration: calm() ? 200 : 600, delay:k*75, easing:"cubic-bezier(.32,1.25,.5,1)", fill:"backwards"});

/* 1. welcome */
/* a line breaks between its sentences, not inside one, when each fits */
function keepSentences(text){ return text.split(/(?<=[.!?])\s+/).map(t=>`<span class="keep">${t}</span>`).join(" "); }
/* 1. welcome: one drawing at a time, crossfading through the hero foods */
let welTimer = 0;
function onbWelcome(card){
  const heroes = HERO_FOODS.filter(id=>hasArt(foodOf(id)));
  const art = id=>foodArt(id, {size:140, alt:""});
  card.classList.add("bare", "wel-in");
  card.innerHTML = `<div class="wel-art" aria-hidden="true" style="--d:0ms"><div class="wel-bob">
      <span class="wel-layer is-on">${art(heroes[0])}</span><span class="wel-layer"></span></div></div>
    <h1 class="onb-h wel-h" id="onbTitle" tabindex="-1" style="--d:120ms">${say("onb.welcome.title")}</h1>
    <p class="wel-p" style="--d:200ms">${keepSentences(say("onb.welcome.line"))}</p>`;
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn-ink"; b.style.setProperty("--d", "280ms");
  b.textContent = say("onb.welcome.cta");
  b.addEventListener("click", ()=>{ haptic(); goStep(1); });
  card.appendChild(b);
  welcomeCycle(card, heroes);
}
/* every ~3 s the next food rises in with a small turn while the last one lifts away;
   only the next drawing is fetched ahead, and nothing runs while the tab is hidden */
function welcomeCycle(card, heroes){
  clearInterval(welTimer);
  if(heroes.length < 2) return;
  const warm = id=>{ const f = foodOf(id); const im = new Image(); im.decoding = "async"; im.src = devicePixelRatio > 1.5 ? f.files.w384 : f.files.w192; };
  let k = 0;
  warm(heroes[1]);
  welTimer = setInterval(()=>{
    if(!card.isConnected || !card.classList.contains("bare")){ clearInterval(welTimer); return; }
    if(document.hidden) return;
    const cur = card.querySelector(".wel-layer.is-on"), next = card.querySelector(".wel-layer:not(.is-on)");
    if(!cur || !next) return;
    k = (k + 1) % heroes.length;
    next.innerHTML = foodArt(heroes[k], {size:140, alt:""});
    const img = next.querySelector("img");
    (img && img.decode ? img.decode().catch(()=>{}) : Promise.resolve()).then(()=>{
      cur.classList.remove("is-on"); next.classList.add("is-on");
      if(calm()){
        next.animate([{opacity:0}, {opacity:1}], {duration:400});
        cur.animate([{opacity:1}, {opacity:0}], {duration:400});
      }else{
        next.animate([{opacity:0, transform:"translateY(10px) rotate(-8deg) scale(.92)"}, {opacity:1, transform:"none"}],
                     {duration:400, easing:"cubic-bezier(.32,1.25,.5,1)"});
        cur.animate([{opacity:1, transform:"none"}, {opacity:0, transform:"translateY(-12px) rotate(5deg) scale(.96)"}],
                    {duration:280, easing:"cubic-bezier(.22,.61,.36,1)"});
      }
      warm(heroes[(k + 1) % heroes.length]);
    });
  }, 3000);
}
/* 2. name */
function onbName(card, P){
  onbHead(card, "What's their name?");
  const inp = document.createElement("input");
  inp.className = "onb-input"; inp.type = "text"; inp.autocomplete = "off"; inp.maxLength = 30;
  inp.placeholder = "Their name"; inp.value = P.name || ""; inp.setAttribute("aria-label", "Their name");
  card.appendChild(inp);
  const next = onbCta(card, "Continue", ()=>{ if(inp.value.trim()) goStep(2); }, {disabled:!inp.value.trim()});
  inp.addEventListener("input", ()=>{ P.name = inp.value.trim(); save(); next.disabled = !P.name; });
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && P.name) goStep(2); });
}
/* 3. birthday: three wheels; the stage badge follows along */
function onbBirthday(card, P){
  const name = P.name || "they";
  if(onb.sub==="milk"){
    const m = ageNow(), left = Math.max(1, 6 - m);
    card.insertAdjacentHTML("beforeend", `<div class="calm-emoji" aria-hidden="true">🍼</div>`);
    onbHead(card, "No solids yet. Milk is all they need.",
      `${P.name || "Your little one"} is ${ageLabel(m)}. Solids usually start around 6 months, so come back in ${left===1 ? "about a month" : `about ${left} months`}. We can remind you then.`);
    onbCta(card, "Remind me", ()=>{
      const b = localDate(P.birthDate);
      const at = new Date(b.getFullYear(), b.getMonth()+6, b.getDate());
      P.remindAt = at.getFullYear()+"-"+String(at.getMonth()+1).padStart(2,"0")+"-"+String(at.getDate()).padStart(2,"0");
      P.exploreEarly = false; save(); goStep(3);
    }, {extra:[{label:"Explore anyway", on:()=>{ P.exploreEarly = true; save(); goStep(3); }}]});
    return;
  }
  onbHead(card, `When ${P.name ? "was " + P.name : "were they"} born?`);
  const now = new Date();
  let b = P.birthDate ? localDate(P.birthDate) : localDate(birthDateFromMonths(10));
  if(isNaN(b)) b = localDate(birthDateFromMonths(10));
  let d = b.getDate(), mo = b.getMonth(), y = b.getFullYear();
  const wrap = document.createElement("div");
  wrap.className = "wheels";
  const badge = document.createElement("div");
  badge.className = "stage-badge"; badge.setAttribute("aria-live", "polite");
  const preview = document.createElement("p");
  preview.className = "stage-preview";
  let lastStage = null;
  const daysIn = (yy, mm)=>new Date(yy, mm+1, 0).getDate();
  const commit = ()=>{
    d = Math.min(d, daysIn(y, mo));
    let date = new Date(y, mo, d);
    if(date > now){ date = new Date(now.getFullYear(), now.getMonth(), now.getDate()); }   // no birthdays in the future
    P.birthDate = date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
    save();
    const m = ageNow(), st = stageFor(m);
    badge.textContent = `${ageLabel(m)} · ${st.name}`;
    preview.textContent = stageLine(st);
    if(lastStage && lastStage!==st.id && !calm()) badge.animate([{transform:"scale(.85)"},{transform:"scale(1.06)"},{transform:"none"}], {duration:420, easing:"cubic-bezier(.32,1.25,.5,1)"});
    lastStage = st.id;
  };
  const years = []; for(let k=now.getFullYear()-4; k<=now.getFullYear(); k++) years.push({value:k, text:String(k)});
  const dayItems = ()=>Array.from({length:daysIn(y, mo)}, (_,k)=>({value:k+1, text:String(k+1)}));
  const dayW = wheel("Day", dayItems(), d, v=>{ d = v; commit(); });
  const monW = wheel("Month", MONTHS.map((t,k)=>({value:k, text:t})), mo, v=>{ mo = v; dayW.setItems(dayItems(), Math.min(d, daysIn(y, mo))); commit(); });
  const yrW = wheel("Year", years, y, v=>{ y = v; dayW.setItems(dayItems(), Math.min(d, daysIn(y, mo))); commit(); });
  wrap.append(dayW.el, monW.el, yrW.el);
  card.append(wrap, badge, preview);
  commit();
  onbCta(card, "Continue", ()=>{ ageNow() < 6 ? goStep(2, "milk") : (P.exploreEarly = false, save(), goStep(3)); });
}
/* a scroll-snap wheel with listbox semantics: scroll, tap or arrow keys */
function wheel(label, items, value, onChange){
  const ITEM = 48;
  const el = document.createElement("div");
  const list = document.createElement("div");
  list.className = "wheel-list"; list.tabIndex = 0;
  list.setAttribute("role", "listbox"); list.setAttribute("aria-label", label);
  el.appendChild(list);
  let opts = [], idx = 0, timer = null;
  const mark = ()=>{
    opts.forEach((o,k)=>o.setAttribute("aria-selected", String(k===idx)));
    if(opts[idx]) list.setAttribute("aria-activedescendant", opts[idx].id);
  };
  const set = (k, scroll)=>{
    k = Math.max(0, Math.min(items.length-1, k));
    const changed = k!==idx;
    idx = k; mark();
    if(scroll) list.scrollTo({top:k*ITEM, behavior: calm() ? "auto" : "smooth"});
    if(changed) onChange(items[k].value);
  };
  const build = ()=>{
    list.innerHTML = "";
    opts = items.map((it, k)=>{
      const o = document.createElement("div");
      o.className = "wheel-opt"; o.id = "w" + uid(); o.setAttribute("role", "option"); o.textContent = it.text;
      o.addEventListener("click", ()=>set(k, true));
      list.appendChild(o);
      return o;
    });
  };
  build();
  idx = Math.max(0, items.findIndex(i=>i.value===value));
  mark();
  requestAnimationFrame(()=>{ list.scrollTop = idx*ITEM; });
  list.addEventListener("scroll", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{ const k = Math.round(list.scrollTop/ITEM); if(k!==idx) set(k, false); }, 90);
  });
  list.addEventListener("keydown", e=>{
    const step = {ArrowDown:1, ArrowUp:-1, PageDown:5, PageUp:-5}[e.key];
    if(step){ e.preventDefault(); set(idx+step, true); }
    else if(e.key==="Home"){ e.preventDefault(); set(0, true); }
    else if(e.key==="End"){ e.preventDefault(); set(items.length-1, true); }
  });
  return {el, set:k=>set(k, true), get:()=>items[idx].value,
    setItems(next, keep){ items = next; build(); idx = Math.max(0, items.findIndex(i=>i.value===keep)); mark(); list.scrollTop = idx*ITEM; }};
}
/* 4. keep out: allergens cycle neutral → avoid → tried; anything else is a chip */
function onbKeepout(card, P){
  onbHead(card, "Anything we should keep out?", "Tap once to avoid, twice for “tried, all good”.");
  const live = document.createElement("p");
  live.className = "sr-only"; live.setAttribute("aria-live", "polite");
  const grid = document.createElement("div");
  grid.className = "al-grid";
  const label = st=>st==="avoid" ? "Avoid" : st==="ok" ? "Tried, all good" : "";
  ALLERGENS.forEach(a=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "al-tile";
    const paint = ()=>{
      const st = P.allergens[a.id] || "";
      b.dataset.state = st;
      b.querySelector(".al-state").textContent = label(st);
      b.setAttribute("aria-label", `${a.label}: ${label(st) || "no preference"}`);
    };
    b.innerHTML = `<span class="al-emoji" aria-hidden="true">${a.emoji}</span><span class="al-name">${a.label}</span><span class="al-state"></span>`;
    b.addEventListener("click", ()=>{
      const st = P.allergens[a.id];
      const next = !st ? "avoid" : st==="avoid" ? "ok" : null;
      if(next) P.allergens[a.id] = next; else delete P.allergens[a.id];
      save(); paint();
      b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
      live.textContent = `${a.label}: ${label(next) || "no preference"}`;
    });
    grid.appendChild(b);
    paint();
  });
  card.append(grid, live);

  // anything else: a chip, allergy or dislike
  const chips = document.createElement("div");
  chips.className = "chips";
  const paintChips = ()=>{
    chips.innerHTML = "";
    P.avoid.forEach(x=>{
      const c = document.createElement("span");
      c.className = "chip" + (x.kind==="allergy" ? " allergy" : "");
      c.innerHTML = `${x.name} <span class="kind">${x.kind==="allergy" ? "Allergy" : "Dislike"}</span><button type="button" class="x" aria-label="Remove ${x.name}">✕</button>`;
      c.querySelector("button").addEventListener("click", ()=>{ P.avoid = P.avoid.filter(y=>y!==x); save(); paintChips(); });
      chips.appendChild(c);
    });
  };
  const line = document.createElement("div");
  line.className = "add-line";
  line.innerHTML = `<input type="text" placeholder="Add something else" aria-label="Another food to keep out">
    <div class="kind-seg" role="group" aria-label="Allergy or dislike">
      <button type="button" data-k="allergy">Allergy</button><button type="button" data-k="dislike">Dislike</button></div>
    <button type="button" class="pill quiet" style="min-height:44px;padding:10px 18px">Add</button>`;
  const inp = line.querySelector("input");
  const segBtns = [...line.querySelectorAll(".kind-seg button")];
  const paintSeg = ()=>segBtns.forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.k===onb.kind)));
  segBtns.forEach(x=>x.addEventListener("click", ()=>{ onb.kind = x.dataset.k; paintSeg(); }));
  const add = ()=>{
    const v = inp.value.trim(); if(!v) return;
    const have = P.avoid.find(f=>f.name.toLowerCase()===v.toLowerCase());
    if(have) have.kind = onb.kind; else P.avoid.push({name:v, kind:onb.kind});
    inp.value = ""; save(); paintChips();
  };
  line.querySelector(".pill").addEventListener("click", add);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
  paintSeg(); paintChips();
  card.append(line, chips);

  const locked = document.createElement("div");
  locked.className = "locked";
  buildLockedRow(locked, ageNow());
  card.appendChild(locked);
  card.insertAdjacentHTML("beforeend", `<p class="note-calm">Not medical advice. Check allergen introduction with your paediatrician.</p>`);
  onbCta(card, "Continue", ()=>goStep(4));
}
/* the locked rules, as a quiet row; tap one to hear why (shared with Plan) */
function buildLockedRow(container, months){
  container.innerHTML = `<p class="locked-head">Always kept out at this age</p>`;
  const why = document.createElement("p");
  why.className = "locked-why"; why.setAttribute("aria-live", "polite");
  LOCKED_RULES.filter(r=>!r.until || months < r.until).forEach(r=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "locked-rule";
    b.innerHTML = `<span class="lock" aria-hidden="true"></span>${r.label}`;
    b.setAttribute("aria-label", `${r.label}, always kept out. Why?`);
    b.addEventListener("click", ()=>{ why.textContent = r.why; });
    container.appendChild(b);
  });
  container.appendChild(why);
}
/* 5. priorities: up to three, and how they'll steer the week */
function onbPriorities(card, P){
  onbHead(card, "What matters most right now?", "Pick up to three.");
  const grid = document.createElement("div");
  grid.className = "pr-grid";
  const lean = document.createElement("p");
  lean.className = "lean"; lean.setAttribute("aria-live", "polite");
  const paint = ()=>{
    grid.querySelectorAll(".pr-card").forEach(b=>{
      const on = P.priorities.includes(b.dataset.id);
      b.setAttribute("aria-pressed", String(on));
      b.disabled = !on && P.priorities.length>=3;
    });
    lean.textContent = priorityLine(P.priorities);
  };
  PRIORITIES.forEach(pr=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "pr-card"; b.dataset.id = pr.id;
    b.innerHTML = `<span class="pr-emoji" aria-hidden="true">${pr.emoji}</span><span class="pr-label">${pr.label}</span>`;
    b.addEventListener("click", ()=>{
      P.priorities = P.priorities.includes(pr.id) ? P.priorities.filter(x=>x!==pr.id) : P.priorities.concat(pr.id).slice(0,3);
      save(); paint();
    });
    grid.appendChild(b);
  });
  card.append(grid, lean);
  paint();
  onbCta(card, "Continue", ()=>goStep(5));
}
/* 6. at home: optional; picks land in stock at their usual pack size */
function onbAtHome(card, P){
  onbHead(card, "What's already at home?", "Optional. It helps the first week say “at home” instead of “buy”.");
  const wrap = document.createElement("div");
  wrap.className = "st-chips";
  STAPLES.filter(([,food])=>!allergyMatch(food, P)).forEach(([label, food, emoji])=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "st-chip";
    const on = ()=>P.staples.includes(food);
    b.innerHTML = `<span aria-hidden="true">${emoji}</span>${label}`;
    b.setAttribute("aria-pressed", String(on()));
    b.addEventListener("click", ()=>{
      P.staples = on() ? P.staples.filter(x=>x!==food) : P.staples.concat(food);
      b.setAttribute("aria-pressed", String(on())); save();
    });
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
  const stock = ()=>{
    P.staples.forEach(food=>{
      const k = foodKey(food);
      if(state.stock[k] && (state.stock[k].plenty || state.stock[k].g===null || state.stock[k].g>0)) return;
      const pack = packFor(food);
      state.stock[k] = {name:food, g: pack ? pack.g : null, plenty:false};
    });
    save();
  };
  onbCta(card, "Continue", ()=>{ stock(); goStep(6); }, {extra:[{label:"Skip for now", on:()=>goStep(6)}]});
}
/* 7. the reveal: the table being set, then the week, applied only on "Looks good" */
function onbReveal(card, P){
  const name = P.name || "your little one";
  if(ageNow() < 6 && !P.exploreEarly){
    card.insertAdjacentHTML("beforeend", `<div class="calm-emoji" aria-hidden="true">🌙</div>`);
    onbHead(card, "All set for now.", `We'll have a first week ready for ${name} around 6 months. Until then, milk is everything.`);
    onbCta(card, "Done", finishOnboarding);
    return;
  }
  if(!onb.draft) onb.draft = generateWeek(planMonths(), P);
  if(!onb.revealed){
    const stage = document.createElement("div");
    stage.className = "rv-stage";
    stage.innerHTML = sampleFan(onb.draft.days[0].meals.slice(0,4).map(m=>m.items[0] ? emojiFor(m.items[0]) : "🍽️")) +
      `<p class="rv-line" id="onbTitle">Setting the table for the week…</p>`;
    card.appendChild(stage);
    const tiles = [...stage.querySelectorAll(".tile")];
    tiles.forEach((t,k)=>{
      const end = getComputedStyle(t).transform;
      if(calm()) t.animate([{opacity:0},{opacity:1}], {duration:250, delay:k*80, fill:"backwards"});
      else t.animate([
        {transform:"translateY(40px) rotate(0) scale(.7)", opacity:0},
        {transform:`translate(${(k-1.5)*-14}px,-18px) rotate(${(k%2?1:-1)*14}deg) scale(1.05)`, opacity:1, offset:.45},
        {transform:`translate(${(k-1.5)*10}px,6px) rotate(${(k%2?-1:1)*6}deg)`, offset:.75},
        {transform:end, opacity:1}], {duration:1500, delay:k*90, easing:"cubic-bezier(.32,1.1,.5,1)", fill:"backwards"});
    });
    const done = ()=>{ if(onb.revealed) return; onb.revealed = true; if(ONB_STEPS[onb.step]==="reveal") renderOnb(); };
    onbCta(card, "Skip", done).classList.add("quiet");
    setTimeout(done, calm() ? 600 : 2300);
    return;
  }
  onbHead(card, `Here's ${name}'s week`, priorityLine(P.priorities));
  const list = document.createElement("div");
  list.className = "rv-days";
  onb.draft.days.forEach(day=>{
    const mains = day.meals.filter(m=>m.label!=="Snack").map(dishName).filter(Boolean);
    list.insertAdjacentHTML("beforeend", `<div class="rv-day"><b>${day.name.slice(0,3)}</b><span>${mains.join(" · ")}</span></div>`);
  });
  card.appendChild(list);
  const extra = [{label:"Shuffle", quiet:true, on:()=>{ onb.draft = generateWeek(planMonths(), P); onb.revealed = false; renderOnb(); }}];
  if(P.returning) extra.push({label:"Keep my current week", on:finishOnboarding});
  onbCta(card, "Looks good", ()=>{
    state.plan = onb.draft;
    state.weekStarted = todayISO();
    currentDay = dayDisplayOrder()[0];
    onb.draft = null;
    finishOnboarding();
  }, {extra});
}

/* ---------- init ---------- */
currentDay = dayDisplayOrder()[0];

renderDayContent();
renderKitchen();
renderVariety();
renderCreate();
renderSummaries();
document.getElementById("heroHead").addEventListener("click", ()=>showSheet("week", {day:dayDisplayOrder()[0]}));
document.getElementById("shopCard").addEventListener("click", ()=>showSheet("shop"));
document.getElementById("weekHead").addEventListener("click", ()=>showSheet("week"));
document.getElementById("varietyHome").addEventListener("click", ()=>showSheet("variety"));
document.getElementById("profileBtn").addEventListener("click", ()=>showSheet("settings"));
document.getElementById("tipClose").addEventListener("click", ()=>{ state.tipDismissed = todayISO(); save(); renderHome(); });
if(!state.profile.onboarded) openOnboarding();
/* offline: register the service worker once the page has settled (never on
   file://, never during tests) */
if("serviceWorker" in navigator && location.protocol.startsWith("http") && !/[?&]test\b/.test(location.search)){
  (window.requestIdleCallback || (f=>setTimeout(f, 1500)))(()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
document.querySelectorAll("#windowSeg button").forEach(b=>b.addEventListener("click", ()=>{
  state.groceryFilter = b.dataset.w; save(); renderKitchen();
}));
</script>
