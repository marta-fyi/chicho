/* The theme, before the first paint: Auto follows the system (prefers-color-scheme), or the family's choice
   in Profile (state.profile.appearance: auto · light · dark). ?theme=light|dark overrides it, for testing.
   Only the dark theme needs the night-sky image, so only it preloads it. */
(function(){
  const root = document.documentElement, forced = new URLSearchParams(location.search).get("theme");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let pref = "auto";
  try{ const s = JSON.parse(localStorage.getItem("toddlerMealPlanner.v1") || "null"); if(s && s.profile && s.profile.appearance) pref = s.profile.appearance; }catch(e){}
  window.applyTheme = function(p){
    if(p) pref = p;
    const t = forced==="light" || forced==="dark" ? forced : pref==="light" || pref==="dark" ? pref : dark.matches ? "dark" : "light";
    const changed = root.dataset.theme!==t;
    root.dataset.theme = t; root.dataset.appearance = pref;
    if(t==="dark" && !document.getElementById("bgPreload")){ const l = document.createElement("link"); l.id = "bgPreload"; l.rel = "preload"; l.as = "image"; l.href = "bg.jpg"; document.head.appendChild(l); }
    if(changed) document.dispatchEvent(new Event("themechange"));
    return t;
  };
  applyTheme();
  dark.addEventListener("change", ()=>applyTheme());
  document.addEventListener("visibilitychange", ()=>root.classList.toggle("tab-hidden", document.hidden));
})();
/* a shared snapshot link is never indexed (the payload lives in the fragment, which is never sent anyway) */
if(/^#\/s\//.test(location.hash)){ const m = document.createElement("meta"); m.name = "robots"; m.content = "noindex"; document.head.appendChild(m); }
/* first run only: the welcome's first two drawings (HERO_FOODS[0], [1] in foods.js) start loading with the page */
try{
  const saved = JSON.parse(localStorage.getItem("toddlerMealPlanner.v1") || "null");
  if(!saved || !saved.profile || !saved.profile.onboarded) ["banana","carrot"].forEach(id=>{
    const l = document.createElement("link");
    l.rel = "preload"; l.as = "image"; l.type = "image/webp";
    l.setAttribute("imagesrcset", `img/food/${id}-192.webp 1x, img/food/${id}-384.webp 2x`);
    document.head.appendChild(l);
  });
}catch(e){}
</script>

  .pill-edit{cursor:text;gap:6px;padding-right:6px;}
  .pill-edit .blank{min-width:5ch;}
  .kind-toggle{display:inline-flex;margin-left:4px;}
  .kind-toggle button{min-height:44px;margin:-4px 0;padding:0 10px;border:none;border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;opacity:.6;}
  .kind-toggle button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;}
  /* the locked line, and its reasons on tap */
  .locked-say{margin-top:24px;max-width:460px;font-size:15px;line-height:1.45;color:var(--ink-85);}
  .locked-say p{margin:0;}
  .lock-i{width:14px;height:14px;margin-right:6px;vertical-align:-1px;fill:currentColor;stroke:currentColor;stroke-width:1.6;}
  .lock-i path{fill:none;}
  .why-list{margin:10px auto 0;padding:0;list-style:none;text-align:left;display:grid;gap:6px;}
  /* meal times */
  .mt-rows{margin-top:24px;display:grid;gap:6px;}
  .mt-row{margin:0;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.5;color:var(--ink);}
  .mt-row input[type=time]{font-variant-numeric:tabular-nums;}
  .mt-row input[type=time]::-webkit-calendar-picker-indicator{display:none;}
  /* the reveal: drawings floating up one by one */
  .rv-row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:28px;min-height:84px;}
  .rv-item{display:block;rotate:var(--r);animation:rv-rise 520ms var(--spring) both;
           animation-delay:calc(var(--k) * 70ms);}
  @keyframes rv-rise{from{opacity:0;transform:translateY(24px) scale(.85);}}
  /* the week, before it's yours */
  .wk-prev{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:4px;width:100%;margin-top:28px;}
  .wk-day{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .wk-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:4px;}
  .wk-art{display:block;rotate:var(--r);}
  
  @media (prefers-reduced-motion: reduce){
    .blank.idle:focus-within::after{animation:none;}
    .rv-item{animation:wel-fade 300ms both;animation-delay:calc(var(--k) * 70ms);}

    @keyframes wel-fade{from{opacity:0;}}
  }

  /* labels and button text: uppercase with +0.06em (the words stay sentence case in content.js) */
  .btn-ink, .offer-pill, .mx-acts .btn-text.undo, .outcome, .pill-o, .alt, .also-btn, .s-seg-opts button, .kind-toggle button,
  .mini, .label, .s-sec, .btn-text:not(.inline), .wd-l{text-transform:uppercase;letter-spacing:var(--track-label);}
  .btn-ink, .offer-pill, .mx-acts .btn-text.undo{font-size:14px;}
  .outcome, .pill-o, .alt, .also-btn, .s-seg-opts button, .btn-text:not(.inline), .kind-toggle button{font-size:13px;}
  .mini, .label, .s-sec, .wd-l{font-size:12px;}

  /* ---------- keep out, priorities ---------- */

  .locked{margin:4px 16px 12px 0;}

  /* a small padlock drawn in CSS: a shackle over a body */
  .lock{position:relative;width:9px;height:7px;border-radius:2px;background:var(--muted);margin-top:4px;}
  .lock::before{content:"";position:absolute;left:1.5px;bottom:5px;width:6px;height:5px;border:1.5px solid var(--muted);border-bottom:none;border-radius:4px 4px 0 0;box-sizing:border-box;}

  /* ---------- home: a lock screen ----------
     A phone: one column, 20px from each edge (or the safe area), at most 430px
     wide; wider screens get the same column, centred, on the same background.
     No cards, no panels: type size, weight and space carry the hierarchy.
     Nothing responds to hover; everything is a tap. */
  .home{max-width:calc(var(--col) + var(--pad-l) + var(--pad-r));margin:0 auto;padding:0 var(--pad-r) calc(env(safe-area-inset-bottom) + 48px) var(--pad-l);color:var(--ink);}
  .lockscreen{display:flex;flex-direction:column;padding:4px 0 0;}
  /* the corner header: who at top-left (one 44px button, it opens Profile), when at top-right */
  .corners{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(env(safe-area-inset-top) + 12px);}
  .who-btn{display:flex;flex-direction:column;align-items:flex-start;min-width:44px;min-height:44px;margin:0;padding:2px 0;border:none;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
  .who-age, .when-date{font-size:13px;line-height:1.4;color:var(--ink-muted);}
  .who-name{font-size:20px;font-weight:500;line-height:1.3;text-transform:uppercase;letter-spacing:var(--track-label);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;}
  .who-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px;}
  .when{display:flex;flex-direction:column;align-items:flex-end;margin:0;padding:2px 0;text-align:right;font-variant-numeric:tabular-nums;}
  .when-time{font-size:20px;font-weight:500;line-height:1.3;}
  /* the poster's captions: 12px uppercase; the stage at 55% (decorative), the glow's group in --ink-muted (functional) */
  .captions{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:16px;font-size:12px;line-height:1.5;text-transform:uppercase;letter-spacing:var(--track-label);}
  .captions p{margin:0;}
  .cap-stage{display:flex;flex-direction:column;color:var(--ink-deco);}
  .cap-glow{color:var(--ink-muted);text-align:right;white-space:nowrap;}
  .headline{margin:0;font-family:var(--font-display);font-size:clamp(32px, 9.5vw, 40px);font-weight:500;letter-spacing:var(--track-hero);line-height:1.1;text-wrap:balance;}
  .headline:focus{outline:none;}
  /* ---------- the glow (light theme) ----------
     ~150% of the column, square, centred on the headline. The wrapper spans the
     screen and clips sideways (never a horizontal scroll) and sits behind
     everything. Two stacked layers crossfade (1.2s) when the open meal's food
     group changes; the breath (scale 1→1.05, opacity .94→1, 10s) is the page's
     only continuous animation, paused when the tab is hidden, off under reduced
     motion. After 21:30 it drops to 55%. Its gradient comes from theme.js. */
  .hl{position:relative;margin-top:16px;}
  .glow-wrap{position:absolute;left:50%;top:50%;width:100vw;height:0;transform:translateX(-50%);overflow-x:clip;overflow-y:visible;
             pointer-events:none;z-index:-1;transition:opacity 1.2s ease-in-out;
             --glow-size:calc(1.5 * min(100vw - var(--pad-l) - var(--pad-r), var(--col)));}
  [data-theme="dark"] .glow-wrap{display:none;}
  .glow-dim .glow-wrap{opacity:.55;}
  .glow-pulse{position:absolute;left:50%;top:0;width:var(--glow-size);height:var(--glow-size);translate:-50% -50%;}
  .glow{position:absolute;inset:0;animation:breathe 10s ease-in-out infinite;will-change:transform, opacity;}
  @keyframes breathe{0%, 100%{transform:scale(1);opacity:.94;} 50%{transform:scale(1.05);opacity:1;}}
  .tab-hidden .glow{animation-play-state:paused;}
  .glow-l{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease-in-out;}
  .glow-l.is-on{opacity:1;}
  /* the grain, layered over the colour, fading out with it */
  .glow-grain{position:absolute;inset:0;background:url("img/grain.png") 0 0 / 128px 128px;
              -webkit-mask-image:radial-gradient(circle closest-side, black 30%, transparent 100%);mask-image:radial-gradient(circle closest-side, black 30%, transparent 100%);}
  @media (prefers-reduced-motion: reduce){ .glow{animation:none;} .glow-l{transition-duration:.3s;} }
  .moment{margin:10px 0 0;min-height:1.4em;font-size:17px;line-height:1.45;color:var(--ink);text-wrap:pretty;}
  .moment.calm-tone{font-weight:500;}
  /* inline text actions keep the line's rhythm; their 44px target is an invisible pad around the words */
  .btn-text.inline{position:relative;min-height:0;min-width:0;padding:0 2px;font-size:inherit;line-height:inherit;color:var(--ink);vertical-align:baseline;}
  .btn-text.inline::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:44px;translate:0 -50%;}
  .btn-text.quiet{color:var(--ink-85);font-weight:500;}
  .mini{margin:0 0 6px;font-size:15px;font-weight:500;color:var(--ink);letter-spacing:0;}   /* full ink: at 85% the night sky took it to 4.2:1 */
  /* the open meal: one object, in place */
  .open-meal{margin-top:20px;}
  .mx{display:flex;flex-direction:column;}
  .mx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mx-title{margin:0;padding:0;border:none;background:none;color:var(--ink);font:inherit;font-size:22px;font-weight:500;letter-spacing:-.02em;text-align:left;cursor:pointer;min-height:44px;}
  h2.mx-title{cursor:default;min-height:0;}
  .mx-title:focus{outline:none;}
  button.mx-title:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px;}
  .mx-meta{margin:0 0 4px;font-size:16px;line-height:1.4;color:var(--ink-85);}
  .mx-foods{list-style:none;margin:0;padding:0;}
  .fr{display:grid;grid-template-columns:28px 1fr 20px;align-items:center;gap:12px;width:100%;min-height:52px;padding:4px 0;border:none;border-bottom:1px solid var(--ink-20);
      background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;}

  .chev{width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -3px;transition:rotate var(--dur-2) var(--ease-out);opacity:.85;}
  .fr[aria-expanded="true"] .chev{rotate:225deg;translate:0 3px;}

  .fr-more{padding:4px 0 12px 40px;font-size:16px;line-height:1.5;}

  .fr-alts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .alt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer;}
  .alt .food-art{--art:24px;}
  .mx-how{margin:12px 0 0;font-size:16px;line-height:1.5;color:var(--ink-85);}
  .mx-acts{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:stretch;width:100%;height:48px;margin-top:16px;
           border-radius:999px;background:var(--ink);color:var(--on-ink);}
  /* the pill keeps its size in every state ("Mark as offered", "Offered · Undo", "Offered"), so nothing shifts */
  .offer-pill{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:48px;padding:0 20px;border-radius:999px;border:none;
              background:none;color:inherit;font:inherit;font-size:17px;font-weight:500;cursor:pointer;
              transition:transform var(--dur-1) var(--ease-out);}
  .mx-acts .btn-text.undo{flex:none;min-height:48px;margin-left:-12px;padding:0 22px 0 0;color:inherit;border-radius:0 999px 999px 0;}
  .mx-acts .btn-text.undo::before{content:"·";display:inline-block;margin-right:10px;text-decoration:none;}
  .mx-acts:has(.undo) .offer-pill{justify-content:flex-end;padding-right:12px;}
  .offer-pill i svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .offer-pill:active{transform:scale(.97);}
  .offer-pill:focus-visible, .outcome:focus-visible, .alt:focus-visible, .ring-btn:focus-visible, .mrow-btn:focus-visible, .also-btn:focus-visible,
   .wd:focus-visible, .shop-line:focus-visible, .s-row:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .outcomes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .outcome{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer;}
  .outcome[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);}
  .mx-links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:8px 0 0;font-size:17px;}
  .mx-links .btn-text.small{min-height:44px;padding:0;font-size:17px;}
  .mx-links label{font-weight:500;}
  .wake{display:inline-flex;align-items:center;gap:8px;}
  .wake i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;}
  .wake[aria-pressed="true"] i{background:currentColor;}
  .undo-line{margin:6px 0 0;font-size:16px;color:var(--ink-85);}
  /* the ring: on every meal, always; filled once offered */
  .ring-btn{position:relative;flex:none;width:44px;height:44px;padding:0;border:none;border-radius:50%;background:none;color:var(--ink);cursor:pointer;}
  /* 28px, a 1.5px ink line, transparent inside (the glow shows through); offered fills with ink and the
     check draws in (a wipe moving off it: transform only, ~180ms) in the paper colour */
  .ring-btn i{position:absolute;inset:8px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;overflow:hidden;transition:transform var(--dur-1) var(--ease-out);}
  .ring-btn i::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform 160ms var(--ease-out);}
  .ring-btn svg{position:relative;width:16px;height:16px;fill:none;stroke:var(--bg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  .ring-btn svg .wipe{fill:var(--ink);stroke:none;transform-box:fill-box;transition:transform 180ms var(--ease-out) 60ms;}
  .ring-btn[aria-pressed="true"] i::before{transform:scale(1);}
  .ring-btn[aria-pressed="true"] svg{opacity:1;}
  .ring-btn[aria-pressed="true"] svg .wipe{transform:translateX(100%);}
  
  /* while you're at it */
  .also{margin-top:24px;}
  .also-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px;padding:6px 0;}
  .also-row .food-art{--art:24px;}
  .also-text{margin:0;font-size:17px;line-height:1.4;}
  .also-note{display:block;font-size:15px;color:var(--ink-85);}
  .also-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border:none;border-radius:999px;background:none;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;}
  .also-btn i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;}
  .also-btn svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  /* up next, earlier today: compact rows that open in place */
  .rows{margin-top:24px;}
  .rows[hidden], .also[hidden]{display:none;}
  .mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mrow-btn{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:48px;padding:0;border:none;background:none;color:var(--ink);font:inherit;font-size:17px;text-align:left;cursor:pointer;}
  .mrow-btn .food-art{--art:24px;}
  .mrow-t{display:flex;flex-direction:column;}
  .mrow-sub{font-size:15px;color:var(--ink-85);}
  .mrow.is-earlier .mrow-btn{color:var(--ink-85);}
  .mrow .undo-line{flex-basis:100%;margin:0 0 4px 36px;}
  .rows .mx{margin:6px 0 10px;}
  .is-milk .open-meal, .is-milk .also, .is-milk .rows, .is-milk .below, .is-empty .open-meal, .is-empty .rows, .is-empty .also, .is-empty .below{display:none;}
  /* below the fold: fades up as it arrives */
  .below{margin-top:36px;opacity:0;transform:translateY(16px);transition:opacity 500ms var(--ease-out), transform 500ms var(--ease-out);}
  .below.in{opacity:1;transform:none;}
  .label{margin:0 0 12px;font-size:var(--fs-title);font-weight:500;letter-spacing:-.02em;}
  .strip{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));justify-items:center;}
  .wd{display:flex;flex-direction:column;align-items:center;gap:2px;width:44px;min-height:44px;padding:4px 0;border:none;background:none;color:var(--ink);font:inherit;cursor:pointer;border-radius:14px;}
  .wd-l{font-size:14px;font-weight:500;}

  .shop-line{display:inline-flex;align-items:center;gap:14px;min-height:56px;padding:4px 0;border:none;background:none;color:var(--ink);font:inherit;font-size:17px;text-align:left;cursor:pointer;}

         background:none;color:var(--ink);font:inherit;font-size:17px;font-weight:500;text-align:left;cursor:pointer;}

  .s-row-sub{font-size:15px;font-weight:400;color:var(--ink-muted);}

  .s-note{margin-top:18px;}
  .s-warn{font-size:17px;line-height:1.45;margin:0 0 16px;}

  /* ---------- sheets ----------
     The one overlay: a bottom sheet with a scrim. One <dialog> for every

     if its content is), drags up to large and down to dismiss, traps focus,
     closes on ✕, Escape or a tap on the scrim, and sits on top of the
     on-screen keyboard (--kb, from visualViewport) so an input is never hidden. */
  .sheet{
    position:fixed;inset:auto 0 var(--kb, 0px) 0;margin:0 auto;width:100%;max-width:calc(var(--col) + 40px);max-height:var(--sheet-max, 62dvh);
    padding:0;border:none;border-radius:28px 28px 0 0;background:var(--sheet);color:var(--ink);
    box-shadow:var(--shadow-sheet);overflow:hidden;
  }
  .sheet[open]{display:flex;flex-direction:column;}
  .sheet::backdrop{background:var(--scrim);}
  .sheet-grab{flex:0 0 auto;display:grid;place-items:center;height:24px;cursor:grab;touch-action:none;}
  .sheet-grab i{width:40px;height:5px;border-radius:3px;background:var(--handle);}
  .sheet-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:2px 16px 10px;touch-action:none;}
  .sheet-title:focus{outline:none;}
  .sheet-title{flex:1;min-width:0;margin:0;font-size:var(--fs-title);font-weight:500;letter-spacing:var(--track-title);color:var(--olive-900);}
  .sheet-back, .sheet-close{
    flex:0 0 auto;width:44px;height:44px;border:none;border-radius:50%;background:var(--olive-50);color:var(--olive-900);
    display:grid;place-items:center;font-size:17px;cursor:pointer;transition:transform var(--dur-1) var(--ease-out);
  }
  .sheet-back:active, .sheet-close:active{transform:scale(.92);}
  .sheet-back[hidden]{display:none;}
  .sheet-back::before{content:"";width:9px;height:9px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;rotate:45deg;translate:2px 0;}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
              padding:4px var(--pad-r) calc(24px + env(safe-area-inset-bottom)) var(--pad-l);}
  .kb-open .sheet-body{padding-bottom:24px;}   /* the keyboard covers the home indicator */
  .sheet-head{padding-left:var(--pad-l);padding-right:calc(var(--pad-r) - 6px);}
  /* the meal */

  .ate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px;}
  .ate button{
    border:none;border-radius:var(--r-pill);min-height:50px;padding:10px 6px;font:inherit;font-size:15px;font-weight:500;
    background:var(--olive-50);color:var(--olive-900);box-shadow:inset 0 0 0 1.5px var(--olive-100);cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out);

  /* a food: dot, name and grams, its chip and actions; the tip runs full width beneath */

  /* the week */

  /* variety */

  /* settings */
  /* shop */

  .sheet-body > *{animation:none;}

  /* small controls keep their size on screen but take a 44px tap */
  .buy-chip, .chip button.x, .locked-rule, .suggest button, .have-chip{position:relative;}
  .buy-chip::after, .chip button.x::after, .locked-rule::after, .suggest button::after{
    content:"";position:absolute;left:50%;top:50%;width:max(100%, 44px);height:max(100%, 44px);translate:-50% -50%;
  }

  /* ---------- food art (foods.js → foodArt()): a drawing, or its emoji ---------- */
  .food-art{display:inline-block;width:var(--art);height:var(--art);flex:none;line-height:1;}
  .food-art img{display:block;width:100%;height:100%;transform:scale(var(--scale,1));filter:var(--art-ink);}
  /* the bullets: each drawing is a mask filled with the ink, so one file serves both themes (and an ink pill
     fills it with --on-ink). artReady() in foods.js switches a bullet to its mask once the image has loaded,
     so lazy loading still works; where masks aren't supported the image shows, forced to the ink's colour */
  .food-art.masked{background-color:var(--art-color, var(--ink));
    -webkit-mask:var(--mask) center / calc(var(--scale, 1) * 100%) no-repeat;mask:var(--mask) center / calc(var(--scale, 1) * 100%) no-repeat;}
  .food-art.masked img{opacity:0;}

  /* ---------- micro-interactions ---------- */
  .burst{position:fixed;width:0;height:0;z-index:300;pointer-events:none;}
  .bp{position:absolute;left:0;top:0;display:block;opacity:0;}
  .bp.leaf{width:12px;height:7px;border-radius:12px 0 12px 0;background:var(--olive-500);}
  .bp.dot{width:6px;height:6px;border-radius:50%;background:var(--grain);}
  .bp.star{width:9px;height:9px;background:var(--fruit);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);}
  /* every row answers a press at once, then springs back */

  /* a sheet's rows and chips arrive in a short stagger (at most eight) */

  .ate button[aria-pressed="true"]{animation:pop var(--dur-3) var(--spring);}
  /* the bought tick pops and the strike draws */

  /* ---------- motion ---------- */
  @keyframes rise{from{transform:translateY(10px);}}
  @keyframes from-right{from{transform:translateX(28px);}}
  @keyframes from-left{from{transform:translateX(-28px);}}
  @keyframes out-right{to{transform:translateX(110%);}}
  @keyframes out-left{to{transform:translateX(-110%);}}
  @keyframes tick-pop{
    from{transform:translateY(-1px) rotate(-45deg) scale(0);}
    60%{transform:translateY(-1px) rotate(-45deg) scale(1.3);}
  }
  @keyframes pop{from{transform:scale(.6);}}
  @keyframes band-in{from{transform:scaleX(0);}}
  @media (prefers-reduced-motion: reduce){
    .bg-img,
    .item-row.just .have-chip, .just input[type=checkbox]:checked::before, .addform-open, .k-row.just,
    .sheet-body.enter > *, .sheet-body.enter :is(.ms-row, .k-row, .vg-row, .chip, .dc-meal),
    .ate button[aria-pressed="true"], .k-row.just input[type=checkbox]:checked::before{animation:none;}

    .seg::before, .btn, .chip, .buy-chip, .row-fg, .r-fg, .hcard, .wd,
    .switch input, .switch input::before, input[type=checkbox]{transition:none;}
  }
  /* touch: every tappable answers a press within 100ms (scale .97, transform only); iOS needs a touchstart
     listener on the document for :active to apply (home.js adds one). Text actions inside a sentence become
     inline-blocks so they can scale too. Nothing responds to hover (tools/check.mjs). */
  :is(button, a[href], [role="button"], summary){touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  .btn-text.inline{display:inline-block;}
  .btn-text.inline + .btn-text.inline{margin-left:8px;}   /* two text actions in one line: 8px between their 44px pads */
  :is(button, a[href], [role="button"]):not(:disabled):active{transform:scale(.97);transition:transform 100ms var(--ease-out);}
  .ring-btn:active{transform:none;}   /* the ring scales its circle instead (below), so its 44px pad doesn't move */
  .ring-btn:not(:disabled):active i{transform:scale(.97);}
  /* last, so nothing above overrides it: a field is never under 16px (iOS zooms on focus below that) */
  .blank .blank-input{font-size:max(16px, 1em);}
  .pill-o.pill-edit{text-transform:none;letter-spacing:0;font-size:16px;}

<!-- the dark theme's background: the night sky (hidden in the light theme) -->
<div class="bg" aria-hidden="true">

  </section>
</div>



<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">

<script>
/* ---------- the clock ----------
   Everything that depends on the time reads now(), never new Date(), so
   tests (and ?now=2026-10-22T14:35 for screenshots) can set it. */
let clockAt = (()=>{ const q = new URLSearchParams(location.search).get("now"); const d = q ? new Date(q) : null; return d && !isNaN(d) ? +d : null; })();
function now(){ return clockAt===null ? new Date() : new Date(clockAt); }
function setClock(d){ clockAt = d===null || d===undefined ? null : +new Date(d); }

/* ---------- category meta ---------- */
const CATS = {
  protein:   { label:"Proteins",          color:"var(--protein)"  },
  vegetable: { label:"Vegetables",        color:"var(--vegetable)"},
  fruit:     { label:"Fruits",            color:"var(--fruit)"    },
  grain:     { label:"Grains & Starches", color:"var(--grain)"    },
  fat:       { label:"Healthy Fats",      color:"var(--fat)"      }
};

const DAY_ORDER = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const GROCERY_FILTERS = [
  {key:"today", label:"Today",       meta:"For today"},
  {key:"next3", label:"Next 3 days", meta:"For the next 3 days"},
  {key:"week",  label:"Week",        meta:"For the rest of the week"}
];
/* ---------- default variety checklist (master foods per category) ---------- */
const DEFAULT_VARIETY = {
  protein:   ["Egg","Chicken","Turkey","Beef","Salmon","White fish","Lentils","Chickpeas","Tofu","Greek yogurt","Cottage cheese","Ricotta","Cheese"],
  vegetable: ["Carrots","Sweet potato","Pumpkin","Zucchini","Green beans","Peas","Cauliflower","Potato","Cucumber","Tomato"],

/* ---------- feeding stages ----------
   One record per stage, and everything age-dependent reads from here: the
   meal slots generated, the texture label on each dish, portions, the
   summary line and the suggested "never include" foods. Months are

const AGE_MAX = 36;
/* The stages: one config drives meal slots, portions and food groups; every
   word about a stage (name, meals, textures, portion hint, the locked line)

/* meal slots, mirroring the five the plan already uses; each stage picks
   the ones it serves by id. slot = which foods fit (FOOD_POOL.slots). */
const MEAL_SLOTS = [
  {id:"breakfast", slot:"breakfast", label:"Breakfast", icon:"🍳", cats:["grain","fruit","protein"]},
  {id:"snack1",    slot:"snack",     label:"Snack",     icon:"🧃", cats:["protein","fruit"]},

/* ---------- the child's profile: age from a birth date ----------
   Age is never stored, only the birth date; months are worked out from
   today, so the stage moves on by itself. */
function ageMonths(iso, at){
  const b = localDate(iso), n = at || now();
  if(isNaN(b)) return null;
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
/* the birth date that makes a child m months old today (same day of the
   month, clamped to the month's length) */
function birthDateFromMonths(m, at){
  const n = at || now();
  const y = n.getFullYear(), mo = n.getMonth() - m;
  const first = new Date(y, mo, 1);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const d = new Date(first.getFullYear(), first.getMonth(), Math.min(n.getDate(), days));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ageNow(){
  const m = state.profile && state.profile.birthDate ? ageMonths(state.profile.birthDate) : null;
  return m===null ? 10 : m;
}

/* ---------- meal times ----------
   Each stage has default times per slot; the family can set their own
   (profile.mealTimes), and a meal's peek can move one meal for today only
   (profile.timesToday). Times are local "HH:mm"; a meal's moment is built
   from the calendar date, so daylight-saving days land on the right hour.
   A meal is upcoming, now (from its anchor for NOW_WINDOW_MIN), earlier
   (it just loses emphasis and stays tickable; never a failure), or offered. */
const NOW_WINDOW_MIN = 60;
function hhmm(v){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || "").trim());
  return m && +m[1] < 24 && +m[2] < 60 ? [+m[1], +m[2]] : null;
}
function fmtHHMM([h, m]){ return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"); }
/* plans saved before schema 7 only had labels: Breakfast, Snack, Lunch, Snack, Dinner */
function ensureSlots(plan){
  (plan && plan.days || []).forEach(d=>{
    let seenLunch = false;
    (d.meals || []).forEach(m=>{
      if(m.label==="Lunch") seenLunch = true;
      if(m.slot && MEAL_SLOTS.some(ms=>ms.id===m.slot)) return;
      m.slot = {Breakfast:"breakfast", Lunch:"lunch", Dinner:"dinner"}[m.label] || (seenLunch ? "snack2" : "snack1");
    });
  });
  return plan;
}
const FALLBACK_TIMES = {breakfast:"08:00", snack1:"10:30", lunch:"12:30", snack2:"16:00", dinner:"19:00"};
function stageTimes(months){ return Object.assign({}, FALLBACK_TIMES, stageFor(Math.max(6, months)).times); }
/* "HH:mm" for a slot on a date: today's one-off change, then theirs, then the stage's */
function mealTime(slot, date){
  const P = state.profile, iso = isoOf(date);
  const once = P.timesToday && P.timesToday.date===iso ? P.timesToday.times[slot] : null;
  return once || (P.mealTimes || {})[slot] || stageTimes(planMonths())[slot] || "12:00";
}
function atTime(date, hm){
  const [h, m] = hhmm(hm) || [12, 0];
  return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m);
}
function planDayIndex(date){
  return state.plan ? state.plan.days.findIndex(d=>d.name===DAY_ORDER[date.getDay()]) : -1;
}
function mealStatus(m, start, t){
  if(m.skipped) return "skipped";
  if(mealOffered(m)) return "offered";
  if(t < start) return "upcoming";
  return t - start < NOW_WINDOW_MIN*60000 ? "now" : "earlier";
}
/* a day's meals in time order: {m, k (index in the day), dayIdx, slot, time, start, status} */
function mealsOn(date){
  const dayIdx = planDayIndex(date);
  if(dayIdx < 0) return [];
  const t = now();
  return state.plan.days[dayIdx].meals.map((m, k)=>({m, k, dayIdx, slot:m.slot}))
    .filter(x=>x.m.items.length)
    .map(x=>{ x.time = mealTime(x.slot, date); x.start = atTime(date, x.time); x.status = mealStatus(x.m, x.start, t); return x; })
    .sort((a, b)=>a.start - b.start);
}
function tomorrowOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
/* the first meal still to come (or happening now) today, else tomorrow's first */
function nextMeal(){
  const t = now();
  const today = mealsOn(t).find(x=>x.status==="upcoming" || x.status==="now");
  if(today) return Object.assign(today, {when:"today"});
  const first = mealsOn(tomorrowOf(t))[0];
  return first ? Object.assign(first, {when:"tomorrow"}) : null;
}

/* times and dates in the reader's own locale and clock (12 or 24 h), never a fixed format */
const FMT = {};
function fmtTime(d){ return (FMT.t = FMT.t || new Intl.DateTimeFormat(undefined, {hour:"numeric", minute:"2-digit"})).format(d); }

/* is this food new to them? (only once something has been offered, so a first week isn't all "new") */
function isNewFood(item){
  const ex = state.exposures || {};
  return Object.keys(ex).length > 0 && !ex[foodKey(baseName(item))];
}
const upper1 = t=>t.charAt(0).toUpperCase() + t.slice(1);
/* "Lentils and sweet potato." */
function foodsLine(m){ return upper1(listJoin(m.items.map(i=>lower1(baseName(i))))) + "."; }

/* The headline, from the clock and the plan: the first rule that applies.
   Returns {kind, headline, title, key, next, announce}; key changes only when the
   state does (so the live region speaks once, not every minute). */
function headlineNow(){
  const P = state.profile, name = P.name || "", months = ageNow();
  if(months < 6 && !P.exploreEarly) return {kind:"milk", headline:say("home.headline.milk", {name}), title:say("home.title.plain"), key:"milk"};
  if(!state.plan || !state.plan.days.some(d=>d.meals.some(m=>m.items.length))) return {kind:"empty", headline:say("home.headline.empty"), title:say("home.title.plain"), key:"empty"};
  const t = now(), today = mealsOn(t), nx = nextMeal();
  const v = x=>({meal:x.m.label, time:fmtTime(x.start)});
  if(nx && nx.when==="today"){
    if(nx.status==="now") return {kind:"now", next:nx, headline:say("home.headline.now", v(nx)), title:say("home.title.now", v(nx)), key:"now:"+nx.slot, announce:say("home.announce.now", v(nx))};
    const mins = Math.max(1, Math.ceil((nx.start - t) / 60000));
    if(mins < 60) return {kind:"soon", next:nx, headline:say("home.headline.soon", Object.assign(v(nx), {n:mins})), title:say("home.title.soon", Object.assign(v(nx), {n:mins})), key:"soon:"+nx.slot};
    return {kind:"at", next:nx, headline:say("home.headline.at", v(nx)), title:say("home.title.at", v(nx)), key:"at:"+nx.slot};
  }
  // today is over: done if every meal was offered (or skipped); otherwise just what's next
  const done = today.length > 0 && today.every(x=>x.status==="offered" || x.status==="skipped");
  if(done) return {kind:"done", next:nx, headline:say("home.headline.done"), title:nx ? say("home.title.tomorrow", v(nx)) : say("home.title.plain"), key:"done", announce:say("home.announce.done")};
  if(nx) return {kind:"tomorrow", next:nx, headline:say("home.headline.tomorrow", v(nx)), title:say("home.title.tomorrow", v(nx)), key:"tomorrow"};
  return {kind:"empty", headline:say("home.headline.empty"), title:say("home.title.plain"), key:"empty"};
}

/* a whole word or phrase inside a food name: "egg" finds "Egg, well cooked"
   but not "eggplant"; "nuts" doesn't find "peanut butter" */
function hasWord(name, phrase){
  const esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + esc + "($|[^a-z])", "i").test(name);
}

/* ---------- safety: what never goes on the plate ----------
   Locked: the user can't remove these, and the generator, swaps and
   hand-added foods all go through the same check (lockedRule). `until` is
   the age in months from which a rule stops applying; no `until` = always,
   for 0-3. `unless` words make a safe preparation pass ("grapes,
   quartered"). Ages and lists are general guidance to check with a
   paediatric source. */
const LOCKED_RULES = [
  {id:"honey", label:"Honey", until:12, words:["honey"],
   why:"Honey isn't safe before 12 months: it can carry spores a baby's tummy can't handle yet."},
  {id:"cowsmilk", label:"Cow's milk as a drink", until:12, words:["cow's milk","cows milk","cow milk","glass of milk"],
   why:"Before 12 months, cow's milk as a drink can crowd out iron. A little in cooking is fine."},
  {id:"nuts", label:"Whole nuts", words:["whole nut","whole nuts","nuts","peanuts","almonds","almond","walnut","walnuts","hazelnut","hazelnuts","cashew","cashews","pistachio","pistachios","pecans"],
   unless:["butter","ground","flour","milk"],
   why:"Whole and chopped nuts are a choking risk for little ones. Smooth nut butters are fine."},
  {id:"grapes", label:"Whole grapes", words:["grape","grapes","whole grapes","cherry tomato","cherry tomatoes"],
   unless:["quartered","halved lengthways"],
   why:"Round foods like whole grapes can block a small airway. Quarter them lengthways."},
  {id:"hardraw", label:"Hard raw chunks", words:["raw carrot","raw apple","popcorn","hard sweet","hard sweets","hard candy","boiled sweets"],
   why:"Hard raw pieces and popcorn are choking risks. Cook until soft, or grate."},
  {id:"salt", label:"Added salt", words:["salt","salted","stock cube","bouillon","soy sauce","crisps"],
   why:"Little kidneys can't handle much salt. Season the grown-up portions after you've served theirs."},
  {id:"sugar", label:"Added sugar", words:["sugar","sugary","syrup","sweets","candy","juice","biscuits","cake"],
   unless:["snap"],
   why:"No added sugar keeps their taste for real food, and their new teeth happy."},
  {id:"unpasteurised", label:"Unpasteurised foods", words:["unpasteurised","unpasteurized","raw milk","raw cheese","raw egg","runny egg","brie","camembert","blue cheese"],
   why:"Unpasteurised milk and soft mould-ripened cheeses can carry listeria. Choose pasteurised."}
];
/* the rule a food breaks at this age, or null */
function lockedRule(name, months){
  const n = String(name);
  return LOCKED_RULES.find(r=>{
    if(r.until && months >= r.until) return false;
    if(!r.words.some(w=>hasWord(n, w))) return false;
    return !(r.unless || []).some(w=>hasWord(n, w));
  }) || null;
}

/* the common allergens, with the words that give them away in a food name */
const ALLERGENS = [

  {id:"milk",      label:"Milk",           emoji:"🥛", words:["milk","yogurt","yoghurt","cheese","ricotta","cream","kefir"]},

  {id:"wheat",     label:"Wheat / gluten", emoji:"🌾", words:["wheat","bread","toast","pasta","couscous","flour","oat","oats","oatmeal","barley","rye"]},
  {id:"soy",       label:"Soy",            emoji:"🫘", words:["soy","soya","tofu","edamame"]},

/* foods whose allergens don't show in the name */
const HIDDEN_ALLERGENS = {"Beef meatballs, soft":["egg","wheat"]};
function allergensOf(name){
  const ids = ALLERGENS.filter(a=>a.words.some(w=>hasWord(name, w))).map(a=>a.id);
  return [...new Set(ids.concat(HIDDEN_ALLERGENS[name] || []))];
}
/* Allergy is strict: the food never appears. A typed allergy ("kiwi")
   blocks foods with that word; one naming an allergen ("egg") blocks
   everything carrying it. */
function allergyMatch(name, profile){
  const own = allergensOf(name);
  if(own.some(a=>(profile.allergens||{})[a]==="avoid")) return true;
  return (profile.avoid||[]).some(x=>x.kind==="allergy" && (
    hasWord(name, x.name) || ALLERGENS.some(a=>a.words.some(w=>hasWord(x.name, w)) && own.includes(a.id))));
}
/* Dislike is soft: it just comes up less often. */
function dislikeMatch(name, profile){
  return (profile.avoid||[]).some(x=>x.kind==="dislike" && hasWord(name, x.name));
}
/* the single gate every food passes: the generator, swaps, hand-added */
function isAllowed(food, months, profile){
  if(food.min > months || (food.max && food.max < months)) return false;
  if(lockedRule(food.name, months)) return false;
  return !allergyMatch(food.name, profile);
}

/* Marking a meal: ate it, ate some, or refused. Any mark means it was
   served, so stock goes down; all and some count for variety; every first
   mark counts as one more exposure to that food (refusal is normal and
   still counts: it can take 10-15 tries). */
/* why a hand-added food can't go on the plate, or "" */
function keepOutReason(name){
  const r = lockedRule(name, ageNow());
  if(r) return `${r.label} stays off the menu for now. ${r.why}`;
  if(allergyMatch(name, state.profile)) return `${name} is on their keep-out list, so we'll leave it off.`;
  return "";
}
/* Offered means "I put this in front of them". It counts the food as tried
   (exposures, variety) and takes its portion from stock; undoing puts it back. */
function setOffered(item, on){
  const was = !!item.offered;
  if(on && !was){
    const k = foodKey(baseName(item));
    state.exposures[k] = (state.exposures[k] || 0) + 1;
  }else if(!on && was){
    const k = foodKey(baseName(item));
    if(state.exposures[k]) state.exposures[k]--;
    if(!state.exposures[k]) delete state.exposures[k];
  }
  item.offered = !!on;
  if(was!==item.offered) useStock(item);
}
function mealOffered(m){ return m.items.length > 0 && m.items.every(i=>i.offered); }

/* ---------- state ---------- */
const STORE_KEY = "toddlerMealPlanner.v1";
const SCHEMA_VERSION = 8;
let state = loadState();

function freshProfile(){

          allergens:{},      // {egg:"avoid"|"ok"}
          avoid:[],          // [{name, kind:"allergy"|"dislike"}]
          priorities:[],     // up to 3 PRIORITIES ids
          staples:[], remindAt:null, lastStage:null,
          mealTimes:{},      // the family's own times, {lunch:"12:00"}; the stage's defaults fill the rest
          timesToday:null,   // {date:"2026-10-22", times:{lunch:"13:15"}}: one day's change
          mealTimesConfirmed:false,
          people:[],         // [{id, name, phone, role}]: on this device only, never in a link
          self:{phone:""},   // where notes to self go (optional)
          firstDay:null,     // the day onboarding finished: no late questions on day one
          appearance:"auto"};  // auto (follows the system) · light · dark
}
function freshState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    plan: ensureSlots(defaultPlan()),
    variety: JSON.parse(JSON.stringify(DEFAULT_VARIETY)),
    manualCovered: {},   // { "protein::Salmon": true }
    stock: {},           // what's at home: { "oatmeal": {name, g:number|null, plenty:bool} }
    extras: [],          // non-food shopping: [{id, name, qty, checked}]
    history: [],
    profile: freshProfile(),
    exposures: {},       // how many times each food has been offered: {"banana": 3}
    openCard: "meals",   // the one card that's open, or null
    groceryFilter: "week", // "today" | "next3" | "week" (the rest of the planned week)
    weekStarted: todayISO(),
    foods: {},           // per food: {safety:"notyet"|"introduced"|"keepout", safetyOn, noReactionOn, preference}
    moment: {},          // {date, later:[keys]}: moment lines put away for today
    asked: {},           // late questions already asked: {mealTimes:"2026-10-22", …}
    prepped: {},         // {date, done:[suggestion ids]}
    shown: {}            // how often a suggestion has shown: {salt: 2, saltDay:"2026-10-22"}

function loadState(){
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw) return freshState();
  let saved;
  try{ saved = JSON.parse(raw); }catch(e){ return freshState(); }
  return migrate(saved);
}

/* An older save's age, in months. CHICHO itself only ever stored months
   (createAge: 10), but accept years too: ageYears: 2, ageMonths: 9,
   age: {years:1, months:3}, or text like "2 years", "1.5 y", "9 months".
   A bare number means months. null when there's nothing readable. */
function savedAgeMonths(saved){
  const num = v=>typeof v==="number" && Number.isFinite(v) ? v : null;
  const text = v=>{
    if(typeof v!=="string" || !v.trim()) return null;
    const t = v.trim().toLowerCase().replace(",", ".");
    let y = t.match(/(\d+(?:\.\d+)?)\s*(?:y|yr|yrs|year|years)\b/), m = t.match(/(\d+(?:\.\d+)?)\s*(?:m|mo|mos|month|months)\b/);
    if(y || m) return (y ? Number(y[1])*12 : 0) + (m ? Number(m[1]) : 0);
    return /^\d+(\.\d+)?$/.test(t) ? Number(t) : null;
  };
  const parts = o=>o && typeof o==="object" && (num(o.years)!==null || num(o.months)!==null)
    ? (num(o.years) || 0)*12 + (num(o.months) || 0) : null;
  const tries = [num(saved.ageMonths), num(saved.ageYears)!==null ? saved.ageYears*12 : null,
                 num(saved.createAge), text(saved.createAge), parts(saved.age), text(saved.age), num(saved.age)];
  const hit = tries.find(v=>v!==null && v>=0);
  return hit===undefined ? null : hit;
}

/* Saved states predate later features, so fill in anything the running code
   expects but an older save never wrote. Saved values always win. */
function migrate(saved){
  const s = Object.assign(freshState(), saved);

  if(!s.plan || !Array.isArray(s.plan.days) || s.plan.days.length===0) s.plan = defaultPlan();

  // keep only categories this build knows about, and add any it's missing
  const variety = {};
  Object.keys(DEFAULT_VARIETY).forEach(cat=>{
    const foods = s.variety && Array.isArray(s.variety[cat]) ? s.variety[cat] : null;
    variety[cat] = foods ? foods.slice() : DEFAULT_VARIETY[cat].slice();
  });
  s.variety = variety;

  if(!s.manualCovered || typeof s.manualCovered!=="object") s.manualCovered = {};
  if(!Array.isArray(s.history)) s.history = [];
  // stock and extras replace the stored grocery list (schema 5): extras keep
  // their tick, and plan foods already ticked as bought count as at home
  if(!s.stock || typeof s.stock!=="object" || Array.isArray(s.stock)) s.stock = {};
  if(!Array.isArray(s.extras)) s.extras = [];
  if(Array.isArray(saved.grocery) && !Array.isArray(saved.extras)){
    saved.grocery.forEach(g=>{
      if(!g || !g.name) return;
      if(g.manual){ s.extras.push({id:g.id||uid(), name:g.name, qty:g.qty||"", checked:!!g.checked}); return; }
      if(!g.checked) return;
      const k = foodKey(g.name);
      if(s.stock[k]) return;
      const grams = (g.entries||[]).reduce((t,e)=>t+(gramsOf(e.qty)||0), 0);
      s.stock[k] = {name:g.name, g: grams || null, plenty:false};
    });
  }
  delete s.grocery;
  if(!GROCERY_FILTERS.some(f=>f.key===s.groceryFilter)) s.groceryFilter = "week";

  delete s.mascotPos;      // the floating mascot is gone

  delete s.menuHintSeen;   // the mascot menu is gone
  if(s.openCard!==null && !["meals","food","variety","plan"].includes(s.openCard)) s.openCard = "meals";
  // schema 6: a profile with a birth date replaces the stored age (always
  // months: 10, 12 or 18 before stages, 0-36 after), and the one "never
  // include" list becomes dislikes; anything a locked rule covers drops,
  // because it's locked now
  const prof = Object.assign(freshProfile(), saved.profile && typeof saved.profile==="object" ? saved.profile : {});
  if(!["auto","light","dark"].includes(prof.appearance)) prof.appearance = "auto";
  if(!prof.birthDate || isNaN(localDate(prof.birthDate))){
    const age = savedAgeMonths(saved);
    prof.birthDate = birthDateFromMonths(age===null ? 10 : Math.min(AGE_MAX, Math.max(0, Math.round(age))));
  }
  if(!saved.profile && Array.isArray(saved.excludedFoods)){
    saved.excludedFoods.forEach(f=>{
      if(typeof f!=="string" || !f.trim()) return;
      const name = f.trim();
      if(lockedRule(name, 0)) return;
      if(!prof.avoid.some(a=>a.name.toLowerCase()===name.toLowerCase())) prof.avoid.push({name, kind:"dislike"});
    });
  }
  prof.avoid = (Array.isArray(prof.avoid) ? prof.avoid : [])
    .filter(a=>a && typeof a.name==="string" && a.name.trim())
    .map(a=>({name:a.name.trim(), kind:a.kind==="allergy" ? "allergy" : "dislike"}));
  const al = {};
  Object.entries(prof.allergens || {}).forEach(([k,v])=>{ if(ALLERGENS.some(a=>a.id===k) && (v==="avoid" || v==="ok")) al[k] = v; });
  prof.allergens = al;
  prof.priorities = (Array.isArray(prof.priorities) ? prof.priorities : []).filter(id=>PRIORITIES.some(p=>p.id===id)).slice(0,3);
  if(!saved.profile) prof.returning = true;   // an older save: their week is worth keeping
  s.profile = prof;
  delete s.createAge; delete s.ageYears; delete s.ageMonths; delete s.age;
  delete s.excludedFoods;
  if(!s.exposures || typeof s.exposures!=="object" || Array.isArray(s.exposures)) s.exposures = {};
  // schema 8: offered replaces the old marks. A food that was marked in any way
  // was put in front of them, so it's offered; how it went moves to the meal
  // (ate some → "some", refused → "nottoday"; nothing counts against them)
  s.plan.days.forEach(d=>d.meals.forEach(m=>{
    const marks = m.items.map(i=>i.ate);   // legacy: the schema-7 mark
    m.items.forEach(i=>{ i.offered = !!(i.offered || i.ate || i.eaten); delete i.ate; delete i.eaten; });   // legacy: old field names
    if(!m.outcome && marks.length && marks.every(Boolean)){
      m.outcome = marks.every(a=>a==="refused") ? "nottoday" : marks.some(a=>a==="some" || a==="refused") ? "some" : null;
    }
    if(!["loved","some","nottoday"].includes(m.outcome)) delete m.outcome;
  }));
  if(!s.foods || typeof s.foods!=="object" || Array.isArray(s.foods)) s.foods = {};
  prof.people = (Array.isArray(prof.people) ? prof.people : []).filter(x=>x && typeof x.name==="string" && x.name.trim())
    .map(x=>({id:x.id || uid(), name:x.name.trim(), phone:normPhone(x.phone), role:x.role || ""}));
  prof.self = {phone:normPhone(prof.self && prof.self.phone)};
  if(!prof.firstDay) prof.firstDay = prof.onboarded ? (s.weekStarted || todayISO()) : null;
  if(prof.mealTimesConfirmed===undefined) prof.mealTimesConfirmed = Object.keys(prof.mealTimes || {}).length > 0;
  ["day","moment","asked","prepped","shown"].forEach(k=>{ if(!s[k] || typeof s[k]!=="object") s[k] = {}; });
  // schema 7: every meal knows its slot (older plans only had labels), and
  // meal times are the family's own overrides of the stage's defaults
  ensureSlots(s.plan);
  const mt = {};
  Object.entries(prof.mealTimes || {}).forEach(([k,v])=>{ if(MEAL_SLOTS.some(ms=>ms.id===k) && hhmm(v)) mt[k] = fmtHHMM(hhmm(v)); });
  prof.mealTimes = mt;
  if(!(prof.timesToday && typeof prof.timesToday.date==="string" && prof.timesToday.times && typeof prof.timesToday.times==="object")) prof.timesToday = null;

  s.schemaVersion = SCHEMA_VERSION;
  return s;
}

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
/* phone numbers keep only digits and a leading + ("+34 600-11 22" → "+346001122") */
function normPhone(v){ const t = String(v || "").trim(); return (t.startsWith("+") ? "+" : "") + t.replace(/\D/g, ""); }


/* ---------- view switching ---------- */
let currentDay = 0;

/* ---------- motion helpers ----------
   Rows are rebuilt on every change, so a CSS transition never sees the
   before state. Instead the one row that changed is marked (justChanged)
   and plays its entrance once; a row on its way out slides off first and
   the re-render waits for it. With reduced motion everything is instant. */
let justChanged = null;
function calm(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; }
/* ---------- the on-screen keyboard ----------
   The visual viewport shrinks when the keyboard opens (the layout viewport
   doesn't, on iOS). --kb is the keyboard's height and --vvh what's left, so
   the sheet and onboarding can sit on top of it. Tests stand in a fake
   viewport with window.__vv = {height, offsetTop}. */
function viewportNow(){ const v = window.__vv || window.visualViewport; return v ? {height:v.height, offsetTop:v.offsetTop || 0} : {height:innerHeight, offsetTop:0}; }
const kbListeners = [];
function kbSync(){
  const v = viewportNow(), kb = Math.max(0, Math.round(innerHeight - v.height - v.offsetTop));
  const root = document.documentElement;
  root.style.setProperty("--kb", kb + "px");
  root.style.setProperty("--vvh", Math.round(v.height) + "px");
  root.classList.toggle("kb-open", kb > 80);
  kbListeners.forEach(f=>f(kb, v));
}
if(window.visualViewport){ visualViewport.addEventListener("resize", kbSync); visualViewport.addEventListener("scroll", kbSync); }
addEventListener("resize", kbSync);
kbSync();
/* ---------- PLAN RENDER ---------- */
/* Plan days stay in their canonical Mon–Sun order (grocery badges depend on it);
   only the tab strip is rotated so today leads. */
function dayDisplayOrder(){
  const days = state.plan.days;
  const start = days.findIndex(d=>d.name===DAY_ORDER[now().getDay()]);
  if(start < 0) return days.map((_,i)=>i);   // custom plan with no matching day name
  return days.map((_,k)=>(start+k)%days.length);
}

/* ---------- calendar ----------
   The plan is a week that starts again on the weekday it was started (the day
   it was applied, or "Start new week"), so what's left of it runs from today
   up to the day before that weekday comes round again. */
function localDate(iso){
  const [y,m,d] = String(iso).split("-").map(Number);
  return new Date(y, m-1, d);
}
function daysLeftInWeek(){
  const start = localDate(state.weekStarted);
  const anchor = isNaN(start) ? now().getDay() : start.getDay();
  return ((anchor - now().getDay() + 7) % 7) || 7;
}

/* The plan's days in display order lead with today, so position k is k days from now. */
function dateForDay(idx){
  const pos = dayDisplayOrder().indexOf(idx), t = now();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate() + (pos<0 ? 0 : pos));   // local calendar days, never 24h steps
}

/* A tiny celebration: six leaves and sparkles burst from a point and
   settle (transform and opacity only, 600 ms, never in the way of a tap).
   With reduced motion, nothing moves; the words carry the moment. */
function burst(from){
  if(calm() || !from || !from.getBoundingClientRect) return;
  const r = from.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
  const layer = document.createElement("div");
  layer.className = "burst"; layer.setAttribute("aria-hidden", "true");
  layer.style.left = x + "px"; layer.style.top = y + "px";
  const shapes = ["leaf","dot","leaf","star","leaf","dot"];
  shapes.forEach((sh, k)=>{
    const p = document.createElement("i");
    p.className = "bp " + sh;
    layer.appendChild(p);
    const a = (k/shapes.length)*Math.PI*2 - Math.PI/2 + (Math.random()-.5)*.5, d = 26 + Math.random()*18;
    p.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:0},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d*.6}px), calc(-50% + ${Math.sin(a)*d*.6}px)) scale(1) rotate(${k*40}deg)`, opacity:1, offset:.35},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d + 8}px)) scale(.6) rotate(${k*70}deg)`, opacity:0}
    ], {duration:620, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"});
  });
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 700);
}
/* a light tap of the phone where it's supported (never on its own) */
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

/* a quiet line for screen readers after a mark ("Lunch: ate it") */
function announce(text){
  const el = document.getElementById("liveStatus");
  el.textContent = "";
  setTimeout(()=>{ el.textContent = text; }, 30);
}

const SLOT_OF = {Breakfast:"breakfast", Snack:"snack", Lunch:"lunch", Dinner:"dinner"};
/* a similar food for the same meal, still passing every safety check */
function swapItem(m, k){
  const item = m.items[k], months = planMonths(), st = stageFor(months);
  const slot = SLOT_OF[m.label] || "lunch";
  const taken = new Set(m.items.map(i=>i.name));
  const pool = FOOD_POOL.filter(f=>f.cats[0]===item.cats[0] && f.slots.includes(slot) && !taken.has(f.name) && isAllowed(f, months, state.profile));
  if(!pool.length) return false;
  const ctx = planContext(months, state.profile), dayCtx = {taken:new Set(), colours:new Set(), newCount:0};
  const ws = pool.map(f=>weightFor(f, ctx, dayCtx));
  let r = Math.random() * ws.reduce((a,b)=>a+b, 0), j = 0;
  for(; j<ws.length-1; j++){ r -= ws[j]; if(r <= 0) break; }
  if(item.offered){ setOffered(item, false); }   // put back what it took from stock
  const fresh = dish(pool[j], st);
  m.items[k] = fresh;
  justChanged = fresh.id;
  save();
  return true;
}

/* ---------- GROCERY ---------- */
/* the days a shopping window covers: today, the next three, or what's left
   of the planned week (the calendar's band) */
function windowDays(key){
  const order = dayDisplayOrder();
  const n = key==="today" ? 1 : key==="next3" ? 3 : Math.min(daysLeftInWeek(), order.length);
  return new Set(order.slice(0, n).map(i=>state.plan.days[i].name));
}
/* ---------- KITCHEN: what to buy for the window, what's at home ----------
   Only stock and extras are stored. What to buy is worked out on every
   render: the plan's portions not yet offered, on the window's days, minus
   what's at home. Quantities count when they're in grams ("50 g"); a food
   with no gram amount is just needed, or covered once it's at home. */
function foodKey(name){ return String(name).trim().toLowerCase(); }
function gramsOf(qty){
  const m = String(qty||"").match(/^\s*(\d+(?:[.,]\d+)?)\s*g\b/i);
  return m ? parseFloat(m[1].replace(",", ".")) : null;
}
function fmtG(g){
  if(g < 1000) return Math.round(g) + " g";
  return (Math.round(g/100)/10).toString().replace(/\.0$/, "") + " kg";
}
