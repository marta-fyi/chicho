/* ---------- the child's profile: age from a birth date ----------
   Age is never stored, only the birth date; months are worked out from
   today, so the stage moves on by itself. */
function ageMonths(iso, at){
  const b = localDate(iso), n = at || now();
  if(isNaN(b)) return null;
  let m = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) m--;
  return Math.max(0, m);
}
/* the birth date that makes a child m months old today (same day of the
   month, clamped to the month's length) */
function birthDateFromMonths(m, at){
  const n = at || now();
  const y = n.getFullYear(), mo = n.getMonth() - m;
  const first = new Date(y, mo, 1);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const d = new Date(first.getFullYear(), first.getMonth(), Math.min(n.getDate(), days));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ageNow(){
  const m = state.profile && state.profile.birthDate ? ageMonths(state.profile.birthDate) : null;
  return m===null ? 10 : m;
}

/* ---------- meal times ----------
   Each stage has default times per slot; the family can set their own
   (profile.mealTimes), and a meal's peek can move one meal for today only
   (profile.timesToday). Times are local "HH:mm"; a meal's moment is built
   from the calendar date, so daylight-saving days land on the right hour.
   A meal is upcoming, now (from its time until GRACE_MIN later), past
   (unlogged, never nagged), eaten (every food marked) or skipped. */
const GRACE_MIN = 90;
function hhmm(v){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || "").trim());
  return m && +m[1] < 24 && +m[2] < 60 ? [+m[1], +m[2]] : null;
}
function fmtHHMM([h, m]){ return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"); }
/* plans saved before schema 7 only had labels: Breakfast, Snack, Lunch, Snack, Dinner */
function ensureSlots(plan){
  (plan && plan.days || []).forEach(d=>{
    let seenLunch = false;
    (d.meals || []).forEach(m=>{
      if(m.label==="Lunch") seenLunch = true;
      if(m.slot && MEAL_SLOTS.some(ms=>ms.id===m.slot)) return;
      m.slot = {Breakfast:"breakfast", Lunch:"lunch", Dinner:"dinner"}[m.label] || (seenLunch ? "snack2" : "snack1");
    });
  });
  return plan;
}
const FALLBACK_TIMES = {breakfast:"08:00", snack1:"10:30", lunch:"12:30", snack2:"16:00", dinner:"19:00"};
function stageTimes(months){ return Object.assign({}, FALLBACK_TIMES, stageFor(Math.max(6, months)).times); }
/* "HH:mm" for a slot on a date: today's one-off change, then theirs, then the stage's */
function mealTime(slot, date){
  const P = state.profile, iso = isoOf(date);
  const once = P.timesToday && P.timesToday.date===iso ? P.timesToday.times[slot] : null;
  return once || (P.mealTimes || {})[slot] || stageTimes(planMonths())[slot] || "12:00";
}
function atTime(date, hm){
  const [h, m] = hhmm(hm) || [12, 0];
  return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m);
}
function planDayIndex(date){
  return state.plan ? state.plan.days.findIndex(d=>d.name===DAY_ORDER[date.getDay()]) : -1;
}
function mealStatus(m, start, t){
  if(m.skipped) return "skipped";
  if(m.items.length && m.items.every(i=>i.ate)) return "eaten";
  if(t < start) return "upcoming";
  return t - start < GRACE_MIN*60000 ? "now" : "past";
}
/* a day's meals in time order: {m, k (index in the day), dayIdx, slot, time, start, status} */
function mealsOn(date){
  const dayIdx = planDayIndex(date);
  if(dayIdx < 0) return [];
  const t = now();
  return state.plan.days[dayIdx].meals.map((m, k)=>({m, k, dayIdx, slot:m.slot}))
    .filter(x=>x.m.items.length)
    .map(x=>{ x.time = mealTime(x.slot, date); x.start = atTime(date, x.time); x.status = mealStatus(x.m, x.start, t); return x; })
    .sort((a, b)=>a.start - b.start);
}
function tomorrowOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
/* the first meal still to come (or happening now) today, else tomorrow's first */
function nextMeal(){
  const t = now();
  const today = mealsOn(t).find(x=>x.status==="upcoming" || x.status==="now");
  if(today) return Object.assign(today, {when:"today"});
  const first = mealsOn(tomorrowOf(t))[0];
  return first ? Object.assign(first, {when:"tomorrow"}) : null;
}

/* times and dates in the reader's own locale and clock (12 or 24 h), never a fixed format */
const FMT = {};
function fmtTime(d){ return (FMT.t = FMT.t || new Intl.DateTimeFormat(undefined, {hour:"numeric", minute:"2-digit"})).format(d); }
function fmtDateTime(d){
  return (FMT.d = FMT.d || new Intl.DateTimeFormat(undefined, {weekday:"long", day:"numeric", month:"long"})).format(d) + ", " + fmtTime(d);
}

/* is this food new to them? (only once something has been offered, so a first week isn't all "new") */
function isNewFood(item){
  const ex = state.exposures || {};
  return Object.keys(ex).length > 0 && !ex[foodKey(baseName(item))];
}
const upper1 = t=>t.charAt(0).toUpperCase() + t.slice(1);
/* "Lentils and sweet potato." */
function foodsLine(m){ return upper1(listJoin(m.items.map(i=>lower1(baseName(i))))) + "."; }

/* The top of home, from the clock and the plan: the first rule that applies.
   Returns {kind, headline, support, action, title, key}; key changes only when
   the state does (so the live region announces "Lunch time" once, not every minute). */
function homeMoment(){
  const P = state.profile, name = P.name || "", months = ageNow();
  if(months < 6 && !P.exploreEarly){
    return {kind:"milk", headline:say("home.headline.milk", {name}), support:say("home.milkLine", {n:Math.max(1, 6 - months)}),
            title:say("home.title.plain"), key:"milk"};
  }
  if(!state.plan || !state.plan.days.some(d=>d.meals.some(m=>m.items.length))){
    return {kind:"empty", headline:say("home.headline.empty"), action:say("home.emptyAction"), title:say("home.title.plain"), key:"empty"};
  }
  const t = now(), today = mealsOn(t), nx = nextMeal();
  const v = x=>({meal:x.m.label, time:fmtTime(x.start), food:x.m.items[0] ? lower1(baseName(x.m.items[0])) : ""});
  const about = x=>{
    const fresh = x.m.items.find(isNewFood);
    return fresh ? say("home.newFood", {food:upper1(baseName(fresh))}) : foodsLine(x.m);
  };
  if(nx && nx.when==="today"){
    if(nx.status==="now") return {kind:"now", next:nx, headline:say("home.headline.now", v(nx)), support:about(nx),
                                  title:say("home.title.now", v(nx)), key:"now:"+nx.slot, announce:say("home.announce.now", v(nx))};
    const mins = Math.max(1, Math.ceil((nx.start - t) / 60000));
    if(mins < 60) return {kind:"soon", next:nx, headline:say("home.headline.soon", Object.assign(v(nx), {n:mins})), support:about(nx),
                          title:say("home.title.soon", Object.assign(v(nx), {n:mins})), key:"soon:"+nx.slot};
    return {kind:"at", next:nx, headline:say("home.headline.at", v(nx)), support:about(nx), title:say("home.title.at", v(nx)), key:"at:"+nx.slot};
  }
  // today is over: cleared if every meal was marked (or skipped), otherwise just what's next, no nagging
  const cleared = today.length > 0 && today.every(x=>x.status==="eaten" || x.status==="skipped");
  if(!nx) return {kind:cleared ? "cleared" : "done", headline:cleared ? say("home.headline.cleared") : say("home.headline.empty"),
                  support:say("home.support", null, "home"), title:say("home.title.plain"), key:cleared ? "cleared" : "done"};
  if(cleared) return {kind:"cleared", next:nx, headline:say("home.headline.cleared"), support:say("home.tomorrowLine", v(nx)),
                      title:say("home.title.tomorrow", v(nx)), key:"cleared", announce:say("home.announce.cleared")};
  return {kind:"tomorrow", next:nx, headline:say("home.headline.tomorrow", v(nx)), support:about(nx),
          title:say("home.title.tomorrow", v(nx)), key:"tomorrow"};
}

/* a whole word or phrase inside a food name: "egg" finds "Egg, well cooked"
   but not "eggplant"; "nuts" doesn't find "peanut butter" */
function hasWord(name, phrase){
  const esc = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + esc + "($|[^a-z])", "i").test(name);
}

/* ---------- safety: what never goes on the plate ----------
   Locked: the user can't remove these, and the generator, swaps and
   hand-added foods all go through the same check (lockedRule). `until` is
   the age in months from which a rule stops applying; no `until` = always,
   for 0-3. `unless` words make a safe preparation pass ("grapes,
   quartered"). Ages and lists are general guidance to check with a
   paediatric source. */
const LOCKED_RULES = [
  {id:"honey", label:"Honey", until:12, words:["honey"],
   why:"Honey isn't safe before 12 months: it can carry spores a baby's tummy can't handle yet."},
  {id:"cowsmilk", label:"Cow's milk as a drink", until:12, words:["cow's milk","cows milk","cow milk","glass of milk"],
   why:"Before 12 months, cow's milk as a drink can crowd out iron. A little in cooking is fine."},
  {id:"nuts", label:"Whole nuts", words:["whole nut","whole nuts","nuts","peanuts","almonds","almond","walnut","walnuts","hazelnut","hazelnuts","cashew","cashews","pistachio","pistachios","pecans"],
   unless:["butter","ground","flour","milk"],
   why:"Whole and chopped nuts are a choking risk for little ones. Smooth nut butters are fine."},
  {id:"grapes", label:"Whole grapes", words:["grape","grapes","whole grapes","cherry tomato","cherry tomatoes"],
   unless:["quartered","halved lengthways"],
   why:"Round foods like whole grapes can block a small airway. Quarter them lengthways."},
  {id:"hardraw", label:"Hard raw chunks", words:["raw carrot","raw apple","popcorn","hard sweet","hard sweets","hard candy","boiled sweets"],
   why:"Hard raw pieces and popcorn are choking risks. Cook until soft, or grate."},
  {id:"salt", label:"Added salt", words:["salt","salted","stock cube","bouillon","soy sauce","crisps"],
   why:"Little kidneys can't handle much salt. Season the grown-up portions after you've served theirs."},
  {id:"sugar", label:"Added sugar", words:["sugar","sugary","syrup","sweets","candy","juice","biscuits","cake"],
   unless:["snap"],
   why:"No added sugar keeps their taste for real food, and their new teeth happy."},
  {id:"unpasteurised", label:"Unpasteurised foods", words:["unpasteurised","unpasteurized","raw milk","raw cheese","raw egg","runny egg","brie","camembert","blue cheese"],
   why:"Unpasteurised milk and soft mould-ripened cheeses can carry listeria. Choose pasteurised."}
];
/* the rule a food breaks at this age, or null */
function lockedRule(name, months){
  const n = String(name);
  return LOCKED_RULES.find(r=>{
    if(r.until && months >= r.until) return false;
    if(!r.words.some(w=>hasWord(n, w))) return false;
    return !(r.unless || []).some(w=>hasWord(n, w));
  }) || null;
}

/* the common allergens, with the words that give them away in a food name */
const ALLERGENS = [
  {id:"egg",       label:"Egg",            emoji:"🥚", words:["egg","eggs","omelette","mayonnaise"]},
  {id:"milk",      label:"Milk",           emoji:"🥛", words:["milk","yogurt","yoghurt","cheese","ricotta","cream","kefir"]},
  {id:"peanut",    label:"Peanut",         emoji:"🥜", words:["peanut","peanuts","groundnut"]},
  {id:"treenuts",  label:"Tree nuts",      emoji:"🌰", words:["almond","cashew","walnut","hazelnut","pistachio","pecan","nut butter"]},
  {id:"wheat",     label:"Wheat / gluten", emoji:"🌾", words:["wheat","bread","toast","pasta","couscous","flour","oat","oats","oatmeal","barley","rye"]},
  {id:"soy",       label:"Soy",            emoji:"🫘", words:["soy","soya","tofu","edamame"]},
  {id:"fish",      label:"Fish",           emoji:"🐟", words:["fish","salmon","cod","hake","tuna","sardine","mackerel"]},
  {id:"shellfish", label:"Shellfish",      emoji:"🦐", words:["shrimp","prawn","prawns","crab","lobster","mussel","mussels","clam","squid"]},
  {id:"sesame",    label:"Sesame",         emoji:"🌱", words:["sesame","tahini","hummus"]}
];
/* foods whose allergens don't show in the name */
const HIDDEN_ALLERGENS = {"Beef meatballs, soft":["egg","wheat"]};
function allergensOf(name){
  const ids = ALLERGENS.filter(a=>a.words.some(w=>hasWord(name, w))).map(a=>a.id);
  return [...new Set(ids.concat(HIDDEN_ALLERGENS[name] || []))];
}
/* Allergy is strict: the food never appears. A typed allergy ("kiwi")
   blocks foods with that word; one naming an allergen ("egg") blocks
   everything carrying it. */
function allergyMatch(name, profile){
  const own = allergensOf(name);
  if(own.some(a=>(profile.allergens||{})[a]==="avoid")) return true;
  return (profile.avoid||[]).some(x=>x.kind==="allergy" && (
    hasWord(name, x.name) || ALLERGENS.some(a=>a.words.some(w=>hasWord(x.name, w)) && own.includes(a.id))));
}
/* Dislike is soft: it just comes up less often. */
function dislikeMatch(name, profile){
  return (profile.avoid||[]).some(x=>x.kind==="dislike" && hasWord(name, x.name));
}
/* the single gate every food passes: the generator, swaps, hand-added */
function isAllowed(food, months, profile){
  if(food.min > months || (food.max && food.max < months)) return false;
  if(lockedRule(food.name, months)) return false;
  return !allergyMatch(food.name, profile);
}

/* ---------- dish names, prep tips, "why this food" ---------- */
function listJoin(a){ return a.length<=1 ? (a[0]||"") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
const baseName = i=>i.name.split(",")[0].trim();
const lower1 = t=>t.charAt(0).toLowerCase() + t.slice(1);
/* "Oatmeal with banana", "Lentils and sweet potato mash", "Chicken with
   carrots and rice": the meal's foods read as one dish */
function dishName(m, opts){
  const afters = !(opts && opts.afters===false);
  if(!m.items.length) return "";
  const byCat = c=>m.items.find(i=>i.cats[0]===c);
  if(m.label==="Snack") return listJoin(m.items.map((i,k)=>k ? lower1(baseName(i)) : baseName(i)));
  if(m.label==="Breakfast"){
    const lead = byCat("grain") || byCat("fruit") || m.items[0];
    const rest = m.items.filter(i=>i!==lead).map(i=>lower1(baseName(i)));
    return baseName(lead) + (rest.length ? " with " + listJoin(rest) : "");
  }
  const p = byCat("protein"), v = byCat("vegetable"), g = byCat("grain");
  const soft = m.items.map(i=>i.tex||"").find(t=>/purée|mash/.test(t));
  if(p && v && soft && m.items.length<=3 && !g){
    return `${baseName(p)} and ${lower1(baseName(v))} ${/purée/.test(soft) ? "purée" : "mash"}`;
  }
  // lunch and dinner: the main dish, and any fruit as the afters
  const fruit = m.items.filter(i=>i.cats[0]==="fruit");
  const mains = m.items.filter(i=>i.cats[0]!=="fruit");
  if(!mains.length) return listJoin(fruit.map((i,k)=>k ? lower1(baseName(i)) : baseName(i)));
  const lead = p || v || mains[0];
  const rest = mains.filter(i=>i!==lead).map(i=>lower1(baseName(i)));
  return baseName(lead) + (rest.length ? " with " + listJoin(rest) : "") +
         (fruit.length && afters ? ", then " + listJoin(fruit.map(i=>lower1(baseName(i)))) : "");
}

  "Hummus":"Look for a low-salt one, or blitz chickpeas with a little oil."
};
function prepTip(item){
  return PREP_TIPS[baseName(item)] || FORM_TIPS[FOOD_FORM[item.name] || CAT_FORM[item.cats[0]]] || "";
}
function whyFor(item){
  const food = FOOD_POOL.find(f=>f.name===item.name);
  const m = metaOf(item.name);
  if(food && food.iron) return "Iron-rich: from about 6 months their own iron stores start running low.";
  if(/salmon/i.test(item.name)) return "Oily fish brings omega-3 fats for a growing brain.";
  if(item.cats[0]==="vegetable") return "Another colour on the plate" + (m.colour ? `, a ${m.colour} one.` : ".");
  if(item.cats[0]==="fruit") return "Natural sweetness and vitamin C, which helps them absorb iron.";
  if(item.cats[0]==="fat") return "Healthy fats: little bodies need plenty of energy in small portions.";
  if(item.cats[0]==="grain") return "Steady energy, and a familiar base next to anything new.";
  return "Protein for growing muscles.";
}

/* Marking a meal: ate it, ate some, or refused. Any mark means it was
   served, so stock goes down; all and some count for variety; every first
   mark counts as one more exposure to that food (refusal is normal and
   still counts: it can take 10-15 tries). */
/* why a hand-added food can't go on the plate, or "" */
function keepOutReason(name){
  const r = lockedRule(name, ageNow());
  if(r) return `${r.label} stays off the menu for now. ${r.why}`;
  if(allergyMatch(name, state.profile)) return `${name} is on their keep-out list, so we'll leave it off.`;
  return "";
}
function setAte(item, v){
  const was = item.eaten;
  if(!item.ate && v){
    const k = foodKey(baseName(item));
    state.exposures[k] = (state.exposures[k] || 0) + 1;
  }
  item.ate = v || null;
  item.eaten = item.ate!==null;
  if(was!==item.eaten) useStock(item);
}

const STORE_KEY = "toddlerMealPlanner.v1";
const SCHEMA_VERSION = 7;

function freshProfile(){

}
function freshState(){
  return {

    plan: ensureSlots(defaultPlan()),
    variety: JSON.parse(JSON.stringify(DEFAULT_VARIETY)),
    manualCovered: {},   // { "protein::Salmon": true }

    extras: [],          // non-food shopping: [{id, name, qty, checked}]

function loadState(){
  const raw = localStorage.getItem(STORE_KEY);
  if(!raw) return freshState();
  let saved;
  try{ saved = JSON.parse(raw); }catch(e){ return freshState(); }
  return migrate(saved);
}

/* An older save's age, in months. CHICHO itself only ever stored months
   (createAge: 10), but accept years too: ageYears: 2, ageMonths: 9,
   age: {years:1, months:3}, or text like "2 years", "1.5 y", "9 months".
   A bare number means months. null when there's nothing readable. */
function savedAgeMonths(saved){
  const num = v=>typeof v==="number" && Number.isFinite(v) ? v : null;
  const text = v=>{
    if(typeof v!=="string" || !v.trim()) return null;
    const t = v.trim().toLowerCase().replace(",", ".");
    let y = t.match(/(\d+(?:\.\d+)?)\s*(?:y|yr|yrs|year|years)\b/), m = t.match(/(\d+(?:\.\d+)?)\s*(?:m|mo|mos|month|months)\b/);
    if(y || m) return (y ? Number(y[1])*12 : 0) + (m ? Number(m[1]) : 0);
    return /^\d+(\.\d+)?$/.test(t) ? Number(t) : null;
  };
  const parts = o=>o && typeof o==="object" && (num(o.years)!==null || num(o.months)!==null)
    ? (num(o.years) || 0)*12 + (num(o.months) || 0) : null;
  const tries = [num(saved.ageMonths), num(saved.ageYears)!==null ? saved.ageYears*12 : null,
                 num(saved.createAge), text(saved.createAge), parts(saved.age), text(saved.age), num(saved.age)];
  const hit = tries.find(v=>v!==null && v>=0);
  return hit===undefined ? null : hit;
}

/* Saved states predate later features, so fill in anything the running code
   expects but an older save never wrote. Saved values always win. */
function migrate(saved){
  const s = Object.assign(freshState(), saved);

  if(!s.plan || !Array.isArray(s.plan.days) || s.plan.days.length===0) s.plan = defaultPlan();

  // keep only categories this build knows about, and add any it's missing
  const variety = {};
  Object.keys(DEFAULT_VARIETY).forEach(cat=>{
    const foods = s.variety && Array.isArray(s.variety[cat]) ? s.variety[cat] : null;
    variety[cat] = foods ? foods.slice() : DEFAULT_VARIETY[cat].slice();
  });
  s.variety = variety;

  if(!s.manualCovered || typeof s.manualCovered!=="object") s.manualCovered = {};
  if(!Array.isArray(s.history)) s.history = [];
  // stock and extras replace the stored grocery list (schema 5): extras keep
  // their tick, and plan foods already ticked as bought count as at home
  if(!s.stock || typeof s.stock!=="object" || Array.isArray(s.stock)) s.stock = {};
  if(!Array.isArray(s.extras)) s.extras = [];
  if(Array.isArray(saved.grocery) && !Array.isArray(saved.extras)){
    saved.grocery.forEach(g=>{
      if(!g || !g.name) return;
      if(g.manual){ s.extras.push({id:g.id||uid(), name:g.name, qty:g.qty||"", checked:!!g.checked}); return; }
      if(!g.checked) return;
      const k = foodKey(g.name);
      if(s.stock[k]) return;
      const grams = (g.entries||[]).reduce((t,e)=>t+(gramsOf(e.qty)||0), 0);
      s.stock[k] = {name:g.name, g: grams || null, plenty:false};
    });
  }
  delete s.grocery;
  if(!GROCERY_FILTERS.some(f=>f.key===s.groceryFilter)) s.groceryFilter = "week";

  delete s.mascotPos;      // the floating mascot is gone

  delete s.menuHintSeen;   // the mascot menu is gone
  if(s.openCard!==null && !["meals","food","variety","plan"].includes(s.openCard)) s.openCard = "meals";
  // schema 6: a profile with a birth date replaces the stored age (always
  // months: 10, 12 or 18 before stages, 0-36 after), and the one "never
  // include" list becomes dislikes; anything a locked rule covers drops,
  // because it's locked now
  const prof = Object.assign(freshProfile(), saved.profile && typeof saved.profile==="object" ? saved.profile : {});
  if(!prof.birthDate || isNaN(localDate(prof.birthDate))){
    const age = savedAgeMonths(saved);
    prof.birthDate = birthDateFromMonths(age===null ? 10 : Math.min(AGE_MAX, Math.max(0, Math.round(age))));
  }
  if(!saved.profile && Array.isArray(saved.excludedFoods)){
    saved.excludedFoods.forEach(f=>{
      if(typeof f!=="string" || !f.trim()) return;
      const name = f.trim();
      if(lockedRule(name, 0)) return;
      if(!prof.avoid.some(a=>a.name.toLowerCase()===name.toLowerCase())) prof.avoid.push({name, kind:"dislike"});
    });
  }
  prof.avoid = (Array.isArray(prof.avoid) ? prof.avoid : [])
    .filter(a=>a && typeof a.name==="string" && a.name.trim())
    .map(a=>({name:a.name.trim(), kind:a.kind==="allergy" ? "allergy" : "dislike"}));
  const al = {};
  Object.entries(prof.allergens || {}).forEach(([k,v])=>{ if(ALLERGENS.some(a=>a.id===k) && (v==="avoid" || v==="ok")) al[k] = v; });
  prof.allergens = al;
  prof.priorities = (Array.isArray(prof.priorities) ? prof.priorities : []).filter(id=>PRIORITIES.some(p=>p.id===id)).slice(0,3);
  if(!saved.profile) prof.returning = true;   // an older save: their week is worth keeping
  s.profile = prof;
  delete s.createAge; delete s.ageYears; delete s.ageMonths; delete s.age;
  delete s.excludedFoods;
  if(!s.exposures || typeof s.exposures!=="object" || Array.isArray(s.exposures)) s.exposures = {};
  // marking: eaten:true becomes "ate it"; eaten keeps meaning "served"
  s.plan.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{
    if(!["all","some","refused"].includes(i.ate)) i.ate = i.eaten ? "all" : null;
    i.eaten = i.ate!==null;
  })));

  // schema 7: every meal knows its slot (older plans only had labels), and
  // meal times are the family's own overrides of the stage's defaults
  ensureSlots(s.plan);
  const mt = {};
  Object.entries(prof.mealTimes || {}).forEach(([k,v])=>{ if(MEAL_SLOTS.some(ms=>ms.id===k) && hhmm(v)) mt[k] = fmtHHMM(hhmm(v)); });
  prof.mealTimes = mt;
  if(!(prof.timesToday && typeof prof.timesToday.date==="string" && prof.timesToday.times && typeof prof.timesToday.times==="object")) prof.timesToday = null;

  s.schemaVersion = SCHEMA_VERSION;
  return s;
}

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }


/* ---------- collapsible add form ----------
   One "+ Add" button that expands into its fields. Open state and typed values
   are held per form key so an unrelated re-render (ticking a checkbox, say)
   doesn't close the form or wipe what you've typed. */
const addForms = {};   // key -> {open, values}

function addFormState(key){
  return addForms[key] || (addForms[key] = {open:false, values:{}});
}

/* fields: [{name, type:"text"|"select", placeholder, full, options:[[value,label]]}] */
function addForm(key, opts){
  const st = addFormState(key);
  const wrap = document.createElement("div");
  wrap.className = "addform";

  if(!st.open){
    const toggle = document.createElement("button");
    toggle.className = "add-toggle";
    toggle.textContent = opts.label;   // the green plus circle is drawn by CSS
    toggle.addEventListener("click", ()=>{ st.open = true; opts.rerender(); });
    wrap.appendChild(toggle);
    return wrap;
  }

  const form = document.createElement("div");
  form.className = "addform-open";
  const inputs = {};

  const full = opts.fields.filter(f=>f.full);
  const rest = opts.fields.filter(f=>!f.full);

  function build(field){
    let el;
    if(field.type==="select"){
      el = document.createElement("select");
      el.setAttribute("aria-label", field.label || (field.name==="cat" ? "Food group" : field.name));
      field.options.forEach(([v,label])=>{
        const o = document.createElement("option");
        o.value = v; o.textContent = label;
        el.appendChild(o);
      });
      el.value = st.values[field.name] || field.options[0][0];
    }else{
      el = document.createElement("input");
      el.type = "text";
      el.placeholder = field.placeholder || "";
      el.setAttribute("aria-label", field.placeholder || field.name);
      el.value = st.values[field.name] || "";
      el.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    }
    if(field.full) el.className = "full";
    el.addEventListener("input", ()=>{ st.values[field.name] = el.value; });
    el.addEventListener("change", ()=>{ st.values[field.name] = el.value; });
    inputs[field.name] = el;
    return el;
  }

  full.forEach(f=>form.appendChild(build(f)));
  if(rest.length){
    const row = document.createElement("div");
    row.className = "addform-row";
    rest.forEach(f=>row.appendChild(build(f)));
    form.appendChild(row);
  }

  function close(){ st.open = false; st.values = {}; st.note = ""; }

  function submit(){
    const values = {};
    Object.entries(inputs).forEach(([k,el])=>{ values[k] = el.value.trim(); });
    const r = opts.onSubmit(values);
    if(typeof r==="string"){ st.note = r; opts.rerender(); return; }   // a calm reason, stay open
    if(r === false) return;   // validation failed, stay open
    close();
    opts.rerender();
  }

  if(st.note){
    const note = document.createElement("p");
    note.className = "form-note";
    note.setAttribute("role", "status");
    note.textContent = st.note;
    form.appendChild(note);
  }
  const actions = document.createElement("div");
  actions.className = "addform-actions";
  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "Cancel";
  cancel.addEventListener("click", ()=>{ close(); opts.rerender(); });
  const add = document.createElement("button");
  add.className = "btn primary";
  add.textContent = "Add";
  add.addEventListener("click", submit);
  actions.appendChild(cancel); actions.appendChild(add);
  form.appendChild(actions);

  wrap.appendChild(form);
  setTimeout(()=>{ const first = form.querySelector("input"); if(first) first.focus(); }, 0);
  return wrap;
}

const CAT_OPTIONS = Object.entries(CATS).map(([k,v])=>[k, v.label]);

/* ---------- the fan: today's meals as tilted tiles ----------
   Each tile shows the meal's main food: a photo if the item carries one
   (item.photo), otherwise a big emoji on its food group's pastel. */
const CAT_EMOJI = {protein:"🍽️", vegetable:"🥕", fruit:"🍓", grain:"🥣", fat:"🥑"};
function emojiFor(item){
  const f = foodOf(item.name);
  return f ? f.emoji : CAT_EMOJI[item.cats[0]] || "🍽️";
}
/* ---------- view switching ---------- */
let currentDay = 0;

/* ---------- motion helpers ----------
   Rows are rebuilt on every change, so a CSS transition never sees the
   before state. Instead the one row that changed is marked (justChanged)
   and plays its entrance once; a row on its way out slides off first and
   the re-render waits for it. With reduced motion everything is instant. */
let justChanged = null;
function calm(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; }
/* Swipe to delete, the iOS list gesture: drag a row left to show Delete,
   drag it most of the way across to delete at once. Pointer events, so it
   works with touch, pen and mouse; vertical drags still scroll. */
let openSwipe = null;
function closeSwipe(){
  if(openSwipe){ const fg = openSwipe.querySelector(".row-fg"); if(fg) fg.style.transform = ""; }
  openSwipe = null;
}
function swipeable(row, label, onDelete){
  const fg = row.querySelector(".row-fg");
  const del = document.createElement("button");
  del.type = "button"; del.className = "swipe-del"; del.textContent = "Delete";
  del.setAttribute("aria-label", "Delete " + label);
  del.addEventListener("click", ()=>{ openSwipe = null; leave(row, "left", onDelete); });
  row.appendChild(del);
  let x0 = 0, y0 = 0, dx = 0, base = 0, id = null, horiz = null;
  const set = v=>{ fg.style.transform = v ? `translateX(${v}px)` : ""; };
  fg.addEventListener("pointerdown", e=>{
    if(e.button>0 || e.target.closest("input,select,.buy-chip,.swipe-del")) return;   // taps on controls stay taps
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = null;
    base = openSwipe===row ? -88 : 0;
    if(openSwipe && openSwipe!==row) closeSwipe();
  });
  fg.addEventListener("pointermove", e=>{
    if(e.pointerId!==id) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(horiz===null){
      if(Math.abs(mx)<6 && Math.abs(my)<6) return;
      horiz = Math.abs(mx) > Math.abs(my);
      if(horiz){ row.classList.add("dragging"); fg.setPointerCapture(id); }
    }
    if(!horiz) return;
    dx = Math.min(0, base + mx);
    set(dx);
  });
  const end = e=>{
    if(e.pointerId!==id) return;
    id = null; row.classList.remove("dragging");
    if(!horiz) return;
    if(dx < -row.offsetWidth*0.6){   // a full swipe deletes
      set(-row.offsetWidth); openSwipe = null;
      return setTimeout(onDelete, calm() ? 0 : 200);
    }
    if(dx < -44){ set(-88); openSwipe = row; }
    else{ set(0); if(openSwipe===row) openSwipe = null; }
  };
  fg.addEventListener("pointerup", end);
  fg.addEventListener("pointercancel", end);
  // the click that ends a drag mustn't tick the row's checkbox
  fg.addEventListener("click", e=>{ if(horiz){ e.preventDefault(); e.stopPropagation(); horiz = null; } }, true);
}
function leave(el, side, then){
  if(calm()) return then();
  el.classList.add(side==="left" ? "leaving-l" : "leaving-r");
  setTimeout(then, 220);
}

/* ---------- PLAN RENDER ---------- */
/* Plan days stay in their canonical Mon–Sun order (grocery badges depend on it);
   only the tab strip is rotated so today leads. */
function dayDisplayOrder(){
  const days = state.plan.days;
  const start = days.findIndex(d=>d.name===DAY_ORDER[now().getDay()]);
  if(start < 0) return days.map((_,i)=>i);   // custom plan with no matching day name
  return days.map((_,k)=>(start+k)%days.length);
}

/* ---------- calendar ----------
   The plan is a week that starts again on the weekday it was started (the day
   it was applied, or "Start new week"), so what's left of it runs from today
   up to the day before that weekday comes round again. */
function localDate(iso){
  const [y,m,d] = String(iso).split("-").map(Number);
  return new Date(y, m-1, d);
}
function daysLeftInWeek(){
  const start = localDate(state.weekStarted);
  const anchor = isNaN(start) ? now().getDay() : start.getDay();
  return ((anchor - now().getDay() + 7) % 7) || 7;
}

/* The plan's days in display order lead with today, so position k is k days from now. */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateForDay(idx){
  const pos = dayDisplayOrder().indexOf(idx), t = now();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate() + (pos<0 ? 0 : pos));   // local calendar days, never 24h steps
}
function formatDate(d){
  return DAY_ORDER[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
}

function haveChip(c, name){
  if(!c) return "";   // eaten: nothing left to check
  if(c.have) return `<span class="have-chip">At home</span>`;
  const pack = c.buy===null ? null : buyPacks(name, c.buy);
  return `<button type="button" class="buy-chip" data-buy aria-label="Mark ${name} bought${pack ? ", " + pack.label : ""}">${pack ? "Buy " + pack.short : "Buy"}</button>`;
}

/* Every change to the plan ends here: the fan, whatever sheet is open, and
   the home cards follow along. */
function renderDayContent(){
  refreshSheet();
  justChanged = null;
  renderSummaries();
}

/* A tiny celebration: six leaves and sparkles burst from a point and
   settle (transform and opacity only, 600 ms, never in the way of a tap).
   With reduced motion, nothing moves; the words carry the moment. */
function burst(from){
  if(calm() || !from || !from.getBoundingClientRect) return;
  const r = from.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
  const layer = document.createElement("div");
  layer.className = "burst"; layer.setAttribute("aria-hidden", "true");
  layer.style.left = x + "px"; layer.style.top = y + "px";
  const shapes = ["leaf","dot","leaf","star","leaf","dot"];
  shapes.forEach((sh, k)=>{
    const p = document.createElement("i");
    p.className = "bp " + sh;
    layer.appendChild(p);
    const a = (k/shapes.length)*Math.PI*2 - Math.PI/2 + (Math.random()-.5)*.5, d = 26 + Math.random()*18;
    p.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:0},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d*.6}px), calc(-50% + ${Math.sin(a)*d*.6}px)) scale(1) rotate(${k*40}deg)`, opacity:1, offset:.35},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d + 8}px)) scale(.6) rotate(${k*70}deg)`, opacity:0}
    ], {duration:620, easing:"cubic-bezier(.2,.8,.3,1)", fill:"forwards"});
  });
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 700);
}
/* a light tap of the phone where it's supported (never on its own) */
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

/* a quiet line for screen readers after a mark ("Lunch: ate it") */
function announce(text){
  const el = document.getElementById("liveStatus");
  el.textContent = "";
  setTimeout(()=>{ el.textContent = text; }, 30);
}

/* ---------- the meal sheet ----------
   Everything about one meal, shown only when it's asked for: the dishes,
   grams, textures, a prep tip, why these foods, a swap, and how it went. */
const SLOT_OF = {Breakfast:"breakfast", Snack:"snack", Lunch:"lunch", Dinner:"dinner"};
const ATE_WORDS = {all:"Ate it", some:"Ate some", refused:"Refused"};
function dayWord(idx){
  const pos = dayDisplayOrder().indexOf(idx);
  return pos===0 ? "Today" : pos===1 ? "Tomorrow" : DAY_FULL(dateForDay(idx));
}
/* how a meal went, if every food in it has been marked the same way */
function mealMark(m){
  if(!m.items.length || m.items.some(i=>!i.ate)) return null;
  const a = m.items[0].ate;
  return m.items.every(i=>i.ate===a) ? a : "some";
}
function renderMealSheet(body, arg){
  const day = state.plan.days[arg.day], m = day && day.meals[arg.meal];
  if(!m){ body.innerHTML = `<p class="empty">This meal has moved on.</p>`; return; }
  setSheetTitle(`${m.label} · ${dayWord(arg.day)}`);
  const main = m.items[0];
  const cover = coverOnPlan();
  const hero = document.createElement("div");
  hero.className = "ms-hero";
  hero.innerHTML = `<span class="ms-emoji" aria-hidden="true" style="--soft:var(--${main ? main.cats[0] : "grain"}-soft, var(--olive-100))">${main ? emojiFor(main) : "🍽️"}</span>
    <div><p class="ms-slot">${m.label}${m.from ? ` · from ${m.from}'s batch` : ""}</p><h3 class="ms-dish">${dishName(m) || "Nothing here yet"}</h3></div>`;
  body.appendChild(hero);

  // how it went: one tap for the whole meal
  if(m.items.length){
    const mark = mealMark(m);
    const ate = document.createElement("div");
    ate.className = "ate"; ate.setAttribute("role", "group"); ate.setAttribute("aria-label", "How did it go?");
    ["all","some","refused"].forEach(v=>{
      const b = document.createElement("button");
      b.type = "button"; b.textContent = ATE_WORDS[v]; b.dataset.k = "ate-" + v;
      b.setAttribute("aria-pressed", String(mark===v));
      b.addEventListener("click", ()=>{
        const next = mealMark(m)===v ? null : v;
        m.items.forEach(i=>setAte(i, next));
        m.items.forEach(i=>{ justChanged = i.id; });
        save();
        const dayDone = day.meals.flatMap(x=>x.items).every(i=>i.ate);
        announce(`${m.label}: ${next ? ATE_WORDS[next].toLowerCase() : "unmarked"}` + (next && dayDone ? `. ${pick(CONTENT.dayDone, "done")}` : ""));
        if(next==="all" || next==="some"){ burst(b); haptic(); }
        renderDayContent();
        if(next && dayDone){   // the day's ring completes on the home strip
          const pos = dayDisplayOrder().indexOf(arg.day);
          const wd = document.querySelectorAll("#weekStrip .wd")[pos];
          if(wd){ wd.classList.add("complete"); setTimeout(()=>wd.classList.remove("complete"), 900); }
        }
      });
      ate.appendChild(b);
    });
    body.appendChild(ate);
  }

  // the foods: grams and texture, a prep tip, at home or to buy, swap, remove
  const list = document.createElement("div");
  list.className = "card ms-items";
  m.items.forEach((item, k)=>{
    const row = document.createElement("div");
    row.className = "ms-row" + (item.id===justChanged ? " just" : "");
    const tip = prepTip(item);
    row.innerHTML = `<span class="ms-dot" aria-hidden="true" style="--soft:var(--${item.cats[0]}-soft, var(--olive-100))">${emojiFor(item)}</span>
      <div class="ms-main"><span class="ms-name">${item.name.split(",")[0]}</span>
        <span class="ms-sub">${[item.qty, item.tex].filter(Boolean).join(" · ")}</span></div>
      ${haveChip(cover[item.id], item.name) || "<span></span>"}
      <div class="ms-acts"><button type="button" class="icon-btn" data-k="swap-${k}" aria-label="Swap ${item.name} for something similar">↻</button>
      <button type="button" class="icon-btn" data-k="rm-${k}" aria-label="Remove ${item.name}">✕</button></div>
      ${tip ? `<span class="ms-tip">${tip}</span>` : ""}`;
    const buy = row.querySelector("[data-buy]");
    if(buy) buy.addEventListener("click", ()=>{
      const short = cover[item.id].buy;   // as if just bought: whole packs
      addToStock(foodKey(item.name), item.name, short===null ? null : buyPacks(item.name, short).g);
      justChanged = item.id;
      announce(`${item.name}: at home now`);
      renderDayContent();
    });
    row.querySelector(`[data-k="swap-${k}"]`).addEventListener("click", ()=>{
      const was = item.name;
      if(swapItem(m, k)){ announce(`Swapped ${was} for ${m.items[k].name}`); renderDayContent(); }
      else announce(`Nothing similar to swap ${was} for`);
    });
    row.querySelector(`[data-k="rm-${k}"]`).addEventListener("click", ()=>leave(row, "left", ()=>{
      m.items.splice(m.items.indexOf(item), 1);
      save(); renderDayContent();
    }));
    list.appendChild(row);
  });
  list.appendChild(addForm(`meal:${arg.day}:${arg.meal}`, {
    label: "Add a food",
    rerender: renderDayContent,
    fields: [
      {name:"name", type:"text",   placeholder:"Food name", full:true},
      {name:"qty",  type:"text",   placeholder:"qty (e.g. 50 g)"},
      {name:"cat",  type:"select", options:CAT_OPTIONS}
    ],
    onSubmit: v=>{
      if(!v.name) return false;
      const why = keepOutReason(v.name);
      if(why) return why;
      m.items.push(it(v.name, v.qty, [v.cat]));
      save();
    }
  }));
  body.appendChild(list);

  // why these foods: one line each, plain and kind
  if(m.items.length){
    const why = document.createElement("div");
    why.className = "card ms-why";
    why.innerHTML = `<p class="section-title">Why these foods</p>` +
      m.items.slice(0, 3).map(i=>`<p><b>${i.name.split(",")[0]}</b>: ${lower1(whyFor(i))}</p>`).join("");
    body.appendChild(why);
  }
}
/* a similar food for the same meal, still passing every safety check */
function swapItem(m, k){
  const item = m.items[k], months = planMonths(), st = stageFor(months);
  const slot = SLOT_OF[m.label] || "lunch";
  const taken = new Set(m.items.map(i=>i.name));
  const pool = FOOD_POOL.filter(f=>f.cats[0]===item.cats[0] && f.slots.includes(slot) && !taken.has(f.name) && isAllowed(f, months, state.profile));
  if(!pool.length) return false;
  const ctx = planContext(months, state.profile), dayCtx = {taken:new Set(), colours:new Set(), newCount:0};
  const ws = pool.map(f=>weightFor(f, ctx, dayCtx));
  let r = Math.random() * ws.reduce((a,b)=>a+b, 0), j = 0;
  for(; j<ws.length-1; j++){ r -= ws[j]; if(r <= 0) break; }
  if(item.eaten){ setAte(item, null); }   // put back what it took from stock
  const fresh = dish(pool[j], st);
  m.items[k] = fresh;
  justChanged = fresh.id;
  save();
  return true;
}

/* ---------- GROCERY ---------- */
/* the days a shopping window covers: today, the next three, or what's left
   of the planned week (the calendar's band) */
function windowDays(key){
  const order = dayDisplayOrder();
  const n = key==="today" ? 1 : key==="next3" ? 3 : Math.min(daysLeftInWeek(), order.length);
  return new Set(order.slice(0, n).map(i=>state.plan.days[i].name));
}
/* ---------- KITCHEN: what to buy for the window, what's at home ----------
   Only stock and extras are stored. What to buy is worked out on every
   render: the plan's portions not yet eaten, on the window's days, minus
   what's at home. Quantities count when they're in grams ("50 g"); a food
   with no gram amount is just needed, or covered once it's at home. */
function foodKey(name){ return String(name).trim().toLowerCase(); }
function gramsOf(qty){
  const m = String(qty||"").match(/^\s*(\d+(?:[.,]\d+)?)\s*g\b/i);
  return m ? parseFloat(m[1].replace(",", ".")) : null;
}
function fmtG(g){
  if(g < 1000) return Math.round(g) + " g";
  return (Math.round(g/100)/10).toString().replace(/\.0$/, "") + " kg";
}

const PACK_ALIAS = {"oats":"oatmeal", "pasta":"whole wheat pasta", "cucumber sticks":"cucumber",
  "smooth peanut butter":"peanut butter"};
/* "Carrots, soft-cooked" shops as carrots: the preparation after the comma doesn't change the pack */
function packFor(name){
  const base = foodKey(name).split(",")[0].trim();
  return PACKS[PACK_ALIAS[base] || base] || null;
}
/* whole packs covering a shortfall in grams; a food with no known pack
   rounds up to the next 100 g */
function buyPacks(name, grams){
  const p = packFor(name);
  if(!p){ const g = Math.max(100, Math.ceil(grams/100)*100); return {g, label:fmtG(g), short:fmtG(g)}; }
  const n = Math.max(1, Math.ceil((grams - 0.5) / p.g));
  return {g:n*p.g, label:(n>1 ? n+" × " : "") + p.label, short:(n>1 ? n+" × " : "") + p.short};
}
function shortDay(name){ return name.slice(0,3); }
const CAT_ORDER = ["protein","vegetable","fruit","grain","fat","other"];

function needOn(daySet){
  const need = {};
  state.plan.days.forEach(day=>{
    if(daySet && !daySet.has(day.name)) return;
    day.meals.forEach(m=>m.items.forEach(item=>{
      if(item.eaten) return;
      const k = foodKey(item.name);
      const n = need[k] || (need[k] = {key:k, name:item.name, cat:item.cats[0]||"other", g:0, days:[]});
      n.g += gramsOf(item.qty) || 0;
      if(!n.days.includes(day.name)) n.days.push(day.name);
    }));
  });
  return need;
}

/* grams still to buy (0 = covered); null = needed, no amount to go on */
function toBuy(n){
  const st = state.stock[n.key];
  if(st && (st.plenty || st.g===null)) return 0;
  if(n.g===0) return st && st.g>0 ? 0 : null;
  return Math.max(0, Math.ceil(n.g - (st ? st.g : 0)));
}

/* walks the plan from today: the first day this food falls short, and the
   last day it's needed at all */
function shortfall(key){
  const st = state.stock[key];
  const measured = !(st && (st.plenty || st.g===null));
  let left = st && measured ? st.g : 0, short = null, last = null;
  for(const idx of dayDisplayOrder()){
    const day = state.plan.days[idx];
    let g = 0;
    day.meals.forEach(m=>m.items.forEach(i=>{ if(!i.eaten && foodKey(i.name)===key) g += gramsOf(i.qty) || 0; }));
    if(!g) continue;
    last = day.name;
    left -= g;
    if(measured && !short && left < -0.5) short = day.name;
  }
  return {short, last};
}

function homeStatus(key){
  const st = state.stock[key];
  if(st.plenty) return {text:"plenty"};
  const {short, last} = shortfall(key);
  if(!last) return {text:"not in this week's plan"};
  if(st.g===null) return {text:"needed this week"};
  if(!short) return {text:lastsFor(key, st.g)};
  const today = short===DAY_ORDER[now().getDay()];
  return {text: today ? "runs out today" : "runs out " + shortDay(short), low:true};
}

/* A pack outlives the week, so say roughly how long: grams at home over
   what a whole week of the plan uses. */
function lastsFor(key, g){
  let perWeek = 0;
  state.plan.days.forEach(day=>day.meals.forEach(m=>m.items.forEach(i=>{ if(foodKey(i.name)===key) perWeek += gramsOf(i.qty) || 0; })));
  const weeks = perWeek ? g / perWeek : Infinity;
  if(weeks < 2) return "enough for the week";
  if(weeks < 4) return "lasts about " + Math.floor(weeks) + " weeks";
  if(weeks < 6) return "lasts about a month";
  return "lasts over a month";
}

/* For every dish not yet eaten, from today on: covered by what's at home,
   or how much is missing for this portion. Stock is spent in plan order, so
   100 g of oatmeal at 40 g a day covers two days and leaves 20 g of the third
   to buy. Plenty, or a "have" with no amount, always covers. */
function coverOnPlan(){
  const left = {}, out = {};
  for(const idx of dayDisplayOrder()){
    state.plan.days[idx].meals.forEach(m=>m.items.forEach(item=>{
      if(item.eaten) return;
      const k = foodKey(item.name), st = state.stock[k];
      if(st && (st.plenty || st.g===null)){ out[item.id] = {have:true}; return; }
      const g = gramsOf(item.qty);
      if(g===null){ out[item.id] = st && st.g>0 ? {have:true} : {buy:null}; return; }
      if(!(k in left)) left[k] = st ? st.g : 0;
      if(left[k] >= g - 0.5){ left[k] -= g; out[item.id] = {have:true}; }
      else{ out[item.id] = {buy: Math.ceil(g - Math.max(0, left[k]))}; left[k] = 0; }
    }));
  }
  return out;
}

/* Eating takes the portion out of what's at home; un-ticking puts back
   exactly what was taken (item.took), even if stock had hit zero. Plenty,
   unmeasured stock and quantities not in grams are left alone. */
function useStock(item){
  const st = state.stock[foodKey(item.name)];
  if(item.eaten){
    const g = gramsOf(item.qty);
    if(!st || st.plenty || st.g===null || g===null){ delete item.took; return; }
    item.took = Math.min(st.g, g);
    st.g -= item.took;
  }else{
    if(st && st.g!==null && item.took) st.g += item.took;
    delete item.took;
  }
}

function addToStock(key, name, grams){
  const st = state.stock[key];
  if(grams===null) state.stock[key] = st || {name, g:null, plenty:false};
  else state.stock[key] = {name, g:(st && st.g>0 ? st.g : 0) + grams, plenty:false};
  save();
}

let editingStock = null;   // the At home row whose amount is open for editing

function renderKitchen(){
  // to buy, for the rest of the planned week
  const filter = state.groceryFilter;
  const seg = document.getElementById("windowSeg");
  seg.style.setProperty("--i", GROCERY_FILTERS.findIndex(f=>f.key===filter));   // slides the pill
  seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.w===filter)));
  const need = needOn(windowDays(filter));
  // most urgent first: grouped by the day each thing is first needed
  const order = dayDisplayOrder().map(i=>state.plan.days[i].name);
  const firstDay = n=>Math.min(...n.days.map(d=>order.indexOf(d)));
  const buy = Object.values(need).map(n=>({n, amt:toBuy(n)})).filter(x=>x.amt===null || x.amt>0)
    .sort((a,b)=>firstDay(a.n)-firstDay(b.n) || CAT_ORDER.indexOf(a.n.cat)-CAT_ORDER.indexOf(b.n.cat) || a.n.name.localeCompare(b.n.name));
  const list = document.getElementById("toBuyList");
  list.innerHTML = "";
  let lastDay = null;
  buy.forEach(({n, amt})=>{
    const fd = firstDay(n);
    if(fd!==lastDay){
      lastDay = fd;
      const h = document.createElement("div");
      h.className = "k-group";
      h.textContent = fd===0 ? "Needed today" : fd===1 ? "Tomorrow" : "By " + order[fd];
      list.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "k-row";
    // just the name: ticking it buys whole packs, which land in Stock
    row.innerHTML = `<div class="row-fg"><label><input type="checkbox"><span class="k-name">${n.name}</span></label></div>`;
    row.querySelector("input").setAttribute("aria-label", "Bought " + n.name);
    row.querySelector("input").addEventListener("change", ()=>{
      row.classList.add("just", "bought");   // the tick pops, a short strike, then it slides off
      announce(`${n.name}: bought`);
      burst(row.querySelector("input")); haptic();
      const go = ()=>leave(row, "right", ()=>{
        addToStock(n.key, n.name, amt===null ? null : buyPacks(n.name, amt).g);
        justChanged = n.key;   // it slides into Stock
        renderKitchen(); renderSummaries();
      });
      if(calm()) go(); else setTimeout(go, 200);
    });
    list.appendChild(row);
  });

  // extras: things that aren't food, ticked off as they're bought
  if(state.extras.length){
    const h = document.createElement("div");
    h.className = "k-group";
    h.textContent = "Extras";
    list.appendChild(h);
  }
  state.extras.forEach(x=>{
    const row = document.createElement("div");
    row.className = "k-row" + (x.checked ? " done" : "");
    row.innerHTML = `<div class="row-fg"><label><input type="checkbox" ${x.checked ? "checked" : ""}>
        <span class="k-main"><span class="k-name">${x.name}</span>${x.qty ? `<span class="k-sub">${x.qty}</span>` : ""}</span></label></div>`;
    row.querySelector("input").addEventListener("change", e=>{ x.checked = e.target.checked; save(); renderKitchen(); });
    swipeable(row, x.name, ()=>{ state.extras = state.extras.filter(y=>y!==x); save(); renderKitchen(); });
    list.appendChild(row);
  });
  if(!buy.length && !state.extras.length){
    list.innerHTML = `<p class="empty">Nothing to buy ${GROCERY_FILTERS.find(f=>f.key===filter).meta.replace(/^For/, "for")}.</p>`;
  }
  const done = !buy.length && !state.extras.some(x=>!x.checked);
  const cel = document.getElementById("shopCelebrate");
  cel.hidden = !done;
  if(done) cel.textContent = pick(CONTENT.shopCelebrate, "cel" + filter);
  const buyCount = buy.length + state.extras.filter(x=>!x.checked).length;
  document.getElementById("toBuyTitle").textContent = `To buy · ${buyCount}`;

  const addX = document.getElementById("extrasAdd");
  addX.innerHTML = "";
  addX.appendChild(addForm("extras", {
    label: "Add extra item",
    rerender: renderKitchen,
    fields: [
      {name:"name", type:"text", placeholder:"Extra item (e.g. diapers, bread)", full:true},
      {name:"qty",  type:"text", placeholder:"qty"}
    ],
    onSubmit: v=>{
      if(!v.name) return false;
      state.extras.push({id:uid(), name:v.name, qty:v.qty||"", checked:false});
      save();
    }
  }));

  // at home: everything with something left, and how long it lasts
  const home = Object.entries(state.stock).filter(([,st])=>st.plenty || st.g===null || st.g>0)
    .sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const hl = document.getElementById("homeList");
  hl.innerHTML = "";
  home.forEach(([key, st])=>{
    const row = document.createElement("div");
    row.className = "k-row" + (key===justChanged ? " just" : "");
    if(editingStock===key){
      row.innerHTML = `<div class="row-fg"><div class="k-edit"><span class="k-name">${st.name}</span>
          <input type="text" inputmode="decimal" aria-label="Amount of ${st.name} in grams" value="${st.g>0 ? Math.round(st.g) : ""}" placeholder="amount">
          <span class="k-unit">g</span>
          <label class="switch"><input type="checkbox" role="switch" data-plenty ${st.plenty ? "checked" : ""}>Plenty</label>
          <button type="button" class="save" data-save>Save</button>
          <button type="button" class="rm" data-rm>Remove</button></div></div>`;
      const inp = row.querySelector("input[type=text]");
      row.querySelector("[data-plenty]").addEventListener("change", e=>{ st.plenty = e.target.checked; save(); });
      row.querySelector("[data-save]").addEventListener("click", ()=>{
        const g = gramsOf(inp.value + " g");
        if(g!==null) st.g = g;
        st.plenty = row.querySelector("[data-plenty]").checked;   // the switch decides, not the amount
        editingStock = null; save(); renderKitchen();
      });
      row.querySelector("[data-rm]").addEventListener("click", ()=>{ delete state.stock[key]; editingStock = null; save(); renderKitchen(); });
      setTimeout(()=>inp.focus(), 0);
    }else{
      const status = homeStatus(key);
      // what's left after the meals ticked as eaten, said as time not grams; tap to correct it
      row.innerHTML = `<div class="row-fg"><button type="button" class="k-stock" aria-label="Change how much ${st.name} is left">
          <span class="k-name">${st.name}</span><span class="k-sub${status.low ? " low" : ""}">${status.text}</span></button></div>`;
      row.querySelector(".k-stock").addEventListener("click", ()=>{ editingStock = key; renderKitchen(); });
      swipeable(row, st.name, ()=>{ delete state.stock[key]; save(); renderKitchen(); });
    }
    hl.appendChild(row);
  });
  if(!home.length) hl.innerHTML = `<p class="empty">Nothing in stock yet: tick foods as you buy them.</p>`;
  justChanged = null;
  document.getElementById("homeTitle").textContent = `Stock · ${home.length}`;

  const addH = document.getElementById("homeAdd");
  addH.innerHTML = "";
  addH.appendChild(addForm("home", {
    label: "Add something you have",
    rerender: renderKitchen,
    fields: [
      {name:"name", type:"text", placeholder:"Food (e.g. oatmeal)", full:true},
      {name:"qty",  type:"text", placeholder:"amount in g (optional)"}
    ],
    onSubmit: v=>{
      if(!v.name) return false;
      const g = gramsOf((v.qty||"").replace(/\s*g\s*$/i,"") + " g");
      const k = foodKey(v.name), st = state.stock[k];
      state.stock[k] = {name: st ? st.name : v.name, g: g!==null ? g : (st ? st.g : null), plenty:false};
      save();
    }
  }));

  renderSummaries();
}

/* ---------- VARIETY ---------- */
function eatenFoodNamesThisWeek(){
  const set = new Set();
  state.plan.days.forEach(day=>{
    day.meals.forEach(m=>{
      m.items.forEach(item=>{
        if(item.ate==="all" || item.ate==="some") set.add(item.name.trim().toLowerCase());
      });
    });
  });
  return set;
}

function isCovered(cat, food){
  const manualKey = cat+"::"+food;
  if(state.manualCovered[manualKey]) return true;
  return eatenFoodNamesThisWeek().has(food.trim().toLowerCase());
}

function toggleManual(cat, food){
  const key = cat+"::"+food;
  if(eatenFoodNamesThisWeek().has(food.trim().toLowerCase())){
    // it's auto-covered by an eaten item; manual toggle would only act as an "un-cover" which we don't support to avoid confusion
    return;
  }
  state.manualCovered[key] = !state.manualCovered[key];
  save(); renderVariety();
}

/* A checklist food the child is too young for (by the food pool's minimum
   age) waits until they reach it; foods the pool doesn't know always show. */
function suitableNow(food){
  if(!stageNow().solids) return true;
  const t = food.trim().toLowerCase();
  const match = FOOD_POOL.find(f=>{
    const n = f.name.toLowerCase();
    return n===t || n.startsWith(t+",") || n.startsWith(t+" ") || n.endsWith(" "+t);
  });
  return !match || match.min <= ageNow();
}
function varietyNow(){
  const out = {};
  Object.entries(state.variety).forEach(([cat, foods])=>{ out[cat] = foods.filter(suitableNow); });
  return out;
}

function renderVariety(){ refreshSheet(); renderSummaries(); }

/* past weeks: a soft bar each, the number only for screen readers (no
   percentages on show, nothing that reads like a grade) */
function renderHistory(wrap){
  if(!state.history || state.history.length===0){
    wrap.innerHTML = `<p class="empty">${CONTENT.pastWeeks}</p>`;
    return;
  }
  wrap.innerHTML = "";
  state.history.slice().reverse().forEach(h=>{
    const row = document.createElement("div");
    const d = localDate(h.weekOf);
    row.className = "history-row";
    row.innerHTML = `<span>Week of ${isNaN(d) ? h.weekOf : MONTHS[d.getMonth()] + " " + d.getDate()}</span>`
      + `<span class="history-bar" role="img" aria-label="${h.overallPct} percent of the checklist tasted"><i style="--w:${Math.max(4, h.overallPct)}%"></i></span>`;
    wrap.appendChild(row);
  });
}

function startNewWeek(){
  // compute this week's overall pct for history before clearing
  let totalItems=0, totalCovered=0;
  Object.entries(varietyNow()).forEach(([cat, foods])=>{
    totalItems += foods.length;
    totalCovered += foods.filter(f=>isCovered(cat,f)).length;
  });
  const overallPct = totalItems? Math.round(100*totalCovered/totalItems) : 0;
  state.history.push({ weekOf: state.weekStarted, overallPct });

  // reset eaten flags + manual covers + ticked extras (stock stays: the food is still at home)
  state.plan.days.forEach(day=>day.meals.forEach(m=>m.items.forEach(item=>{ item.eaten=false; item.ate=null; delete item.took; })));
  state.manualCovered = {};
  state.extras.forEach(x=>x.checked=false);
  state.weekStarted = todayISO();
  currentDay = dayDisplayOrder()[0];   // the new week starts today

  save();
  renderDayContent();
  renderKitchen();
  renderVariety();
}

/* ---------- CREATE: generate a week of age-appropriate menus ---------- */
let draft = null;   // preview only — deliberately never written to state until applied

function stageNow(){ return stageFor(ageNow()); }

function eligibleFoods(months, profile){
  return FOOD_POOL.filter(f=>isAllowed(f, months, profile));
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Deals foods by weight: priorities, dislikes and what's at home tilt the
   odds, and each use makes a food less likely next time, so the week still
   spreads out. A food already on today's plates is skipped while there's
   anything else. */
function weightFor(f, ctx, day){
  const P = ctx.priorities, m = metaOf(f.name), key = foodKey(f.name.split(",")[0]);
  let w = 1;
  // strong enough to see in a week: each meal only draws from its own food
  // groups and repeats are penalised, which dilutes any single weight
  if(dislikeMatch(f.name, ctx.profile)) w *= .3;
  if(P.has("iron") && f.iron) w *= 4;
  if(P.has("colours") && m.colour && !day.colours.has(m.colour)) w *= 2.5;
  if(P.has("quick")) w *= m.quick ? 2.5 : .35;
  if(P.has("batch") && m.freezes) w *= 2.5;
  if(P.has("finger") && ctx.finger && /finger|strips|pieces|bite-size/.test(textureFor(f, ctx.st) || "")) w *= 2.5;
  if(P.has("athome") && ctx.atHome.has(key)) w *= 4;
  if(P.has("affordable")) w *= m.cost==="low" ? 2.5 : m.cost==="high" ? .2 : 1;
  if(P.has("gentle")){
    if(ctx.known.has(key)) w *= 3;
    else if(day.newCount >= 1) w *= .05;   // one new taste a day is plenty
  }
  return w;
}
function makeDealer(foods, ctx){
  const uses = {};
  return function deal(cat, slot, day){
    const fits = foods.filter(f=>f.cats[0]===cat && f.slots.includes(slot));
    const cands = fits.filter(f=>!day.taken.has(f.name));
    const pool = cands.length ? cands : fits;
    if(!pool.length) return null;
    const ws = pool.map(f=>weightFor(f, ctx, day) / (1 + 1.2*(uses[f.name] || 0)));
    let r = Math.random() * ws.reduce((a,b)=>a+b, 0), k = 0;
    for(; k<ws.length-1; k++){ r -= ws[k]; if(r <= 0) break; }
    const f = pool[k];
    uses[f.name] = (uses[f.name] || 0) + 1;
    day.taken.add(f.name);
    const m = metaOf(f.name);
    if(m.colour) day.colours.add(m.colour);
    if(ctx.priorities.has("gentle") && !ctx.known.has(foodKey(f.name.split(",")[0]))) day.newCount++;
    return f;
  };
}

function portionFor(food, st){
  return (st.portions[food.cats[0]] || 30) + " g";
}
function dish(food, st){ return it(food.name, portionFor(food, st), food.cats, textureFor(food, st)); }

/* Near-family weeks keep three familiar grains (one for breakfast, two for
   lunch and dinner) so each plate has a staple next to anything new. */
function withStaples(foods){
  const grains = foods.filter(f=>f.cats[0]==="grain");
  const bfast = shuffled(grains.filter(f=>f.slots.includes("breakfast"))).slice(0,1);
  const main = shuffled(grains.filter(f=>!bfast.includes(f) && (f.slots.includes("lunch") || f.slots.includes("dinner")))).slice(0,2);
  const keep = new Set(bfast.concat(main));
  return foods.filter(f=>f.cats[0]!=="grain" || keep.has(f));
}

/* what generation knows about this household right now */
function planContext(months, profile){
  const st = stageFor(months);
  const atHome = new Set(Object.entries(state.stock || {})
    .filter(([,x])=>x.plenty || x.g===null || x.g>0).map(([k])=>k.split(",")[0].trim()));
  const known = new Set(Object.keys(state.exposures || {}));
  (state.plan ? state.plan.days : []).forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{
    if(i.ate==="all" || i.ate==="some") known.add(foodKey(baseName(i)));
  })));
  return {st, profile, priorities:new Set(profile.priorities || []), atHome, known,
          finger:["textures","family","nearfamily"].includes(st.id)};
}

/* null when the stage has no solids: there is no menu to make yet */
function generateWeek(months, profile){
  const ctx = planContext(months, profile);
  const st = ctx.st;
  if(!st.solids) return null;
  let foods = eligibleFoods(months, profile);
  if(st.picky) foods = withStaples(foods);
  const deal = makeDealer(foods, ctx);
  const slots = MEAL_SLOTS.filter(ms=>slotsFor(months).includes(ms.id));

  const days = DAY_ORDER.slice(1).concat(DAY_ORDER[0]).map(name=>{   // Monday..Sunday
    const day = {taken:new Set(), colours:new Set(), newCount:0};
    const meals = slots.map(ms=>{
      const items = [];
      (st.perMeal ? ms.cats.slice(0, st.perMeal) : ms.cats).forEach(cat=>{
        const food = deal(cat, ms.slot, day);
        if(food) items.push(dish(food, st));
      });
      return meal(ms.label, ms.icon, items, ms.id);
    });
    return {name, meals};
  });

  const week = {days};
  // batch-cook: Monday's and Thursday's dinners come round again two days later
  if(ctx.priorities.has("batch")){
    [[0,2],[3,5]].forEach(([from, to])=>{
      const src = days[from].meals.find(m=>m.label==="Dinner");
      const k = days[to].meals.findIndex(m=>m.label==="Dinner");
      if(!src || k<0) return;
      const copy = meal(src.label, src.icon, src.items.map(i=>it(i.name, i.qty, i.cats.slice(), i.tex)), src.slot);
      copy.from = days[from].name;   // "from Monday's batch"
      days[to].meals[k] = copy;
    });
  }
  ensureIron(week, foods, st);
  return week;
}

/* Babies and toddlers need iron daily, so guarantee at least one iron-rich
   item per day by swapping the lunch protein where a day comes up short. */
function ensureIron(week, foods, st){
  const ironNames = new Set(foods.filter(f=>f.iron).map(f=>f.name));
  const ironLunch = foods.filter(f=>f.iron && f.slots.includes("lunch") && f.cats[0]==="protein");
  if(ironLunch.length===0) return;
  week.days.forEach(day=>{
    const has = day.meals.some(m=>m.items.some(i=>ironNames.has(i.name)));
    if(has) return;
    const lunch = day.meals.find(m=>m.label==="Lunch");
    if(!lunch) return;
    const slot = lunch.items.findIndex(i=>i.cats[0]==="protein");
    const pick = ironLunch[Math.floor(Math.random()*ironLunch.length)];
    const item = dish(pick, st);
    if(slot>=0) lunch.items[slot] = item; else lunch.items.unshift(item);
  });
}

/* ---------- CREATE: preview stats ---------- */
function draftStats(){
  const names = new Set(), ironNames = new Set(FOOD_POOL.filter(f=>f.iron).map(f=>f.name));
  let ironDays = 0;
  draft.days.forEach(day=>{
    let dayIron = false;
    day.meals.forEach(m=>m.items.forEach(i=>{
      names.add(i.name);
      if(ironNames.has(i.name)) dayIron = true;
    }));
    if(dayIron) ironDays++;
  });
  // what the variety checklist would reach if every generated food were eaten
  let totalFoods = 0, covered = 0;
  const lower = new Set([...names].map(n=>n.toLowerCase()));
  Object.values(state.variety).forEach(foods=>{
    totalFoods += foods.length;
    covered += foods.filter(f=>{
      const t = f.trim().toLowerCase();
      return [...lower].some(n=>n===t || n.startsWith(t+",") || t.startsWith(n.split(",")[0]));
    }).length;
  });
  return {
    distinct: names.size,
    ironDays,
    coverage: totalFoods ? Math.round(100*covered/totalFoods) : 0
  };
}

/* ---------- CREATE: render ---------- */
function renderCreate(){
  renderCreateControls();
  renderCreatePreview();
}

function renderCreateControls(){
  const months = ageNow(), st = stageNow();

  const sum = document.getElementById("stageSummary");
  sum.textContent = stageSummary(st);
  sum.hidden = !st.solids;   // the milk-only note below already says it

  // under six months there is nothing to plan: a calm note instead of controls
  const milk = document.getElementById("milkState");
  document.getElementById("solidsControls").hidden = !st.solids;
  milk.hidden = st.solids;
  if(!st.solids){
    const left = 6 - months;
    milk.innerHTML = `<p class="big">No solids yet, milk is all they need.</p>
      <p>Come back around 6 months${left===1 ? ", in about a month" : `, in about ${left} months`}.</p>`;
  }

  // priorities: up to three, and a line saying how they steer the plan
  const pWrap = document.getElementById("priorityChips");
  pWrap.innerHTML = "";
  const chosen = state.profile.priorities;
  PRIORITIES.forEach(pr=>{
    const on = chosen.includes(pr.id);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip tap" + (on ? " selected" : "");
    b.setAttribute("aria-pressed", String(on));
    b.textContent = pr.label;
    b.disabled = !on && chosen.length>=3;
    b.addEventListener("click", ()=>{
      state.profile.priorities = on ? chosen.filter(x=>x!==pr.id) : chosen.concat(pr.id).slice(0,3);
      save(); draft = null; renderCreate();
    });
    pWrap.appendChild(b);
  });
  document.getElementById("priorityLine").textContent = priorityLine(chosen);

  // the household's own keep-out list: allergies strict, dislikes soft
  const exWrap = document.getElementById("excludeChips");
  exWrap.innerHTML = "";
  if(state.profile.avoid.length===0){
    const none = document.createElement("span");
    none.className = "subtle";
    none.style.margin = "0";
    none.textContent = "Nothing on the list yet.";
    exWrap.appendChild(none);
  }
  state.profile.avoid.forEach(x=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (x.kind==="allergy" ? " allergy" : "");
    chip.innerHTML = `${x.name} <span class="kind">${x.kind==="allergy" ? "Allergy" : "Dislike"}</span><button type="button" class="x" aria-label="Remove ${x.name}">✕</button>`;
    chip.querySelector("button").addEventListener("click", ()=>{
      state.profile.avoid = state.profile.avoid.filter(y=>y!==x);
      save(); draft = null; renderCreate();
    });
    exWrap.appendChild(chip);
  });

  // locked: always kept out at this age; tap one to hear why
  buildLockedRow(document.getElementById("lockedRules"), months);

  if(st.solids){
    document.getElementById("createBanner").textContent =
      `At ${ageLabel(months)}, foods are ${st.textureShort}; portions are ${st.portionHint}. ${st.note} `
      + `No added salt or sugar, and nothing served whole that could block a small airway. General guidance `
      + `only; check allergen introduction and anything you're unsure about with your paediatrician.`;
  }

  const gen = document.getElementById("generateBtn");
  gen.disabled = !st.solids;
  gen.textContent = draft ? "Shuffle again" : "Shuffle a preview";
  renderSummaries();
}

function addExclusion(kind){
  const inp = document.getElementById("excludeName");
  const v = inp.value.trim();
  if(!v) return;
  const have = state.profile.avoid.find(f=>f.name.toLowerCase()===v.toLowerCase());
  if(have) have.kind = kind;                 // re-adding switches allergy / dislike
  else state.profile.avoid.push({name:v, kind});
  save();
  inp.value = "";
  draft = null;
  renderCreate();
}

function generateDraft(){
  if(!stageFor(planMonths()).solids) return;
  draft = generateWeek(planMonths(), state.profile);
  renderCreate();
}

function discardDraft(){
  draft = null;
  renderCreate();
}

function renderCreatePreview(){
  const wrap = document.getElementById("createPreview");
  wrap.innerHTML = "";
  if(!draft){
    wrap.innerHTML = "";
    return;
  }

  const s = draftStats();
  const stats = document.createElement("div");
  stats.className = "card";
  stats.innerHTML = `<div class="section-title">Preview · ${ageLabel(ageNow())} · ${stageNow().name}</div>
    <div class="preview-stats">
      <span><strong>${s.distinct}</strong> different foods</span>
      <span><strong>${s.ironDays}/7</strong> days iron-rich</span>
      <span><strong>${s.coverage}%</strong> variety if all eaten</span>
    </div>`;
  wrap.appendChild(stats);

  const card = document.createElement("div");
  card.className = "preview-days";
  draft.days.forEach(day=>{
    const block = document.createElement("div");
    block.className = "meal-block";
    const rows = day.meals.map(m=>
      `<div class="preview-line"><span class="lbl">${m.icon} ${m.label}</span>`
      + `<span class="foods">${m.items.map(i=>i.name + (i.tex ? ` <span class="tex">${i.tex}</span>` : "")).join(", ") || "—"}</span></div>`
    ).join("");
    block.innerHTML = `<div class="meal-head"><div class="label">${day.name}</div></div>${rows}`;
    card.appendChild(block);
  });
  wrap.appendChild(card);

  const row = document.createElement("div");
  row.className = "btnrow";
  row.innerHTML = `<button class="btn primary" id="applyBtn">Use this week</button>
    <button class="btn" id="discardBtn">Not this one</button>`;
  row.querySelector("#applyBtn").addEventListener("click", applyDraft);
  row.querySelector("#discardBtn").addEventListener("click", discardDraft);
  wrap.appendChild(row);

  const note = document.createElement("p");
  note.className = "subtle";
  note.style.textAlign = "center";
  note.textContent = "Using it replaces this week's menu. What's at home, past weeks and the variety checklist stay.";
  wrap.appendChild(note);
}

function applyDraft(){
  if(!draft) return;

  state.plan = draft;   // stock and extras stay: the food at home doesn't change
  state.weekStarted = todayISO();
  save();

  draft = null;
  currentDay = dayDisplayOrder()[0];
  renderDayContent();
  renderKitchen();
  renderVariety();
  renderCreate();
  showSheet("week");
}

/* ---------- sheets ----------
   One dialog shows every detail. showSheet() opens it (or, when it's
   already open, goes one view deeper with a Back); views re-render in place
   when the plan changes, keeping scroll and focus. Shop and Plan are panels
   with their own renderers: they move in while shown and back out after. */
const sheetEl = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
let sheetStack = [], sheetOpener = null, sheetOpenerKey = null;
const PARTS = {shop:"part-shop", plan:"part-plan"};
function setSheetTitle(t){ document.getElementById("sheetTitle").textContent = t; }
const wideSheet = ()=>matchMedia("(min-width:768px)").matches;

function showSheet(kind, arg){
  if(sheetEl.open){ unmountParts(); sheetStack.push({kind, arg}); renderSheet(1); return; }
  sheetOpener = document.activeElement;
  // a redraw may replace the opener (a fan tile), so remember how to find it again
  sheetOpenerKey = sheetOpener ? (sheetOpener.id ? "#" + sheetOpener.id : sheetOpener.dataset.k ? `[data-k="${sheetOpener.dataset.k}"]` : null) : null;
  sheetStack = [{kind, arg}];
  renderSheet(0);
  sheetEl.showModal();
  document.getElementById("sheetTitle").focus({preventScroll:true});   // start on the title, not the close button
  sheetEl.style.transform = "";
  if(calm()) sheetEl.animate([{opacity:0},{opacity:1}], {duration:180});
  else sheetEl.animate(wideSheet() ? [{transform:"scale(.96)", opacity:0}, {transform:"none", opacity:1}]
                                   : [{transform:"translateY(100%)"}, {transform:"none"}],
                       {duration: wideSheet() ? 260 : 420, easing:"cubic-bezier(.32,1.2,.5,1)"});
  enterStagger();
}
function backSheet(){
  if(sheetStack.length < 2) return closeSheet();
  unmountParts(); sheetStack.pop(); renderSheet(-1);
}
function closeSheet(){
  if(!sheetEl.open) return;
  const done = ()=>{
    unmountParts(); sheetEl.close(); sheetStack = []; sheetEl.style.transform = "";
    const back = sheetOpener && document.contains(sheetOpener) ? sheetOpener : sheetOpenerKey ? document.querySelector(sheetOpenerKey) : null;
    if(back) back.focus({preventScroll:true});
  };
  if(calm()){ done(); return; }
  // exits are quicker than entrances
  const from = sheetEl.style.transform || "none";
  const a = sheetEl.animate(wideSheet() ? [{opacity:1}, {transform:"scale(.97)", opacity:0}]
                                        : [{transform:from}, {transform:"translateY(100%)"}],
                            {duration: wideSheet() ? 150 : 220, easing:"cubic-bezier(.4,0,1,1)", fill:"forwards"});
  a.onfinish = ()=>{ done(); a.cancel(); };
}
function unmountParts(){
  Object.values(PARTS).forEach(id=>{
    const el = document.getElementById(id);
    if(el.parentElement!==document.getElementById("parts")) document.getElementById("parts").appendChild(el);
  });
}
function enterStagger(){
  if(calm()) return;
  sheetBody.classList.remove("enter"); void sheetBody.offsetWidth; sheetBody.classList.add("enter");
  setTimeout(()=>sheetBody.classList.remove("enter"), 600);
}
function renderSheet(dir){
  const top = sheetStack[sheetStack.length-1];
  document.getElementById("sheetBack").hidden = sheetStack.length < 2;
  sheetBody.innerHTML = "";
  if(PARTS[top.kind]){
    sheetBody.appendChild(document.getElementById(PARTS[top.kind]));
    if(top.kind==="shop"){ setSheetTitle("Shop"); renderKitchen(); }
    if(top.kind==="plan"){ setSheetTitle("Plan next week"); renderCreate(); }
  }else{
    ({meal:renderMealSheet, week:renderWeekSheet, variety:renderVarietySheet, group:renderGroupSheet,
      settings:renderSettingsSheet})[top.kind](sheetBody, top.arg || {});
  }
  if(dir){
    sheetBody.scrollTop = 0;
    if(!calm()) sheetBody.animate([{transform:`translateX(${dir*32}px)`, opacity:0}, {transform:"none", opacity:1}],
                                  {duration:280, easing:"cubic-bezier(.32,1.2,.5,1)"});
    else sheetBody.animate([{opacity:0},{opacity:1}], {duration:160});
  }
}
/* the plan changed: redraw the view on show, keeping scroll and focus */
function refreshSheet(){
  if(!sheetEl.open || !sheetStack.length) return;
  const top = sheetStack[sheetStack.length-1];
  if(PARTS[top.kind]) return;   // Shop and Plan redraw themselves
  const y = sheetBody.scrollTop, rail = sheetBody.querySelector(".days-rail");
  const railX = rail ? rail.scrollLeft : 0;
  const focusKey = document.activeElement && sheetBody.contains(document.activeElement) ? document.activeElement.dataset.k : null;
  renderSheet(0);
  sheetBody.scrollTop = y;
  const r2 = sheetBody.querySelector(".days-rail"); if(r2) r2.scrollLeft = railX;
  if(focusKey){ const f = sheetBody.querySelector(`[data-k="${focusKey}"]`); if(f) f.focus({preventScroll:true}); }
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("sheetBack").addEventListener("click", backSheet);
sheetEl.addEventListener("cancel", e=>{ e.preventDefault(); closeSheet(); });   // Escape
sheetEl.addEventListener("click", e=>{ if(e.target===sheetEl) closeSheet(); });   // a tap on the backdrop
/* drag the handle (or the header) down to dismiss */
(function(){
  let y0 = null, dy = 0, id = null;
  const start = e=>{ if(wideSheet() || e.target.closest("button")) return; y0 = e.clientY; dy = 0; id = e.pointerId; e.currentTarget.setPointerCapture(id); };
  const move = e=>{ if(e.pointerId!==id || y0===null) return; dy = Math.max(0, e.clientY - y0); sheetEl.style.transform = `translateY(${dy}px)`; };
  const end = e=>{
    if(e.pointerId!==id || y0===null) return;
    y0 = null; id = null;
    if(dy > 110) closeSheet();
    else{
      const from = sheetEl.style.transform; sheetEl.style.transform = "";
      if(from && !calm()) sheetEl.animate([{transform:from}, {transform:"none"}], {duration:300, easing:"cubic-bezier(.32,1.2,.5,1)"});
    }
  };
  ["sheetGrab","sheetHead"].forEach(i=>{
    const el = document.getElementById(i);
    el.addEventListener("pointerdown", start); el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  });
})();
