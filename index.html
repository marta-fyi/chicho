/* ---------- the week sheet: seven days to swipe through, and past weeks ---------- */
function renderWeekSheet(body, arg){
  setSheetTitle("This week");
  const all = dayDisplayOrder().flatMap(i=>state.plan.days[i].meals.flatMap(m=>m.items));
  if(all.length && all.every(i=>i.ate)) body.insertAdjacentHTML("beforeend", `<p class="celebrate">${pick(CONTENT.weekDone, "week")}</p>`);
  const rail = document.createElement("div");
  rail.className = "days-rail";
  rail.setAttribute("role", "list");
  dayDisplayOrder().forEach((idx, pos)=>{
    const day = state.plan.days[idx], d = dateForDay(idx);
    const items = day.meals.flatMap(m=>m.items), marked = items.filter(i=>i.ate).length;
    const p = items.length ? marked/items.length : 0;
    const card = document.createElement("article");
    card.className = "day-card"; card.setAttribute("role", "listitem"); card.dataset.day = idx;
    card.innerHTML = `<div class="dc-top"><p class="dc-day">${DAY_FULL(d)} ${d.getDate()}</p>${pos===0 ? `<span class="dc-tag">Today</span>` : ""}
      <span class="ring" aria-hidden="true"><svg viewBox="0 0 38 38"><circle class="r-bg" cx="19" cy="19" r="15.9" pathLength="100"/><circle class="r-fg" cx="19" cy="19" r="15.9" pathLength="100" style="--p:${p.toFixed(3)}"/></svg></span></div>
      <ul class="dc-meals"></ul>`;
    const ul = card.querySelector("ul");
    day.meals.forEach((m, mi)=>{
      if(!m.items.length) return;
      const li = document.createElement("li");
      const mark = mealMark(m);
      li.innerHTML = `<button type="button" class="dc-meal" data-k="m-${idx}-${mi}"><span class="dc-slot">${m.label}</span><span class="dc-dish">${dishName(m)}</span><span class="dc-mark">${mark ? "✓ " + ATE_WORDS[mark] : ""}</span></button>`;
      li.querySelector("button").addEventListener("click", ()=>showSheet("meal", {day:idx, meal:mi}));
      ul.appendChild(li);
    });
    if(!ul.children.length) ul.innerHTML = `<li class="empty">${CONTENT.emptyDay}</li>`;
    rail.appendChild(card);
  });
  body.appendChild(rail);
  if(arg.day!==undefined){
    const pos = dayDisplayOrder().indexOf(arg.day);
    requestAnimationFrame(()=>{ const c = rail.children[pos]; if(c) rail.scrollLeft = c.offsetLeft - 16; });
  }
  const plan = document.createElement("button");
  plan.type = "button"; plan.className = "pill"; plan.style.width = "100%"; plan.textContent = "Plan next week →";
  plan.addEventListener("click", ()=>showSheet("plan"));
  body.appendChild(plan);
  const hist = document.createElement("div");
  hist.className = "card"; hist.style.marginTop = "18px";
  hist.innerHTML = `<div class="section-title">Past weeks</div><div class="history-list"></div>`;
  renderHistory(hist.querySelector(".history-list"));
  body.appendChild(hist);
  const fresh = document.createElement("button");
  fresh.type = "button"; fresh.className = "link-btn"; fresh.textContent = "Start a fresh week";
  fresh.addEventListener("click", ()=>{ startNewWeek(); announce("A fresh week. Last week is saved below."); });
  body.appendChild(fresh);
  body.insertAdjacentHTML("beforeend", `<p class="subtle center">A fresh week keeps the menu and what's at home, clears the marks, and saves this week's rainbow to Past weeks.</p>`);
}

/* ---------- variety: the rainbow, one food group at a time ---------- */
const GROUP_NAMES = {protein:"Proteins", vegetable:"Vegetables", fruit:"Fruits", grain:"Grains & starches", fat:"Healthy fats"};
function renderVarietySheet(body){
  setSheetTitle("Variety");
  const vnow = varietyNow();
  const on = Object.keys(CATS).filter(c=>(vnow[c]||[]).some(f=>isCovered(c, f))).length;
  body.insertAdjacentHTML("beforeend", `<p class="glance" style="margin:0 4px 12px">${on===0 ? CONTENT.rainbow.none : on===Object.keys(CATS).length ? CONTENT.rainbow.all : CONTENT.rainbow.some}</p>`);
  const list = document.createElement("div");
  list.className = "card vg-list";
  Object.keys(CATS).forEach(cat=>{
    const tasted = (vnow[cat]||[]).filter(f=>isCovered(cat, f));
    const b = document.createElement("button");
    b.type = "button"; b.className = "vg-row"; b.dataset.k = "g-" + cat;
    b.innerHTML = `<i class="vg-dot${tasted.length ? " on" : ""}" style="--c:var(--${cat})" aria-hidden="true"></i>
      <span class="vg-text"><span class="vg-name">${GROUP_NAMES[cat]}</span><span class="vg-sub">${tasted.length ? tasted.slice(0,4).join(", ") + (tasted.length>4 ? "…" : "") : "Not yet this week"}</span></span>`;
    b.addEventListener("click", ()=>showSheet("group", {cat}));
    list.appendChild(b);
  });
  body.appendChild(list);
  // log something else they tried
  const log = document.createElement("div");
  log.className = "card";
  log.innerHTML = `<div class="section-title">Log something else</div>`;
  log.appendChild(addForm("variety:log", {
    label: "Something they tried",
    rerender: ()=>refreshSheet(),
    fields: [{name:"name", type:"text", placeholder:"Food (e.g. mango)", full:true}, {name:"cat", type:"select", options:CAT_OPTIONS}],
    onSubmit: v=>{
      if(!v.name) return false;
      const list = state.variety[v.cat];
      const have = list.find(f=>f.toLowerCase()===v.name.toLowerCase());
      const food = have || v.name;
      if(!have) list.push(food);
      state.manualCovered[v.cat + "::" + food] = true;
      save(); announce(`${food} logged`); renderSummaries();
    }
  }));
  body.appendChild(log);
}
let groupEditing = false;
function renderGroupSheet(body, arg){
  const cat = arg.cat;
  setSheetTitle(GROUP_NAMES[cat]);
  const foods = varietyNow()[cat] || [];
  body.insertAdjacentHTML("beforeend", `<p class="subtle">${groupEditing ? "Remove foods from the list, or add new ones." : "Tasted this week light up by themselves when a meal is marked. Tap a food to mark it yourself."}</p>`);
  const card = document.createElement("div");
  card.className = "card";
  const chips = document.createElement("div");
  chips.className = "chips spaced";
  foods.forEach(food=>{
    const covered = isCovered(cat, food);
    const c = document.createElement("button");
    c.type = "button"; c.className = "chip tap" + (covered ? " covered" : ""); c.dataset.k = "f-" + food;
    c.setAttribute("aria-pressed", String(covered));
    c.innerHTML = groupEditing ? `${food} <span class="x" aria-hidden="true">✕</span>` : `${covered ? "✓ " : ""}${food}`;
    c.setAttribute("aria-label", groupEditing ? `Remove ${food}` : `${food}${covered ? ", tasted this week" : ""}`);
    c.addEventListener("click", ()=>{
      if(groupEditing){
        state.variety[cat] = state.variety[cat].filter(f=>f!==food);
        delete state.manualCovered[cat + "::" + food];
        save(); refreshSheet(); renderSummaries();
      }else toggleManual(cat, food);
    });
    chips.appendChild(c);
  });
  card.appendChild(chips);
  if(groupEditing) card.appendChild(addForm("variety:" + cat, {
    label: "Add a food to " + GROUP_NAMES[cat].toLowerCase(),
    rerender: ()=>refreshSheet(),
    fields: [{name:"name", type:"text", placeholder:"Food to add", full:true}],
    onSubmit: v=>{
      if(!v.name) return false;
      if(!state.variety[cat].some(f=>f.toLowerCase()===v.name.toLowerCase())){ state.variety[cat].push(v.name); save(); }
    }
  }));
  body.appendChild(card);
  const edit = document.createElement("button");
  edit.type = "button"; edit.className = "link-btn"; edit.dataset.k = "edit"; edit.textContent = groupEditing ? "Done" : "Edit the list";
  edit.addEventListener("click", ()=>{ groupEditing = !groupEditing; refreshSheet(); });
  body.appendChild(edit);
}

/* ---------- voice: every string lives in content.js (CONTENT, pick, say) ---------- */
function dayPart(d){
  const h = (d || now()).getHours();
  return h>=5 && h<12 ? "morning" : h>=12 && h<18 ? "afternoon" : "evening";
}
const DAY_FULL = d=>DAY_ORDER[d.getDay()];

/* ====================================================================
   HOME: a poster, no boxes. The greeting, the clock, the next meal, then
   Today, This week, Shop and Variety. Everything about a thing opens in
   a peek (hover, focus or tap); "Open →" goes to the full view (the sheet).
   ==================================================================== */
const GROUPS = ["protein","vegetable","fruit","grain","fat"];
const $ = id=>document.getElementById(id);
/* only touch the DOM when the words actually change (the clock ticks every minute) */
function setText(el, text){ if(el && el.textContent!==text) el.textContent = text; }
function weekStart(){ const d = localDate(state.weekStarted); return isNaN(d) ? now() : d; }
/* the plan's seven days, from the day it started (not Monday): {pos, date, dayIdx} */
function weekDays(){
  const s = weekStart();
  return Array.from({length:7}, (_, pos)=>{ const date = new Date(s.getFullYear(), s.getMonth(), s.getDate() + pos); return {pos, date, dayIdx:planDayIndex(date)}; });
}
function weekDone(){ const s = weekStart(); return now() >= new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7); }
function milkOnly(){ return ageNow() < 6 && !state.profile.exploreEarly; }
function hasPlan(){ return !!state.plan && state.plan.days.some(d=>d.meals.some(m=>m.items.length)); }
/* the foods of a group tried this week: marked eaten (all or some), or logged by hand */
function triedFoods(cat){
  const out = new Set();
  state.plan.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{ if((i.ate==="all" || i.ate==="some") && i.cats[0]===cat) out.add(baseName(i)); })));
  Object.keys(state.manualCovered || {}).forEach(k=>{ const [c, f] = k.split("::"); if(c===cat && state.manualCovered[k]) out.add(f); });
  return [...out];
}
/* what to pick up for the rest of the week, the soonest-needed first */
function shopList(){
  const order = dayDisplayOrder().map(i=>state.plan.days[i].name);
  const first = n=>Math.min(...n.days.map(d=>order.indexOf(d)));
  return Object.values(needOn(windowDays("week")))
    .filter(n=>{ const a = toBuy(n); return a===null || a>0; })
    .sort((a, b)=>first(a) - first(b));
}
function dayWordFor(name){
  const order = dayDisplayOrder().map(i=>state.plan.days[i].name);
  const k = order.indexOf(name);
  return k===0 ? "today" : k===1 ? "tomorrow" : shortDay(name);
}
function mealEaten(m){ return m.items.length > 0 && m.items.every(i=>i.ate); }

/* ---------- render ---------- */
let homeKey = null, homeDrawn = false, mealsSig = "", lastISO = null;
function renderHome(){
  if(!$("home")) return;
  const P = state.profile, st = stageNow();
  if(P.lastStage===null || P.lastStage===undefined){ P.lastStage = st.id; save(); }
  lastISO = todayISO();
  setText($("profileBtn"), (P.name || "·").trim().charAt(0).toUpperCase());
  $("profileBtn").setAttribute("aria-label", say("home.profile.label") + (P.name ? ": " + P.name : ""));
  const calmState = milkOnly(), empty = !calmState && !hasPlan();
  $("home").classList.toggle("is-milk", calmState);
  $("home").classList.toggle("is-empty", empty);
  renderClock();
  renderMoment();
  renderMeals();
  renderWeek();
  renderShopLine();
  renderVarietyLine();
  if(!homeDrawn){ homeDrawn = true; homeEntrance(); }
  Peek.refresh();
}
function renderClock(){
  const P = state.profile, t = now();
  const greet = say("home.greet." + dayPart(t), {name:P.name || ""}).replace(/,\s*$/, "");
  setText($("greet"), greet + (P.birthDate ? say("home.age", {months:ageNow()}) : ""));
  setText($("clock"), fmtDateTime(t));
  $("clock").setAttribute("datetime", t.toISOString());
}
/* headline + support (or a prompt in its place) + the tab's title */
function renderMoment(){
  const P = state.profile, st = stageNow(), m = homeMoment(), name = P.name || "";
  document.title = m.title;
  const h = $("headline"), sup = $("support");
  const changed = homeKey!==null && homeKey!==m.key;
  const paint = ()=>{
    setText(h, m.headline);
    sup.innerHTML = "";
    const prompt = (text, acts)=>{
      sup.append(text + " ");
      acts.forEach(([label, fn])=>{ const b = document.createElement("button"); b.type = "button"; b.className = "btn-text inline"; b.textContent = label; b.addEventListener("click", fn); sup.append(b); });
    };
    if(m.kind==="empty") prompt("", [[m.action, setNextWeek]]);
    else if(m.kind!=="milk" && st.solids && P.lastStage!==st.id){
      prompt(say("home.stageChange", {name, months:ageNow()}), [
        [say("home.stageUpdate"), ()=>setNextWeek()],
        [say("home.stageLater"), ()=>{ P.lastStage = st.id; save(); renderHome(); }]]);
    }else if(m.kind!=="milk" && weekDone()) prompt(say("home.weekDone"), [[say("home.weekNext"), setNextWeek]]);
    else setText(sup, m.support || "");
  };
  if(changed && !calm()){
    [h, sup].forEach(el=>el.animate([{opacity:1}, {opacity:0}], {duration:150, fill:"forwards"}).onfinish = function(){ this.cancel(); });
    setTimeout(()=>{ paint(); [h, sup].forEach(el=>el.animate([{opacity:0, transform:"translateY(6px)"}, {opacity:1, transform:"none"}], {duration:300, easing:"cubic-bezier(.32,1.25,.5,1)"})); }, 150);
  }else paint();
  if(changed && m.announce) announce(m.announce);
  homeKey = m.key;
}

/* Today: the day's meals in time order, drawn, the next one lifted. Built once per
   shape of the day; the clock only moves classes, so the emphasis glides. */
const TILT = [-5, 4, -3, 6, -6];
function renderMeals(){
  const wrap = $("meals"), t = now();
  const today = milkOnly() ? [] : mealsOn(t);
  const sig = todayISO() + "|" + today.map(x=>x.slot + x.time + x.m.items.map(i=>i.id + (i.ate || "")).join(",")).join(";");
  if(sig!==mealsSig){
    mealsSig = sig;
    wrap.innerHTML = "";
    wrap.style.setProperty("--n", Math.max(1, today.length));
    if(milkOnly()){
      wrap.innerHTML = `<div class="meal solo" role="listitem"><span class="meal-art">${foodArt("milk", {size:150, alt:say("home.milkArt")})}</span></div>`;
    }
    today.forEach((x, k)=>{
      const main = x.m.items[0];
      const el = document.createElement("div");
      el.className = "meal"; el.setAttribute("role", "listitem");
      el.dataset.day = x.dayIdx; el.dataset.k = x.k;
      el.style.setProperty("--r", TILT[k % TILT.length] + "deg");
      el.style.setProperty("--z", 10 - k);
      el.innerHTML = `<span class="meal-tag" aria-hidden="true"><i></i><span></span></span>
        <button type="button" class="meal-btn" data-k="meal-${x.slot}"><span class="meal-art">${foodArt(main.name, {size:150, alt:""})}</span></button>
        <button type="button" class="qtick" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></button>
        <span class="meal-name"><b>${esc(x.m.label)}</b><span class="meal-time"><span class="sep">· </span>${esc(fmtTime(x.start))}</span></span>
        <span class="meal-note"></span>`;
      const btn = el.querySelector(".meal-btn");
      Peek.bind(btn, {kind:"meal", arg:{day:x.dayIdx, meal:x.k}});
      el.querySelector(".qtick").addEventListener("click", e=>{ e.stopPropagation(); quickTick(x.dayIdx, x.k, el); });
      wrap.appendChild(el);
    });
  }
  updateMeals();
}

/* ====================================================================
   PEEKS: the only surfaces. One element, any trigger.
   Desktop (fine pointer): opens 90 ms into a hover, closes 160 ms after
   the pointer leaves trigger and peek (a bridge covers the gap); click
   pins it. Keyboard: focus opens, ↓/↑ move through its rows, Esc closes
   and returns focus. Touch: a bottom sheet over a scrim, drag to dismiss.
   Positioned fixed with flip/shift, so nothing on the page moves.
   ==================================================================== */
const Peek = (()=>{
  const fine = matchMedia("(hover: hover) and (pointer: fine)");
  let el = null, scrim = null, cur = null, opts = null, pinned = false, sheet = false, openT = 0, closeT = 0, quiet = null;

    scrim = document.createElement("div");
    scrim.className = "scrim"; scrim.hidden = true;
    scrim.addEventListener("click", ()=>close(true));
    document.body.append(scrim, el);
    el.addEventListener("pointerenter", ()=>clearTimeout(closeT));
    el.addEventListener("pointerleave", e=>{ if(!pinned && !sheet && e.pointerType==="mouse") closeSoon(); });
    el.addEventListener("keydown", onKey);
    el.addEventListener("focusout", e=>{ if(!pinned && !sheet && !el.contains(e.relatedTarget) && e.relatedTarget!==cur) closeSoon(); });

    let y0 = null, dy = 0;
    el.addEventListener("pointerdown", e=>{ if(sheet && e.target.closest(".peek-grab")){ y0 = e.clientY; dy = 0; el.setPointerCapture(e.pointerId); } });
    el.addEventListener("pointermove", e=>{ if(y0!==null){ dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; } });
    el.addEventListener("pointerup", ()=>{ if(y0===null) return; y0 = null; if(dy > 80) close(true); else { el.style.transform = ""; } });
    document.addEventListener("pointerdown", e=>{ if(cur && pinned && !sheet && !el.contains(e.target) && !cur.contains(e.target)) close(false); }, true);
    document.addEventListener("keydown", e=>{ if(e.key==="Escape" && cur){ e.preventDefault(); close(true); } });

    trigger.setAttribute("aria-expanded", "false");
    trigger.setAttribute("aria-controls", "peek");
    trigger._peek = o;

      mount(); clearTimeout(closeT);
      if(cur!==trigger){ clearTimeout(openT); openT = setTimeout(()=>open(trigger, false), 90); }
    });
    trigger.addEventListener("pointerleave", e=>{ if(e.pointerType!=="mouse") return; clearTimeout(openT); if(cur===trigger && !pinned) closeSoon(); });
    trigger.addEventListener("click", ()=>{
      mount();
      if(!fine.matches){ open(trigger, true, true); return; }
      if(cur===trigger && pinned){ close(false); return; }
      open(trigger, true);
    });
    trigger.addEventListener("focus", ()=>{
      if(quiet===trigger){ quiet = null; return; }   // focus coming back after Esc doesn't reopen it
      if(trigger.matches(":focus-visible")){ mount(); open(trigger, false); }
    });
    trigger.addEventListener("blur", e=>{ if(cur===trigger && !pinned && !(el && el.contains(e.relatedTarget))) closeSoon(); });
    trigger.addEventListener("keydown", e=>{
      if(e.key==="ArrowDown" && cur===trigger){ e.preventDefault(); const r = rows(); if(r[0]) r[0].focus(); }
    });
  }
  function rows(){ return el ? [...el.querySelectorAll("button:not([disabled]), input, [data-row][tabindex]")].filter(x=>x.offsetParent!==null) : []; }
  function onKey(e){
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){
      if(e.target.tagName==="INPUT" && e.target.type!=="time") return;
      e.preventDefault();

      if(j < 0){ cur && cur.focus(); return; }

    }
  }
  function focusAfter(t){
    const all = [...document.querySelectorAll("#home button:not([disabled]), #home a[href]")].filter(x=>x.offsetParent!==null);
    const k = all.indexOf(t); if(all[k+1]) all[k+1].focus();
  }
  function open(trigger, pin, asSheet){
    mount();
    clearTimeout(closeT); clearTimeout(openT);
    const same = cur===trigger && !el.hidden;
    if(cur && cur!==trigger) close(false, true);
    cur = trigger; opts = trigger._peek; pinned = !!pin; sheet = !!asSheet;
    trigger.setAttribute("aria-expanded", "true");

    if(same){ el.classList.toggle("pinned", pinned); return; }
    render();
    el.classList.toggle("as-sheet", sheet);
    el.classList.toggle("pinned", pinned);
    el.hidden = false; el.style.transform = "";
    scrim.hidden = !sheet;
    place();
    if(!calm()){
      el.animate(sheet ? [{transform:"translateY(100%)"}, {transform:"none"}]
                       : [{opacity:0, transform:"translateY(8px) scale(.98)"}, {opacity:1, transform:"none"}],
                 {duration: sheet ? 380 : 220, easing: sheet ? "cubic-bezier(.32,1.2,.5,1)" : "cubic-bezier(.2,.8,.2,1)"});
      if(sheet) scrim.animate([{opacity:0}, {opacity:1}], {duration:220});
    }
    if(sheet){ const r = rows(); (r[0] || el).focus({preventScroll:true}); }
  }
  function render(){
    const keep = el.contains(document.activeElement) ? rows().indexOf(document.activeElement) : -1;
    const scroll = el.scrollTop;
    el.innerHTML = sheet ? `<div class="peek-grab" aria-hidden="true"><i></i></div>` : "";
    const body = document.createElement("div");
    body.className = "peek-body";

    if(title){ title.id = "peekTitle"; el.setAttribute("aria-labelledby", "peekTitle"); }
    el.scrollTop = scroll;
    if(keep >= 0){ const r = rows(); (r[Math.min(keep, r.length-1)] || el).focus({preventScroll:true}); }
  }
  function place(){
    if(!el || el.hidden || !cur || sheet){ if(el && sheet){ el.style.left = el.style.top = ""; } return; }
    if(!document.contains(cur)){ close(false, true); return; }
    const r = cur.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, m = 8, gap = 10;
    const below = innerHeight - r.bottom - gap - m, above = r.top - gap - m;
    const down = h <= below || below >= above;
    el.style.maxHeight = Math.max(200, down ? below : above) + "px";
    const hh = Math.min(h, down ? below : above);
    el.style.top = (down ? r.bottom + gap : r.top - gap - hh) + "px";
    el.style.left = Math.max(m, Math.min(r.left + r.width/2 - w/2, innerWidth - w - m)) + "px";
    el.classList.toggle("above", !down);
    // the bridge reaches back to the trigger, so the pointer can travel across the gap
    el.style.setProperty("--bridge-x", (r.left - parseFloat(el.style.left)) + "px");
    el.style.setProperty("--bridge-w", r.width + "px");
  }
  function closeSoon(){ clearTimeout(closeT); closeT = setTimeout(()=>close(false), 160); }
  function close(returnFocus, instant){
    clearTimeout(closeT); clearTimeout(openT);
    if(!el || !cur) return;
    const t = cur;
    t.setAttribute("aria-expanded", "false");
    t.classList.remove("is-open");
    cur = null; pinned = false;
    const wasSheet = sheet; sheet = false;
    const hide = ()=>{ if(cur) return; el.hidden = true; scrim.hidden = true; el.innerHTML = ""; el.style.transform = ""; };
    if(instant || calm()) hide();
    else{
      const a = el.animate(wasSheet ? [{transform:el.style.transform || "none"}, {transform:"translateY(100%)"}] : [{opacity:1}, {opacity:0, transform:"translateY(4px) scale(.99)"}],
                           {duration: wasSheet ? 220 : 140, easing:"cubic-bezier(.4,0,1,1)", fill:"forwards"});
      if(wasSheet) scrim.animate([{opacity:1}, {opacity:0}], {duration:200, fill:"forwards"}).onfinish = function(){ this.cancel(); };
      a.onfinish = ()=>{ a.cancel(); hide(); };
    }
    if(returnFocus && document.contains(t) && document.activeElement!==t){ quiet = t; t.focus({preventScroll:true}); if(document.activeElement!==t) quiet = null; }
  }
  /* after any change, an open peek redraws in place (focus and scroll kept) */
  function refresh(){ if(el && cur && !el.hidden){ if(!document.contains(cur)){ const k = cur.dataset.k; const again = k && document.querySelector(`[data-k="${k}"]`); if(again){ again._peek = again._peek || cur._peek; cur = again; again.setAttribute("aria-expanded", "true"); again.classList.add("is-open"); } else { close(false, true); return; } } render(); place(); } }
  return {bind, open, close, refresh, get el(){ return el; }, get trigger(){ return cur; }};
})();

/* ---------- what each peek holds ---------- */
const tickSVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg>`;

/* three safe alternatives from the same food group for this meal */
function alternatives(m, k){
  const item = m.items[k], months = planMonths(), slot = (MEAL_SLOTS.find(x=>x.id===m.slot) || {}).slot || SLOT_OF[m.label] || "lunch";
  const taken = new Set(m.items.map(i=>i.name));
  const pool = FOOD_POOL.filter(f=>f.cats[0]===item.cats[0] && f.slots.includes(slot) && !taken.has(f.name) && isAllowed(f, months, state.profile));
  const withArt = pool.filter(f=>hasArt(foodOf(f.name))), rest = pool.filter(f=>!hasArt(foodOf(f.name)));
  return shuffled(withArt).concat(shuffled(rest)).slice(0, 3);
}
let peekOpen = {swap:null, more:null, time:false, log:false};   // which inline part of the meal peek is open
const PEEKS = {
  /* a meal: its foods, each with texture and amount, a tick, swap / skip / how it went */
  meal(body, {day, meal}){
    const d = state.plan.days[day], m = d && d.meals[meal];

    sw.innerHTML = `<span>${esc(say("peek.meal.allEaten"))}</span><i aria-hidden="true"></i>`;
    sw.addEventListener("click", ()=>{ m.items.forEach(i=>setAte(i, all ? null : "all")); save(); haptic(); afterMark(m, Peek.trigger, !all); });

    list.className = "p-rows";
    m.items.forEach((item, k)=>{

      const acts = row.querySelector(".p-acts");
      const act = (label, fn, extra)=>{ const b = document.createElement("button"); b.type = "button"; b.className = "p-act"; b.textContent = label; if(extra) Object.entries(extra).forEach(([a, v])=>b.setAttribute(a, v)); b.addEventListener("click", fn); acts.appendChild(b); return b; };

/* the same order all day for the same key, so suggestions don't jump between peeks */
function shuffledFor(arr, key){
  const a = arr.slice();
  let h = 2166136261; for(let k=0; k<key.length; k++){ h ^= key.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  for(let i=a.length-1; i>0; i--){ h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i+1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* the next meal still to come that this food suits (today first, then the rest of the week) */
function nextOpenSlot(f){
  for(const x of weekDays()){
    if(isoOf(x.date) < todayISO() || x.dayIdx < 0) continue;
    const list = isoOf(x.date)===todayISO() ? mealsOn(now()).filter(y=>y.status==="upcoming" || y.status==="now") : mealsOn(x.date);
    const hit = list.find(y=>{ const ms = MEAL_SLOTS.find(s=>s.id===y.slot); return ms && f.slots.includes(ms.slot) && !y.m.items.some(i=>i.name===f.name) && !mealEaten(y.m); });
    if(hit) return {m:hit.m, label:hit.m.label.toLowerCase()};
  }
  return null;
}

/* ---------- onboarding ----------
   One sentence per screen, completed by you: the field sits inside the
   sentence as its missing word. Every answer is saved as it's given, so
   closing the tab and coming back resumes at the same step, and Back keeps
   what was entered. Nothing about the plan changes until "Love it". */
const ONB_STEPS = ["welcome","name","birthday","keepout","priorities","athome","mealtimes","reveal"];
const STAPLES = [
  ["Oats","Oatmeal"],["Rice","Rice, soft-cooked"],["Pasta","Whole wheat pasta"],["Bread","Whole wheat toast"],
  ["Eggs","Egg, well cooked"],["Yogurt","Greek yogurt"],["Cheese","Cheese, grated"],["Lentils","Lentils"],
  ["Chickpeas","Chickpeas"],["Frozen peas","Peas"],["Frozen spinach","Spinach, cooked"],["Potatoes","Potato"],
  ["Sweet potatoes","Sweet potato"],["Carrots","Carrots, soft-cooked"],["Bananas","Banana"],["Apples","Apple, cooked"],
  ["Avocado","Avocado"],["Olive oil","Olive oil"]
];
/* each allergen pill shows the drawing of a food that carries it, when there is one */
const ALLERGEN_ART = {egg:"egg", milk:"milk", peanut:"peanut-butter", wheat:"toast", soy:"tofu", fish:"white-fish", sesame:"hummus"};
let onb = {step:0, sub:null, dir:1, draft:null, revealed:false, kind:"allergy", adding:false};
const S = key=>ONB_STEPS.indexOf(key);

/* months to plan for: a baby under 6 months only gets a menu if the
   family chose to explore anyway, and then it's a first-tastes week */
function planMonths(){
  const m = ageNow();
  return m < 6 && state.profile.exploreEarly ? 6 : m;
}
/* meal times only matter once there are meals */
function stepApplies(key){ return key!=="mealtimes" || planMonths() >= 6; }
function stepAfter(n){ let k = n + 1; while(k < ONB_STEPS.length-1 && !stepApplies(ONB_STEPS[k])) k++; return k; }
function stepBefore(n){ let k = n - 1; while(k > 0 && !stepApplies(ONB_STEPS[k])) k--; return Math.max(0, k); }
function nextStep(){ goStep(stepAfter(onb.step)); }

/* step is an index or a name ("reveal") */
function openOnboarding(step, opts){
  const P = state.profile;
  if(typeof step==="string") step = S(step);
  const o = opts || {};
  onb.step = Math.max(0, Math.min(ONB_STEPS.length-1, step===undefined ? (P.onboardingStep||0) : step));
  // from the profile menu: one step (single) or a few (through), then back home
  onb.from = o.single || o.through ? onb.step : null;
  onb.through = o.through ? S(o.through) : o.single ? onb.step : null;
  onb.single = onb.through!==null;
  onb.replay = !!o.replay;
  onb.sub = null; onb.draft = null; onb.revealed = false; onb.adding = false;
  document.body.classList.add("onb-open");
  document.querySelector(".container").inert = true;
  const el = document.getElementById("onboarding");
  el.hidden = false;
  document.getElementById("onbClose").hidden = !P.onboarded;   // a re-run can be left; a first run can't
  renderOnb();
  focusStep();
}
function closeOnboarding(){
  document.getElementById("onboarding").hidden = true;
  document.body.classList.remove("onb-open");
  document.querySelector(".container").inert = false;
  clearInterval(welTimer); clearTimeout(onb.revealTimer);
  mealsSig = "";
  renderKitchen(); renderCreate(); renderHome();
}
function finishOnboarding(){
  state.profile.onboarded = true;
  state.profile.onboardingStep = 0;
  delete state.profile.returning;
  save();
  closeOnboarding();
}
/* the gradient hurries for a moment, as if we were moving through it */
function rushSky(){
  if(calm()) return;
  document.querySelectorAll(".bg-img").forEach(b=>b.getAnimations().forEach(a=>{
    a.playbackRate = 14;
    setTimeout(()=>{ a.playbackRate = 6; }, 160);
    setTimeout(()=>{ a.playbackRate = 1; }, 420);
  }));
}
/* the first blank waits with its caret; otherwise the sentence itself takes focus */
function focusStep(){
  const card = document.getElementById("onbCard");
  const f = card.querySelector(".blank-input");
  const title = card.querySelector("#onbTitle");
  if(f) f.focus({preventScroll:true});
  else if(title){ title.tabIndex = -1; title.focus({preventScroll:true}); }
}
/* the finished sentence slides up and fades; the next one rises in */
function goStep(n, sub){
  if(onb.single && (n < onb.from || n > onb.through)){ save(); closeOnboarding(); return; }
  const card = document.getElementById("onbCard");
  onb.dir = n > onb.step || (n===onb.step && sub) ? 1 : -1;
  const swap = ()=>{
    onb.step = n; onb.sub = sub || null; onb.adding = false;
    if(!onb.single) state.profile.onboardingStep = n;
    save();
    renderOnb();
    if(!calm()) card.animate([{transform:`translateY(${onb.dir*28}px)`, opacity:0}, {transform:"none", opacity:1}],
                             {duration:320, easing:"cubic-bezier(.32,1.25,.5,1)"});
    else card.animate([{opacity:0},{opacity:1}], {duration:180});
    focusStep();
  };
  rushSky();
  if(calm()){ swap(); return; }
  const out = card.animate([{transform:"none", opacity:1}, {transform:`translateY(${-onb.dir*24}px)`, opacity:0}],
                           {duration:170, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
  out.onfinish = ()=>{ out.cancel(); swap(); };
}

function renderOnb(){
  const P = state.profile, key = ONB_STEPS[onb.step];
  const dots = document.getElementById("onbDots");
  const shown = ONB_STEPS.filter((k, i)=>i > 0 && stepApplies(k));   // the welcome has no dot
  dots.innerHTML = shown.map(k=>`<i class="${k===key ? "on" : ""}"></i>`).join("");
  document.getElementById("onbProgress").textContent = onb.step ? `Step ${shown.indexOf(key)+1} of ${shown.length}` : "";
  const back = document.getElementById("onbBack");
  back.hidden = onb.step===0 && !onb.sub && !onb.single;
  back.setAttribute("aria-label", say("onb.back"));
  back.onclick = ()=> onb.sub ? goStep(onb.step) : onb.single && onb.step===onb.from ? closeOnboarding() : goStep(stepBefore(onb.step));
  document.getElementById("onbClose").onclick = closeOnboarding;
  const card = document.getElementById("onbCard");
  card.innerHTML = "";
  card.className = "onb-card bare";
  clearInterval(welTimer); clearTimeout(onb.revealTimer);
  document.getElementById("onboarding").classList.toggle("is-welcome", key==="welcome");
  ({welcome:onbWelcome, name:onbName, birthday:onbBirthday, keepout:onbKeepout, priorities:onbPriorities,
    athome:onbAtHome, mealtimes:onbMealTimes, reveal:onbReveal})[key](card, P);
}

/* ---------- the pieces every step is made of ---------- */
const esc = t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* A blank inside a sentence: an input that grows with what you type (a hidden
   mirror sets its width), on a thick underline that pulses softly until the
   first keystroke. state: "" (empty) · "ok" (a valid value: the line darkens) · "hint" */
function blank(o){
  const wrap = document.createElement("span");
  wrap.className = "blank" + (o.value ? "" : " idle");
  wrap.style.setProperty("--min", (o.min || 3) + "ch");
  const mirror = document.createElement("span");
  mirror.className = "blank-mirror"; mirror.setAttribute("aria-hidden", "true");
  const inp = document.createElement("input");
  inp.className = "blank-input"; inp.type = "text"; inp.id = o.id || "b" + uid();
  inp.autocomplete = o.autocomplete || "off"; inp.spellcheck = false;
  if(o.inputmode) inp.inputMode = o.inputmode;
  if(o.maxLength) inp.maxLength = o.maxLength;
  if(o.label) inp.setAttribute("aria-label", o.label);
  if(o.list) inp.setAttribute("list", o.list);
  if(o.enterkeyhint) inp.enterKeyHint = o.enterkeyhint;
  inp.value = o.value || "";
  const sync = ()=>{ mirror.textContent = inp.value || " ".repeat(o.min || 3); };
  sync();
  inp.addEventListener("input", ()=>{ wrap.classList.remove("idle"); sync(); o.onInput && o.onInput(inp.value); });
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); o.onEnter && o.onEnter(); } });
  wrap.append(mirror, inp);
  return {el:wrap, input:inp, sync, set(state){ wrap.dataset.state = state || ""; }};
}
/* a sentence from content with {blank}-style slots filled by elements; the words
   before the first slot become a <label> for it */
function sentence(text, slots, cls){
  const h = document.createElement("h1");
  h.className = cls || "sent"; h.id = "onbTitle"; h.tabIndex = -1;
  const parts = text.split(/\{(\w+)\}/);
  let labelled = false;
  parts.forEach((part, k)=>{
    if(k % 2===0){
      if(!part) return;
      const next = slots[parts[k+1]];
      if(!labelled && next && next.input){
        const l = document.createElement("label");
        l.htmlFor = next.input.id; l.textContent = part.replace(/\s+$/, "");
        h.append(l, part.endsWith(" ") ? " " : "");
        labelled = true;
      }else h.append(part);
    }else{
      const slot = slots[part];
      h.append(slot ? slot.el : `{${part}}`);
    }
  });
  return h;
}
function line(text, cls){ const p = document.createElement("p"); p.className = cls || "onb-line"; p.innerHTML = keepSentences(esc(text)); return p; }
function hint(){ const p = document.createElement("p"); p.className = "onb-hint"; p.setAttribute("aria-live", "polite"); return p; }
/* the primary button (fades in once the step has a valid value) and quiet text buttons */
function onbCta(card, label, onNext, opts){

/* a line breaks between its sentences, not inside one, when each fits */

/* every ~3 s the next food rises in with a small turn while the last one lifts away;
   only the next drawing is fetched ahead, and nothing runs while the tab is hidden */
function welcomeCycle(card, heroes){
  clearInterval(welTimer);
  if(heroes.length < 2) return;
  const warm = id=>{ const f = foodOf(id); const im = new Image(); im.decoding = "async"; im.src = devicePixelRatio > 1.5 ? f.files.w384 : f.files.w192; };
  let k = 0;
  warm(heroes[1]);
  welTimer = setInterval(()=>{
    if(!card.isConnected || !card.classList.contains("wel-in")){ clearInterval(welTimer); return; }
    if(document.hidden) return;
    const cur = card.querySelector(".wel-layer.is-on"), next = card.querySelector(".wel-layer:not(.is-on)");
    if(!cur || !next) return;
    k = (k + 1) % heroes.length;
    next.innerHTML = foodArt(heroes[k], {size:140, alt:""});
    const img = next.querySelector("img");
    (img && img.decode ? img.decode().catch(()=>{}) : Promise.resolve()).then(()=>{
      cur.classList.remove("is-on"); next.classList.add("is-on");
      if(calm()){
        next.animate([{opacity:0}, {opacity:1}], {duration:400});
        cur.animate([{opacity:1}, {opacity:0}], {duration:400});
      }else{
        next.animate([{opacity:0, transform:"translateY(10px) rotate(-8deg) scale(.92)"}, {opacity:1, transform:"none"}],
                     {duration:400, easing:"cubic-bezier(.32,1.25,.5,1)"});
        cur.animate([{opacity:1, transform:"none"}, {opacity:0, transform:"translateY(-12px) rotate(5deg) scale(.96)"}],
                    {duration:280, easing:"cubic-bezier(.22,.61,.36,1)"});
      }
      warm(heroes[(k + 1) % heroes.length]);
    });
  }, 3000);
}

/* 3. birthday: "{name} arrived on __ / ____ / ____." The stage follows along below. */
const MONTH_NAMES = (()=>{ const f = new Intl.DateTimeFormat(undefined, {month:"long"}); return Array.from({length:12}, (_, k)=>f.format(new Date(2024, k, 1))); })();
const MONTHS_EN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
/* "10", "oct", "October", "octubre" → 9; null when unclear */
function parseMonth(v){
  const t = String(v || "").trim().toLowerCase().replace(/\.$/, "");
  if(!t) return null;
  if(/^\d{1,2}$/.test(t)){ const n = +t; return n>=1 && n<=12 ? n-1 : null; }
  const hits = new Set();
  [MONTH_NAMES.map(m=>m.toLowerCase()), MONTHS_EN].forEach(list=>list.forEach((m, k)=>{ if(m===t || (t.length>=3 && m.startsWith(t))) hits.add(k); }));
  return hits.size===1 ? [...hits][0] : null;
}
function onbBirthday(card, P){
  const name = P.name || "They";
  if(onb.sub==="milk"){
    const m = ageNow(), left = Math.max(1, 6 - m);
    const [first, ...rest] = say("onb.birthday.milk", {name, n:left}).split(/(?<=\.)\s+/);
    const h = document.createElement("h1");
    h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = first;
    card.append(h, line(rest.join(" ")));
    onbCta(card, say("onb.birthday.remind"), ()=>{
      const b = localDate(P.birthDate);
      const at = new Date(b.getFullYear(), b.getMonth()+6, b.getDate());
      P.remindAt = isoOf(at);
      P.exploreEarly = false; save(); nextStep();
    }, {extra:[{label:say("onb.birthday.explore"), on:()=>{ P.exploreEarly = true; save(); nextStep(); }}]});
    return;
  }
  const today = now();
  const had = P.birthDate ? localDate(P.birthDate) : null;
  let next;
  const check = ()=>{
    const d = +day.input.value, mo = parseMonth(month.input.value), y = +year.input.value;
    day.set(d>=1 && d<=31 ? "ok" : ""); month.set(mo!==null ? "ok" : ""); year.set(/^\d{4}$/.test(year.input.value) ? "ok" : "");
    let msg = "", date = null;
    if(day.input.value && month.input.value && year.input.value){
      if(mo===null) msg = say("onb.birthday.hint.month", {month:MONTH_NAMES[today.getMonth()]});
      else if(!/^\d{4}$/.test(year.input.value) || y < today.getFullYear()-10) msg = say("onb.birthday.hint.year", {year:today.getFullYear()-1});
      else{
        const max = new Date(y, mo+1, 0).getDate();
        if(d < 1 || d > max){ msg = say("onb.birthday.hint.days", {month:MONTH_NAMES[mo], n:max}); day.set("hint"); }
        else{
          date = new Date(y, mo, d);
          if(date > today){ msg = say("onb.birthday.hint.future"); date = null; }
          else if(ageMonths(isoOf(date)) > AGE_MAX) msg = say("onb.birthday.hint.old");
        }
      }
    }
    help.textContent = msg;
    if(date){ P.birthDate = isoOf(date); save(); }
    paintStage(date ? ageMonths(isoOf(date)) : null);
    next.ready(!!date);
    return !!date;
  };
  const go = ()=>{ if(!check()) return; ageNow() < 6 ? goStep(onb.step, "milk") : (P.exploreEarly = false, save(), nextStep()); };
  const day = blank({value:had ? String(had.getDate()) : "", min:2, maxLength:2, inputmode:"numeric", label:say("onb.birthday.day"),
    onInput:v=>{ check(); if(v.length===2 || +v > 3) month.input.focus(); }, onEnter:go});
  const month = blank({value:had ? MONTH_NAMES[had.getMonth()] : "", min:6, maxLength:16, label:say("onb.birthday.month"),
    onInput:()=>{ check(); picker.follow(); }, onEnter:()=>{ if(!picker.choose()) go(); }});
  const year = blank({value:had ? String(had.getFullYear()) : "", min:4, maxLength:4, inputmode:"numeric", label:say("onb.birthday.year"),
    onInput:()=>check(), onEnter:go});
  month.input.addEventListener("blur", ()=>{ const k = parseMonth(month.input.value); if(k!==null){ month.input.value = MONTH_NAMES[k]; month.sync(); check(); } });
  const s = sentence(say("onb.birthday.sentence", {name}), {day, month, year});
  // the day field is labelled by the words before it ("Lula arrived on"), the others by their own names
  card.append(s, line(say("onb.birthday.line")));
  const picker = monthPicker(card, month, k=>{ month.input.value = MONTH_NAMES[k]; month.sync(); month.el.classList.remove("idle"); check(); year.input.focus(); });
  const help = hint();
  const stage = document.createElement("div");
  stage.className = "stage-say"; stage.setAttribute("aria-live", "polite");
  stage.innerHTML = `<p class="stage-name"></p><p class="stage-line"></p>`;
  card.append(help, stage);
  let shownStage = null;
  function paintStage(m){
    const st = m===null ? null : stageFor(m);
    const id = st ? st.id : null;
    if(id===shownStage) return;
    shownStage = id;
    stage.querySelector(".stage-name").textContent = st ? st.name : "";
    stage.querySelector(".stage-line").textContent = st ? stageLine(st) : "";
    if(st && !calm()) stage.animate([{opacity:0, transform:"translateY(10px)"}, {opacity:1, transform:"none"}], {duration:320, easing:"cubic-bezier(.32,1.25,.5,1)"});
  }
  next = onbCta(card, say("onb.birthday.cta"), go, {ready:false});
  check();
}

/* The month blank's compact list: a small peek under the field that opens on
   tap or focus, follows what's typed, and takes arrow keys, Enter and Escape
   (the combobox pattern: focus stays in the field). */
function monthPicker(card, month, onPick){
  const inp = month.input, list = document.createElement("div");
  const short = new Intl.DateTimeFormat(undefined, {month:"short"});
  list.className = "month-peek"; list.id = "mp" + uid(); list.setAttribute("role", "listbox"); list.setAttribute("aria-label", say("onb.birthday.month"));
  list.hidden = true;
  list.innerHTML = MONTH_NAMES.map((m, k)=>`<button type="button" role="option" tabindex="-1" id="${list.id}-${k}" aria-selected="false" aria-label="${m}">${short.format(new Date(2024, k, 1))}</button>`).join("");
  card.appendChild(list);
  inp.setAttribute("role", "combobox"); inp.setAttribute("aria-autocomplete", "list");
  inp.setAttribute("aria-controls", list.id); inp.setAttribute("aria-expanded", "false");
  let active = -1;
  const opts = [...list.children];
  const mark = k=>{
    active = k;
    opts.forEach((o, j)=>o.setAttribute("aria-selected", String(j===k)));
    if(k>=0) inp.setAttribute("aria-activedescendant", opts[k].id); else inp.removeAttribute("aria-activedescendant");
  };
  const place = ()=>{
    const c = card.getBoundingClientRect(), r = month.el.getBoundingClientRect(), half = list.offsetWidth/2 || 120;
    const x = r.left + r.width/2 - c.left;   // centred under the field, shifted to stay on screen
    list.style.left = Math.max(half - c.left + 8, Math.min(x, innerWidth - c.left - half - 8)) + "px";
    list.style.top = (r.bottom - c.top + 10) + "px";
  };
  const open = ()=>{ if(!list.hidden) return; list.hidden = false; inp.setAttribute("aria-expanded", "true"); place(); mark(parseMonth(inp.value) ?? -1);
    if(!calm()) list.animate([{opacity:0, transform:"translate(-50%, 8px) scale(.98)"}, {opacity:1, transform:"translate(-50%, 0)"}], {duration:220, easing:"cubic-bezier(.2,.8,.2,1)"}); };
  const close = ()=>{ if(list.hidden) return; list.hidden = true; inp.setAttribute("aria-expanded", "false"); mark(-1); };
  inp.addEventListener("focus", open);
  inp.addEventListener("click", open);
  inp.addEventListener("blur", e=>{ if(!list.contains(e.relatedTarget)) close(); });
  inp.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){
      e.preventDefault();
      if(list.hidden){ open(); if(active < 0) mark(0); return; }   // the first press only opens it, on the current month
      const d = e.key==="ArrowDown" ? 1 : -1;
      mark(active < 0 ? (d > 0 ? 0 : 11) : (active + d + 12) % 12);
    }else if(e.key==="Escape" && !list.hidden){ e.preventDefault(); close(); }
  });
  list.addEventListener("pointerdown", e=>e.preventDefault());   // keep focus (and the caret) in the field
  opts.forEach((o, k)=>o.addEventListener("click", ()=>{ close(); onPick(k); }));
  addEventListener("resize", place);
  return {
    follow(){ open(); mark(parseMonth(inp.value) ?? -1); },
    choose(){ if(list.hidden || active < 0) return false; const k = active; close(); onPick(k); return true; }
  };
}

/* 4. keep out: "Keep these off the plate." Pills cycle neutral → keep out → tried and loved */
function onbKeepout(card, P){
  const live = document.createElement("p");
  live.className = "sr-only"; live.setAttribute("aria-live", "polite");
  const h = document.createElement("h1");
  h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = say("onb.keepOut.title");
  card.append(h, line(say("onb.keepOut.line")));
  const pills = document.createElement("div");
  pills.className = "pills";
  const word = st=>st==="avoid" ? say("onb.keepOut.out") : st==="ok" ? say("onb.keepOut.loved") : say("onb.keepOut.neutral");
  ALLERGENS.forEach(a=>{
    const b = pillBtn(a.label, ALLERGEN_ART[a.id] || null);
    if(!ALLERGEN_ART[a.id]) b.querySelector(".food-art").textContent = a.emoji;
    const paint = ()=>{
      const st = P.allergens[a.id] || "";
      b.dataset.state = st==="avoid" ? "out" : st==="ok" ? "loved" : "";
      b.setAttribute("aria-label", `${a.label}: ${word(st)}`);
    };
    b.addEventListener("click", ()=>{
      const st = P.allergens[a.id];
      const next = !st ? "avoid" : st==="avoid" ? "ok" : null;
      if(next) P.allergens[a.id] = next; else delete P.allergens[a.id];
      save(); paint(); haptic();
      live.textContent = `${a.label}: ${word(next)}`;
    });
    paint();
    pills.appendChild(b);
  });
  // their own: "Also not ____" with Allergy / Dislike, then a removable pill
  const own = ()=>{
    pills.querySelectorAll(".pill-own, .pill-edit, .pill-add").forEach(x=>x.remove());
    P.avoid.forEach(x=>{
      const c = document.createElement("span");
      c.className = "pill-o pill-own"; c.dataset.state = "out";
      c.innerHTML = `${foodArt(x.name, {size:24, alt:""})}<span>${esc(x.name)} · ${x.kind==="allergy" ? say("onb.keepOut.allergy") : say("onb.keepOut.dislike")}</span>`;
      const rm = document.createElement("button");
      rm.type = "button"; rm.className = "pill-x"; rm.setAttribute("aria-label", say("onb.keepOut.remove", {food:x.name}));
      rm.addEventListener("click", ()=>{ P.avoid = P.avoid.filter(y=>y!==x); save(); own(); live.textContent = `${x.name} removed`; pills.querySelector(".pill-add").focus(); });
      c.appendChild(rm);
      pills.appendChild(c);
    });
    if(onb.adding){
      const e = document.createElement("span");
      e.className = "pill-o pill-edit";
      const b = blank({min:5, maxLength:30, onEnter:()=>commit()});
      const t = say("onb.keepOut.alsoNot").split("{blank}");
      const l = document.createElement("label"); l.htmlFor = b.input.id; l.textContent = t[0].trim();
      const kind = document.createElement("span");
      kind.className = "kind-toggle"; kind.setAttribute("role", "group"); kind.setAttribute("aria-label", `${say("onb.keepOut.allergy")} / ${say("onb.keepOut.dislike")}`);
      ["allergy","dislike"].forEach(k=>{
        const kb = document.createElement("button");
        kb.type = "button"; kb.textContent = say("onb.keepOut." + k); kb.setAttribute("aria-pressed", String(onb.kind===k));
        kb.addEventListener("click", ()=>{ onb.kind = k; kind.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed", String(z===kb))); b.input.focus(); });
        kind.appendChild(kb);
      });
      e.append(l, " ", b.el, kind);
      const commit = ()=>{
        const v = b.input.value.trim();
        onb.adding = false;
        if(v){
          const have = P.avoid.find(f=>f.name.toLowerCase()===v.toLowerCase());
          if(have) have.kind = onb.kind; else P.avoid.push({name:v, kind:onb.kind});
          save(); live.textContent = `${v}: ${say("onb.keepOut." + onb.kind)}`;
        }
        own(); pills.querySelector(".pill-add").focus();
      };
      b.input.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ ev.preventDefault(); b.input.value = ""; commit(); } });
      e.addEventListener("focusout", ev=>{ if(!e.contains(ev.relatedTarget)) setTimeout(()=>{ if(e.isConnected && !e.contains(document.activeElement)) commit(); }, 0); });
      pills.appendChild(e);
      requestAnimationFrame(()=>b.input.focus());
    }
    const add = pillBtn(say("onb.keepOut.add"), undefined, {cls:"pill-add"});
    add.hidden = onb.adding;
    add.addEventListener("click", ()=>{ onb.adding = true; own(); });
    pills.appendChild(add);
  };
  own();
  card.append(pills, live);
  // what's always off the plate at this age; "Why?" opens one line per rule
  const locked = document.createElement("div");
  locked.className = "locked-say";
  const rules = LOCKED_RULES.filter(r=>!r.until || ageNow() < r.until);
  locked.innerHTML = `<p><svg class="lock-i" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none"/></svg>${esc(lockedLine(ageNow()))}
    <button type="button" class="btn-text small" aria-expanded="false">${say("onb.keepOut.why")}</button></p>
    <ul class="why-list" hidden>${rules.map(r=>`<li><b>${esc(r.label)}.</b> ${esc(r.why)}</li>`).join("")}</ul>`;
  const why = locked.querySelector("button"), wl = locked.querySelector(".why-list");
  why.addEventListener("click", ()=>{ wl.hidden = !wl.hidden; why.setAttribute("aria-expanded", String(!wl.hidden)); });
  card.append(locked, line(say("onb.keepOut.note"), "onb-note"));
  onbCta(card, say("onb.next"), nextStep);
}

    save();
  };
  onbCta(card, say("onb.atHome.cta"), ()=>{ stock(); nextStep(); }, {extra:[{label:say("onb.atHome.skip"), on:nextStep}]});
}

/* 7. meal times: "{name} usually eats at…" one time per meal the stage serves, prefilled */
function onbMealTimes(card, P){
  const months = planMonths(), defaults = stageTimes(months);
  const h = document.createElement("h1");
  h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = say("onb.mealTimes.title", {name:P.name || "They"});
  card.append(h);
  const rows = document.createElement("div");
  rows.className = "mt-rows";
  slotsFor(months).forEach(slot=>{
    const ms = MEAL_SLOTS.find(x=>x.id===slot);
    const r = document.createElement("p");
    r.className = "mt-row";
    const id = "mt-" + slot;
    r.innerHTML = `<label for="${id}">${esc(say("onb.mealTimes.at", {meal:ms.label}))}</label> <span class="blank time" data-state="ok"><input class="blank-input" type="time" id="${id}" step="300" value="${(P.mealTimes||{})[slot] || defaults[slot]}"></span>`;
    r.querySelector("input").addEventListener("change", e=>{
      const v = hhmm(e.target.value);
      if(!v) return;
      const t = fmtHHMM(v);
      P.mealTimes = Object.assign({}, P.mealTimes);
      if(t===defaults[slot]) delete P.mealTimes[slot]; else P.mealTimes[slot] = t;   // the stage's defaults keep following the stage
      save();
    });
    rows.appendChild(r);
  });
  card.append(rows, line(say("onb.mealTimes.line")));
  onbCta(card, say("onb.mealTimes.cta"), nextStep, {extra:[{label:say("onb.mealTimes.usual"), on:()=>{ P.mealTimes = {}; save(); nextStep(); }}]});
}

/* 8. the reveal: the table being set (≤ 2.5 s, skippable), then the week; applied only on "Love it" */
function onbReveal(card, P){
  const name = P.name || "";
  if(ageNow() < 6 && !P.exploreEarly){
    const h = document.createElement("h1");
    h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = say("onb.restful.title");
    card.append(h, line(say("onb.restful.line")));
    onbCta(card, say("onb.restful.cta"), finishOnboarding);
    return;
  }
  if(!onb.draft) onb.draft = generateWeek(planMonths(), P);
  const draw = weekFoods(onb.draft);
  if(!onb.revealed){
    const h = document.createElement("h1");
    h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = say("onb.reveal.title");
    const row = document.createElement("div");
    row.className = "rv-row"; row.setAttribute("aria-hidden", "true");
    row.innerHTML = draw.slice(0, 6).map((id, k)=>`<span class="rv-item" style="--k:${k};--r:${[-6,4,-3,6,-5,3][k]}deg">${foodArt(id, {size:72, alt:""})}</span>`).join("");
    card.append(row, h);
    const done = ()=>{ if(onb.revealed) return; onb.revealed = true; clearTimeout(onb.revealTimer); if(ONB_STEPS[onb.step]==="reveal"){ renderOnb(); focusStep(); } };
    const skip = document.createElement("button");
    skip.type = "button"; skip.className = "btn-text"; skip.textContent = say("onb.reveal.skip");
    skip.addEventListener("click", done);
    card.append(skip);
    card.addEventListener("click", e=>{ if(e.target===card || row.contains(e.target)) done(); });
    onb.revealTimer = setTimeout(done, calm() ? 700 : 2300);
    return;
  }
  const h = document.createElement("h1");
  h.className = "sent"; h.id = "onbTitle"; h.tabIndex = -1; h.textContent = say("onb.done.title", {name});
  card.append(h, line(say("onb.done.line", {name})));
  card.appendChild(weekPreview(onb.draft));
  const extra = [{label:say("onb.done.shuffle"), on:()=>{ onb.draft = generateWeek(planMonths(), P); renderOnb(); focusStep(); }}];
  if(P.returning || (P.onboarded && hasPlan())) extra.push({label:say("onb.done.keep"), on:finishOnboarding});
  onbCta(card, say("onb.done.apply"), ()=>{
    if(P.onboarded && hasPlan()) state.history.push({weekOf:state.weekStarted});   // the week it replaces
    state.plan = onb.draft;
    state.weekStarted = todayISO();
    P.lastStage = stageNow().id;
    currentDay = dayDisplayOrder()[0];
    onb.draft = null;
    finishOnboarding();
  }, {extra});
}
/* the drawn foods of a week, most-used first, one each */
function weekFoods(week){
  const count = {};
  week.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{ const f = foodOf(i.name); if(hasArt(f)) count[f.id] = (count[f.id] || 0) + 1; })));
  return Object.keys(count).sort((a, b)=>count[b] - count[a]);
}
/* seven days from today, each with its meals' main foods as small drawings */
function weekPreview(week){
  const wrap = document.createElement("div");
  wrap.className = "wk-prev";
  const t = now(), start = Math.max(0, week.days.findIndex(d=>d.name===DAY_ORDER[t.getDay()]));
  const narrow = new Intl.DateTimeFormat(undefined, {weekday:"short"});
  week.days.forEach((_, pos)=>{
    const day = week.days[(start + pos) % week.days.length];
    const date = new Date(t.getFullYear(), t.getMonth(), t.getDate() + pos);
    const mains = day.meals.filter(m=>m.items.length).map(m=>m.items[0]);
    const col = document.createElement("div");
    col.className = "wk-day";
    col.innerHTML = `<span class="wk-name">${narrow.format(date)}</span>` +
      mains.slice(0, 3).map((i, k)=>`<span class="wk-art" style="--r:${[-6,5,-3][k]}deg">${foodArt(i.name, {size:40, alt:baseName(i)})}</span>`).join("");
    col.setAttribute("aria-label", `${DAY_FULL(date)}: ${mains.map(baseName).join(", ")}`);
    col.setAttribute("role", "group");
    wrap.appendChild(col);
  });
  return wrap;
}
